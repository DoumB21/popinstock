<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG Banner — Funko — 1200×630</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      background-color: #0a0a0f;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Grid background */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* Subtle radial glow behind the content — Funko blue instead of the site's orange */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(50, 130, 220, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .banner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      text-align: center;
      padding: 0 80px;
    }

    /* Small Hoardio wordmark row, same treatment as the site-wide banner —
       this still identifies as a Hoardio page, just Funko-branded below. */
    .wordmark {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wordmark img {
      height: 32px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
      opacity: 0.7;
    }

    /* funko.svg's paths carry no fill (defaults to black) — same invert
       trick the Hoardio wordmark above already uses to go from black to
       white against this dark background, rather than hand-editing the
       source SVG's fill. */
    .funko-logo {
      width: 320px;
      height: auto;
      object-fit: contain;
      margin: 10px 0 6px;
      filter: invert(1);
    }

    /* Main headline */
    h1 {
      font-size: 3.6rem;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.1;
      color: #f0f0f5;
    }

    h1 span {
      background: linear-gradient(135deg, #6bb0ff, #3282dc);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Tagline */
    .tagline {
      font-size: 1.25rem;
      color: #8888aa;
      letter-spacing: 0.02em;
      line-height: 1.5;
    }

    .wax-pill {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 7px 20px;
      border-radius: 999px;
      border: 1px solid rgba(50, 130, 220, 0.4);
      background: rgba(50, 130, 220, 0.08);
      color: #6bb0ff;
    }

    /* Bottom border accent */
    .accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #3282dc 30%, #6bb0ff 50%, #3282dc 70%, transparent);
    }
  </style>
</head>
<body>

  <div class="banner">
    <div class="wordmark">
      <img src="images/Hoardio_logo.png" alt="Hoardio" />
    </div>

    <img class="funko-logo" src="images/funko.svg" alt="Funko" />

    <h1>Funko Digital <span>Collector Tools</span></h1>

    <p class="tagline">Mint rankings, wallet lookups, set tracking, and trade analysis.</p>

    <span class="wax-pill">Powered by the WAX Blockchain</span>
  </div>

  <div class="accent-bar"></div>

</body>
</html>
