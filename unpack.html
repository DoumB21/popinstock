<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unpack — Hoardio</title>
  <meta name="description" content="Open packs in your WAX inventory and claim their contents." />
  <link rel="canonical" href="https://www.hoardio.com/unpack" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.hoardio.com/unpack" />
  <meta property="og:title" content="Unpack — Hoardio" />
  <meta property="og:description" content="Open packs in your WAX inventory and claim their contents." />
  <meta property="og:image" content="https://www.hoardio.com/images/og-banner.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Unpack — Hoardio" />
  <meta name="twitter:description" content="Open packs in your WAX inventory and claim their contents." />
  <meta name="twitter:image" content="https://www.hoardio.com/images/og-banner.png" />
  <link rel="icon" href="images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="shared/global.css" />
  <style>
    /* ── Page ── */
    .page-main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    .auth-gate {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 2.5rem 2rem;
      text-align: center; color: var(--text-secondary);
    }
    .auth-gate-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem; }
    .auth-gate-hint  { font-size: 0.88rem; }

    /* ── Tab switcher — same visual language as buy-offers.html/trade-offers.html. ── */
    .offer-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .offer-tab-btn {
      flex: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      background: rgba(240,168,64,0.12); border: 1px solid rgba(240,168,64,0.45);
      border-radius: 8px; padding: 0.55rem 1.1rem;
      font-size: 0.85rem; font-weight: 700; color: var(--accent-light);
      font-family: inherit; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .offer-tab-btn:hover { background: rgba(240,168,64,0.2); border-color: rgba(240,168,64,0.7); }
    .offer-tab-btn.active {
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      border-color: transparent; color: #fff;
    }
    .tab-count { font-variant-numeric: tabular-nums; opacity: 0.85; }
    @media (max-width: 480px) {
      .offer-tab-btn { padding: 0.55rem 0.5rem; gap: 0.3rem; }
    }

    .pack-note {
      display: none; background: rgba(240,168,64,0.1); border: 1px solid rgba(240,168,64,0.3);
      color: var(--accent-light); border-radius: 10px; padding: 0.75rem 1rem;
      font-size: 0.85rem; margin-bottom: 1.25rem;
    }

    .status-wrap { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
    .spinner {
      width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 0.9rem; }
    .empty-state strong { display: block; color: var(--text-primary); font-size: 1rem; margin-bottom: 0.4rem; }

    /* ── Packs tab — card grid ── */
    .pack-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .pack-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .pack-card:hover { border-color: var(--border-hover); }
    .pack-card--highlight { border-color: var(--accent-light); box-shadow: 0 0 0 2px rgba(240,168,64,0.35); }
    .pack-card-media {
      aspect-ratio: 1; background: rgba(255,255,255,0.03);
      display: flex; align-items: center; justify-content: center;
    }
    .pack-card-media img, .pack-card-media video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .pack-media-ph { color: var(--text-secondary); font-size: 1.8rem; }
    .pack-card-body { padding: 0.85rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.3rem; flex: 1; }
    .pack-card-name { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pack-card-col { font-size: 0.78rem; color: var(--text-secondary); }
    .pack-card-status { font-size: 0.78rem; min-height: 1.1em; }
    .pack-card-status.is-error { color: #e05252; }

    .pack-btn {
      margin-top: auto; font-size: 0.85rem; font-weight: 700; padding: 0.55rem 1rem;
      border-radius: 8px; border: 1px solid rgba(240,168,64,0.45);
      background: rgba(240,168,64,0.12); color: var(--accent-light);
      cursor: pointer; font-family: inherit; transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .pack-btn:hover:not(:disabled) { background: rgba(240,168,64,0.22); border-color: rgba(240,168,64,0.7); }
    .pack-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    /* ── Unclaimed Packs tab — flat list ── */
    .unclaimed-list { display: flex; flex-direction: column; gap: 0.7rem; }
    .unclaimed-row {
      display: flex; align-items: center; gap: 1.1rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 13px; padding: 0.9rem 1.25rem;
      transition: border-color 0.15s;
    }
    .unclaimed-row:hover { border-color: var(--border-hover); }
    .unclaimed-media {
      flex-shrink: 0; width: 60px; height: 60px; border-radius: 10px; overflow: hidden;
      background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      display: flex; align-items: center; justify-content: center;
    }
    .unclaimed-media img, .unclaimed-media video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .unclaimed-media .pack-media-ph { font-size: 1.4rem; }
    .unclaimed-body { flex: 1; min-width: 0; }
    .unclaimed-name { font-size: 1rem; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .unclaimed-col { font-size: 0.82rem; color: var(--text-secondary); margin-top: 0.15rem; }
    .unclaimed-status { font-size: 0.78rem; margin-top: 0.3rem; }
    .unclaimed-status.is-error { color: #e05252; }
    .unclaimed-actions { flex-shrink: 0; }

    @media (max-width: 700px) {
      .page-main { padding: 1.25rem 0.75rem 3rem; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script src="shared/wax-api.js"></script>
  <script src="shared/wallet-widget.js"></script>
  <script src="shared/wallet-menu.js"></script>
  <script src="shared/tx-error.js"></script>
  <script src="shared/atomic-packs.js"></script>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index" class="nav-home" title="Back to homepage">
      <img src="images/Hoardio_fav.png" alt="Hoardio" />
    </a>
    <span class="nav-divider"></span>
    <div class="nav-links"></div>
  </div>
</nav>
<script src="shared/generic-nav.js"></script>

<main class="page-main">
  <div class="page-header">
    <h1 class="page-title">Unpack <span class="accent">Packs</span></h1>
    <p class="page-desc" id="pageDesc">Packs in your inventory that are ready to open.</p>
  </div>

  <div class="offer-tabs" id="unpackTabs">
    <button type="button" class="offer-tab-btn active" data-tab="packs">📦 Packs<span class="tab-count" id="tabCountPacks"></span></button>
    <button type="button" class="offer-tab-btn" data-tab="unclaimed">🎁 Unclaimed Packs<span class="tab-count" id="tabCountUnclaimed"></span></button>
  </div>

  <div class="pack-note" id="unboxNote"></div>

  <div id="authGate" class="auth-gate" style="display:none;">
    <p class="auth-gate-title">Wallet not connected</p>
    <p class="auth-gate-hint">Connect your WAX wallet using the button in the navigation bar to see your packs.</p>
  </div>

  <div id="loadWrap" class="status-wrap" style="display:none;">
    <div class="spinner"></div>
    <div id="loadWrapText">Scanning your inventory for packs…</div>
  </div>

  <div id="emptyWrap" class="empty-state" style="display:none;"></div>

  <div id="packsList" class="pack-grid" style="display:none;"></div>
  <div id="packsLoadMoreWrap" style="display:none; text-align:center; margin-top:1.5rem;">
    <button id="packsLoadMoreBtn" class="load-more-btn">Load more</button>
  </div>
  <div id="unclaimedList" class="unclaimed-list" style="display:none;"></div>
</main>

<script>
'use strict';

const IPFS_GATEWAY_LIST = ['https://ipfs.io/ipfs/', 'https://cloudflare-ipfs.com/ipfs/', 'https://dweb.link/ipfs/'];
function toMediaUrl(v) { return /^https?:\/\//i.test(v) ? v : IPFS_GATEWAY_LIST[0] + v; }
function escHtml(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

// A Packs-tab grid can easily hold 1000+ cards for a large wallet (confirmed
// live) — autoplaying video on every one at once (inventory.html avoids this
// entirely via a real IntersectionObserver lazy-loader) crashed the tab in
// testing. Preferring the static image and never autoplaying avoids the
// whole class of problem without needing that same lazy-load machinery here.
function packMediaHtml(asset) {
  const d = asset.data || {};
  const t = asset.template?.immutable_data || {};
  const img   = d.img || d.image || t.img || t.image || '';
  if (img) return `<img src="${escHtml(toMediaUrl(img))}" alt="" loading="lazy">`;
  const video = d.video || t.video || '';
  if (video) return `<video src="${escHtml(toMediaUrl(video))}" muted playsinline loop preload="none"></video>`;
  return '<div class="pack-media-ph">📦</div>';
}

/* ── Nav auth ── */
const _wallet = WalletWidget.mount(document.querySelector('.nav-inner'), {
  authScript: 'shared/wax-auth.js',
  menuItems: walletMenuItems(),
});
window.addEventListener('wax-auth-change', onWalletChange);

/* ── Tabs ── */
let _tab = 'packs';
const TAB_DESC = {
  packs: 'Packs in your inventory that are ready to open.',
  unclaimed: "Packs you've opened, waiting to be claimed.",
};
function setActiveTab(tab) {
  _tab = tab === 'unclaimed' ? 'unclaimed' : 'packs';
  document.querySelectorAll('.offer-tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === _tab));
  document.getElementById('pageDesc').textContent = TAB_DESC[_tab];
  document.getElementById('loadWrapText').textContent = _tab === 'packs' ? 'Scanning your inventory for packs…' : 'Checking for unclaimed packs…';
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (wallet) loadTab();
}
document.querySelectorAll('.offer-tab-btn').forEach(btn => {
  btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
});

const TAB_COUNT_EL = { packs: document.getElementById('tabCountPacks'), unclaimed: document.getElementById('tabCountUnclaimed') };
function setTabCount(tab, n) {
  const el = TAB_COUNT_EL[tab];
  if (!el) return;
  el.textContent = n != null ? ` (${n})` : '';
}

function showState(state) {
  const packsListState = state === 'list' && _tab === 'packs';
  document.getElementById('authGate').style.display  = state === 'auth'    ? '' : 'none';
  document.getElementById('loadWrap').style.display  = state === 'loading' ? '' : 'none';
  document.getElementById('emptyWrap').style.display = state === 'empty'   ? '' : 'none';
  document.getElementById('packsList').style.display     = packsListState ? '' : 'none';
  document.getElementById('packsLoadMoreWrap').style.display = (packsListState && _packVisible < _packEntries.length) ? '' : 'none';
  document.getElementById('unclaimedList').style.display = (state === 'list' && _tab === 'unclaimed') ? '' : 'none';
}

document.getElementById('packsLoadMoreBtn').addEventListener('click', () => {
  const btn = document.getElementById('packsLoadMoreBtn');
  btn.disabled = true;
  renderPackBatch();
  btn.disabled = false;
});

function setUnboxNote(msg) {
  const el = document.getElementById('unboxNote');
  if (!msg) { el.style.display = 'none'; return; }
  el.textContent = msg;
  el.style.display = '';
}

/* ── Packs tab ── */
async function scanOwnedAssets(wallet) {
  const assets = [];
  let page = 1;
  for (;;) {
    const url = `${WaxApi.aaBase()}/assets?owner=${encodeURIComponent(wallet)}&limit=1000&page=${page}`;
    const rows = await WaxApi.apiFetch(url);
    if (!rows || !rows.length) break;
    assets.push(...rows);
    if (rows.length < 1000) break;
    page++;
  }
  return assets;
}

async function loadPacks(wallet) {
  const assets = await scanOwnedAssets(wallet);
  const byTemplate = new Map(); // template_id -> assets[]
  for (const a of assets) {
    const tid = a.template?.template_id;
    if (!tid) continue;
    if (!byTemplate.has(tid)) byTemplate.set(tid, []);
    byTemplate.get(tid).push(a);
  }

  // Resolve pack-ness per DISTINCT template only — a collector owning many
  // copies of the same pack template only costs one lookup, not one per
  // asset. lookupPackByTemplateId shares one registry fetch across every
  // call (see shared/atomic-packs.js), so firing them all at once is free —
  // no manual concurrency limiting needed.
  const distinctIds = [...byTemplate.keys()];
  const packRows = await Promise.all(distinctIds.map(tid => AtomicPacks.lookupPackByTemplateId(tid)));

  const entries = [];
  distinctIds.forEach((tid, i) => {
    const pack = packRows[i];
    if (!pack) return;
    for (const asset of byTemplate.get(tid)) entries.push({ asset, pack });
  });
  return entries;
}

// A large collector can own 1000+ packs (confirmed live) — mounting that
// many cards (each with its own <img>) in one paint crashed the tab in
// testing. Rendered in bounded batches instead, same "Load more" pattern
// inventory.html already uses for its own grid.
const PACK_PAGE_SIZE = 60;
let _packEntries = [];
let _packVisible = 0;

function renderPackBatch() {
  const list = document.getElementById('packsList');
  const next = _packEntries.slice(_packVisible, _packVisible + PACK_PAGE_SIZE);
  next.forEach(e => list.appendChild(buildPackCard(e)));
  _packVisible += next.length;
  const moreWrap = document.getElementById('packsLoadMoreWrap');
  moreWrap.style.display = _packVisible < _packEntries.length ? '' : 'none';
}

function buildPackCard(entry) {
  const { asset, pack } = entry;
  const card = document.createElement('div');
  card.className = 'pack-card';
  card.dataset.assetId = asset.asset_id;
  const name = asset.data?.name || asset.name || 'Pack';
  const collection = asset.collection?.name || pack.collection_name || '';
  const locked = pack.unlock_time && pack.unlock_time * 1000 > Date.now();
  card.innerHTML = `
    <div class="pack-card-media">${packMediaHtml(asset)}</div>
    <div class="pack-card-body">
      <div class="pack-card-name" title="${escHtml(name)}">${escHtml(name)}</div>
      <div class="pack-card-col">${escHtml(collection)}</div>
      <div class="pack-card-status" data-status>${locked ? 'Unlocks ' + new Date(pack.unlock_time * 1000).toLocaleDateString() : ''}</div>
      <button type="button" class="pack-btn" data-unbox${locked ? ' disabled' : ''}>${locked ? 'Locked' : 'Unbox'}</button>
    </div>
  `;
  const btn = card.querySelector('[data-unbox]');
  const statusEl = card.querySelector('[data-status]');
  if (!locked) btn.addEventListener('click', () => unboxPack(asset.asset_id, card, btn, statusEl));
  return card;
}

function checkPacksEmpty() {
  if (_packEntries.length === 0) {
    document.getElementById('packsList').style.display = 'none';
    document.getElementById('packsLoadMoreWrap').style.display = 'none';
    document.getElementById('emptyWrap').innerHTML = '<strong>No packs found</strong>Nothing in your inventory is openable right now.';
    document.getElementById('emptyWrap').style.display = '';
  }
}

async function unboxPack(assetId, cardEl, btn, statusEl) {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (!wallet) return;
  btn.disabled = true;
  btn.textContent = 'Unboxing…';
  statusEl.textContent = '';
  statusEl.className = 'pack-card-status';
  try {
    await WaxAuth.transact([AtomicPacks.buildUnboxAction(wallet, assetId)]);
    cardEl.remove();
    const idx = _packEntries.findIndex(e => String(e.asset.asset_id) === String(assetId));
    if (idx !== -1) { _packEntries.splice(idx, 1); _packVisible--; }
    checkPacksEmpty();
    setTabCount('packs', _packEntries.length);
    setUnboxNote('Unboxing… this usually takes a few seconds.');
    pollForUnclaimed(wallet, assetId);
  } catch (err) {
    const info = describeTxError(err);
    if (info.kind === 'cancelled') {
      btn.disabled = false;
      btn.textContent = 'Unbox';
      return;
    }
    statusEl.innerHTML = info.kind !== 'generic' ? txErrorHtml(info, '', '') : escHtml(err.message || 'Unbox failed.');
    statusEl.className = 'pack-card-status is-error';
    btn.disabled = false;
    btn.textContent = 'Unbox';
  }
}

// Bounded auto-poll after a successful Unbox — the oracle callback usually
// resolves in 2-5s, but isn't always reliable (a real pack sat unresolved
// for 3+ months in testing), so this degrades gracefully: on timeout it
// just stops silently and leaves the Unclaimed Packs tab's own always-live
// query to pick it up whenever the visitor checks it.
async function pollForUnclaimed(wallet, assetId) {
  const POLL_MS = 2000, TIMEOUT_MS = 30000;
  const start = Date.now();
  while (Date.now() - start < TIMEOUT_MS) {
    await new Promise(r => setTimeout(r, POLL_MS));
    if ((window.getWaxAccount ? window.getWaxAccount() : null) !== wallet) return; // wallet changed mid-poll
    const rows = await AtomicPacks.fetchUnclaimedPacks(wallet);
    if (rows.some(r => String(r.pack_asset_id) === String(assetId))) {
      setUnboxNote('');
      setActiveTab('unclaimed');
      return;
    }
  }
  setUnboxNote('This may take longer than usual — check the Unclaimed Packs tab shortly.');
}

/* ── Unclaimed Packs tab ── */
async function fetchAssetBrief(assetId) {
  try { return await WaxApi.apiFetch(`${WaxApi.aaBase()}/assets/${encodeURIComponent(assetId)}`); }
  catch { return null; }
}

async function loadUnclaimed(wallet) {
  const rows = await AtomicPacks.fetchUnclaimedPacks(wallet);
  const entries = [];
  for (const row of rows) {
    const pack = await AtomicPacks.lookupPackByPackId(row.pack_id);
    if (!pack) continue; // shouldn't happen, but don't let one bad row break the whole tab
    entries.push({ row, pack });
  }
  return entries;
}

function buildUnclaimedRow(entry) {
  const { row, pack } = entry;
  const el = document.createElement('div');
  el.className = 'unclaimed-row';
  el.dataset.packAssetId = row.pack_asset_id;
  el.innerHTML = `
    <div class="unclaimed-media" data-media><div class="pack-media-ph">📦</div></div>
    <div class="unclaimed-body">
      <div class="unclaimed-name" data-name>Pack #${escHtml(row.pack_asset_id)}</div>
      <div class="unclaimed-col">${escHtml(pack.collection_name)}</div>
      <div class="unclaimed-status" data-status></div>
    </div>
    <div class="unclaimed-actions">
      <button type="button" class="pack-btn" data-claim>Claim</button>
    </div>
  `;
  const btn = el.querySelector('[data-claim]');
  const statusEl = el.querySelector('[data-status]');
  btn.addEventListener('click', () => claimPack(row.pack_asset_id, pack, el, btn, statusEl));

  // Best-effort enrich with the asset's own name/image — it's currently
  // owned by atomicpacksx, not this wallet, but AtomicAssets still tracks
  // its data. Not blocking the row's initial render.
  fetchAssetBrief(row.pack_asset_id).then(asset => {
    if (!asset) return;
    const nameEl = el.querySelector('[data-name]');
    if (nameEl) nameEl.textContent = asset.data?.name || asset.name || ('Pack #' + row.pack_asset_id);
    const mediaEl = el.querySelector('[data-media]');
    if (mediaEl) mediaEl.innerHTML = packMediaHtml(asset);
  }).catch(() => {});

  return el;
}

function checkUnclaimedEmpty() {
  const list = document.getElementById('unclaimedList');
  if (list.children.length === 0) {
    list.style.display = 'none';
    document.getElementById('emptyWrap').innerHTML = '<strong>No packs waiting to be claimed</strong>';
    document.getElementById('emptyWrap').style.display = '';
  }
}

async function claimPack(packAssetId, pack, rowEl, btn, statusEl) {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (!wallet) return;
  btn.disabled = true;
  btn.textContent = 'Claiming…';
  statusEl.textContent = '';
  statusEl.className = 'unclaimed-status';
  try {
    await WaxAuth.transact([AtomicPacks.buildClaimAction(wallet, packAssetId, pack.roll_counter)]);
    rowEl.remove();
    checkUnclaimedEmpty();
    setTabCount('unclaimed', document.getElementById('unclaimedList').children.length);
  } catch (err) {
    const info = describeTxError(err);
    if (info.kind === 'cancelled') {
      btn.disabled = false;
      btn.textContent = 'Claim';
      return;
    }
    statusEl.innerHTML = info.kind !== 'generic' ? txErrorHtml(info, '', '') : escHtml(err.message || 'Claim failed.');
    statusEl.className = 'unclaimed-status is-error';
    btn.disabled = false;
    btn.textContent = 'Claim';
  }
}

/* ── Deep link (?asset_id=) — Packs tab only, best-effort ──
   If the target isn't in the first rendered batch (e.g. it's the 400th
   pack in a large inventory), pull enough extra batches in to include it
   before searching — otherwise it would silently never be found. */
function deepLinkAssetId() {
  return new URLSearchParams(location.search).get('asset_id');
}

function maybeHighlightDeepLink(list) {
  const targetId = deepLinkAssetId();
  if (!targetId) return;
  const idx = _packEntries.findIndex(e => String(e.asset.asset_id) === String(targetId));
  if (idx === -1) return; // not one of this wallet's packs (already unboxed elsewhere, wrong wallet, etc.)
  while (_packVisible <= idx) renderPackBatch();
  const card = list.querySelector(`[data-asset-id="${CSS.escape(targetId)}"]`);
  if (card) {
    card.classList.add('pack-card--highlight');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

/* ── Load dispatch ── */
let _loadGen = 0;

async function loadTab() {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (!wallet) { showState('auth'); return; }
  const myGen = ++_loadGen;
  const tab = _tab; // snapshot — _tab can change again before this resolves
  showState('loading');
  try {
    if (tab === 'packs') {
      const entries = await loadPacks(wallet);
      if (myGen !== _loadGen) return;
      _packEntries = entries;
      _packVisible = 0;
      setTabCount('packs', entries.length);
      const list = document.getElementById('packsList');
      list.innerHTML = '';
      if (!entries.length) {
        document.getElementById('emptyWrap').innerHTML = '<strong>No packs found</strong>Nothing in your inventory is openable right now.';
        showState('empty');
        return;
      }
      renderPackBatch();
      showState('list');
      maybeHighlightDeepLink(list);
    } else {
      const entries = await loadUnclaimed(wallet);
      if (myGen !== _loadGen) return;
      setTabCount('unclaimed', entries.length);
      const list = document.getElementById('unclaimedList');
      list.innerHTML = '';
      if (!entries.length) {
        document.getElementById('emptyWrap').innerHTML = '<strong>No packs waiting to be claimed</strong>';
        showState('empty');
        return;
      }
      entries.forEach(e => list.appendChild(buildUnclaimedRow(e)));
      showState('list');
    }
  } catch (err) {
    if (myGen !== _loadGen) return;
    console.error('Failed to load ' + tab + ':', err);
    document.getElementById('emptyWrap').innerHTML = '<strong>Failed to load</strong>Could not reach the WAX API. Please try again later.';
    showState('empty');
  }
}

/* ── Init ── */
function onWalletChange() {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (wallet) loadTab();
  else { showState('auth'); setTabCount('packs', null); setTabCount('unclaimed', null); }
}
function init() {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (wallet) loadTab();
  else showState('auth');
}
init();
</script>
