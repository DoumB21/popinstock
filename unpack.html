<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Unpack — Hoardio</title>
  <meta name="description" content="Open packs in your WAX inventory and claim their contents." />
  <link rel="canonical" href="https://www.hoardio.com/unpack" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.hoardio.com/unpack" />
  <meta property="og:title" content="Unpack — Hoardio" />
  <meta property="og:description" content="Open packs in your WAX inventory and claim their contents." />
  <meta property="og:image" content="https://www.hoardio.com/images/og-banner.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Unpack — Hoardio" />
  <meta name="twitter:description" content="Open packs in your WAX inventory and claim their contents." />
  <meta name="twitter:image" content="https://www.hoardio.com/images/og-banner.png" />
  <link rel="icon" href="images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="shared/global.css" />
  <style>
    /* ── Page ── */
    .page-main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    .auth-gate {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 2.5rem 2rem;
      text-align: center; color: var(--text-secondary);
    }
    .auth-gate-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem; }
    .auth-gate-hint  { font-size: 0.88rem; }

    .tab-count { font-variant-numeric: tabular-nums; opacity: 0.85; }

    .status-wrap { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
    .spinner {
      width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 0.9rem; }
    .empty-state strong { display: block; color: var(--text-primary); font-size: 1rem; margin-bottom: 0.4rem; }

    /* ── Unclaimed Packs — should normally be empty/hidden entirely; only
       appears when a previous Unpack didn't finish claiming. ── */
    .section-title { font-size: 1.05rem; font-weight: 700; margin-bottom: 0.3rem; }
    .section-hint { font-size: 0.85rem; color: var(--text-secondary); margin-bottom: 1rem; }

    /* ── Card grid — shared by both the Unclaimed Packs section and the
       Packs section below it (same layout, "Claim" vs "Unpack" button). ── */
    .pack-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 1rem; }
    .pack-card {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
      overflow: hidden; display: flex; flex-direction: column; transition: border-color 0.15s, box-shadow 0.15s;
    }
    .pack-card:hover { border-color: var(--border-hover); }
    .pack-card--highlight { border-color: var(--accent-light); box-shadow: 0 0 0 2px rgba(240,168,64,0.35); }
    .pack-card-media {
      aspect-ratio: 1; background: rgba(255,255,255,0.03);
      display: flex; align-items: center; justify-content: center;
    }
    .pack-card-media img, .pack-card-media video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .pack-media-ph { color: var(--text-secondary); font-size: 1.8rem; }
    .pack-card-body { padding: 0.85rem 1rem 1rem; display: flex; flex-direction: column; gap: 0.3rem; flex: 1; }
    .pack-card-name { font-size: 0.95rem; font-weight: 700; color: var(--text-primary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .pack-card-col { font-size: 0.78rem; color: var(--text-secondary); }
    .pack-card-status { font-size: 0.78rem; min-height: 1.1em; }
    .pack-card-status.is-error { color: #e05252; }

    .pack-btn {
      margin-top: auto; font-size: 0.85rem; font-weight: 700; padding: 0.55rem 1rem;
      border-radius: 8px; border: 1px solid rgba(240,168,64,0.45);
      background: rgba(240,168,64,0.12); color: var(--accent-light);
      cursor: pointer; font-family: inherit; transition: background 0.15s, border-color 0.15s, opacity 0.15s;
    }
    .pack-btn:hover:not(:disabled) { background: rgba(240,168,64,0.22); border-color: rgba(240,168,64,0.7); }
    .pack-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 700px) {
      .page-main { padding: 1.25rem 0.75rem 3rem; }
    }

    /* ── Pack results popup — shown after a successful Claim, listing the
       cards just received. Single consumer (this page), so kept local
       rather than a shared modal module. ── */
    .pr-overlay {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.7);
      align-items: center; justify-content: center; z-index: 1000; padding: 1.5rem;
    }
    .pr-panel {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 16px;
      max-width: 640px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 1.5rem;
    }
    .pr-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
    .pr-title { font-size: 1.1rem; font-weight: 700; }
    .pr-close {
      background: none; border: none; color: var(--text-secondary);
      font-size: 1.2rem; line-height: 1; cursor: pointer; padding: 0.25rem;
    }
    .pr-close:hover { color: var(--text-primary); }
    .pr-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 0.85rem; margin-bottom: 1.25rem; }
    .pr-card {
      display: block; background: rgba(255,255,255,0.03); border: 1px solid var(--border);
      border-radius: 10px; overflow: hidden; text-decoration: none; color: inherit;
      transition: border-color 0.15s;
    }
    .pr-card:hover { border-color: var(--border-hover); }
    .pr-card-media { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; background: rgba(255,255,255,0.03); }
    .pr-card-media img, .pr-card-media video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .pr-card-name {
      font-size: 0.82rem; font-weight: 600; padding: 0.5rem 0.6rem; text-align: center;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .pr-empty { color: var(--text-secondary); font-size: 0.9rem; text-align: center; padding: 1rem 0 1.5rem; }
    .pr-close-btn { width: 100%; text-align: center; }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script src="shared/wax-api.js"></script>
  <script src="shared/wallet-widget.js"></script>
  <script src="shared/wallet-menu.js"></script>
  <script src="shared/tx-error.js"></script>
  <script src="shared/atomic-packs.js"></script>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index" class="nav-home" title="Back to homepage">
      <img src="images/Hoardio_fav.png" alt="Hoardio" />
    </a>
    <span class="nav-divider"></span>
    <div class="nav-links"></div>
  </div>
</nav>
<script src="shared/generic-nav.js"></script>

<main class="page-main">
  <div class="page-header">
    <h1 class="page-title">Unpack <span class="accent">Packs</span></h1>
    <p class="page-desc">Packs in your inventory that are ready to open.</p>
  </div>

  <div id="authGate" class="auth-gate" style="display:none;">
    <p class="auth-gate-title">Wallet not connected</p>
    <p class="auth-gate-hint">Connect your WAX wallet using the button in the navigation bar to see your packs.</p>
  </div>

  <!-- Unclaimed Packs — not a tab, always at the top, unscoped by
       collection, loaded once (see loadUnclaimedSection). Hidden entirely
       unless non-empty: normally there should never be anything here — its
       presence means a previous Unpack didn't finish claiming. -->
  <section id="unclaimedSection" style="display:none; margin-bottom:2rem;">
    <div class="section-title">Unclaimed Packs<span class="tab-count" id="unclaimedCount"></span></div>
    <p class="section-hint">These didn't finish claiming after a previous Unpack.</p>
    <div id="unclaimedGrid" class="pack-grid"></div>
  </section>

  <div id="packsCollectionPicker" style="display:none; margin-bottom:1.25rem; max-width:360px;">
    <label for="packsCollectionComboInput" style="display:block; font-size:0.82rem; color:var(--text-secondary); margin-bottom:0.4rem;">Collection</label>
    <div class="cb-combo" id="packsCollectionCombo">
      <input type="text" class="cb-combo-input" id="packsCollectionComboInput" autocomplete="off" spellcheck="false">
      <button type="button" class="cb-combo-clear" id="packsCollectionComboClear" style="display:none" title="Clear">✕</button>
      <div class="cb-panel"></div>
    </div>
  </div>

  <div id="loadWrap" class="status-wrap" style="display:none;">
    <div class="spinner"></div>
    <div id="loadWrapText">Scanning your inventory for packs…</div>
  </div>

  <div id="emptyWrap" class="empty-state" style="display:none;"></div>

  <div id="packsList" class="pack-grid" style="display:none;"></div>
  <div id="packsLoadMoreWrap" style="display:none; text-align:center; margin-top:1.5rem;">
    <button id="packsLoadMoreBtn" class="load-more-btn">Load more</button>
  </div>
</main>

<!-- Shown after a successful Claim — the cards just received, read directly
     off that claim transaction's own trace (see AtomicPacks.extractMintedAssets).
     Closing it just hides the overlay; the Packs page underneath is untouched,
     so the visitor can immediately open another pack. -->
<div class="pr-overlay" id="packResultOverlay">
  <div class="pr-panel" id="packResultPanel" role="dialog" aria-modal="true" aria-label="Cards received">
    <div class="pr-header">
      <div class="pr-title">You got:</div>
      <button type="button" class="pr-close" id="packResultCloseX" aria-label="Close">✕</button>
    </div>
    <div class="pr-grid" id="packResultGrid"></div>
    <button type="button" class="pack-btn pr-close-btn" id="packResultCloseBtn">Close</button>
  </div>
</div>

<script>
'use strict';

const IPFS_GATEWAY_LIST = ['https://ipfs.io/ipfs/', 'https://cloudflare-ipfs.com/ipfs/', 'https://dweb.link/ipfs/'];
function toMediaUrl(v) { return /^https?:\/\//i.test(v) ? v : IPFS_GATEWAY_LIST[0] + v; }
function escHtml(s) { return (s || '').toString().replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

function setSectionCount(elId, n) {
  const el = document.getElementById(elId);
  if (el) el.textContent = n ? ` (${n})` : '';
}

// A Packs grid can easily hold 1000+ cards for a large wallet (confirmed
// live) — autoplaying video on every one at once (inventory.html avoids this
// entirely via a real IntersectionObserver lazy-loader) crashed the tab in
// testing. Preferring the static image and never autoplaying avoids the
// whole class of problem without needing that same lazy-load machinery here.
//
// Full AtomicAssets asset objects are heavy (nested collection/schema/
// template/mutable_data/backed_tokens) — confirmed live that scanning a
// large wallet's full inventory (owner=, paginated) and holding all of it
// as raw objects genuinely ran the tab out of memory (~10,674 assets).
// Every asset gets reduced to this lean shape immediately, right where it's
// fetched, so nothing ever holds the full raw object beyond one page at a
// time. Used uniformly everywhere a card needs to show name+media, whether
// the asset came from the bulk owner= scan or a single /assets/{id} fetch
// (see fetchAssetBrief) — one shape, one packMediaHtml.
function leanAsset(a) {
  return {
    asset_id: a.asset_id,
    name: a.data?.name || a.name || '',
    img: a.data?.img || a.data?.image || a.template?.immutable_data?.img || a.template?.immutable_data?.image || '',
    video: a.data?.video || a.template?.immutable_data?.video || '',
    collection_name: a.collection?.name || '',
  };
}

function packMediaHtml(asset) {
  if (asset.img) return `<img src="${escHtml(toMediaUrl(asset.img))}" alt="" loading="lazy">`;
  if (asset.video) return `<video src="${escHtml(toMediaUrl(asset.video))}" muted playsinline loop preload="none"></video>`;
  return '<div class="pack-media-ph">📦</div>';
}

async function fetchAssetBrief(assetId) {
  try { return await WaxApi.apiFetch(`${WaxApi.aaBase()}/assets/${encodeURIComponent(assetId)}`); }
  catch { return null; }
}

/* ── Nav auth ── */
const _wallet = WalletWidget.mount(document.querySelector('.nav-inner'), {
  authScript: 'shared/wax-auth.js',
  menuItems: walletMenuItems(),
});
window.addEventListener('wax-auth-change', onWalletChange);

/* ── Pack results popup — shown after any successful Claim (both the
   Unclaimed Packs section below and the inline Packs-section flow use it),
   listing the cards just received with a Close button that falls back to
   whichever page state was already showing underneath. ── */
const packResultOverlay = document.getElementById('packResultOverlay');
const packResultGrid = document.getElementById('packResultGrid');
function closePackResultPopup() {
  packResultOverlay.style.display = 'none';
  packResultGrid.innerHTML = '';
}
document.getElementById('packResultCloseX').addEventListener('click', closePackResultPopup);
document.getElementById('packResultCloseBtn').addEventListener('click', closePackResultPopup);
let _prDownOnOverlay = false;
packResultOverlay.addEventListener('mousedown', e => { _prDownOnOverlay = (e.target === packResultOverlay); });
packResultOverlay.addEventListener('click', e => { if (_prDownOnOverlay && e.target === packResultOverlay) closePackResultPopup(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape' && packResultOverlay.style.display !== 'none') closePackResultPopup(); });
function showPackResultsPopup(minted) {
  packResultGrid.innerHTML = minted.length
    ? minted.map(a => `
        <a class="pr-card" href="/asset/${encodeURIComponent(a.asset_id)}" target="_blank" rel="noopener">
          <div class="pr-card-media">${packMediaHtml(a)}</div>
          <div class="pr-card-name" title="${escHtml(a.name || 'Card')}">${escHtml(a.name || 'Card')}</div>
        </a>
      `).join('')
    : '<div class="pr-empty">Claimed — check your inventory for the new cards.</div>';
  packResultOverlay.style.display = 'flex';
}

/* ── Unclaimed Packs — unscoped (every collection at once), loaded once
   (page load / a real wallet change), not re-fetched by in-page
   interactions like picking a different collection below, and NOT touched
   by the Packs section's own inline unbox→claim flow (see buildPackCard) —
   a pack being actively opened there must never show up duplicated here
   too. This section only ever reflects what's on-chain as of the last
   load; a pack abandoned mid-flow (tab closed between Unbox and Claim)
   surfaces here the next time the page is actually loaded. ── */
async function loadUnclaimed(wallet) {
  const rows = await AtomicPacks.fetchUnclaimedPacks(wallet);
  const entries = [];
  for (const row of rows) {
    const pack = await AtomicPacks.lookupPackByPackId(row.pack_id);
    if (!pack) continue; // shouldn't happen, but don't let one bad row break the section
    entries.push({ row, pack });
  }
  return entries;
}

function buildUnclaimedCard(entry) {
  const { row, pack } = entry;
  const card = document.createElement('div');
  card.className = 'pack-card';
  card.dataset.packAssetId = row.pack_asset_id;
  card.innerHTML = `
    <div class="pack-card-media" data-media><div class="pack-media-ph">📦</div></div>
    <div class="pack-card-body">
      <div class="pack-card-name" data-name title="Pack #${escHtml(row.pack_asset_id)}">Pack #${escHtml(row.pack_asset_id)}</div>
      <div class="pack-card-col">${escHtml(pack.collection_name)}</div>
      <div class="pack-card-status" data-status></div>
      <button type="button" class="pack-btn" data-claim>Claim</button>
    </div>
  `;
  const btn = card.querySelector('[data-claim]');
  const statusEl = card.querySelector('[data-status]');
  btn.addEventListener('click', () => claimPack(row.pack_asset_id, pack, card, btn, statusEl));

  // Best-effort enrich with the asset's own name/image — it's currently
  // owned by atomicpacksx, not this wallet, but AtomicAssets still tracks
  // its data. Not blocking the card's initial render.
  fetchAssetBrief(row.pack_asset_id).then(asset => {
    if (!asset) return;
    const lean = leanAsset(asset);
    const nameEl = card.querySelector('[data-name]');
    if (nameEl) { nameEl.textContent = lean.name || ('Pack #' + row.pack_asset_id); nameEl.title = nameEl.textContent; }
    const mediaEl = card.querySelector('[data-media]');
    if (mediaEl) mediaEl.innerHTML = packMediaHtml(lean);
  }).catch(() => {});

  return card;
}

function checkUnclaimedEmpty() {
  const grid = document.getElementById('unclaimedGrid');
  setSectionCount('unclaimedCount', grid.children.length);
  if (grid.children.length === 0) document.getElementById('unclaimedSection').style.display = 'none';
}

async function claimPack(packAssetId, pack, cardEl, btn, statusEl) {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (!wallet) return;
  btn.disabled = true;
  btn.textContent = 'Claiming…';
  statusEl.textContent = '';
  statusEl.className = 'pack-card-status';
  try {
    const claimAction = await AtomicPacks.buildClaimAction(wallet, packAssetId);
    const result = await WaxAuth.transact([claimAction]);
    cardEl.remove();
    checkUnclaimedEmpty();
    showPackResultsPopup(AtomicPacks.extractMintedAssets(result));
  } catch (err) {
    const info = describeTxError(err);
    if (info.kind === 'cancelled') {
      btn.disabled = false;
      btn.textContent = 'Claim';
      return;
    }
    statusEl.innerHTML = info.kind !== 'generic' ? txErrorHtml(info, '', '') : escHtml(err.message || 'Claim failed.');
    statusEl.className = 'pack-card-status is-error';
    btn.disabled = false;
    btn.textContent = 'Claim';
  }
}

let _unclaimedGen = 0;

async function loadUnclaimedSection(wallet) {
  const myGen = ++_unclaimedGen;
  try {
    const entries = await loadUnclaimed(wallet);
    if (myGen !== _unclaimedGen) return;
    const grid = document.getElementById('unclaimedGrid');
    grid.innerHTML = '';
    entries.forEach(e => grid.appendChild(buildUnclaimedCard(e)));
    setSectionCount('unclaimedCount', entries.length);
    document.getElementById('unclaimedSection').style.display = entries.length ? '' : 'none';
  } catch (err) {
    if (myGen !== _unclaimedGen) return;
    // This section is an anomaly indicator, not a required part of the
    // page — fail quietly (stays hidden) rather than showing a scary error
    // for something that's supposed to be invisible most of the time.
    console.error('Failed to load unclaimed packs:', err);
    document.getElementById('unclaimedSection').style.display = 'none';
  }
}

/* ── Packs section ──
   Scanning a wallet's ENTIRE inventory to find its packs (the original
   approach) ran a real whale wallet's tab out of memory in testing — a
   collector's inventory is dominated by everything that ISN'T a pack.
   Instead: find which collections the wallet owns anything in AND that have
   at least one registered pack (both cheap: one /accounts summary call for
   owned collections+counts, plus AtomicPacks.getPackCollections(), which
   reads the same registry the lookups below already share — no full
   inventory scan at all), show those as a picker, and only ever fetch
   owner=+collection_name= scoped assets for whichever one is selected. */
let _packCollections = [];
let _selectedCollection = null;
let _deepLinkResolveAttempted = false;

async function loadPackCollectionsList(wallet) {
  const [ownedRes, packCollectionNames] = await Promise.all([
    WaxApi.rawFetch(`${WaxApi.aaBase()}/accounts/${encodeURIComponent(wallet)}`).then(r => r.json()),
    AtomicPacks.getPackCollections(),
  ]);
  const packSet = new Set(packCollectionNames);
  const candidates = (ownedRes?.data?.collections || [])
    .filter(e => e.collection?.collection_name && packSet.has(e.collection.collection_name))
    .map(e => ({
      collection_name: e.collection.collection_name,
      name: e.collection.name || e.collection.collection_name,
      ownedCount: null, // filled in below with the actual PACK count, not total cards owned in the collection
    }));

  // Owning SOMETHING in a pack-bearing collection doesn't mean owning a
  // PACK specifically (could just own regular cards from it) — confirm
  // each candidate with a cheap existence check (template_whitelist,
  // a single small response) rather than showing a collection that would
  // just turn out empty once picked. The same response also gives an
  // accurate pack count for the picker label (was previously the
  // collection's total owned-card count from /accounts, not packs
  // specifically) — capped at 100 since this is a display count, not
  // something that needs to be exact past that point. Bounded concurrency
  // since this can be dozens of collections' worth of individual requests.
  const CONCURRENCY = 10;
  const COUNT_CAP = 100;
  const owns = new Array(candidates.length).fill(false);
  let idx = 0;
  async function worker() {
    while (idx < candidates.length) {
      const i = idx++;
      const templateIds = await AtomicPacks.getPackTemplateIdsByCollection(candidates[i].collection_name);
      if (!templateIds.length) continue;
      try {
        const rows = await WaxApi.apiFetch(
          `${WaxApi.aaBase()}/assets?owner=${encodeURIComponent(wallet)}&collection_name=${encodeURIComponent(candidates[i].collection_name)}&template_whitelist=${templateIds.join(',')}&limit=${COUNT_CAP + 1}`
        );
        const n = rows ? rows.length : 0;
        owns[i] = n > 0;
        candidates[i]._rawCount = n; // kept numeric for sorting — ownedCount below may become a capped display string
        candidates[i].ownedCount = n > COUNT_CAP ? `${COUNT_CAP}+` : n;
      } catch { /* couldn't confirm — leave it out rather than risk showing an empty collection */ }
    }
  }
  await Promise.all(Array.from({ length: Math.min(CONCURRENCY, candidates.length) }, worker));

  return candidates
    .filter((c, i) => owns[i])
    .sort((a, b) => (b._rawCount || 0) - (a._rawCount || 0));
}

// Same type-to-search combo widget as inventory.html's own Collection
// filter (identical markup/behavior: cb-combo/cb-panel/cb-item, all styled
// globally in shared/global.css already) — duplicated here rather than
// extracted into a shared module, matching this codebase's existing
// convention of small per-page UI helpers (escHtml, toMediaUrl, etc.)
// staying local until a THIRD page needs the same thing.
function cbItemHtml(i, currentValue) {
  return `<div class="cb-item${i.value === currentValue ? ' active' : ''}" data-val="${escHtml(i.value)}"><span>${escHtml(i.label)}</span></div>`;
}
function renderCbItemsInto(listEl, items, currentValue, onSelect) {
  listEl.innerHTML = items.length
    ? items.map(i => cbItemHtml(i, currentValue)).join('')
    : `<div class="cb-empty">No matches</div>`;
  listEl.querySelectorAll('.cb-item').forEach(item => {
    item.addEventListener('click', () => {
      closeAllCbCombos();
      onSelect(item.dataset.val);
    });
  });
}
function syncCbComboDisplay(combo) {
  const input   = combo.querySelector('.cb-combo-input');
  const clear   = combo.querySelector('.cb-combo-clear');
  const allItem = combo._cbItems[0];
  const active  = combo._cbItems.find(i => i.value === combo._cbCurrentValue) || allItem;
  const hasSelection = active.value !== allItem.value;
  input.placeholder = allItem.label;
  input.value = hasSelection ? active.label : '';
  input.title = hasSelection ? active.label : '';
  clear.style.display = hasSelection ? '' : 'none';
  combo.classList.toggle('has-selection', hasSelection);
}
function closeAllCbCombos() {
  document.querySelectorAll('.cb-combo').forEach(combo => {
    combo.querySelector('.cb-panel')?.classList.remove('open');
    combo.classList.remove('open');
    if (combo._cbItems) syncCbComboDisplay(combo);
  });
}
function buildCbCombo(comboId, items, currentValue, onSelect) {
  const combo = document.getElementById(comboId);
  combo._cbItems        = items;
  combo._cbCurrentValue = currentValue;
  combo._cbOnSelect     = onSelect;
  syncCbComboDisplay(combo);
  if (combo._cbWired) return;
  combo._cbWired = true;

  const input = combo.querySelector('.cb-combo-input');
  const clear = combo.querySelector('.cb-combo-clear');
  const panel = combo.querySelector('.cb-panel');

  const renderList = filterText => {
    const q = filterText.trim().toLowerCase();
    const options = combo._cbItems.slice(1); // exclude the "All ..." sentinel — it's the placeholder/clear, not a row
    const filtered = q
      ? options.filter(i => i.label.toLowerCase().includes(q) || i.value.toLowerCase().includes(q))
      : options;
    renderCbItemsInto(panel, filtered, combo._cbCurrentValue, val => {
      combo._cbCurrentValue = val;
      closeAllCbCombos();
      combo._cbOnSelect(val);
    });
  };

  input.addEventListener('focus', () => {
    closeAllCbCombos();
    combo.classList.add('open');
    panel.classList.add('open');
    renderList('');
    input.select();
  });
  input.addEventListener('input', () => renderList(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') {
      e.stopPropagation();
      input.blur();
      closeAllCbCombos();
    } else if (e.key === 'Enter') {
      e.preventDefault();
      panel.querySelector('.cb-item')?.click();
    }
  });
  input.addEventListener('blur', () => {
    setTimeout(() => { if (!combo.contains(document.activeElement)) closeAllCbCombos(); }, 150);
  });
  clear.addEventListener('mousedown', e => e.preventDefault());
  clear.addEventListener('click', () => {
    combo._cbCurrentValue = combo._cbItems[0].value;
    syncCbComboDisplay(combo);
    combo._cbOnSelect(combo._cbCurrentValue);
    input.blur();
  });
}
document.addEventListener('click', e => {
  if (!e.target.closest('.cb-combo')) closeAllCbCombos();
});

// item[0] is always the "All collections" sentinel — selecting it means
// "nothing picked yet" (per explicit request: default to All, prompt the
// visitor to pick one, never auto-load the top collection).
function packCollectionComboItems() {
  return [{ value: 'all', label: 'All collections' }].concat(
    _packCollections.map(c => ({
      value: c.collection_name,
      label: c.name + (c.ownedCount != null ? ` (${c.ownedCount})` : ''),
    }))
  );
}
function renderCollectionPicker(currentValue) {
  buildCbCombo('packsCollectionCombo', packCollectionComboItems(), currentValue || 'all', val => {
    const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
    if (wallet) selectPackCollection(wallet, val);
  });
}

// Groups by template_id AND reduces to leanAsset() in the same pass over
// each fetched page, rather than collecting the full raw scan into one
// array first and grouping afterward — confirmed live that holding both
// the full raw array AND the grouped copy at once was part of what drove
// the OOM crash above. Scoped to one collection now, so this rarely
// exceeds a single page even for a large collector.
async function loadPacksForCollection(wallet, collectionName) {
  const byTemplate = new Map(); // template_id -> leanAsset[]
  let page = 1;
  for (;;) {
    const url = `${WaxApi.aaBase()}/assets?owner=${encodeURIComponent(wallet)}&collection_name=${encodeURIComponent(collectionName)}&limit=1000&page=${page}`;
    const rows = await WaxApi.apiFetch(url);
    if (!rows || !rows.length) break;
    for (const a of rows) {
      const tid = a.template?.template_id;
      if (!tid) continue;
      if (!byTemplate.has(tid)) byTemplate.set(tid, []);
      byTemplate.get(tid).push(leanAsset(a));
    }
    if (rows.length < 1000) break;
    page++;
  }

  // Resolve pack-ness per DISTINCT template only — a collector owning many
  // copies of the same pack template only costs one lookup, not one per
  // asset. lookupPackByTemplateId shares one registry fetch across every
  // call (see shared/atomic-packs.js), so firing them all at once is free —
  // no manual concurrency limiting needed.
  const distinctIds = [...byTemplate.keys()];
  const packRows = await Promise.all(distinctIds.map(tid => AtomicPacks.lookupPackByTemplateId(tid)));

  const entries = [];
  distinctIds.forEach((tid, i) => {
    const pack = packRows[i];
    if (!pack) return;
    for (const asset of byTemplate.get(tid)) entries.push({ asset, pack });
  });
  return entries;
}

function showState(state) {
  document.getElementById('authGate').style.display  = state === 'auth'    ? '' : 'none';
  document.getElementById('loadWrap').style.display  = state === 'loading' ? '' : 'none';
  document.getElementById('emptyWrap').style.display = state === 'empty'   ? '' : 'none';
  // The collection picker stays visible across loading/list/empty — picking
  // a different collection re-loads what's below it, not itself — only
  // hidden while logged out or before collections have been discovered.
  document.getElementById('packsCollectionPicker').style.display = (state !== 'auth' && _packCollections.length > 0) ? '' : 'none';
  document.getElementById('packsList').style.display = state === 'list' ? '' : 'none';
  document.getElementById('packsLoadMoreWrap').style.display = (state === 'list' && _packVisible < _packEntries.length) ? '' : 'none';
}

document.getElementById('packsLoadMoreBtn').addEventListener('click', () => {
  const btn = document.getElementById('packsLoadMoreBtn');
  btn.disabled = true;
  renderPackBatch();
  btn.disabled = false;
});

// Switching the collection picker back and forth is a same-session, same-
// wallet action — re-running the full owner+collection asset scan (and its
// per-template pack lookups) every single time made the picker feel broken
// (confirmed: visibly slow on every switch, including switching straight
// back to a collection just viewed seconds earlier). Cached in memory per
// collection for the rest of this page visit; cleared on a real wallet
// change (see onWalletChange) so a different wallet never sees stale
// entries. The "just bought a pack, come straight here" freshness need is
// still met — that's about the FIRST time a collection loads in this
// session, which this cache doesn't affect at all.
let _packCollectionCache = new Map(); // collection_name -> entries[]

function renderPackEntries(entries) {
  _packEntries = entries;
  _packVisible = 0;
  const list = document.getElementById('packsList');
  list.innerHTML = '';
  if (!entries.length) {
    document.getElementById('emptyWrap').innerHTML = '<strong>No packs in this collection</strong>Pick another collection above.';
    showState('empty');
    return;
  }
  renderPackBatch();
  showState('list');
  maybeHighlightDeepLink(list);
}

async function selectPackCollection(wallet, collectionName) {
  _selectedCollection = collectionName;
  const myGen = ++_loadGen;
  // "All collections" is the default/prompt state, not something to fetch —
  // per explicit request, nothing loads until a specific collection is
  // picked (this is also what avoids re-introducing the whole-inventory
  // scan the picker exists to prevent in the first place).
  if (collectionName === 'all') {
    _packEntries = [];
    _packVisible = 0;
    document.getElementById('packsList').innerHTML = '';
    document.getElementById('emptyWrap').innerHTML = '<strong>Pick a collection</strong>Select one above to see your packs.';
    showState('empty');
    return;
  }
  if (_packCollectionCache.has(collectionName)) {
    renderPackEntries(_packCollectionCache.get(collectionName));
    return;
  }
  showState('loading');
  try {
    const entries = await loadPacksForCollection(wallet, collectionName);
    if (myGen !== _loadGen) return;
    _packCollectionCache.set(collectionName, entries);
    renderPackEntries(entries);
  } catch (err) {
    if (myGen !== _loadGen) return;
    console.error('Failed to load packs for ' + collectionName + ':', err);
    document.getElementById('emptyWrap').innerHTML = '<strong>Failed to load</strong>Could not reach the WAX API. Please try again later.';
    showState('empty');
  }
}

// A large collector can own 1000+ packs (confirmed live) — mounting that
// many cards (each with its own <img>) in one paint crashed the tab in
// testing. Rendered in bounded batches instead, same "Load more" pattern
// inventory.html already uses for its own grid.
const PACK_PAGE_SIZE = 60;
let _packEntries = [];
let _packVisible = 0;

function renderPackBatch() {
  const list = document.getElementById('packsList');
  const next = _packEntries.slice(_packVisible, _packVisible + PACK_PAGE_SIZE);
  next.forEach(e => list.appendChild(buildPackCard(e)));
  _packVisible += next.length;
  const moreWrap = document.getElementById('packsLoadMoreWrap');
  moreWrap.style.display = _packVisible < _packEntries.length ? '' : 'none';
}

// Cards stay in place through the whole flow — clicking Unpack signs the
// unbox tx, then (once the oracle roll resolves) the SAME card's button
// flips to Claim in place, rather than moving into the Unclaimed Packs
// section above (that section is reserved for packs abandoned mid-flow on
// a past visit — see its own comment). `card.dataset.stage` drives which
// handler the button's click runs.
function buildPackCard(entry) {
  const { asset, pack } = entry;
  const card = document.createElement('div');
  card.className = 'pack-card';
  card.dataset.assetId = asset.asset_id;
  card.dataset.stage = 'openable';
  const name = asset.name || 'Pack';
  const collection = asset.collection_name || pack.collection_name || '';
  const locked = pack.unlock_time && pack.unlock_time * 1000 > Date.now();
  card.innerHTML = `
    <div class="pack-card-media">${packMediaHtml(asset)}</div>
    <div class="pack-card-body">
      <div class="pack-card-name" title="${escHtml(name)}">${escHtml(name)}</div>
      <div class="pack-card-col">${escHtml(collection)}</div>
      <div class="pack-card-status" data-status>${locked ? 'Unlocks ' + new Date(pack.unlock_time * 1000).toLocaleDateString() : ''}</div>
      <button type="button" class="pack-btn" data-action${locked ? ' disabled' : ''}>${locked ? 'Locked' : 'Unpack'}</button>
    </div>
  `;
  const btn = card.querySelector('[data-action]');
  const statusEl = card.querySelector('[data-status]');
  if (!locked) {
    btn.addEventListener('click', () => {
      if (card.dataset.stage === 'claimable') claimPackFromCard(entry, card, btn, statusEl);
      else unboxPackFromCard(entry, card, btn, statusEl);
    });
  }
  return card;
}

function checkPacksEmpty() {
  if (_packEntries.length === 0) {
    document.getElementById('packsList').style.display = 'none';
    document.getElementById('packsLoadMoreWrap').style.display = 'none';
    document.getElementById('emptyWrap').innerHTML = '<strong>No packs left in this collection</strong>Pick another collection above.';
    document.getElementById('emptyWrap').style.display = '';
  }
}

// The actual on-chain action is still "unbox" (atomicassets::transfer with
// memo "unbox", see shared/atomic-packs.js) — only the user-facing label
// changed to "Unpack" to match the rest of this page's wording.
async function unboxPackFromCard(entry, card, btn, statusEl) {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (!wallet) return;
  const assetId = entry.asset.asset_id;
  btn.disabled = true;
  btn.textContent = 'Unpacking…';
  statusEl.textContent = '';
  statusEl.className = 'pack-card-status';
  try {
    await WaxAuth.transact([AtomicPacks.buildUnboxAction(wallet, assetId)]);
    btn.textContent = 'Waiting…';
    statusEl.textContent = 'Waiting for reveal…';
    const ready = await pollForClaimReady(wallet, assetId);
    if (!ready) {
      // Degrades gracefully: the pack asset already left the wallet (it
      // was transferred to atomicpacksx), so this exact button can't be
      // used again — but the Unclaimed Packs section above will still pick
      // it up on this page's next real load, same as any other abandoned
      // in-progress pack.
      statusEl.textContent = 'Taking longer than usual — reload in a bit; it will show under Unclaimed Packs above once ready.';
      btn.textContent = 'Unboxed';
      return;
    }
    card.dataset.stage = 'claimable';
    statusEl.textContent = '';
    btn.textContent = 'Claim';
    btn.disabled = false;
  } catch (err) {
    const info = describeTxError(err);
    if (info.kind === 'cancelled') {
      btn.disabled = false;
      btn.textContent = 'Unpack';
      return;
    }
    statusEl.innerHTML = info.kind !== 'generic' ? txErrorHtml(info, '', '') : escHtml(err.message || 'Unpack failed.');
    statusEl.className = 'pack-card-status is-error';
    btn.disabled = false;
    btn.textContent = 'Unpack';
  }
}

// Bounded poll after Unpack — the oracle callback usually resolves in
// 2-5s, but isn't always reliable (a real pack sat unresolved for 3+
// months in earlier testing). Polls AtomicPacks.fetchOriginRollIds (the
// `unboxassets` table, scoped by this exact asset_id) rather than
// fetchUnclaimedPacks/`unboxpacks` — confirmed live that `unboxpacks` is
// written at Unbox time, BEFORE the oracle resolves, so its existence
// alone isn't proof a claim would actually succeed yet; `unboxassets`
// populated (non-empty) is the real "ready to claim" signal.
async function pollForClaimReady(wallet, assetId) {
  const POLL_MS = 2000, TIMEOUT_MS = 30000;
  const start = Date.now();
  while (Date.now() - start < TIMEOUT_MS) {
    await new Promise(r => setTimeout(r, POLL_MS));
    if ((window.getWaxAccount ? window.getWaxAccount() : null) !== wallet) return false; // wallet changed mid-poll
    const ids = await AtomicPacks.fetchOriginRollIds(assetId);
    if (ids.length) return true;
  }
  return false;
}

async function claimPackFromCard(entry, card, btn, statusEl) {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (!wallet) return;
  btn.disabled = true;
  btn.textContent = 'Claiming…';
  statusEl.textContent = '';
  statusEl.className = 'pack-card-status';
  try {
    const claimAction = await AtomicPacks.buildClaimAction(wallet, entry.asset.asset_id);
    const result = await WaxAuth.transact([claimAction]);
    const idx = _packEntries.indexOf(entry);
    if (idx !== -1) { _packEntries.splice(idx, 1); _packVisible--; }
    card.remove();
    checkPacksEmpty();
    showPackResultsPopup(AtomicPacks.extractMintedAssets(result));
  } catch (err) {
    const info = describeTxError(err);
    if (info.kind === 'cancelled') {
      btn.disabled = false;
      btn.textContent = 'Claim';
      return;
    }
    statusEl.innerHTML = info.kind !== 'generic' ? txErrorHtml(info, '', '') : escHtml(err.message || 'Claim failed.');
    statusEl.className = 'pack-card-status is-error';
    btn.disabled = false;
    btn.textContent = 'Claim';
  }
}

/* ── Deep link (?asset_id=) — Packs section only, best-effort ──
   If the target isn't in the first rendered batch (e.g. it's the 400th
   pack in a large inventory), pull enough extra batches in to include it
   before searching — otherwise it would silently never be found. */
function deepLinkAssetId() {
  return new URLSearchParams(location.search).get('asset_id');
}

function maybeHighlightDeepLink(list) {
  const targetId = deepLinkAssetId();
  if (!targetId) return;
  const idx = _packEntries.findIndex(e => String(e.asset.asset_id) === String(targetId));
  if (idx === -1) return; // not one of this wallet's packs (already unboxed elsewhere, wrong wallet, etc.)
  while (_packVisible <= idx) renderPackBatch();
  const card = list.querySelector(`[data-asset-id="${CSS.escape(targetId)}"]`);
  if (card) {
    card.classList.add('pack-card--highlight');
    card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  }
}

let _loadGen = 0;

async function loadPacksSection(wallet) {
  const myGen = ++_loadGen;
  showState('loading');
  try {
    // Re-discovered fresh every time, not cached per session — someone who
    // just bought a pack (very common: buy it, go straight here to open
    // it) needs to see it immediately, including in a collection they
    // didn't have any candidate packs in a minute ago.
    const collections = await loadPackCollectionsList(wallet);
    if (myGen !== _loadGen) return;
    _packCollections = collections;
    if (!_packCollections.length) {
      document.getElementById('emptyWrap').innerHTML = '<strong>No packs found</strong>Nothing in your inventory is openable right now.';
      showState('empty');
      return;
    }
    let initial = 'all';
    if (_selectedCollection != null) {
      // Revisiting — keep whatever was picked (its pack list gets
      // re-fetched fresh below regardless of whether it's still in the
      // candidate list, since that list is just for browsing; the fetch
      // itself is always the live truth).
      initial = _selectedCollection;
    } else {
      // First load — default "All collections" (a prompt, not a fetch —
      // see selectPackCollection) unless a deep link from asset.html/
      // inventory.html resolves to one of the candidate collections, in
      // which case that one loads immediately.
      const targetAssetId = deepLinkAssetId();
      if (targetAssetId && !_deepLinkResolveAttempted) {
        _deepLinkResolveAttempted = true;
        const brief = await fetchAssetBrief(targetAssetId);
        if (myGen !== _loadGen) return;
        const col = brief?.collection?.collection_name;
        if (col && _packCollections.some(c => c.collection_name === col)) initial = col;
      }
    }
    renderCollectionPicker(initial);
    await selectPackCollection(wallet, initial);
  } catch (err) {
    if (myGen !== _loadGen) return;
    console.error('Failed to load packs:', err);
    document.getElementById('emptyWrap').innerHTML = '<strong>Failed to load</strong>Could not reach the WAX API. Please try again later.';
    showState('empty');
  }
}

/* ── Init ── */
let _lastWallet = null;

function onWalletChange() {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  // A different wallet (including a straight switch via the nav's Linked
  // Wallets menu — no page reload in between) invalidates the previous
  // wallet's discovered collections entirely, not just its pack list.
  const walletChanged = wallet !== _lastWallet;
  if (walletChanged) {
    _packCollections = [];
    _selectedCollection = null;
    _deepLinkResolveAttempted = false;
    _packCollectionCache.clear();
  }
  _lastWallet = wallet;
  if (!wallet) {
    showState('auth');
    document.getElementById('unclaimedSection').style.display = 'none';
    return;
  }
  loadPacksSection(wallet);
  // Unclaimed Packs loads once per real wallet change, not on every
  // wax-auth-change re-fire for the same wallet and not on in-page
  // interactions (e.g. picking a different collection below).
  if (walletChanged) loadUnclaimedSection(wallet);
}
function init() {
  _lastWallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (_lastWallet) {
    loadPacksSection(_lastWallet);
    loadUnclaimedSection(_lastWallet);
  } else {
    showState('auth');
  }
}
init();
</script>
<script src="shared/moved.js"></script>
</body>
</html>
