<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Pack Stats — NHL Breakaway — Hoardio</title>
  <meta name="description" content="Browse every NHL Breakaway pack — moments, editions, opened, collected, and percent-remaining stats. Filter by series and rarity." />
  <link rel="canonical" href="https://www.hoardio.com/nhlbreakaway/pack-stats" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.hoardio.com/nhlbreakaway/pack-stats" />
  <meta property="og:title" content="Pack Stats — NHL Breakaway — Hoardio" />
  <meta property="og:description" content="Browse every NHL Breakaway pack — moments, editions, opened, collected, and percent-remaining stats. Filter by series and rarity." />
  <meta property="og:image" content="https://www.hoardio.com/images/og-nhlbreakaway.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Pack Stats — NHL Breakaway — Hoardio" />
  <meta name="twitter:description" content="Browse every NHL Breakaway pack — moments, editions, opened, collected, and percent-remaining stats. Filter by series and rarity." />
  <meta name="twitter:image" content="https://www.hoardio.com/images/og-nhlbreakaway.png" />
  <link rel="icon" href="../images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="../images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="../shared/global.css" />
  <style>
    .content { display: flex; flex-direction: column; gap: 1.25rem; }
    .page-header { margin-bottom: 0; }

    /* ── Filter bar ── */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .filter-bar .cb-combo { min-width: 180px; flex: 1; max-width: 280px; }
    .filter-bar .search-input {
      flex: 1; min-width: 180px; max-width: 320px;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      color: var(--text-primary); padding: 0.5rem 0.75rem; font-size: 0.85rem;
    }
    .filter-bar .search-input:focus { outline: none; border-color: var(--accent); }
    /* Activity tab's Min/Max Edition — narrow fixed-width number inputs,
       same idea as wallet.html's own amount-range-input (a plain min-width
       on .search-input would otherwise silently win over a narrower width
       set here). */
    .filter-bar .amount-range-input { width: 120px; flex: 0 0 auto; min-width: 0; max-width: 120px; }
    @media (max-width: 700px) { .filter-bar .amount-range-input { max-width: none; } }

    /* Activity tab's two filter groups (Pack Filters / Highlight Filters) —
       same label styling as .mobile-stat-label elsewhere on this site. */
    .filter-group { display: flex; flex-direction: column; gap: 0.5rem; }
    .filter-group-label {
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-secondary);
    }

    /* Opener search — a plain .search-input plus a live suggestion dropdown
       (same /api/wallet/suggest-backed type-ahead as wallet.html's own
       Wallet Look Up box), so it needs the same relative-positioned wrap +
       cb-dropdown-clear + cb-panel trio wallet.html uses for its own input. */
    .opener-search-wrap { position: relative; flex: 1.2; min-width: 220px; max-width: 320px; }
    .opener-search-wrap .search-input { width: 100%; max-width: none; padding-right: 2.1rem; }
    .suggest-item { display: flex; flex-direction: column; align-items: flex-start; gap: 0.15rem; }
    .suggest-item-name { font-weight: 600; }
    .suggest-item-wallet { font-size: 0.72rem; color: var(--text-secondary); }

    /* ── Busy overlay — shown while the initial packs fetch is in flight.
       Same fixed, viewport-centered overlay + solid message card as
       highlights.html/edition-rankings.html/holders.html's own — this page
       only ever fetches once (every filter/sort after that is client-side
       over the already-loaded rows), so this only wraps init()'s own
       fetchPacks() call. ── */
    .busy-overlay {
      position: fixed; inset: 0; z-index: 400;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6);
    }
    .busy-overlay.active { display: flex; }
    .busy-box {
      display: flex; align-items: center; gap: 0.6rem;
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 0.9rem 1.4rem; border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      font-size: 0.85rem; font-weight: 600; color: var(--text-primary);
    }
    .busy-spinner {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.25); border-top-color: var(--accent-light);
      animation: busy-spin 0.7s linear infinite;
    }
    @keyframes busy-spin { to { transform: rotate(360deg); } }

    /* Mobile-only "Sort by" combo + Asc/Desc toggle — replaces the desktop
       table's clickable column headers, which disappear along with the
       table itself at this width (see .mobile-card-list below). Without
       this, mobile would have no way to change sort order at all. */
    .mobile-sort-bar { display: none; }
    .mobile-sort-bar .cb-combo { max-width: 220px; }

    /* ── Results meta ── */
    .results-meta { font-size: 0.8rem; color: var(--text-secondary); min-height: 1.2em; }
    .results-meta strong { color: var(--text-primary); }

    /* ── Tabs (Stats / Activity) — same pattern as holders.html's own
       Editions/Top Holders tabs. ── */
    .packstats-tabs { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: -1px; }
    .packstats-tab-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 0.65rem 0.1rem; font-family: inherit; font-size: 0.85rem; font-weight: 700;
      color: var(--text-secondary); cursor: pointer; transition: color 0.15s, border-color 0.15s;
    }
    .packstats-tab-btn:hover { color: var(--text-primary); }
    .packstats-tab-btn.active { color: var(--accent-light); border-bottom-color: var(--accent); }
    .packstats-tab-panel { display: none; flex-direction: column; gap: 1.25rem; margin-top: 1.25rem; }
    .packstats-tab-panel.active { display: flex; }

    /* Stats tab's pack-name cell becomes a real link into the Activity tab,
       pre-filtered to that pack (see PACKS_ROW_LINK below) — same "real
       anchor, not a div+click" convention as every other drill-through link
       on this site (right/middle-click still works for free). */
    .pack-name-link { color: var(--text-primary); text-decoration: none; }
    .pack-name-link:hover { color: var(--accent-light); text-decoration: underline; }

    /* ── Activity tab ── */
    .activity-table td { vertical-align: top; }
    /* Zebra striping — each row is a whole pack-open (4 stacked highlight
       lines), tall enough that adjacent rows blend together without a clear
       separator. Only on this table, not the Stats tab's dense single-line
       rows, which don't need it. */
    .activity-table tbody tr:nth-child(even) { background: rgba(255,255,255,0.02); }
    /* Same accent-light treatment as holders.html's own .holder-link — the
       site's established color for a resolved username link. */
    .opener-link { color: var(--accent-light); text-decoration: none; }
    .opener-link:hover { text-decoration: underline; }
    /* Icon-only Polygonscan link — same treatment as wallet.html's own
       .explorer-link on its Activity tab. */
    .explorer-link { color: var(--text-secondary); text-decoration: none; }
    .explorer-link:hover { color: var(--accent-light); }

    /* One pulled highlight (of usually 4) inside a pack-open row — a mini
       version of the site's own table-row shape, not a full separate table,
       since it's nested inside one cell/mobile-card. */
    .pull-list { display: flex; flex-direction: column; gap: 4px; min-width: 220px; }
    .pull-item {
      display: flex; align-items: center; gap: 0.5rem;
      color: inherit; text-decoration: none; font-size: 0.8rem;
      padding: 2px 0; border-radius: 4px;
    }
    .pull-item:hover .pull-player { color: var(--accent-light); text-decoration: underline; }
    .pull-player { font-weight: 600; color: var(--text-primary); }
    .pull-set { color: var(--text-secondary); font-size: 0.72rem; flex: 1; }
    .pull-edition { color: var(--text-secondary); font-size: 0.72rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .pull-list-wrap { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
    .pull-list-wrap .pull-list { margin-top: 0.35rem; }

    /* ── Left in Packs tab ── */
    .pools-summary {
      display: flex; flex-wrap: wrap; gap: 1.5rem;
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.85rem 1.2rem;
    }
    .pools-summary-item { display: flex; flex-direction: column; gap: 2px; }
    .pools-summary-value { font-size: 1.3rem; font-weight: 800; color: var(--accent-light); font-variant-numeric: tabular-nums; }
    .pools-summary-label { font-size: 0.65rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }

    /* One highlight-pool row's linked highlight(s) — usually 1 (an
       individual highlight), occasionally several (a shared pool, e.g. "The
       Greatest Achievements" Legendary tier sharing 1 pull across 5
       players) — same idea as the Activity tab's own pull-list, reused
       verbatim since it's the same "compact linked mini-list inside one
       cell" shape. */
    .pool-members { display: flex; flex-direction: column; gap: 4px; }
    .pool-member {
      display: flex; align-items: center; gap: 0.5rem;
      color: inherit; text-decoration: none; font-size: 0.83rem;
    }
    .pool-member:hover .pool-member-name { color: var(--accent-light); text-decoration: underline; }
    .pool-member-name { font-weight: 600; color: var(--text-primary); }
    .pool-member-team { color: var(--text-secondary); font-size: 0.72rem; flex: 1; }
    /* Per-member pulled count within a shared-pool group — see
       poolMemberHtml's showPulled param. Dim/plain at 0, accent+bold on the
       member(s) that actually account for the group's pulled total, so a
       glance answers "which one(s) got pulled". */
    .pool-member-pulled { color: var(--text-secondary); font-size: 0.72rem; font-variant-numeric: tabular-nums; }
    .pool-member-pulled--hit { color: var(--accent-light); font-weight: 700; }
    .pool-shared-note { display: block; font-size: 0.65rem; color: var(--text-secondary); margin-top: 2px; }

    .pool-remaining { font-weight: 700; font-variant-numeric: tabular-nums; }
    /* Red — this exact highlight/pool has nothing left, matches the site's
       existing "negative/depleted" red convention (holders.html's
       .floor-price-missing, wallet.html's .cell-rating--negative). */
    .pool-remaining--depleted { color: #f87171; }
    /* Yellow — still available but low, same "heads up" amber as the
       Wallet tab's own .hl-unpriced-flag. Threshold is a plain <=5, not
       tied to the pool's own size — a 1-of-1 with 1 left and a 500-pool
       with 5 left both read as "grab it soon" at a glance. */
    .pool-remaining--low { color: #eab308; }

    .pools-unsourced {
      font-size: 0.82rem; color: var(--text-secondary);
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 12px;
      padding: 0.85rem 1.2rem;
    }
    .pools-unsourced-list { margin-top: 0.5rem; display: flex; flex-wrap: wrap; gap: 0.4rem 1rem; }

    /* ── Packs table ── */
    .packs-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .packs-table thead th {
      text-align: left; padding: 8px 12px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-secondary); background: var(--bg-card);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .packs-table thead th.col-r { text-align: right; }
    .packs-table thead th.sortable { cursor: pointer; user-select: none; }
    .packs-table thead th.sortable:hover { color: var(--text-primary); }
    .packs-table thead th .sort-icon { font-size: 0.6rem; opacity: 0.45; margin-left: 3px; }
    .packs-table thead th.sorted .sort-icon { opacity: 1; color: var(--accent-light); }
    .packs-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
    .packs-table tbody tr:last-child { border-bottom: none; }
    .packs-table tbody tr:hover { background: rgba(255,255,255,0.04); }
    .packs-table tbody td { padding: 8px 12px; vertical-align: middle; }
    .packs-table tbody td.col-r { text-align: right; font-variant-numeric: tabular-nums; }

    .cell-pack-name { font-weight: 600; color: var(--text-primary); }
    /* Uncapped pack design (pack_moments.total_editions IS NULL — mints
       progressively, no fixed cap) — same live "so far" treatment as
       sets.html/highlights.html's .editions-growing, applied to the same
       live-distributed-total concept here. */
    .editions-growing { color: var(--accent-light); font-weight: 700; cursor: help; }
    .cell-series { font-size: 0.68rem; color: var(--text-secondary); margin-top: 2px; }
    .cell-pct { display: block; font-size: 0.72rem; color: var(--text-secondary); margin-top: 2px; }

    /* ── Rarity pills — identical to sets.html's, kept in sync by hand (see
       reference_nhlbreakaway_rarity_colors memory for the source colors). ── */
    .rarity-pill {
      --rr-border: linear-gradient(rgba(255,255,255,0.35), rgba(255,255,255,0.35));
      --rr-text: linear-gradient(91.27deg, #fff 6.06%, #e7f1f4 47.93%, #fff 87.27%);
      display: inline-flex; align-items: center; line-height: 1;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
      border: 1px solid transparent;
      background-origin: border-box;
      background-clip: padding-box, border-box;
      background-image: linear-gradient(var(--bg), var(--bg)), var(--rr-border);
    }
    .rarity-pill-text {
      background-image: var(--rr-text);
      -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
    }
    .rarity-pill--fandom    { --rr-border: linear-gradient(91deg, #824424, #8a6441 30%, #7b4c2e 90%); --rr-text: linear-gradient(91deg, #d1713e 6.06%, #f3ac6c 47.93%, #d28e62 87.27%); }
    .rarity-pill--rare      { --rr-border: linear-gradient(92deg, #4e7fff, #2f52d6 30%, #4e7fff 90%); --rr-text: linear-gradient(93.83deg, #68aeff -0.71%, #c4dfff 45.06%, #68aeff 99.14%); }
    .rarity-pill--limited   { --rr-border: linear-gradient(91deg, #646464, #303030 30%, #646464 90%); --rr-text: linear-gradient(91.27deg, #a5b4ae 6.06%, #e6edea 31.44%, #bdc2c0 47.51%, #d9d9d9 63.58%, #c5d2ce 87.27%); }
    .rarity-pill--legendary { --rr-border: linear-gradient(92.71deg, #bd8800 -7.25%, #633b00 16.42%, #bd8800 36.23%, #633b00 54.94%, #bd8800 76.96%, #633b00 98.42%); --rr-text: linear-gradient(91.27deg, #ffb800 6.06%, #ffebb8 47.93%, #ffcf55 87.27%); }
    .rarity-pill--epic      { --rr-border: linear-gradient(92deg, #007770, #350da7 10%, #89068b 30%, #350da7 70%, #007770 95%); --rr-text: linear-gradient(99.88deg, #23ffa3 0.36%, #5177ff 24.51%, #f364ff 46.15%, #748aff 71.31%, #28ffcb 96.55%); }
    .rarity-pill--heroic    { --rr-border: linear-gradient(91.94deg, #58009d 3.4%, #2b00ab 27.27%, #58009d 45.16%, #2b00ab 60.73%, #58009d 80.46%, #2b00ab 98.86%); --rr-text: linear-gradient(91.27deg, #7d8aff 6.06%, #b98eff 47.93%, #4176ff 87.27%); }
    .rarity-pill--mythic    { --rr-border: linear-gradient(91.94deg, #ff2600 30%, #e20004 50%, #870005 80%, #e20004 98%, #ff2600); --rr-text: linear-gradient(91.27deg, #ff2600 6.06%, #e20004 47.93%); }

    /* ── Mobile card list — one card per pack instead of a table row, so
       phone widths never need horizontal scroll to read the rest of a row.
       Same "two parallel DOM representations, toggled by breakpoint" pattern
       as trade-analyzer.html's own mobile-card-list (table wrapper hides,
       this shows) — simpler here since pack-stats has no per-row sub-state
       to keep in sync, just re-rendered from the same filtered/sorted rows
       every time. Hidden above 700px, matching this page's own existing
       breakpoint (not trade-analyzer's 640px). ── */
    .mobile-card-list { display: none; flex-direction: column; gap: 0.75rem; }
    .mobile-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 0.85rem 1rem;
    }
    /* Bled out to the card's own edges (negative margin matching
       .mobile-card's padding, restored as padding so content position is
       unchanged) so the tint reads as a full-width header band, not just a
       tinted rectangle floating inside the card's padding. Top corners
       rounded to match the card's own radius. */
    .mobile-card-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 0.75rem;
      margin: -0.85rem -1rem 0.6rem;
      padding: 0.85rem 1rem 0.6rem;
      border-bottom: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      background: rgba(255,255,255,0.045);
    }
    .mobile-card-stats {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0.6rem 1rem;
    }
    .mobile-stat-label {
      display: block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-secondary); margin-bottom: 2px;
    }
    .mobile-stat-value { font-variant-numeric: tabular-nums; }

    @media (max-width: 700px) {
      .filter-bar .cb-combo, .filter-bar .search-input, .opener-search-wrap { max-width: none; }
      .packs-table, .activity-table, .pools-table { font-size: 0.78rem; }
      .table-scroll { display: none; }
      .mobile-card-list { display: flex; }
      .mobile-sort-bar { display: flex; }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="content">

    <div class="page-header">
      <div class="page-title">NHL Breakaway <span class="accent">Pack Stats</span></div>
      <div class="page-subtitle">Highlights, editions, opened, and collected stats for every pack.</div>
    </div>

    <div class="packstats-tabs" id="packstatsTabs">
      <button type="button" class="packstats-tab-btn active" data-tab="stats">Stats</button>
      <button type="button" class="packstats-tab-btn" data-tab="activity">Activity</button>
      <button type="button" class="packstats-tab-btn" data-tab="left-in-packs">Left in Packs</button>
    </div>

    <div class="busy-overlay" id="busyOverlay"><div class="busy-box"><span class="busy-spinner"></span><span>Loading…</span></div></div>

    <div class="packstats-tab-panel active" id="tabPanelStats">
      <div class="filter-bar">
        <input type="text" class="search-input" id="nameSearch" placeholder="Search pack name…" autocomplete="off" spellcheck="false">
        <div class="cb-combo" id="seriesCombo">
          <input type="text" class="cb-combo-input" id="seriesComboInput" autocomplete="off" spellcheck="false">
          <button type="button" class="cb-combo-clear" id="seriesComboClear" style="display:none" title="Clear">✕</button>
          <div class="cb-panel" id="seriesPanel"></div>
        </div>
        <div class="cb-combo" id="rarityCombo">
          <input type="text" class="cb-combo-input" id="rarityComboInput" autocomplete="off" spellcheck="false">
          <button type="button" class="cb-combo-clear" id="rarityComboClear" style="display:none" title="Clear">✕</button>
          <div class="cb-panel" id="rarityPanel"></div>
        </div>
      </div>

      <div class="filter-bar mobile-sort-bar" id="mobileSortBar">
        <div class="cb-combo" id="sortFieldCombo">
          <input type="text" class="cb-combo-input" id="sortFieldComboInput" autocomplete="off" spellcheck="false" readonly>
          <div class="cb-panel" id="sortFieldPanel"></div>
        </div>
        <div class="tpc-toggle-group" id="sortDirToggle">
          <button type="button" class="tpc-toggle-btn" data-dir="asc">↑ Asc</button>
          <button type="button" class="tpc-toggle-btn" data-dir="desc">↓ Desc</button>
        </div>
      </div>

      <div class="results-meta" id="resultsMeta"></div>

      <div class="table-scroll" style="overflow-x:auto;">
        <table class="packs-table">
          <thead>
            <tr id="packsHeadRow"></tr>
          </thead>
          <tbody id="packsBody"></tbody>
        </table>
      </div>

      <div class="mobile-card-list" id="packsMobileList"></div>
    </div>

    <div class="packstats-tab-panel" id="tabPanelActivity">
      <div class="filter-group">
        <div class="filter-group-label">Pack Filters</div>
        <div class="filter-bar">
          <div class="cb-combo" id="activityPackCombo">
            <input type="text" class="cb-combo-input" id="activityPackComboInput" autocomplete="off" spellcheck="false">
            <button type="button" class="cb-combo-clear" id="activityPackComboClear" style="display:none" title="Clear">✕</button>
            <div class="cb-panel" id="activityPackPanel"></div>
          </div>
          <div class="cb-combo" id="activitySeriesCombo">
            <input type="text" class="cb-combo-input" id="activitySeriesComboInput" autocomplete="off" spellcheck="false">
            <button type="button" class="cb-combo-clear" id="activitySeriesComboClear" style="display:none" title="Clear">✕</button>
            <div class="cb-panel" id="activitySeriesPanel"></div>
          </div>
          <div class="cb-combo" id="activityRarityCombo">
            <input type="text" class="cb-combo-input" id="activityRarityComboInput" autocomplete="off" spellcheck="false">
            <button type="button" class="cb-combo-clear" id="activityRarityComboClear" style="display:none" title="Clear">✕</button>
            <div class="cb-panel" id="activityRarityPanel"></div>
          </div>
          <div class="opener-search-wrap">
            <input type="text" class="search-input" id="activityOpenerSearch" placeholder="Search opener (username or wallet)…" autocomplete="off" spellcheck="false">
            <button type="button" class="cb-dropdown-clear" id="activityOpenerSearchClear" style="display:none" title="Clear">✕</button>
            <div class="cb-panel" id="activityOpenerSuggestPanel"></div>
          </div>
        </div>
      </div>

      <div class="filter-group">
        <div class="filter-group-label">Highlight Filters</div>
        <div class="filter-bar">
          <div class="cb-combo" id="activityPullSetCombo">
            <input type="text" class="cb-combo-input" id="activityPullSetComboInput" autocomplete="off" spellcheck="false">
            <button type="button" class="cb-combo-clear" id="activityPullSetComboClear" style="display:none" title="Clear">✕</button>
            <div class="cb-panel" id="activityPullSetPanel"></div>
          </div>
          <div class="cb-combo" id="activityPullSeriesCombo">
            <input type="text" class="cb-combo-input" id="activityPullSeriesComboInput" autocomplete="off" spellcheck="false">
            <button type="button" class="cb-combo-clear" id="activityPullSeriesComboClear" style="display:none" title="Clear">✕</button>
            <div class="cb-panel" id="activityPullSeriesPanel"></div>
          </div>
          <div class="cb-combo" id="activityPullRarityCombo">

<script src="api-base.js"></script>
<script src="rarity-order.js"></script>
<script>
'use strict';

// See api-base.js (loaded above) for the localhost-vs-production URL logic.
const API_BASE = window.NHL_API_BASE;

// The backend caches its cacheable endpoints effectively forever, keyed on
// this version string (see nhlbreakaway/dev-server/index.js's
// VERSIONED_CACHE_SECONDS comment for the full reasoning) — appending it to
// every cacheable fetch is what makes that cache actually invalidate the
// moment new data lands, with no fixed TTL to guess at. Resolved once
// (shares nav.js's own sessionStorage cache/key, so whichever of the two
// runs first on a given page load is the only one that actually hits the
// network) and reused for every fetch on this page — filter changes, Load
// More, etc., not just the first one.
const DATA_VERSION_CACHE_KEY = 'nhlbreakaway_data_last_updated';
const DATA_VERSION_CACHE_TTL_MS = 60 * 1000;
let _dataVersionPromise = null;
function getDataVersion() {
  if (_dataVersionPromise) return _dataVersionPromise;
  _dataVersionPromise = (async () => {
    try {
      const cached = sessionStorage.getItem(DATA_VERSION_CACHE_KEY);
      if (cached) {
        const { value, cachedAt } = JSON.parse(cached);
        if (Date.now() - cachedAt < DATA_VERSION_CACHE_TTL_MS) return value;
      }
    } catch {}
    try {
      const res = await fetch(`${API_BASE}/api/site-meta`);
      const { data_last_updated } = await res.json();
      if (data_last_updated) {
        try { sessionStorage.setItem(DATA_VERSION_CACHE_KEY, JSON.stringify({ value: data_last_updated, cachedAt: Date.now() })); } catch {}
      }
      return data_last_updated || '';
    } catch {
      return '';
    }
  })();
  return _dataVersionPromise;
}
// Appends the cache-busting version param, respecting whether `url` already
// has a query string. No-op (returns url unchanged) if the version couldn't
// be resolved — worst case that one request just isn't optimally cached,
// never a broken request.
function withVersion(url, version) {
  return version ? url + (url.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(version) : url;
}

const COLUMNS = [
  { key: 'name',        label: 'Pack Name',  sortable: true },
  { key: 'rarity',      label: 'Rarity',     sortable: true },
  { key: 'moments',     label: 'Highlights', sortable: true, num: true },
  { key: 'editions',    label: 'Editions',   sortable: true, num: true },
  { key: 'opened',      label: 'Opened',     sortable: true, num: true },
  { key: 'collected',   label: 'Collected',  sortable: true, num: true },
  { key: 'distributed', label: 'Distributed', sortable: true, num: true },
  { key: 'pct_left',    label: '% Left',     sortable: true, num: true },
];

const state = {
  packs: [],
  name: '',
  series: '',
  rarity: '',
  sortField: 'name',
  sortDir: 'asc',
};

async function fetchPacks() {
  const version = await getDataVersion();
  const res = await fetch(withVersion(`${API_BASE}/api/packs`, version));
  const data = await res.json();
  state.packs = data.packs;
}

function filteredSortedPacks() {
  let rows = state.packs;
  const q = state.name.trim().toLowerCase();
  if (q) rows = rows.filter(p => p.pack_name.toLowerCase().includes(q));
  if (state.series) rows = rows.filter(p => p.series_label === state.series);
  if (state.rarity) rows = rows.filter(p => p.rarity === state.rarity);

  const dir = state.sortDir === 'asc' ? 1 : -1;
  const field = state.sortField;
  rows = [...rows].sort((a, b) => {
    let av, bv;
    if (field === 'name') { av = a.pack_name; bv = b.pack_name; }
    // Uncapped packs have editions=null (the whole reason editions_live_sum
    // exists — it's what actually renders as "N+" in this column). Sorting
    // by the raw field left every uncapped row's sort key as null, so they
    // never compared against each other or the capped rows by their real
    // displayed number at all — just whatever order the API happened to
    // return them in. Fall back to the live sum so "sort by Editions"
    // always orders by the number actually shown.
    else if (field === 'editions') { av = a.editions ?? a.editions_live_sum; bv = b.editions ?? b.editions_live_sum; }
    else { av = a[field]; bv = b[field]; }
    if (av === null || av === undefined) av = typeof bv === 'number' ? -Infinity : '';
    if (bv === null || bv === undefined) bv = typeof av === 'number' ? -Infinity : '';
    if (typeof av === 'string') return av.localeCompare(bv) * dir;
    return (av - bv) * dir;
  });
  return rows;
}

// Shared by the desktop header-click handler and the mobile "Sort by" combo
// (see mobileSortFieldCombo below) — picking a new field this way always
// jumps straight to its "best first" direction, matching whichever way
// makes the column read naturally (name/rarity alphabetical; every numeric
// column highest-first).
function defaultDirForField(field) {
  return field === 'name' || field === 'rarity' ? 'asc' : 'desc';
}

function renderHead() {
  const row = document.getElementById('packsHeadRow');
  row.innerHTML = COLUMNS.map(col => {
    if (!col.sortable) return `<th${col.num ? ' class="col-r"' : ''}>${col.label}</th>`;
    const sorted = state.sortField === col.key;
    const icon = sorted ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';
    return `<th class="sortable${col.num ? ' col-r' : ''}${sorted ? ' sorted' : ''}" data-field="${col.key}">${col.label} <span class="sort-icon">${icon}</span></th>`;
  }).join('');
  row.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const field = th.dataset.field;
      if (state.sortField === field) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortField = field;
        state.sortDir = defaultDirForField(field);
      }
      renderHead();
      renderBody();
      syncMobileSortControls();
    });
  });
}

function fmtNum(n) {
  return n === null || n === undefined ? '—' : n.toLocaleString();
}

function fmtPct(p) {
  return p === null || p === undefined ? '' : `${p.toFixed(2)}%`;
}

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

// Stats tab's pack-name cell links straight into the Activity tab,
// pre-filtered to this exact pack design — a real <a href> (not a div+click
// handler) so right/middle-click still work, and a fresh load of this exact
// URL lands on the same filtered view via the init() URL-param read below.
// Also carries pool_pack_uuid, so if the visitor later opens Left in Packs
// it's already showing this pack too — even though most packs have no pool
// data at all, initPoolsTab() validates it against the real list and falls
// back to "Select a pack" if this one isn't in it.
function packActivityHref(p) {
  return `pack-stats?tab=activity&pack_uuid=${encodeURIComponent(p.pack_uuid)}&pool_pack_uuid=${encodeURIComponent(p.pack_uuid)}`;
}
function packNameLinkHtml(p) {
  return `<a class="pack-name-link" href="${packActivityHref(p)}">${escHtml(p.pack_name)}</a>`;
}

function renderBody() {
  const rows = filteredSortedPacks();
  const body = document.getElementById('packsBody');
  body.innerHTML = rows.map(p => `
    <tr>
      <td>
        <div class="cell-pack-name">${packNameLinkHtml(p)}</div>
        <div class="cell-series">${escHtml(p.series_label)}</div>
      </td>
      <td>${p.rarity
        ? `<span class="rarity-pill rarity-pill--${p.rarity.toLowerCase()}"><span class="rarity-pill-text">${p.rarity}</span></span>`
        : '—'}</td>
      <td class="col-r">${fmtNum(p.moments)}</td>
      <td class="col-r">${p.editions === null
        ? `<span class="editions-growing" title="Uncapped — mints progressively, no fixed cap">${fmtNum(p.editions_live_sum)}+</span>`
        : fmtNum(p.editions)}</td>
      <td class="col-r">${fmtNum(p.opened)}<span class="cell-pct">${fmtPct(p.opened_pct)}</span></td>
      <td class="col-r">${fmtNum(p.collected)}<span class="cell-pct">${fmtPct(p.collected_pct)}</span></td>
      <td class="col-r">${fmtNum(p.distributed)}</td>
      <td class="col-r">${fmtPct(p.pct_left) || '—'}</td>
    </tr>
  `).join('');

  const mobileList = document.getElementById('packsMobileList');
  mobileList.innerHTML = rows.map(p => `
    <div class="mobile-card">
      <div class="mobile-card-header">
        <div>
          <div class="cell-pack-name">${packNameLinkHtml(p)}</div>
          <div class="cell-series">${escHtml(p.series_label)}</div>
        </div>
        ${p.rarity
          ? `<span class="rarity-pill rarity-pill--${p.rarity.toLowerCase()}"><span class="rarity-pill-text">${p.rarity}</span></span>`
          : ''}
      </div>
      <div class="mobile-card-stats">
        <div><span class="mobile-stat-label">Highlights</span><span class="mobile-stat-value">${fmtNum(p.moments)}</span></div>
        <div><span class="mobile-stat-label">Editions</span><span class="mobile-stat-value">${p.editions === null
          ? `<span class="editions-growing" title="Uncapped — mints progressively, no fixed cap">${fmtNum(p.editions_live_sum)}+</span>`
          : fmtNum(p.editions)}</span></div>
        <div><span class="mobile-stat-label">Opened</span><span class="mobile-stat-value">${fmtNum(p.opened)}<span class="cell-pct">${fmtPct(p.opened_pct)}</span></span></div>
        <div><span class="mobile-stat-label">Collected</span><span class="mobile-stat-value">${fmtNum(p.collected)}<span class="cell-pct">${fmtPct(p.collected_pct)}</span></span></div>
        <div><span class="mobile-stat-label">Distributed</span><span class="mobile-stat-value">${fmtNum(p.distributed)}</span></div>
        <div><span class="mobile-stat-label">% Left</span><span class="mobile-stat-value">${fmtPct(p.pct_left) || '—'}</span></div>
      </div>
    </div>
  `).join('');

  document.getElementById('resultsMeta').innerHTML = `<strong>${rows.length}</strong> pack${rows.length === 1 ? '' : 's'}`;
}

/* ── Shared cb-combo wiring (Series / Rarity) — identical to sets.html's ── */
function closeAllCombos() {
  document.querySelectorAll('.cb-combo').forEach(combo => {
    combo.classList.remove('open');
    combo.querySelector('.cb-panel')?.classList.remove('open');
    if (combo._items) syncComboDisplay(combo);
  });
}
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.cb-combo')) closeAllCombos();
});

function syncComboDisplay(combo) {
  const input = combo.querySelector('.cb-combo-input');
  const clear = combo.querySelector('.cb-combo-clear');
  const allItem = combo._items[0];
  const active = combo._items.find(i => i.value === combo._getValue()) || allItem;
  const hasSelection = active.value !== allItem.value;
  input.placeholder = allItem.label;
  input.value = hasSelection ? active.label : '';
  if (clear) clear.style.display = hasSelection ? '' : 'none';
  combo.classList.toggle('has-selection', hasSelection);
}

// onPick defaults to renderBody (every existing Series/Rarity combo's own
// behavior, unchanged) — the mobile "Sort by" combo below is the one
// exception, needing extra side effects (recompute sort direction, re-sync
// the direction toggle) beyond just re-rendering the filtered rows. It also
// has no clear (✕) button in its markup at all — there's no "no sort"
// state, unlike every other filter here — so both this and
// syncComboDisplay above null-guard that lookup instead of assuming it
// always exists.
function buildCombo(comboId, items, getValue, setValue, onPick = renderBody) {
  const combo = document.getElementById(comboId);
  const input = combo.querySelector('.cb-combo-input');
  const clear = combo.querySelector('.cb-combo-clear');
  const panel = combo.querySelector('.cb-panel');

  combo._items = items;
  combo._getValue = getValue;
  syncComboDisplay(combo);
  if (combo._wired) return;
  combo._wired = true;

  const pick = val => {
    closeAllCombos();
    setValue(val);
    syncComboDisplay(combo);
    onPick();
  };

  const renderList = filterText => {
    const q = filterText.trim().toLowerCase();
    const options = combo._items.slice(1);
    const filtered = q ? options.filter(i => i.label.toLowerCase().includes(q)) : options;
    panel.innerHTML = filtered.length
      ? filtered.map(i => `<div class="cb-item${i.value === getValue() ? ' active' : ''}" data-val="${i.value}"><span>${i.label}</span></div>`).join('')
      : `<div class="cb-empty">No matches</div>`;
    panel.querySelectorAll('.cb-item').forEach(item => {
      item.addEventListener('click', () => pick(item.dataset.val));
    });
  };

  input.addEventListener('focus', () => {
    closeAllCombos();
    combo.classList.add('open');
    panel.classList.add('open');
    renderList('');
    input.select();
  });
  input.addEventListener('input', () => renderList(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); input.blur(); closeAllCombos(); }
    else if (e.key === 'Enter') { e.preventDefault(); panel.querySelector('.cb-item')?.click(); }
  });
  input.addEventListener('blur', () => {
    // Close only THIS combo, not every combo — see sets.html's identical
    // comment for the reason (a different combo the user just opened
    // shouldn't get clobbered by this one's delayed blur handler).
    setTimeout(() => {
      if (!combo.contains(document.activeElement)) {
        combo.classList.remove('open');
        panel.classList.remove('open');
        syncComboDisplay(combo);
      }
    }, 150);
  });
  if (clear) {
    clear.addEventListener('mousedown', e => e.preventDefault());
    clear.addEventListener('click', () => { pick(''); input.blur(); });
  }
}

function populateFilters() {
  const seriesValues = [...new Set(state.packs.map(p => p.series_label))].sort();
  const rarityValues = sortByRarityOrder([...new Set(state.packs.map(p => p.rarity).filter(Boolean))]);

  buildCombo('seriesCombo',
    [{ value: '', label: 'All series' }, ...seriesValues.map(v => ({ value: v, label: v }))],
    () => state.series, v => state.series = v);

  buildCombo('rarityCombo',
    [{ value: '', label: 'All rarities' }, ...rarityValues.map(v => ({ value: v, label: v }))],
    () => state.rarity, v => state.rarity = v);
}

// Mobile-only "Sort by" combo — buildCombo's own renderList always
// slice(1)s the items array (index 0 is reserved for the "All X" sentinel
// every other combo here uses, never rendered as a clickable row). Sort
// field has no "All" option — it's always exactly one column — so a real
// (inert, empty-value) sentinel still has to go first, or the actual first
// column would silently take over that hidden slot and could never show as
// the active row when the list opens (hit this exact bug once already on
// activity-leaderboard.html's Type combo).
function populateSortFieldCombo() {
  buildCombo('sortFieldCombo',
    [{ value: '', label: '' }, ...COLUMNS.filter(c => c.sortable).map(c => ({ value: c.key, label: c.label }))],
    () => state.sortField,
    v => {
      state.sortField = v;
      state.sortDir = defaultDirForField(v);
    },
    () => { renderHead(); renderBody(); syncMobileSortControls(); });
}

function syncMobileSortControls() {
  syncComboDisplay(document.getElementById('sortFieldCombo'));
  document.querySelectorAll('#sortDirToggle .tpc-toggle-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.dir === state.sortDir);
  });
}

document.getElementById('sortDirToggle').addEventListener('click', e => {
  const btn = e.target.closest('.tpc-toggle-btn');
  if (!btn || btn.classList.contains('active')) return;
  state.sortDir = btn.dataset.dir;
  renderHead();
  renderBody();
  syncMobileSortControls();
});

document.getElementById('nameSearch').addEventListener('input', e => {
  state.name = e.target.value;
  renderBody();
});

function setBusyUi(active) {
  document.getElementById('busyOverlay').classList.toggle('active', active);
}

/* ══════════════════ Activity tab — pack opening history ══════════════════
   Per NHL_BREAKAWAY_DATA_HANDOFF.txt's PACK OPENING HISTORY section, backed
   by /api/pack-activity (+ /api/pack-activity/filters). Only ONE drop is
   fully backfilled as of 2026-09-04 (series_id 8R5xYdbD) — every NEW pack
   open of any design is captured automatically going forward, but other
   drops will only show activity from here on, not full history. Paginated
   via Load More (same click-once-to-arm-autoscroll convention as wallet.html's
   own Activity tab), NOT a single client-side fetch like the Stats tab
   above — this table only grows over time and a pack-open row carries 4
   nested highlights each, too heavy to ever load in full up front. */
function prettyWallet(val) {
  if (!val) return val;
  return /^0x[0-9a-fA-F]{40}$/.test(val) ? `${val.slice(0, 6)}…${val.slice(-4)}` : val;
}
// transaction_datetime-style naive string (no timezone suffix) — same
// UTC-assumption fix as wallet.html's own fmtActivityDate.
function fmtActivityDate(raw) {
  if (!raw) return '—';
  const d = new Date(raw);
  if (isNaN(d)) return raw;
  return new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }).format(d);
}

const ACTIVITY_PAGE_SIZE = 25;
const ACTIVITY_COLUMNS = [
  { key: 'pack_name', label: 'Pack', sortable: true },
  { key: 'rarity',    label: 'Rarity' },
  { key: 'edition',   label: 'Edition', sortable: true, num: true },
  { key: 'date',      label: 'Opened At', sortable: true },
  { key: 'opener',    label: 'Opened By', sortable: true },
  { key: 'highlights', label: 'Highlights' },
  { key: 'tx',        label: '' },
];
function activityDefaultDirForField(field) {
  return field === 'opener' || field === 'pack_name' ? 'asc' : 'desc';
}

const activityState = {
  packUuid: '', seriesLabel: '', rarity: '', opener: '',
  pullSetName: '', pullSeriesLabel: '', pullRarity: '', minEdition: '', maxEdition: '', player: '',
  sortField: 'date', sortDir: 'desc',
  activity: [], offset: 0, total: 0, hasMore: false, busy: false, autoLoadArmed: false, loaded: false,
};

function renderActivityHead() {
  const row = document.getElementById('activityHeadRow');
  row.innerHTML = ACTIVITY_COLUMNS.map(col => {
    if (!col.sortable) return `<th${col.num ? ' class="col-r"' : ''}>${col.label}</th>`;
    const sorted = activityState.sortField === col.key;
    const icon = sorted ? (activityState.sortDir === 'asc' ? '↑' : '↓') : '↕';
    return `<th class="sortable${col.num ? ' col-r' : ''}${sorted ? ' sorted' : ''}" data-field="${col.key}">${col.label} <span class="sort-icon">${icon}</span></th>`;
  }).join('');
  row.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const field = th.dataset.field;
      if (activityState.sortField === field) {
        activityState.sortDir = activityState.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        activityState.sortField = field;
        activityState.sortDir = activityDefaultDirForField(field);
      }
      renderActivityHead();
      fetchActivityPage(true);
      syncActivityMobileSort();
    });
  });
}

// One pulled highlight, reused by both the desktop cell and the mobile
// card's own "Highlights" section — links into Holders for that exact
// moment, same as every other per-highlight link on this site.
function pullListHtml(highlights) {

function activityQueryParams() {
  const params = new URLSearchParams();
  if (activityState.packUuid) params.set('pack_uuid', activityState.packUuid);
  if (activityState.seriesLabel) params.set('series_label', activityState.seriesLabel);
  if (activityState.rarity) params.set('rarity', activityState.rarity);
  if (activityState.opener) params.set('opener', activityState.opener);
  if (activityState.pullSetName) params.set('pull_set_name', activityState.pullSetName);
  if (activityState.pullSeriesLabel) params.set('pull_series_label', activityState.pullSeriesLabel);
  if (activityState.pullRarity) params.set('pull_rarity', activityState.pullRarity);
  if (activityState.minEdition !== '') params.set('min_edition', activityState.minEdition);
  if (activityState.maxEdition !== '') params.set('max_edition', activityState.maxEdition);
  if (activityState.player) params.set('player', activityState.player);
  params.set('sort', activityState.sortField);
  params.set('dir', activityState.sortDir);
  params.set('limit', ACTIVITY_PAGE_SIZE);
  params.set('offset', activityState.offset);
  return params;
}

async function loadActivityChunk() {
  if (activityState.busy) return;
  activityState.busy = true;
  renderActivityLoadMore();
  setBusyUi(true);
  try {
    const version = await getDataVersion();
    const res = await fetch(withVersion(`${API_BASE}/api/pack-activity?${activityQueryParams()}`, version));
    const data = await res.json();
    activityState.activity = [...activityState.activity, ...data.packs];
    activityState.total = data.total;
    activityState.hasMore = data.has_more;
    activityState.offset += data.packs.length;
    renderActivityBody();
  } catch (err) {
    document.getElementById('activityResultsMeta').textContent = 'Failed to load pack activity. Please try again shortly.';
    console.error(err);
  } finally {
    activityState.busy = false;
    renderActivityLoadMore();
    setBusyUi(false);
  }
}
async function fetchActivityPage(reset) {
  if (reset) { activityState.offset = 0; activityState.activity = []; activityState.autoLoadArmed = false; }
  await loadActivityChunk();
}

/* ══════════════════ Opener search — live suggestion dropdown ══════════════════
   Same debounced type-ahead as wallet.html's own Wallet Look Up search box,
   backed by the SAME /api/wallet/suggest endpoint (username/wallet_address
   matches) — reused as-is since "opener" here is exactly the same kind of
   lookup (a wallet, matched by username or address prefix/substring). */
const openerInputEl = document.getElementById('activityOpenerSearch');
const openerClearBtn = document.getElementById('activityOpenerSearchClear');
const openerSuggestPanel = document.getElementById('activityOpenerSuggestPanel');
let openerSuggestItems = [];
let openerSuggestActiveIndex = -1;
let openerSuggestSeq = 0;

function updateOpenerClear() { openerClearBtn.style.display = openerInputEl.value ? '' : 'none'; }
function closeOpenerSuggestions() {
  openerSuggestPanel.classList.remove('open');
  openerSuggestItems = [];
  openerSuggestActiveIndex = -1;
}
function renderOpenerSuggestions() {
  if (!openerSuggestItems.length) {
    openerSuggestPanel.innerHTML = `<div class="cb-empty">No matches</div>`;
  } else {
    openerSuggestPanel.innerHTML = openerSuggestItems.map((s, i) => `
      <div class="cb-item suggest-item${i === openerSuggestActiveIndex ? ' active' : ''}" data-index="${i}">
        <span class="suggest-item-name">${escHtml(s.username || '(no username)')}</span>
        <span class="suggest-item-wallet">${escHtml(s.wallet_address)}</span>
      </div>
    `).join('');
    openerSuggestPanel.querySelectorAll('.suggest-item').forEach(el => {
      el.addEventListener('mousedown', e => e.preventDefault()); // keep focus so blur doesn't close before click registers
      el.addEventListener('click', () => selectOpenerSuggestion(openerSuggestItems[Number(el.dataset.index)]));
    });
  }
  openerSuggestPanel.classList.add('open');
}
function applyOpener(val) {
  activityState.opener = val.trim();
  fetchActivityPage(true);
}
function selectOpenerSuggestion(item) {
  openerInputEl.value = item.username || item.wallet_address;
  updateOpenerClear();
  closeOpenerSuggestions();
  applyOpener(openerInputEl.value);
}
let _openerSuggestT = null;
let _openerApplyT = null;
openerInputEl.addEventListener('input', () => {
  updateOpenerClear();
  const q = openerInputEl.value.trim();

  // The typed text is still a valid filter on its own even with no
  // suggestion picked (matches a raw wallet address, or a username Sweet
  // never cached — see handlePackActivity's opener ILIKE) — debounced
  // separately from the suggestion fetch below so neither blocks the other.
  clearTimeout(_openerApplyT);
  _openerApplyT = setTimeout(() => applyOpener(openerInputEl.value), 300);

  clearTimeout(_openerSuggestT);
  if (q.length < 2) { closeOpenerSuggestions(); return; }
  _openerSuggestT = setTimeout(async () => {
    const seq = ++openerSuggestSeq;
    try {
      const version = await getDataVersion();
      const res = await fetch(withVersion(`${API_BASE}/api/wallet/suggest?q=${encodeURIComponent(q)}`, version));
      const data = await res.json();
      if (seq !== openerSuggestSeq) return; // a newer keystroke's request already won
      openerSuggestItems = data.suggestions;
      openerSuggestActiveIndex = -1;
      renderOpenerSuggestions();
    } catch (err) {
      console.error(err);
    }
  }, 250);
});
openerInputEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && openerSuggestItems.length) {
    e.preventDefault();
    openerSuggestActiveIndex = (openerSuggestActiveIndex + 1) % openerSuggestItems.length;
    renderOpenerSuggestions();
  } else if (e.key === 'ArrowUp' && openerSuggestItems.length) {
    e.preventDefault();
    openerSuggestActiveIndex = (openerSuggestActiveIndex - 1 + openerSuggestItems.length) % openerSuggestItems.length;
    renderOpenerSuggestions();
  } else if (e.key === 'Enter') {
    if (openerSuggestActiveIndex >= 0 && openerSuggestItems[openerSuggestActiveIndex]) {
      e.preventDefault();
      selectOpenerSuggestion(openerSuggestItems[openerSuggestActiveIndex]);
    } else {
      closeOpenerSuggestions();
    }
  } else if (e.key === 'Escape') {
    closeOpenerSuggestions();
  }
});
openerClearBtn.addEventListener('mousedown', e => e.preventDefault());
openerClearBtn.addEventListener('click', () => {
  openerInputEl.value = '';
  updateOpenerClear();
  closeOpenerSuggestions();
  applyOpener('');
  openerInputEl.focus();
});
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.opener-search-wrap')) closeOpenerSuggestions();
});

let _editionRangeT = null;
function wireEditionRangeInput(id, stateKey) {
  document.getElementById(id).addEventListener('input', e => {
    clearTimeout(_editionRangeT);
    const val = e.target.value;
    _editionRangeT = setTimeout(() => { activityState[stateKey] = val; fetchActivityPage(true); }, 250);
  });
}

let _activityPlayerT = null;
document.getElementById('activityPlayerSearch').addEventListener('input', e => {

// Keeps ?pack_uuid= in sync with the Pack filter combo's own current value.
// The Stats tab's pack-name link (packActivityHref) is what puts it in the
// URL in the first place (a full navigation, so it's correct at load time)
// — without this, clearing the combo or picking a different pack left the
// OLD pack_uuid sitting in the address bar, so a copy-pasted URL would land
// back on the pack the visitor had already moved away from.
function syncPackUuidUrl() {
  const url = new URL(location.href);
  if (activityState.packUuid) url.searchParams.set('pack_uuid', activityState.packUuid);
  else url.searchParams.delete('pack_uuid');
  history.replaceState(null, '', url);
}

/* ══════════════════ Left in Packs — highlight pool remaining-count tab ══════════════════
   Per NHL_BREAKAWAY_DATA_HANDOFF.txt's PACK HIGHLIGHT POOLS section, backed
   by /api/pack-pools(/filters). Unlike Activity, this is a MANUAL one-off
   import per drop (not hourly) — only 2 packs have this data at all right
   now. Small dataset per pack (≤165 rows) fetched whole and filtered/sorted
   client-side, same convention as the Stats tab above, NOT Activity's
   server-paginated Load More. */
const POOLS_COLUMNS = [
  { key: 'set_name',  label: 'Set',       sortable: true },
  { key: 'player',    label: 'Highlight', sortable: true },
  { key: 'available', label: 'Available', sortable: true, num: true },
  { key: 'pulled',    label: 'Pulled',    sortable: true, num: true },
  { key: 'remaining', label: 'Remaining', sortable: true, num: true },
];
function poolsDefaultDirForField(field) {
  return field === 'player' || field === 'set_name' ? 'asc' : 'desc';
}
const poolsState = {
  packUuid: '', packName: '', setName: '', rarity: '', player: '',
  sortField: 'remaining', sortDir: 'asc',
  highlights: [], unsourced: [], totals: null, poolsAvailable: null, loaded: false,
};

// showPulled: only for shared-pool rows — the row's own Pulled column
// already shows the group TOTAL, so a per-member breakdown is only useful
// (and only non-redundant) when the group has more than one member. Every
// member shows its own count, 0 included, not just the ones that hit — the
// whole point is being able to tell WHICH of the shared members accounts
// for the group's pulled total.
function poolMemberHtml(m, showPulled) {
  return `<a class="pool-member" href="holders?moment_uuid=${encodeURIComponent(m.moment_uuid)}">
    <span class="pool-member-name">${escHtml(m.player)}</span>
    <span class="pool-member-team">${escHtml(m.team || '')}</span>
    ${showPulled ? `<span class="pool-member-pulled${m.pulled > 0 ? ' pool-member-pulled--hit' : ''}">${fmtNum(m.pulled)} pulled</span>` : ''}
    ${m.rarity ? `<span class="rarity-pill rarity-pill--${m.rarity.toLowerCase()}"><span class="rarity-pill-text">${m.rarity}</span></span>` : ''}
  </a>`;
}
function poolHighlightCellHtml(h) {
  const showPulled = h.type === 'shared';
  return `<div class="pool-members">${h.members.map(m => poolMemberHtml(m, showPulled)).join('')}</div>`;
}
function poolAvailableCellHtml(h) {
  return h.type === 'shared'
    ? `${fmtNum(h.pool_size)}<span class="pool-shared-note">shared × ${h.members.length}</span>`
    : fmtNum(h.pool_size);
}
function poolRemainingCellHtml(h) {
  const cls = h.remaining <= 0 ? 'pool-remaining--depleted' : (h.remaining <= 5 ? 'pool-remaining--low' : '');
  // The sheet's "approx avail" is a snapshot estimate, not a live cap — a
  // highlight open long enough can genuinely get pulled MORE times than
  // that estimate said existed. Surfaced as "(+N) All pulled" (N = the
  // overage) rather than a silently-clamped "All pulled", so that's
  // visible instead of looking identical to an exact sellout.
  let text;
  if (h.remaining < 0) text = `(+${fmtNum(-h.remaining)}) All pulled`;
  else if (h.remaining === 0) text = 'All pulled';
  else text = fmtNum(h.remaining);
  return `<span class="pool-remaining ${cls}">${text}</span>`;
}

function filteredSortedPools() {
  let rows = poolsState.highlights;
  if (poolsState.setName) rows = rows.filter(h => h.set_name === poolsState.setName);
  if (poolsState.rarity) rows = rows.filter(h => h.members.some(m => m.rarity === poolsState.rarity));
  const q = poolsState.player.trim().toLowerCase();
  if (q) rows = rows.filter(h => h.members.some(m => m.player.toLowerCase().includes(q)));

  const dir = poolsState.sortDir === 'asc' ? 1 : -1;
  const field = poolsState.sortField;
  return [...rows].sort((a, b) => {
    let av, bv;
    if (field === 'player') { av = a.members[0].player; bv = b.members[0].player; }
    else if (field === 'set_name') { av = a.set_name; bv = b.set_name; }
    else if (field === 'available') { av = a.pool_size; bv = b.pool_size; }
    else { av = a[field]; bv = b[field]; } // pulled, remaining
    if (typeof av === 'string') return av.localeCompare(bv) * dir;
    return (av - bv) * dir;
  });
}

function renderPoolsHead() {
  const row = document.getElementById('poolsHeadRow');
  row.innerHTML = POOLS_COLUMNS.map(col => {
    if (!col.sortable) return `<th${col.num ? ' class="col-r"' : ''}>${col.label}</th>`;
    const sorted = poolsState.sortField === col.key;
    const icon = sorted ? (poolsState.sortDir === 'asc' ? '↑' : '↓') : '↕';
    return `<th class="sortable${col.num ? ' col-r' : ''}${sorted ? ' sorted' : ''}" data-field="${col.key}">${col.label} <span class="sort-icon">${icon}</span></th>`;
  }).join('');
  row.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const field = th.dataset.field;
      if (poolsState.sortField === field) {
        poolsState.sortDir = poolsState.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        poolsState.sortField = field;
        poolsState.sortDir = poolsDefaultDirForField(field);
      }
      renderPoolsHead();
      renderPoolsBody();
      syncPoolsMobileSort();
    });
  });
}

    <div class="pools-unsourced-list">${poolsState.unsourced.map(m => `<span>${escHtml(m.player)} <span class="cell-series">(${escHtml(m.set_name)})</span></span>`).join('')}</div>

function renderPoolsBody() {
  if (!poolsState.packUuid) {
    document.getElementById('poolsBody').innerHTML = '';
    document.getElementById('poolsMobileList').innerHTML = '';

  `).join('');

  document.getElementById('poolsMobileList').innerHTML = rows.map(h => `
    <div class="mobile-card">
      <div class="mobile-card-header">
        <div>
          <div class="cell-series">${escHtml(h.set_name)}</div>
          ${poolHighlightCellHtml(h)}
        </div>
      </div>
      <div class="mobile-card-stats">
        <div><span class="mobile-stat-label">Available</span><span class="mobile-stat-value">${poolAvailableCellHtml(h)}</span></div>
        <div><span class="mobile-stat-label">Pulled</span><span class="mobile-stat-value">${fmtNum(h.pulled)}</span></div>
        <div><span class="mobile-stat-label">Remaining</span><span class="mobile-stat-value">${poolRemainingCellHtml(h)}</span></div>
      </div>
    </div>
  `).join('');

  document.getElementById('poolsResultsMeta').innerHTML = `<strong>${fmtNum(rows.length)}</strong> highlight${rows.length === 1 ? '' : 's'}`;
}

async function fetchPoolsForPack() {
  // A different pack's pool has a different set of sets/rarities — a
  // filter value carried over from the previous pack could silently hide
  // everything (or nothing meaningful) on the new one.
  poolsState.setName = '';
  poolsState.rarity = '';
  document.getElementById('poolsResultsMeta').textContent = 'Loading…';
  document.getElementById('poolsBody').innerHTML = '';
  document.getElementById('poolsMobileList').innerHTML = '';
  document.getElementById('poolsSummary').innerHTML = '';
  document.getElementById('poolsUnsourced').innerHTML = '';
  setBusyUi(true);
  try {
    const version = await getDataVersion();
    const res = await fetch(withVersion(`${API_BASE}/api/pack-pools?pack_uuid=${encodeURIComponent(poolsState.packUuid)}`, version));
    const data = await res.json();
    poolsState.poolsAvailable = data.pools_available;
    poolsState.highlights = data.highlights || [];
    poolsState.unsourced = data.unsourced || [];
    poolsState.totals = data.pools_available ? { available: data.total_available, pulled: data.total_pulled, remaining: data.total_remaining } : null;
    populatePoolsDataFilters();
    renderPoolsAll();
  } catch (err) {
    document.getElementById('poolsResultsMeta').textContent = 'Failed to load pack highlight pools. Please try again shortly.';
    console.error(err);
  } finally {
    setBusyUi(false);
  }
}

function populatePoolsSortFieldCombo() {
  buildCombo('poolsSortFieldCombo',
    [{ value: '', label: '' }, ...POOLS_COLUMNS.filter(c => c.sortable).map(c => ({ value: c.key, label: c.label }))],
    () => poolsState.sortField,
    v => { poolsState.sortField = v; poolsState.sortDir = poolsDefaultDirForField(v); },
    () => { renderPoolsHead(); renderPoolsBody(); syncPoolsMobileSort(); });
}
function syncPoolsMobileSort() {
  syncComboDisplay(document.getElementById('poolsSortFieldCombo'));
  document.querySelectorAll('#poolsSortDirToggle .tpc-toggle-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.dir === poolsState.sortDir);
  });
}
document.getElementById('poolsSortDirToggle').addEventListener('click', e => {
  const btn = e.target.closest('.tpc-toggle-btn');
  if (!btn || btn.classList.contains('active')) return;
  poolsState.sortDir = btn.dataset.dir;
  renderPoolsHead();
  renderPoolsBody();
  syncPoolsMobileSort();
});

document.getElementById('poolsPlayerSearch').addEventListener('input', e => {
  poolsState.player = e.target.value;
  renderPoolsBody();
});

// Set/Rarity options are scoped to whatever pack is CURRENTLY loaded (not a
// sitewide list) — rebuilt after every pack switch, not just once at init,
// since a different pack's pool has a different set of sets/rarities. Same
// "don't show a filter value with zero matches" convention as elsewhere on
// this site.
function populatePoolsDataFilters() {
  const setValues = [...new Set(poolsState.highlights.map(h => h.set_name).filter(Boolean))].sort();
  const rarityValues = sortByRarityOrder([...new Set(poolsState.highlights.flatMap(h => h.members.map(m => m.rarity)).filter(Boolean))]);
  buildCombo('poolsSetCombo',
    [{ value: '', label: 'All sets' }, ...setValues.map(v => ({ value: v, label: v }))],
    () => poolsState.setName, v => poolsState.setName = v, () => renderPoolsBody());
  buildCombo('poolsRarityCombo',
    [{ value: '', label: 'All rarities' }, ...rarityValues.map(v => ({ value: v, label: v }))],
    () => poolsState.rarity, v => poolsState.rarity = v, () => renderPoolsBody());
}

async function initPoolsTab() {
  renderPoolsHead();
  populatePoolsSortFieldCombo();
  syncPoolsMobileSort();
  try {
    const version = await getDataVersion();
    const res = await fetch(withVersion(`${API_BASE}/api/pack-pools/filters`, version));
    const data = await res.json();
    if (!data.packs.length) {
      document.getElementById('poolsResultsMeta').textContent = 'No packs have a Highlights List imported yet.';
      return;
    }
    // Keep a URL-deep-linked pack_uuid only if it's actually one this
    // endpoint lists (most packs have no pool data at all — see the Stats
    // tab's own click-through, which pre-fills this for EVERY pack, not
    // just the ones with real pool data). No auto-selecting the first pack
    // otherwise — an explicit "Select a pack" state instead.
    if (poolsState.packUuid && !data.packs.some(p => p.pack_uuid === poolsState.packUuid)) {
      poolsState.packUuid = '';
    }
    buildCombo('poolsPackCombo',
      [{ value: '', label: 'Select a pack…' }, ...data.packs.map(p => ({ value: p.pack_uuid, label: p.pack_name }))],
      () => poolsState.packUuid, v => { poolsState.packUuid = v; syncPoolUuidUrl(); }, () => { fetchPoolsForPack(); });
    syncPoolUuidUrl();
    if (poolsState.packUuid) {
      await fetchPoolsForPack();
    } else {
      populatePoolsDataFilters(); // wires Set/Rarity as inert empty-option combos until a pack is picked
      renderPoolsAll();
    }
  } catch (err) {
    document.getElementById('poolsResultsMeta').textContent = 'Failed to load pack highlight pools. Please try again shortly.';
    console.error(err);
  }
}

// Keeps ?pool_pack_uuid= in sync with the Pack combo, same "copy-pasted URL
// should match what's on screen" reasoning as syncPackUuidUrl for Activity
// — a different param name (pool_pack_uuid, not pack_uuid) since the two
// tabs' pack selections are independent of each other.
function syncPoolUuidUrl() {
  const url = new URL(location.href);
  if (poolsState.packUuid) url.searchParams.set('pool_pack_uuid', poolsState.packUuid);
  else url.searchParams.delete('pool_pack_uuid');
  history.replaceState(null, '', url);
}

/* ══════════════════ Tabs (Stats / Activity / Left in Packs) ══════════════════ */
const TAB_PANEL_IDS = { stats: 'tabPanelStats', activity: 'tabPanelActivity', 'left-in-packs': 'tabPanelLeftInPacks' };
function setActiveTab(tab, { syncUrl = true } = {}) {
  if (!TAB_PANEL_IDS[tab]) tab = 'stats';
  document.querySelectorAll('.packstats-tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
  Object.entries(TAB_PANEL_IDS).forEach(([name, id]) => {
    document.getElementById(id).classList.toggle('active', name === tab);
  });
  if (syncUrl) {
    const url = new URL(location.href);
    url.searchParams.set('tab', tab);
    history.replaceState(null, '', url);
  }
  if (tab === 'activity' && !activityState.loaded) {
    activityState.loaded = true;
    initActivityTab();
  }
  if (tab === 'left-in-packs' && !poolsState.loaded) {
    poolsState.loaded = true;
    initPoolsTab();
  }
}
document.getElementById('packstatsTabs').addEventListener('click', e => {
  const btn = e.target.closest('.packstats-tab-btn');
  if (btn) setActiveTab(btn.dataset.tab);
});

(async function init() {
  renderHead();
  populateSortFieldCombo();
  syncMobileSortControls();
  document.getElementById('resultsMeta').textContent = 'Loading…';
  setBusyUi(true);
  try {
    await fetchPacks();
    populateFilters();
    renderBody();
  } catch (err) {
    document.getElementById('resultsMeta').textContent = 'Failed to load packs. Please try again shortly.';
    console.error(err);
  } finally {
    setBusyUi(false);
  }

  // Deep-link support — a Stats-tab pack-name click (packActivityHref) lands
  // here as ?tab=activity&pack_uuid=..., same URL-param-read convention as
  // wallet.html's own ?tab=/?set= init handling.
  const initParams = new URLSearchParams(location.search);
  const initTab = initParams.get('tab') || 'stats';
  const initPackUuid = initParams.get('pack_uuid') || '';
  if (initPackUuid) activityState.packUuid = initPackUuid;
  const initPoolPackUuid = initParams.get('pool_pack_uuid') || '';
  if (initPoolPackUuid) poolsState.packUuid = initPoolPackUuid;
  setActiveTab(initTab, { syncUrl: false });
})();
</script>
