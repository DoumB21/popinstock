<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Leaderboard — NHL Breakaway — Hoardio</title>
  <meta name="description" content="Top spenders, sellers, traders, and pack openers across every NHL Breakaway wallet — filter by series, set, rarity, and player." />
  <link rel="canonical" href="https://www.hoardio.com/nhlbreakaway/activity-leaderboard" />
  <link rel="icon" href="../images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="../images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="../shared/global.css" />
  <style>
    .content { display: flex; flex-direction: column; gap: 1.25rem; }
    .page-header { margin-bottom: 0; }

    .filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-start; }
    .filter-bar .cb-combo { min-width: 160px; flex: 1; max-width: 220px; }
    .filter-bar .text-search-wrap { position: relative; min-width: 180px; max-width: 280px; flex: 1.2; }
    .filter-bar .text-search-wrap .search-input { width: 100%; min-width: 0; max-width: none; padding-right: 2.1rem; }
    .filter-bar .amount-range-input { width: 120px; flex: 0 0 auto; min-width: 0; max-width: 120px; }
    @media (max-width: 700px) {
      .filter-bar .cb-combo, .filter-bar .text-search-wrap, .filter-bar .amount-range-input { max-width: none; }
    }

    .results-meta { font-size: 0.8rem; color: var(--text-secondary); min-height: 1.2em; }
    .results-meta strong { color: var(--text-primary); }

    /* ── Table — same sortable/rank-tint treatment as wallet.html's Activity
       tab and leaderboard.html's own Collector Leaderboard, merged into one
       (Rank is never sortable, it's just row position). ── */
    .items-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .items-table thead th {
      text-align: left; padding: 8px 12px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-secondary); background: var(--bg-card);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .items-table thead th.col-r { text-align: right; }
    .items-table thead th.sortable { cursor: pointer; user-select: none; }
    .items-table thead th.sortable:hover { color: var(--text-primary); }
    .items-table thead th .sort-icon { font-size: 0.6rem; opacity: 0.45; margin-left: 3px; }
    .items-table thead th.sorted .sort-icon { opacity: 1; color: var(--accent-light); }
    .items-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
    .items-table tbody tr:last-child { border-bottom: none; }
    .items-table tbody tr:hover { background: rgba(255,255,255,0.04); }
    .items-table tbody td { padding: 8px 12px; vertical-align: middle; }
    .items-table tbody td.col-r { text-align: right; font-variant-numeric: tabular-nums; }
    .items-table tbody tr.rank-row--1 { background: rgba(255,215,0,0.10); }
    .items-table tbody tr.rank-row--1:hover { background: rgba(255,215,0,0.16); }
    .items-table tbody tr.rank-row--2 { background: rgba(192,192,192,0.09); }
    .items-table tbody tr.rank-row--2:hover { background: rgba(192,192,192,0.15); }
    .items-table tbody tr.rank-row--3 { background: rgba(205,127,50,0.10); }
    .items-table tbody tr.rank-row--3:hover { background: rgba(205,127,50,0.16); }
    .cell-rank { color: var(--text-secondary); font-variant-numeric: tabular-nums; width: 1%; }
    .cell-rank--1 { color: #ffd700; font-weight: 700; }
    .cell-rank--2 { color: #c0c0c0; font-weight: 700; }
    .cell-rank--3 { color: #cd7f32; font-weight: 700; }
    .cell-count { font-weight: 700; color: var(--text-primary); }
    .holder-link { color: var(--accent-light); text-decoration: none; }
    .holder-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<div class="page">
  <div class="content">

    <div class="page-header">
      <div class="page-title">NHL Breakaway <span class="accent">Activity Leaderboard</span></div>
      <div class="page-subtitle">Top spenders, sellers, traders, and pack openers — pick a type, then filter by series, set, rarity, and player.</div>
    </div>

    <div class="filter-bar">
      <div class="cb-combo" id="typeCombo">
        <input type="text" class="cb-combo-input" id="typeComboInput" autocomplete="off" spellcheck="false">
        <div class="cb-panel" id="typePanel"></div>
      </div>
      <div class="cb-combo" id="seriesCombo">
        <input type="text" class="cb-combo-input" id="seriesComboInput" autocomplete="off" spellcheck="false">
        <button type="button" class="cb-combo-clear" id="seriesComboClear" style="display:none" title="Clear">✕</button>
        <div class="cb-panel" id="seriesPanel"></div>
      </div>
      <div class="cb-combo" id="setCombo">
        <input type="text" class="cb-combo-input" id="setComboInput" autocomplete="off" spellcheck="false">
        <button type="button" class="cb-combo-clear" id="setComboClear" style="display:none" title="Clear">✕</button>
        <div class="cb-panel" id="setPanel"></div>
      </div>
      <div class="cb-combo" id="rarityCombo">
        <input type="text" class="cb-combo-input" id="rarityComboInput" autocomplete="off" spellcheck="false">
        <button type="button" class="cb-combo-clear" id="rarityComboClear" style="display:none" title="Clear">✕</button>
        <div class="cb-panel" id="rarityPanel"></div>
      </div>
      <div class="text-search-wrap">
        <input type="text" class="search-input" id="playerSearch" placeholder="Search player" autocomplete="off" spellcheck="false">
        <button type="button" class="cb-dropdown-clear" id="playerSearchClear" style="display:none" title="Clear">✕</button>
      </div>
    </div>

    <div class="filter-bar">
      <input type="number" class="search-input amount-range-input" id="minAmount" placeholder="Min amount" min="0" step="0.01" inputmode="decimal">
      <input type="number" class="search-input amount-range-input" id="maxAmount" placeholder="Max amount" min="0" step="0.01" inputmode="decimal">
      <button id="clearFiltersBtn" class="clear-filters-btn" type="button">✕ Clear filters</button>
    </div>

    <div class="results-meta" id="resultsMeta"></div>

    <div style="overflow-x:auto;">
      <table class="items-table">
        <thead><tr id="headRow"></tr></thead>
        <tbody id="body"></tbody>
      </table>
    </div>

    <div id="loadMoreWrap" style="display:none; text-align:center; padding:1rem 0;">
      <button type="button" id="loadMoreBtn" class="load-more-btn">Load more</button>
    </div>

  </div>
</div>

<script src="api-base.js"></script>
<script src="rarity-order.js"></script>
<script>
'use strict';

// See api-base.js (loaded above) for the localhost-vs-production URL logic.
const API_BASE = window.NHL_API_BASE;
const PAGE_SIZE = 100;

// See wallet.html's identical helper for the full "why" — versioned cache
// key resolved once per page load, shared with nav.js via sessionStorage.
const DATA_VERSION_CACHE_KEY = 'nhlbreakaway_data_last_updated';
const DATA_VERSION_CACHE_TTL_MS = 60 * 1000;
let _dataVersionPromise = null;
function getDataVersion() {
  if (_dataVersionPromise) return _dataVersionPromise;
  _dataVersionPromise = (async () => {
    try {
      const cached = sessionStorage.getItem(DATA_VERSION_CACHE_KEY);
      if (cached) {
        const { value, cachedAt } = JSON.parse(cached);
        if (Date.now() - cachedAt < DATA_VERSION_CACHE_TTL_MS) return value;
      }
    } catch {}
    try {
      const res = await fetch(`${API_BASE}/api/site-meta`);
      const { data_last_updated } = await res.json();
      if (data_last_updated) {
        try { sessionStorage.setItem(DATA_VERSION_CACHE_KEY, JSON.stringify({ value: data_last_updated, cachedAt: Date.now() })); } catch {}
      }
      return data_last_updated || '';
    } catch {
      return '';
    }
  })();
  return _dataVersionPromise;
}
function withVersion(url, version) {
  return version ? url + (url.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(version) : url;
}

function fmtNum(n) {
  return n === null || n === undefined ? '—' : n.toLocaleString();
}
function fmtUsd(n) {
  return n === null || n === undefined ? '—' : `$${n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ══════════════════ .cb-combo widget (single-select, searchable) ══════════════════
   Verbatim copy of wallet.html's own implementation — kept page-local per
   this section's own convention of not sharing JS modules across pages. */
function closeAllCombos() {
  document.querySelectorAll('.cb-combo').forEach(combo => {
    combo.classList.remove('open');
    combo.querySelector('.cb-panel')?.classList.remove('open');
    if (combo._items) syncComboDisplay(combo);
  });
}
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.cb-combo')) closeAllCombos();
});

function syncComboDisplay(combo) {
  const input = combo.querySelector('.cb-combo-input');
  const clear = combo.querySelector('.cb-combo-clear');
  const allItem = combo._items[0];
  const active = combo._items.find(i => i.value === combo._getValue()) || allItem;
  const hasSelection = active.value !== allItem.value;
  input.placeholder = allItem.label;
  input.value = hasSelection ? active.label : '';
  if (clear) clear.style.display = hasSelection ? '' : 'none';
  combo.classList.toggle('has-selection', hasSelection);
}

function buildCombo(comboId, items, getValue, setValue, onPick) {
  const combo = document.getElementById(comboId);
  const input = combo.querySelector('.cb-combo-input');
  const clear = combo.querySelector('.cb-combo-clear');
  const panel = combo.querySelector('.cb-panel');

  combo._items = items;
  combo._getValue = getValue;
  syncComboDisplay(combo);
  if (combo._wired) return;
  combo._wired = true;

  const pick = val => {
    closeAllCombos();
    setValue(val);
    syncComboDisplay(combo);
    onPick();
  };

  const renderList = filterText => {
    const q = filterText.trim().toLowerCase();
    const options = combo._items.slice(1);
    const filtered = q ? options.filter(i => i.label.toLowerCase().includes(q)) : options;
    panel.innerHTML = filtered.length
      ? filtered.map(i => `<div class="cb-item${i.value === getValue() ? ' active' : ''}" data-val="${i.value}"><span>${i.label}</span></div>`).join('')
      : `<div class="cb-empty">No matches</div>`;
    panel.querySelectorAll('.cb-item').forEach(item => {
      item.addEventListener('click', () => pick(item.dataset.val));
    });
  };

  input.addEventListener('focus', () => {
    closeAllCombos();
    combo.classList.add('open');
    panel.classList.add('open');
    renderList('');
    input.select();
  });
  input.addEventListener('input', () => renderList(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); input.blur(); closeAllCombos(); }
    else if (e.key === 'Enter') { e.preventDefault(); panel.querySelector('.cb-item')?.click(); }
  });
  input.addEventListener('blur', () => {
    setTimeout(() => {
      if (!combo.contains(document.activeElement)) {
        combo.classList.remove('open');
        panel.classList.remove('open');
        syncComboDisplay(combo);
      }
    }, 150);
  });
  if (clear) {
    clear.addEventListener('mousedown', e => e.preventDefault());
    clear.addEventListener('click', () => { pick(''); input.blur(); });
  }
}

function setupTextSearch({ inputId, clearId, debounceMs = 250, applyValue }) {
  const input = document.getElementById(inputId);
  const clearBtn = document.getElementById(clearId);
  let t = null;

  function updateClear() { clearBtn.style.display = input.value ? '' : 'none'; }

  input.addEventListener('input', () => {
    clearTimeout(t);
    updateClear();
    const val = input.value.trim();
    t = setTimeout(() => applyValue(val), debounceMs);
  });

  clearBtn.addEventListener('mousedown', e => e.preventDefault());
  clearBtn.addEventListener('click', () => {
    input.value = '';
    updateClear();
    applyValue('');
  });

  return { reset: updateClear };
}

/* ══════════════════ Activity Leaderboard ══════════════════
   One type at a time — each is a genuinely different metric (count-only
   for most, count+$ for purchase/sale), so this is never an "all types"
   view. hasAmount drives whether the Total Amount column/sort/min-max
   filters are relevant for the currently selected type. */
const TYPE_LABELS = {
  purchase: 'Purchase', sale: 'Sale', trade: 'Trade', gift: 'Gift',
  pack_open: 'Pack Open', promo: 'Promo', transfer: 'Transfer',
};
const TYPE_HAS_AMOUNT = { purchase: true, sale: true };

const COLUMNS_BASE = [
  { key: 'rank',   label: 'Rank' },
  { key: 'wallet', label: 'Wallet' },
  { key: 'count',  label: 'Count', sortable: true, num: true },
];
const COLUMN_AMOUNT = { key: 'amount', label: 'Total Amount', sortable: true, num: true };
function activeColumns() {
  return TYPE_HAS_AMOUNT[state.type] ? [...COLUMNS_BASE, COLUMN_AMOUNT] : COLUMNS_BASE;
}

const state = {
  type: 'purchase', series_label: '', set_name: '', rarity: '', player: '',
  min_amount: '', max_amount: '',
  sortField: 'amount', sortDir: 'desc',
  leaderboard: [], offset: 0, hasMore: false, busy: false, autoLoadArmed: false,
};

function buildQuery() {
  const params = new URLSearchParams();
  params.set('type', state.type);
  if (state.series_label) params.set('series_label', state.series_label);
  if (state.set_name) params.set('set_name', state.set_name);
  if (state.rarity) params.set('rarity', state.rarity);
  if (state.player) params.set('player', state.player);
  if (TYPE_HAS_AMOUNT[state.type]) {
    if (state.min_amount !== '') params.set('min_amount', state.min_amount);
    if (state.max_amount !== '') params.set('max_amount', state.max_amount);
  }
  params.set('sort', state.sortField);
  params.set('dir', state.sortDir);
  params.set('limit', PAGE_SIZE);
  params.set('offset', state.offset);
  return params;
}

async function loadChunk() {
  if (state.busy) return 0;
  state.busy = true;
  renderLoadMore();
  let got = 0;
  try {
    const version = await getDataVersion();
    const res = await fetch(withVersion(`${API_BASE}/api/activity-leaderboard?${buildQuery()}`, version));
    const data = await res.json();
    state.leaderboard = [...state.leaderboard, ...data.leaderboard];
    state.hasMore = data.has_more;
    state.offset += data.leaderboard.length;
    got = data.leaderboard.length;
    renderBody();
  } catch (err) {
    document.getElementById('resultsMeta').textContent = 'Failed to load leaderboard. Please try again shortly.';
    console.error(err);
  } finally {
    state.busy = false;
    renderLoadMore();
  }
  return got;
}

async function fetchPage(reset) {
  if (reset) { state.offset = 0; state.leaderboard = []; state.autoLoadArmed = false; state.hasMore = false; }
  await loadChunk();
}

function renderHead() {
  const row = document.getElementById('headRow');
  row.innerHTML = activeColumns().map(col => {
    if (!col.sortable) return `<th${col.num ? ' class="col-r"' : ''}>${col.label}</th>`;
    const sorted = state.sortField === col.key;
    const icon = sorted ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';
    return `<th class="sortable${col.num ? ' col-r' : ''}${sorted ? ' sorted' : ''}" data-field="${col.key}">${col.label} <span class="sort-icon">${icon}</span></th>`;
  }).join('');
  row.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const field = th.dataset.field;
      if (state.sortField === field) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortField = field;
        state.sortDir = 'desc';
      }
      renderHead();
      fetchPage(true);
    });
  });
}

function renderBody() {
  const cols = activeColumns().length;
  const body = document.getElementById('body');
  if (!state.leaderboard.length) {
    body.innerHTML = `<tr><td colspan="${cols}" style="padding:2rem 1rem; text-align:center; color:var(--text-secondary);">No activity matches these filters.</td></tr>`;
  } else {
    body.innerHTML = state.leaderboard.map((r, i) => {
      const rank = i + 1;
      const rankClass = rank <= 3 ? ` cell-rank--${rank}` : '';
      const rowClass = rank <= 3 ? ` class="rank-row--${rank}"` : '';
      const wallet = `<a class="holder-link" href="https://nhlbreakaway.com/user/${encodeURIComponent(r.username)}?sort=newest" target="_blank" rel="noopener">${escHtml(r.username)}</a>`;
      return `
        <tr${rowClass}>
          <td class="cell-rank${rankClass}">#${fmtNum(rank)}</td>
          <td>${wallet}</td>
          <td class="col-r cell-count">${fmtNum(r.count)}</td>
          ${TYPE_HAS_AMOUNT[state.type] ? `<td class="col-r">${fmtUsd(r.total_amount)}</td>` : ''}
        </tr>
      `;
    }).join('');
  }
  document.getElementById('resultsMeta').innerHTML =
    `<strong>${fmtNum(state.leaderboard.length)}</strong> wallet${state.leaderboard.length === 1 ? '' : 's'}${state.hasMore ? '+' : ''}`;
}

function renderLoadMore() {
  const wrap = document.getElementById('loadMoreWrap');
  const btn = document.getElementById('loadMoreBtn');
  wrap.style.display = state.hasMore ? 'block' : 'none';
  btn.disabled = state.busy;
  btn.textContent = state.busy ? 'Loading…' : 'Load more';
}
document.getElementById('loadMoreBtn').addEventListener('click', () => {
  state.autoLoadArmed = true;
  fetchPage(false);
});
new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && state.autoLoadArmed && !state.busy && state.hasMore) fetchPage(false);
}, { rootMargin: '600px' }).observe(document.getElementById('loadMoreWrap'));

function syncAmountInputsVisibility() {
  const show = TYPE_HAS_AMOUNT[state.type];
  document.getElementById('minAmount').style.display = show ? '' : 'none';
  document.getElementById('maxAmount').style.display = show ? '' : 'none';
}

function populateTypeCombo() {
  // buildCombo's own renderList always slice(1)s the items array — index 0
  // is reserved for the "All X" sentinel every other combo on this page
  // uses (never rendered as a clickable row, just what an empty input
  // means). Type has no "All types" — each one is a genuinely different
  // metric — but that reserved slot still has to exist as a real (if inert)
  // placeholder, or the FIRST real option silently takes its place and can
  // never show as the active row in the open dropdown. An empty-value
  // sentinel that's simply never selectable keeps Purchase (or whichever
  // type is active) correctly highlighted when the list opens.
  buildCombo('typeCombo',
    [{ value: '', label: '' }, ...Object.entries(TYPE_LABELS).map(([value, label]) => ({ value, label }))],
    () => state.type, v => {
      state.type = v;
      // Amount-based types default to sorting by amount; count-only types
      // have no amount column to sort by at all.
      state.sortField = TYPE_HAS_AMOUNT[v] ? 'amount' : 'count';
      state.sortDir = 'desc';
      syncAmountInputsVisibility();
    },
    () => { renderHead(); fetchPage(true); });
}

async function populateFilters() {
  const version = await getDataVersion();
  const res = await fetch(withVersion(`${API_BASE}/api/highlights/filters`, version));
  const data = await res.json();
  buildCombo('seriesCombo',
    [{ value: '', label: 'All series' }, ...data.series.map(v => ({ value: v, label: v }))],
    () => state.series_label, v => state.series_label = v, () => fetchPage(true));
  buildCombo('setCombo',
    [{ value: '', label: 'All sets' }, ...data.sets.map(v => ({ value: v, label: v }))],
    () => state.set_name, v => state.set_name = v, () => fetchPage(true));
  buildCombo('rarityCombo',
    [{ value: '', label: 'All rarities' }, ...sortByRarityOrder(data.rarities).map(v => ({ value: v, label: v }))],
    () => state.rarity, v => state.rarity = v, () => fetchPage(true));
}

const playerSearchWidget = setupTextSearch({
  inputId: 'playerSearch', clearId: 'playerSearchClear', debounceMs: 400,
  applyValue: val => { state.player = val; fetchPage(true); },
});

let _amountT = null;
function wireAmountInput(id, stateKey) {
  document.getElementById(id).addEventListener('input', e => {
    clearTimeout(_amountT);
    const val = e.target.value;
    _amountT = setTimeout(() => { state[stateKey] = val; fetchPage(true); }, 250);
  });
}
wireAmountInput('minAmount', 'min_amount');
wireAmountInput('maxAmount', 'max_amount');

document.getElementById('clearFiltersBtn').addEventListener('click', () => {
  state.series_label = ''; state.set_name = ''; state.rarity = ''; state.player = '';
  state.min_amount = ''; state.max_amount = '';
  document.getElementById('minAmount').value = '';
  document.getElementById('maxAmount').value = '';
  document.getElementById('playerSearch').value = '';
  playerSearchWidget.reset();
  syncComboDisplay(document.getElementById('seriesCombo'));
  syncComboDisplay(document.getElementById('setCombo'));
  syncComboDisplay(document.getElementById('rarityCombo'));
  fetchPage(true);
});

(async function init() {
  document.getElementById('resultsMeta').textContent = 'Loading…';
  populateTypeCombo();
  syncAmountInputsVisibility();
  renderHead();
  try {
    await Promise.all([populateFilters(), fetchPage(true)]);
  } catch (err) {
    document.getElementById('resultsMeta').textContent = 'Failed to load leaderboard. Please try again shortly.';
    console.error(err);
  }
})();
</script>
<script src="nav.js"></script>
</body>
</html>
