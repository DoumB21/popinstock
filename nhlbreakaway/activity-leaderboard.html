<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Activity Leaderboard — NHL Breakaway — Hoardio</title>
  <meta name="description" content="Top spenders, sellers, traders, and pack openers across every NHL Breakaway wallet — filter by series, set, rarity, and player." />
  <link rel="canonical" href="https://www.hoardio.com/nhlbreakaway/activity-leaderboard" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.hoardio.com/nhlbreakaway/activity-leaderboard" />
  <meta property="og:title" content="Activity Leaderboard — NHL Breakaway — Hoardio" />
  <meta property="og:description" content="Top spenders, sellers, traders, and pack openers across every NHL Breakaway wallet — filter by series, set, rarity, and player." />
  <meta property="og:image" content="https://www.hoardio.com/images/og-nhlbreakaway.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Activity Leaderboard — NHL Breakaway — Hoardio" />
  <meta name="twitter:description" content="Top spenders, sellers, traders, and pack openers across every NHL Breakaway wallet — filter by series, set, rarity, and player." />
  <meta name="twitter:image" content="https://www.hoardio.com/images/og-nhlbreakaway.png" />
  <link rel="icon" href="../images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="../images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="../shared/global.css" />
  <style>
    .content { display: flex; flex-direction: column; gap: 1.25rem; }
    .page-header { margin-bottom: 0; }

    .filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: flex-start; }
    .filter-bar .cb-combo { min-width: 160px; flex: 1; max-width: 220px; }
    .filter-bar .text-search-wrap { position: relative; min-width: 180px; max-width: 280px; flex: 1.2; }
    .filter-bar .text-search-wrap .search-input { width: 100%; min-width: 0; max-width: none; padding-right: 2.1rem; }
    /* History tab's own Min/Max amount — same fixed-narrow pattern as
       wallet.html's own amount-range-input. */
    .filter-bar .amount-range-input { width: 120px; flex: 0 0 auto; min-width: 0; max-width: 120px; }
    /* Date inputs render their own native calendar-icon chrome, so they
       need a bit more room than the plain number inputs to not clip it. */
    .filter-bar .date-range-input { width: 160px; flex: 0 0 auto; min-width: 0; max-width: 160px; color-scheme: dark; }
    @media (max-width: 700px) {
      .filter-bar .cb-combo, .filter-bar .text-search-wrap { max-width: none; }
      .filter-bar .amount-range-input, .filter-bar .date-range-input { max-width: none; }
    }

    /* ── Tabs (Leaderboard / History) — same pattern as pack-stats.html's/
       holders.html's own. ── */
    .al-tabs { display: flex; gap: 1.5rem; border-bottom: 1px solid var(--border); margin-bottom: -1px; }
    .al-tab-btn {
      background: none; border: none; border-bottom: 2px solid transparent;
      padding: 0.65rem 0.1rem; font-family: inherit; font-size: 0.85rem; font-weight: 700;
      color: var(--text-secondary); cursor: pointer; transition: color 0.15s, border-color 0.15s;
    }
    .al-tab-btn:hover { color: var(--text-primary); }
    .al-tab-btn.active { color: var(--accent-light); border-bottom-color: var(--accent); }
    .al-tab-panel { display: none; flex-direction: column; gap: 1.25rem; margin-top: 1.25rem; }
    .al-tab-panel.active { display: flex; }

    /* ── History tab — per-transaction feed, ported from wallet.html's own
       Activity tab (type/rarity pills, from/to cells, pack-pull mini-list)
       since this page had none of that CSS before. ── */
    .type-pill {
      display: inline-flex; align-items: center; line-height: 1;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(var(--tp-rgb), 0.12); border: 1px solid rgba(var(--tp-rgb), 0.4);
      color: rgb(var(--tp-rgb));
    }
    .type-pill--purchase  { --tp-rgb: 34, 197, 94; }
    .type-pill--trade     { --tp-rgb: 59, 130, 246; }
    .type-pill--gift      { --tp-rgb: 236, 72, 153; }
    .type-pill--pack_open { --tp-rgb: 240, 168, 64; }
    .type-pill--promo     { --tp-rgb: 20, 184, 166; }
    .type-pill--transfer  { --tp-rgb: 148, 163, 184; }
    .pack-pill {
      display: inline-flex; align-items: center; gap: 4px; line-height: 1;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
      background: rgba(240,168,64,0.1); border: 1px solid rgba(240,168,64,0.35);
      color: var(--accent-light);
    }
    .rarity-pill {
      --rr-border: linear-gradient(rgba(255,255,255,0.35), rgba(255,255,255,0.35));
      --rr-text: linear-gradient(91.27deg, #fff 6.06%, #e7f1f4 47.93%, #fff 87.27%);
      display: inline-flex; align-items: center; line-height: 1;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
      border: 1px solid transparent;
      background-origin: border-box;
      background-clip: padding-box, border-box;
      background-image: linear-gradient(var(--bg), var(--bg)), var(--rr-border);
    }
    .rarity-pill-text {
      background-image: var(--rr-text);
      -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
    }
    .rarity-pill--fandom    { --rr-border: linear-gradient(91deg, #824424, #8a6441 30%, #7b4c2e 90%); --rr-text: linear-gradient(91deg, #d1713e 6.06%, #f3ac6c 47.93%, #d28e62 87.27%); }
    .rarity-pill--rare      { --rr-border: linear-gradient(92deg, #4e7fff, #2f52d6 30%, #4e7fff 90%); --rr-text: linear-gradient(93.83deg, #68aeff -0.71%, #c4dfff 45.06%, #68aeff 99.14%); }
    .rarity-pill--limited   { --rr-border: linear-gradient(91deg, #646464, #303030 30%, #646464 90%); --rr-text: linear-gradient(91.27deg, #a5b4ae 6.06%, #e6edea 31.44%, #bdc2c0 47.51%, #d9d9d9 63.58%, #c5d2ce 87.27%); }
    .rarity-pill--legendary { --rr-border: linear-gradient(92.71deg, #bd8800 -7.25%, #633b00 16.42%, #bd8800 36.23%, #633b00 54.94%, #bd8800 76.96%, #633b00 98.42%); --rr-text: linear-gradient(91.27deg, #ffb800 6.06%, #ffebb8 47.93%, #ffcf55 87.27%); }
    .rarity-pill--epic      { --rr-border: linear-gradient(92deg, #007770, #350da7 10%, #89068b 30%, #350da7 70%, #007770 95%); --rr-text: linear-gradient(99.88deg, #23ffa3 0.36%, #5177ff 24.51%, #f364ff 46.15%, #748aff 71.31%, #28ffcb 96.55%); }
    .rarity-pill--heroic    { --rr-border: linear-gradient(91.94deg, #58009d 3.4%, #2b00ab 27.27%, #58009d 45.16%, #2b00ab 60.73%, #58009d 80.46%, #2b00ab 98.86%); --rr-text: linear-gradient(91.27deg, #7d8aff 6.06%, #b98eff 47.93%, #4176ff 87.27%); }
    .rarity-pill--mythic    { --rr-border: linear-gradient(91.94deg, #ff2600 30%, #e20004 50%, #870005 80%, #e20004 98%, #ff2600); --rr-text: linear-gradient(91.27deg, #ff2600 6.06%, #e20004 47.93%); }
    .cell-set-name { font-weight: 600; color: var(--text-primary); }
    .cell-series { font-size: 0.72rem; color: var(--text-secondary); margin-top: 2px; }
    .cell-from-to-line { font-size: 0.82rem; white-space: nowrap; }
    .cell-from-to-line + .cell-from-to-line { margin-top: 2px; }
    .explorer-link { color: var(--text-secondary); text-decoration: none; }
    .explorer-link:hover { color: var(--accent-light); }
    .mobile-card-full-row { grid-column: 1 / -1; }
    .pull-list { display: flex; flex-direction: column; gap: 4px; max-width: 520px; }
    .pull-item {
      display: flex; align-items: center; gap: 0.5rem;
      color: inherit; text-decoration: none; font-size: 0.8rem;
      padding: 2px 0; border-radius: 4px;
    }
    .pull-item:hover .pull-player { color: var(--accent-light); text-decoration: underline; }
    .pull-player { font-weight: 600; color: var(--text-primary); }
    .pull-edition { color: var(--text-secondary); font-size: 0.72rem; font-weight: 700; font-variant-numeric: tabular-nums; }
    .pull-set { color: var(--text-secondary); font-size: 0.72rem; flex: 1; }
    .activity-pulls-row td { background: rgba(255,255,255,0.02); padding: 10px 14px 14px; }
    .activity-pulls-mobile { margin-top: 0.6rem; padding-top: 0.6rem; border-top: 1px solid var(--border); }
    .activity-expand-empty { color: var(--text-secondary); font-size: 0.8rem; padding: 0.35rem 0; }

    /* History tab's own "Search collector" box — same suggestion-dropdown
       widget as the Leaderboard tab's "Find a Collector" above, just its
       own instance (a live FILTER on the feed, not a rank spotlight). */
    .collector-search-wrap { position: relative; flex: 1; max-width: 340px; min-width: 220px; }
    .collector-search-wrap .search-input { width: 100%; max-width: none; padding-right: 2.1rem; }

    .results-meta { font-size: 0.8rem; color: var(--text-secondary); min-height: 1.2em; }
    .results-meta strong { color: var(--text-primary); }

    /* ── Find a collector (username/address type-ahead, ported from
       leaderboard.html) — identified by USERNAME here, not wallet_address:
       sweet_transaction_history has no wallet_address column at all. ── */
    .find-collector-wrap { position: relative; flex: 1; max-width: 340px; min-width: 220px; }
    .find-collector-wrap .search-input { width: 100%; max-width: none; padding-right: 2.1rem; }
    .suggest-item { flex-direction: column; align-items: flex-start; gap: 0.15rem; }
    .suggest-item-name { font-weight: 600; }
    .suggest-item-wallet { font-size: 0.72rem; color: var(--text-secondary); }
    #findCollectorResult { display: inline-flex; align-items: center; }
    #findCollectorResult strong { color: var(--accent-light); }
    .exit-spotlight-btn { margin-left: 0.6rem; background: none; border: none; padding: 0; color: var(--accent-light); text-decoration: underline; font-size: 0.8rem; cursor: pointer; }
    .exit-spotlight-btn:hover { color: var(--text-primary); }
    .items-table tbody tr.spotlight-row { background: rgba(240,168,64,0.08); }
    .items-table tbody tr.spotlight-row:hover { background: rgba(240,168,64,0.14); }

    /* ── Table — same sortable/rank-tint treatment as wallet.html's Activity
       tab and leaderboard.html's own Collector Leaderboard, merged into one
       (Rank is never sortable, it's just row position). ── */
    .items-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .items-table thead th {
      text-align: left; padding: 8px 12px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-secondary); background: var(--bg-card);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .items-table thead th.col-r { text-align: right; }
    .items-table thead th.sortable { cursor: pointer; user-select: none; }
    .items-table thead th.sortable:hover { color: var(--text-primary); }
    .items-table thead th .sort-icon { font-size: 0.6rem; opacity: 0.45; margin-left: 3px; }
    .items-table thead th.sorted .sort-icon { opacity: 1; color: var(--accent-light); }
    .items-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
    .items-table tbody tr:last-child { border-bottom: none; }
    .items-table tbody tr:hover { background: rgba(255,255,255,0.04); }
    .items-table tbody td { padding: 8px 12px; vertical-align: middle; }
    .items-table tbody td.col-r { text-align: right; font-variant-numeric: tabular-nums; }
    .items-table tbody tr.rank-row--1 { background: rgba(255,215,0,0.10); }
    .items-table tbody tr.rank-row--1:hover { background: rgba(255,215,0,0.16); }
    .items-table tbody tr.rank-row--2 { background: rgba(192,192,192,0.09); }
    .items-table tbody tr.rank-row--2:hover { background: rgba(192,192,192,0.15); }
    .items-table tbody tr.rank-row--3 { background: rgba(205,127,50,0.10); }
    .items-table tbody tr.rank-row--3:hover { background: rgba(205,127,50,0.16); }
    .cell-rank { color: var(--text-secondary); font-variant-numeric: tabular-nums; width: 1%; }
    .cell-rank--1 { color: #ffd700; font-weight: 700; }
    .cell-rank--2 { color: #c0c0c0; font-weight: 700; }
    .cell-rank--3 { color: #cd7f32; font-weight: 700; }
    .cell-count { font-weight: 700; color: var(--text-primary); }
    .holder-link { color: var(--accent-light); text-decoration: none; }
    .holder-link:hover { text-decoration: underline; }

    /* ── Busy overlay — same pattern as highlights.html's own. This page's
       queries (grouping/summing sweet_transaction_history) run several
       seconds — without this, a filter/sort/type change looked like nothing
       happened, inviting repeat clicks. Fixed to the viewport (not absolute
       over the results) so it's centered on what's visible regardless of
       scroll position; same z-index/backdrop convention as this site's
       other fixed modals. Identical at every width — a fixed-position
       overlay needs no separate mobile/desktop treatment. */
    .busy-overlay {
      position: fixed; inset: 0; z-index: 400;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6);
    }
    .busy-overlay.active { display: flex; }
    .busy-box {
      display: flex; align-items: center; gap: 0.6rem;
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 0.9rem 1.4rem; border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      font-size: 0.85rem; font-weight: 600; color: var(--text-primary);
    }
    .busy-spinner {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.25); border-top-color: var(--accent-light);
      animation: busy-spin 0.7s linear infinite;
    }
    @keyframes busy-spin { to { transform: rotate(360deg); } }
    .nhl-busy .filter-bar, .nhl-busy .mobile-sort-bar { pointer-events: none; opacity: 0.7; }
    .nhl-busy .items-table thead th.sortable { pointer-events: none; cursor: not-allowed; }

    /* Mobile-only "Sort by" combo + Asc/Desc toggle — same pattern as
       sets.html/pack-stats.html/highlights.html/wallet.html's own. */
    /* align-items: stretch (not the .filter-bar-inherited flex-start) so
       the Asc/Desc toggle group stretches to match the sort-field combo's
       own height, same as every other page's mobile-sort-bar — without
       this override it renders ~10px shorter here than on pack-stats.html
       etc., since .filter-bar sets flex-start for its OTHER rows (the
       "Find a Collector" wrap needs top-alignment against a taller
       suggestion panel), which this bar would otherwise inherit too. */
    .mobile-sort-bar { display: none; align-items: stretch; }
    .mobile-sort-bar .cb-combo { max-width: 220px; }

    /* ── Mobile card list — one card per row instead of a table row, so
       phone widths never need horizontal scroll. Same "two parallel DOM
       representations, toggled by breakpoint, both driven by the same
       render call" pattern as every other page in this section. Used
       unconditionally here (not just below some column-count threshold) —
       simpler than switching between a row-ish layout and a block one
       depending on whether the active type has a Total Amount column. ── */
    .mobile-card-list { display: none; flex-direction: column; gap: 0.75rem; }
    .mobile-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 0.85rem 1rem;
    }
    .mobile-card-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 0.75rem;
      margin: -0.85rem -1rem 0.6rem;
      padding: 0.85rem 1rem 0.6rem;
      border-bottom: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      background: rgba(255,255,255,0.045);
    }
    .mobile-card-header-name { display: flex; align-items: center; gap: 0.5rem; min-width: 0; }
    /* .cell-rank's own width:1% is a table-cell "shrink to content" trick —
       inside this flex header instead, that same tiny width collapses the
       box to ~1px and lets the "#N" text overflow into the wallet link next
       to it. Undo it here specifically. */
    .mobile-card-header-name .cell-rank { width: auto; flex-shrink: 0; }
    .mobile-card-stats {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0.6rem 1rem;
    }
    .mobile-stat-label {
      display: block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-secondary); margin-bottom: 2px;
    }
    .mobile-stat-value { font-variant-numeric: tabular-nums; }
    .mobile-card.rank-row--1 { background: rgba(255,215,0,0.08); border-color: rgba(255,215,0,0.25); }
    .mobile-card.rank-row--2 { background: rgba(192,192,192,0.07); border-color: rgba(192,192,192,0.22); }
    .mobile-card.rank-row--3 { background: rgba(205,127,50,0.08); border-color: rgba(205,127,50,0.25); }
    .mobile-card.spotlight-row { background: rgba(240,168,64,0.08); border-color: rgba(240,168,64,0.3); }

    @media (max-width: 700px) {
      .table-scroll { display: none; }
      .mobile-card-list { display: flex; }
      .mobile-sort-bar { display: flex; }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="content">

    <div class="page-header">
      <div class="page-title">NHL Breakaway <span class="accent">Activity Leaderboard</span></div>
      <div class="page-subtitle">Top spenders, sellers, traders, and pack openers, or browse the full sitewide activity history.</div>
    </div>

    <div class="al-tabs" id="alTabs">
      <button type="button" class="al-tab-btn active" data-tab="leaderboard">Leaderboard</button>
      <button type="button" class="al-tab-btn" data-tab="history">History</button>
    </div>

    <div class="busy-overlay" id="busyOverlay"><div class="busy-box"><span class="busy-spinner"></span><span>Loading…</span></div></div>

    <div class="al-tab-panel active" id="tabPanelLeaderboard">
      <div class="filter-bar">
        <div class="cb-combo" id="typeCombo">
          <input type="text" class="cb-combo-input" id="typeComboInput" autocomplete="off" spellcheck="false">
          <div class="cb-panel" id="typePanel"></div>
        </div>
        <div class="cb-combo" id="seriesCombo">
          <input type="text" class="cb-combo-input" id="seriesComboInput" autocomplete="off" spellcheck="false">
          <button type="button" class="cb-combo-clear" id="seriesComboClear" style="display:none" title="Clear">✕</button>
          <div class="cb-panel" id="seriesPanel"></div>
        </div>
        <div class="cb-combo" id="setCombo">
          <input type="text" class="cb-combo-input" id="setComboInput" autocomplete="off" spellcheck="false">
          <button type="button" class="cb-combo-clear" id="setComboClear" style="display:none" title="Clear">✕</button>
          <div class="cb-panel" id="setPanel"></div>
        </div>
        <div class="cb-combo" id="rarityCombo">
          <input type="text" class="cb-combo-input" id="rarityComboInput" autocomplete="off" spellcheck="false">
          <button type="button" class="cb-combo-clear" id="rarityComboClear" style="display:none" title="Clear">✕</button>
          <div class="cb-panel" id="rarityPanel"></div>
        </div>
      </div>

      <div class="filter-bar">
        <div class="find-collector-wrap">
          <input type="text" class="search-input" id="findCollectorInput" placeholder="Find collector by username or wallet (0x...)" autocomplete="off" spellcheck="false">
          <button type="button" class="cb-dropdown-clear" id="findCollectorClear" style="display:none" title="Clear">✕</button>
          <div class="cb-panel" id="findCollectorSuggestPanel"></div>
        </div>
        <span class="results-meta" id="findCollectorResult"></span>
        <button id="clearFiltersBtn" class="clear-filters-btn" type="button">✕ Clear filters</button>
      </div>

      <!-- Mobile-only "Sort by" combo + Asc/Desc toggle — replaces the desktop
           table's clickable column headers, which disappear along with the
           table at that width (see .mobile-card-list below). Repopulated
           whenever the Type changes (see populateTypeCombo's onPick), since
           count-only types have one fewer sortable column than purchase/sale. -->
      <div class="filter-bar mobile-sort-bar" id="mobileSortBar">
        <div class="cb-combo" id="sortFieldCombo">
          <input type="text" class="cb-combo-input" id="sortFieldComboInput" autocomplete="off" spellcheck="false" readonly>
          <div class="cb-panel" id="sortFieldPanel"></div>
        </div>
        <div class="tpc-toggle-group" id="sortDirToggle">
          <button type="button" class="tpc-toggle-btn" data-dir="asc">↑ Asc</button>
          <button type="button" class="tpc-toggle-btn" data-dir="desc">↓ Desc</button>
        </div>
      </div>

      <div class="results-meta" id="resultsMeta"></div>

      <div class="table-scroll" style="overflow-x:auto;">
        <table class="items-table">
          <thead><tr id="headRow"></tr></thead>
          <tbody id="body"></tbody>
        </table>
      </div>
      <!-- Always a 1-column block layout at mobile widths, regardless of
           whether the active type has 3 columns (count-only) or 4 (purchase/
           sale, +Total Amount) — simpler and more consistent than switching
           between a row-ish layout and a block one depending on type. -->
      <div class="mobile-card-list" id="mobileList"></div>

      <div id="loadMoreWrap" style="display:none; text-align:center; padding:1rem 0;">
        <button type="button" id="loadMoreBtn" class="load-more-btn">Load more</button>
      </div>
    </div>

    <div class="al-tab-panel" id="tabPanelHistory">
      <div class="filter-bar">
        <div class="cb-combo" id="historyTypeCombo">
          <input type="text" class="cb-combo-input" id="historyTypeComboInput" autocomplete="off" spellcheck="false">
          <button type="button" class="cb-combo-clear" id="historyTypeComboClear" style="display:none" title="Clear">✕</button>
          <div class="cb-panel" id="historyTypePanel"></div>
        </div>
        <div class="cb-combo" id="historySeriesCombo">
          <input type="text" class="cb-combo-input" id="historySeriesComboInput" autocomplete="off" spellcheck="false">
          <button type="button" class="cb-combo-clear" id="historySeriesComboClear" style="display:none" title="Clear">✕</button>
          <div class="cb-panel" id="historySeriesPanel"></div>
        </div>
        <div class="cb-combo" id="historySetCombo">
          <input type="text" class="cb-combo-input" id="historySetComboInput" autocomplete="off" spellcheck="false">
          <button type="button" class="cb-combo-clear" id="historySetComboClear" style="display:none" title="Clear">✕</button>
          <div class="cb-panel" id="historySetPanel"></div>
        </div>

<script src="api-base.js"></script>
<script src="rarity-order.js"></script>
<script>
'use strict';

// See api-base.js (loaded above) for the localhost-vs-production URL logic.
const API_BASE = window.NHL_API_BASE;
const PAGE_SIZE = 100;

// See wallet.html's identical helper for the full "why" — versioned cache
// key resolved once per page load, shared with nav.js via sessionStorage.
const DATA_VERSION_CACHE_KEY = 'nhlbreakaway_data_last_updated';
const DATA_VERSION_CACHE_TTL_MS = 60 * 1000;
let _dataVersionPromise = null;
function getDataVersion() {
  if (_dataVersionPromise) return _dataVersionPromise;
  _dataVersionPromise = (async () => {
    try {
      const cached = sessionStorage.getItem(DATA_VERSION_CACHE_KEY);
      if (cached) {
        const { value, cachedAt } = JSON.parse(cached);
        if (Date.now() - cachedAt < DATA_VERSION_CACHE_TTL_MS) return value;
      }
    } catch {}
    try {
      const res = await fetch(`${API_BASE}/api/site-meta`);
      const { data_last_updated } = await res.json();
      if (data_last_updated) {
        try { sessionStorage.setItem(DATA_VERSION_CACHE_KEY, JSON.stringify({ value: data_last_updated, cachedAt: Date.now() })); } catch {}
      }
      return data_last_updated || '';
    } catch {
      return '';
    }
  })();
  return _dataVersionPromise;
}
function withVersion(url, version) {
  return version ? url + (url.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(version) : url;
}

function fmtNum(n) {
  return n === null || n === undefined ? '—' : n.toLocaleString();
}
function fmtUsd(n) {
  return n === null || n === undefined ? '—' : `$${n.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;
}
function escHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

/* ══════════════════ .cb-combo widget (single-select, searchable) ══════════════════
   Verbatim copy of wallet.html's own implementation — kept page-local per
   this section's own convention of not sharing JS modules across pages. */
function closeAllCombos() {
  document.querySelectorAll('.cb-combo').forEach(combo => {
    combo.classList.remove('open');
    combo.querySelector('.cb-panel')?.classList.remove('open');
    if (combo._items) syncComboDisplay(combo);
  });
}
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.cb-combo')) closeAllCombos();
});

function syncComboDisplay(combo) {
  const input = combo.querySelector('.cb-combo-input');
  const clear = combo.querySelector('.cb-combo-clear');
  const allItem = combo._items[0];
  const active = combo._items.find(i => i.value === combo._getValue()) || allItem;
  const hasSelection = active.value !== allItem.value;
  input.placeholder = allItem.label;
  input.value = hasSelection ? active.label : '';
  if (clear) clear.style.display = hasSelection ? '' : 'none';
  combo.classList.toggle('has-selection', hasSelection);
}

function buildCombo(comboId, items, getValue, setValue, onPick) {
  const combo = document.getElementById(comboId);
  const input = combo.querySelector('.cb-combo-input');
  const clear = combo.querySelector('.cb-combo-clear');
  const panel = combo.querySelector('.cb-panel');

  combo._items = items;
  combo._getValue = getValue;
  syncComboDisplay(combo);
  if (combo._wired) return;
  combo._wired = true;

  const pick = val => {
    closeAllCombos();
    setValue(val);
    syncComboDisplay(combo);
    onPick();
  };

  const renderList = filterText => {
    const q = filterText.trim().toLowerCase();
    const options = combo._items.slice(1);
    const filtered = q ? options.filter(i => i.label.toLowerCase().includes(q)) : options;
    panel.innerHTML = filtered.length
      ? filtered.map(i => `<div class="cb-item${i.value === getValue() ? ' active' : ''}" data-val="${i.value}"><span>${i.label}</span></div>`).join('')
      : `<div class="cb-empty">No matches</div>`;
    panel.querySelectorAll('.cb-item').forEach(item => {
      item.addEventListener('click', () => pick(item.dataset.val));
    });
  };

  input.addEventListener('focus', () => {
    closeAllCombos();
    combo.classList.add('open');
    panel.classList.add('open');
    renderList('');
    input.select();
  });
  input.addEventListener('input', () => renderList(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); input.blur(); closeAllCombos(); }
    else if (e.key === 'Enter') { e.preventDefault(); panel.querySelector('.cb-item')?.click(); }
  });
  input.addEventListener('blur', () => {
    setTimeout(() => {
      if (!combo.contains(document.activeElement)) {
        combo.classList.remove('open');
        panel.classList.remove('open');
        syncComboDisplay(combo);
      }
    }, 150);
  });
  if (clear) {
    clear.addEventListener('mousedown', e => e.preventDefault());
    clear.addEventListener('click', () => { pick(''); input.blur(); });
  }
}

function setupTextSearch({ inputId, clearId, debounceMs = 250, applyValue }) {
  const input = document.getElementById(inputId);
  const clearBtn = document.getElementById(clearId);
  let t = null;

  function updateClear() { clearBtn.style.display = input.value ? '' : 'none'; }

  input.addEventListener('input', () => {
    clearTimeout(t);
    updateClear();
    const val = input.value.trim();
    t = setTimeout(() => applyValue(val), debounceMs);
  });

  clearBtn.addEventListener('mousedown', e => e.preventDefault());
  clearBtn.addEventListener('click', () => {
    input.value = '';
    updateClear();
    applyValue('');
  });

  return { reset: updateClear };
}

/* ══════════════════ Activity Leaderboard ══════════════════
   One type at a time — each is a genuinely different metric (count-only
   for most, count+$ for purchase/sale), so this is never an "all types"
   view. hasAmount drives whether the Total Amount column/sort/min-max
   filters are relevant for the currently selected type. */
const TYPE_LABELS = {
  purchase: 'Purchase', sale: 'Sale', trade: 'Trade', gift: 'Gift',
  pack_open: 'Pack Open', promo: 'Promo', transfer: 'Transfer',
};
const TYPE_HAS_AMOUNT = { purchase: true, sale: true };

const COLUMNS_BASE = [
  { key: 'rank',   label: 'Rank' },
  { key: 'wallet', label: 'Wallet' },
  { key: 'count',  label: 'Count', sortable: true, num: true },
];
const COLUMN_AMOUNT = { key: 'amount', label: 'Total Amount', sortable: true, num: true };
function activeColumns() {
  return TYPE_HAS_AMOUNT[state.type] ? [...COLUMNS_BASE, COLUMN_AMOUNT] : COLUMNS_BASE;
}

const state = {
  type: 'purchase', series_label: '', set_name: '', rarity: '',
  sortField: 'amount', sortDir: 'desc',
  leaderboard: [], offset: 0, hasMore: false, busy: false, autoLoadArmed: false,
  spotlightUsername: null,
  // Real count of wallets matching the current filters, from the backend's
  // `total` field — NOT state.leaderboard.length, which is just however
  // many rows happen to be loaded so far (always the page size on a first
  // load, regardless of how many actually matched).
  total: 0,
};

// Shown while a filter/sort/type change or Load More is in flight — this
// page's queries (grouping/summing sweet_transaction_history) routinely
// take several seconds, so without this a change looked like nothing
// happened and invited repeat clicks. Same pattern/name as highlights.html's
// own setBusyUi(), identical at every width (fixed-position overlay).
function setBusyUi(active) {
  document.body.classList.toggle('nhl-busy', active);
  document.getElementById('busyOverlay').classList.toggle('active', active);
}

// Shared by the paginated list and the spotlight rank lookup — same filters,
// same type, same sort (the spotlight always shows this wallet's rank
// under whatever's currently selected, not a fixed metric).
function buildFilterParams() {
  const params = new URLSearchParams();
  params.set('type', state.type);
  if (state.series_label) params.set('series_label', state.series_label);
  if (state.set_name) params.set('set_name', state.set_name);
  if (state.rarity) params.set('rarity', state.rarity);
  params.set('sort', state.sortField);
  params.set('dir', state.sortDir);
  return params;
}

function buildQuery() {
  const params = buildFilterParams();
  params.set('limit', PAGE_SIZE);
  params.set('offset', state.offset);
  return params;
}

async function loadChunk() {
  if (state.busy) return 0;
  state.busy = true;
  renderLoadMore();
  setBusyUi(true);
  let got = 0;
  try {
    const version = await getDataVersion();
    const res = await fetch(withVersion(`${API_BASE}/api/activity-leaderboard?${buildQuery()}`, version));
    const data = await res.json();
    state.leaderboard = [...state.leaderboard, ...data.leaderboard];
    state.hasMore = data.has_more;
    state.total = data.total;
    state.offset += data.leaderboard.length;
    got = data.leaderboard.length;
    renderBody();
  } catch (err) {
    document.getElementById('resultsMeta').textContent = 'Failed to load leaderboard. Please try again shortly.';
    console.error(err);
  } finally {
    state.busy = false;
    renderLoadMore();
    setBusyUi(false);
  }
  return got;
}

// While a collector is spotlighted, every filter/sort/type change re-runs
// the rank lookup instead of the paginated list — same "top-layer filter,
// always their CURRENT real rank" convention as leaderboard.html's own
// Find a collector.
async function loadSpotlight() {
  if (state.busy) return;
  state.busy = true;
  renderLoadMore();
  setBusyUi(true);
  try {
    const params = buildFilterParams();
    params.set('username', state.spotlightUsername);
    const version = await getDataVersion();
    const res = await fetch(withVersion(`${API_BASE}/api/activity-leaderboard/rank?${params}`, version));
    const data = await res.json();
    state.leaderboard = data.found
      ? [{ username: data.username, count: data.count, total_amount: data.total_amount, rank: data.rank }]
      : [];
    state.hasMore = false;
    renderBody();
  } catch (err) {
    document.getElementById('resultsMeta').textContent = 'Failed to load. Please try again shortly.';
    console.error(err);
  } finally {
    state.busy = false;
    renderLoadMore();
    setBusyUi(false);
  }
}

function exitSpotlight() {
  state.spotlightUsername = null;
  findCollectorInputEl.value = '';
  updateFindCollectorClear();
  document.getElementById('findCollectorResult').textContent = '';
  closeFcSuggestions();
  fetchPage(true);
}

async function fetchPage(reset) {
  if (reset) { state.offset = 0; state.leaderboard = []; state.autoLoadArmed = false; state.hasMore = false; }
  if (state.spotlightUsername) await loadSpotlight();
  else await loadChunk();
}

function renderHead() {
  const row = document.getElementById('headRow');
  row.innerHTML = activeColumns().map(col => {
    if (!col.sortable) return `<th${col.num ? ' class="col-r"' : ''}>${col.label}</th>`;
    const sorted = state.sortField === col.key;
    const icon = sorted ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';
    return `<th class="sortable${col.num ? ' col-r' : ''}${sorted ? ' sorted' : ''}" data-field="${col.key}">${col.label} <span class="sort-icon">${icon}</span></th>`;
  }).join('');
  row.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const field = th.dataset.field;
      if (state.sortField === field) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortField = field;
        state.sortDir = 'desc';
      }
      renderHead();
      fetchPage(true);
      syncMobileSortControls();
    });
  });
}

/* ══════════════════ Mobile "Sort by" combo + Asc/Desc toggle ══════════════════
   Repopulated (not just synced) whenever the Type changes — see
   populateTypeCombo's onPick — since count-only types have one fewer
   sortable column than purchase/sale (no Total Amount). */
function populateMobileSortCombo() {
  const sortable = activeColumns().filter(c => c.sortable);
  buildCombo('sortFieldCombo',
    [{ value: '', label: '' }, ...sortable.map(c => ({ value: c.key, label: c.label }))],
    () => state.sortField,
    v => { state.sortField = v; state.sortDir = 'desc'; },
    () => { renderHead(); fetchPage(true); syncMobileSortControls(); });
  syncMobileSortControls();
}
function syncMobileSortControls() {
  syncComboDisplay(document.getElementById('sortFieldCombo'));
  document.querySelectorAll('#sortDirToggle .tpc-toggle-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.dir === state.sortDir);
  });
}
document.getElementById('sortDirToggle').addEventListener('click', e => {
  const btn = e.target.closest('.tpc-toggle-btn');
  if (!btn || btn.classList.contains('active')) return;
  state.sortDir = btn.dataset.dir;
  renderHead();
  syncMobileSortControls();
  fetchPage(true);
});

function renderBody() {
  const cols = activeColumns().length;
  const body = document.getElementById('body');
  const mobileList = document.getElementById('mobileList');
  if (!state.leaderboard.length) {
    const emptyMsg = state.spotlightUsername ? "This collector has no activity matching these filters." : 'No activity matches these filters.';
    body.innerHTML = `<tr><td colspan="${cols}" style="padding:2rem 1rem; text-align:center; color:var(--text-secondary);">${emptyMsg}</td></tr>`;
    mobileList.innerHTML = `<div style="padding:2rem 1rem; text-align:center; color:var(--text-secondary);">${emptyMsg}</div>`;
  } else {
    body.innerHTML = state.leaderboard.map((r, i) => {
      // Spotlight mode carries the collector's REAL rank on the row itself
      // (from /api/activity-leaderboard/rank) rather than its position in
      // this single-row array.
      const rank = r.rank != null ? r.rank : i + 1;
      const rankClass = rank <= 3 ? ` cell-rank--${rank}` : '';
      const rowClass = state.spotlightUsername ? ' class="spotlight-row"' : (rank <= 3 ? ` class="rank-row--${rank}"` : '');
      const wallet = `<a class="holder-link" href="https://nhlbreakaway.com/user/${encodeURIComponent(r.username)}?sort=newest" target="_blank" rel="noopener">${escHtml(r.username)}</a>`;
      return `
        <tr${rowClass}>
          <td class="cell-rank${rankClass}">#${fmtNum(rank)}</td>
          <td>${wallet}</td>
          <td class="col-r cell-count">${fmtNum(r.count)}</td>
          ${TYPE_HAS_AMOUNT[state.type] ? `<td class="col-r">${fmtUsd(r.total_amount)}</td>` : ''}
        </tr>
      `;
    }).join('');

    mobileList.innerHTML = state.leaderboard.map((r, i) => {
      const rank = r.rank != null ? r.rank : i + 1;
      const rankClass = rank <= 3 ? ` cell-rank--${rank}` : '';
      const cardClass = state.spotlightUsername ? ' spotlight-row' : (rank <= 3 ? ` rank-row--${rank}` : '');
      const wallet = `<a class="holder-link" href="https://nhlbreakaway.com/user/${encodeURIComponent(r.username)}?sort=newest" target="_blank" rel="noopener">${escHtml(r.username)}</a>`;
      return `
        <div class="mobile-card${cardClass}">
          <div class="mobile-card-header">
            <div class="mobile-card-header-name">
              <span class="cell-rank${rankClass}">#${fmtNum(rank)}</span>
              ${wallet}
            </div>
          </div>
          <div class="mobile-card-stats">
            <div><span class="mobile-stat-label">Count</span><span class="mobile-stat-value">${fmtNum(r.count)}</span></div>
            ${TYPE_HAS_AMOUNT[state.type] ? `<div><span class="mobile-stat-label">Total Amount</span><span class="mobile-stat-value">${fmtUsd(r.total_amount)}</span></div>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }
  const meta = document.getElementById('resultsMeta');
  if (state.spotlightUsername) {
    meta.innerHTML = `Showing <strong>1</strong> collector only <button type="button" id="exitSpotlightBtn" class="exit-spotlight-btn">✕ Show full leaderboard</button>`;
    document.getElementById('exitSpotlightBtn').addEventListener('click', exitSpotlight);
  } else {
    meta.innerHTML = `<strong>${fmtNum(state.total)}</strong> wallet${state.total === 1 ? '' : 's'}`;
  }
}

function renderLoadMore() {
  const wrap = document.getElementById('loadMoreWrap');
  const btn = document.getElementById('loadMoreBtn');
  wrap.style.display = (state.hasMore && !state.spotlightUsername) ? 'block' : 'none';
  btn.disabled = state.busy;
  btn.textContent = state.busy ? 'Loading…' : 'Load more';
}
document.getElementById('loadMoreBtn').addEventListener('click', () => {
  state.autoLoadArmed = true;
  fetchPage(false);
});
new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && state.autoLoadArmed && !state.busy && state.hasMore) fetchPage(false);
}, { rootMargin: '600px' }).observe(document.getElementById('loadMoreWrap'));

function populateTypeCombo() {
  // buildCombo's own renderList always slice(1)s the items array — index 0
  // is reserved for the "All X" sentinel every other combo on this page
  // uses (never rendered as a clickable row, just what an empty input
  // means). Type has no "All types" — each one is a genuinely different
  // metric — but that reserved slot still has to exist as a real (if inert)
  // placeholder, or the FIRST real option silently takes its place and can
  // never show as the active row in the open dropdown. An empty-value
  // sentinel that's simply never selectable keeps Purchase (or whichever
  // type is active) correctly highlighted when the list opens.
  buildCombo('typeCombo',
    [{ value: '', label: '' }, ...Object.entries(TYPE_LABELS).map(([value, label]) => ({ value, label }))],
    () => state.type, v => {
      state.type = v;
      // Amount-based types default to sorting by amount; count-only types
      // have no amount column to sort by at all.
      state.sortField = TYPE_HAS_AMOUNT[v] ? 'amount' : 'count';
      state.sortDir = 'desc';
    },
    () => { renderHead(); fetchPage(true); populateMobileSortCombo(); });
}

async function populateFilters() {
  const version = await getDataVersion();
  const res = await fetch(withVersion(`${API_BASE}/api/highlights/filters`, version));
  const data = await res.json();
  buildCombo('seriesCombo',
    [{ value: '', label: 'All series' }, ...data.series.map(v => ({ value: v, label: v }))],
    () => state.series_label, v => state.series_label = v, () => fetchPage(true));
  buildCombo('setCombo',
    [{ value: '', label: 'All sets' }, ...data.sets.map(v => ({ value: v, label: v }))],
    () => state.set_name, v => state.set_name = v, () => fetchPage(true));
  buildCombo('rarityCombo',
    [{ value: '', label: 'All rarities' }, ...sortByRarityOrder(data.rarities).map(v => ({ value: v, label: v }))],
    () => state.rarity, v => state.rarity = v, () => fetchPage(true));
}

document.getElementById('clearFiltersBtn').addEventListener('click', () => {
  state.series_label = ''; state.set_name = ''; state.rarity = '';
  syncComboDisplay(document.getElementById('seriesCombo'));
  syncComboDisplay(document.getElementById('setCombo'));
  syncComboDisplay(document.getElementById('rarityCombo'));
  fetchPage(true);
});

/* ══════════════════ Find a collector (username/address type-ahead) ══════════════════
   Ported from leaderboard.html's own — identified by USERNAME here, not
   wallet_address: sweet_transaction_history has no wallet_address column,
   so a wallet with no cached username simply cannot appear in this
   leaderboard at all (a clear message, not a silent empty spotlight). */
const findCollectorInputEl = document.getElementById('findCollectorInput');
const findCollectorSuggestPanel = document.getElementById('findCollectorSuggestPanel');
const findCollectorClearBtn = document.getElementById('findCollectorClear');
let fcSuggestItems = [];
let fcSuggestActiveIndex = -1;
let fcSuggestSeq = 0;

function closeFcSuggestions() {
  findCollectorSuggestPanel.classList.remove('open');
  fcSuggestItems = [];
  fcSuggestActiveIndex = -1;
}

function updateFindCollectorClear() {
  findCollectorClearBtn.style.display = findCollectorInputEl.value ? '' : 'none';
}

function renderFcSuggestions() {
  if (!fcSuggestItems.length) {
    findCollectorSuggestPanel.innerHTML = `<div class="cb-empty">No matches</div>`;
  } else {
    findCollectorSuggestPanel.innerHTML = fcSuggestItems.map((s, i) => `
      <div class="cb-item suggest-item${i === fcSuggestActiveIndex ? ' active' : ''}" data-index="${i}">
        <span class="suggest-item-name">${escHtml(s.username || '(no username)')}</span>
        <span class="suggest-item-wallet">${escHtml(s.wallet_address)}</span>
      </div>
    `).join('');
    findCollectorSuggestPanel.querySelectorAll('.suggest-item').forEach(el => {
      el.addEventListener('mousedown', e => e.preventDefault());
      el.addEventListener('click', () => selectFcSuggestion(fcSuggestItems[Number(el.dataset.index)]));
    });
  }
  findCollectorSuggestPanel.classList.add('open');
}

function selectFcSuggestion(item) {
  findCollectorInputEl.value = item.username || item.wallet_address;
  updateFindCollectorClear();
  closeFcSuggestions();
  if (!item.username) {
    document.getElementById('findCollectorResult').textContent = "This wallet has no cached username, so it can't appear in this leaderboard.";
    return;
  }
  spotlightCollector(item.username);
}

async function spotlightCollector(resolvedUsername) {
  const query = resolvedUsername || findCollectorInputEl.value.trim();
  const resultEl = document.getElementById('findCollectorResult');
  if (!query) { resultEl.textContent = ''; return; }
  resultEl.textContent = 'Searching…';
  try {
    let username = resolvedUsername;
    if (!username) {
      const version = await getDataVersion();
      const resolveRes = await fetch(withVersion(`${API_BASE}/api/wallet/resolve?q=${encodeURIComponent(query)}`, version));
      if (resolveRes.status === 404) {
        resultEl.textContent = `No wallet or username found matching "${query}".`;
        return;
      }
      if (!resolveRes.ok) throw new Error(`resolve failed: ${resolveRes.status}`);
      ({ username } = await resolveRes.json());
      if (!username) {
        resultEl.textContent = "This wallet has no cached username, so it can't appear in this leaderboard.";
        return;
      }
    }
    resultEl.textContent = '';
    state.spotlightUsername = username;
    await fetchPage(true);
  } catch (err) {
    resultEl.textContent = 'Failed to look up. Please try again shortly.';
    console.error(err);
  }
}

let _fcSuggestT = null;
findCollectorInputEl.addEventListener('input', () => {
  clearTimeout(_fcSuggestT);
  updateFindCollectorClear();
  const q = findCollectorInputEl.value.trim();
  document.getElementById('findCollectorResult').textContent = '';
  // Clearing the box exits the spotlight — there's no other way to get
  // back to the full leaderboard via this input once spotlighted.
  if (!q && state.spotlightUsername) { state.spotlightUsername = null; fetchPage(true); return; }
  if (q.length < 2) { closeFcSuggestions(); return; }
  _fcSuggestT = setTimeout(async () => {
    const seq = ++fcSuggestSeq;
    try {
      const version = await getDataVersion();
      const res = await fetch(withVersion(`${API_BASE}/api/wallet/suggest?q=${encodeURIComponent(q)}`, version));
      const data = await res.json();
      if (seq !== fcSuggestSeq) return;
      fcSuggestItems = data.suggestions;
      fcSuggestActiveIndex = -1;
      renderFcSuggestions();
    } catch (err) {
      console.error(err);
    }
  }, 250);
});

document.addEventListener('mousedown', e => {
  if (!e.target.closest('.find-collector-wrap')) closeFcSuggestions();
});

findCollectorClearBtn.addEventListener('mousedown', e => e.preventDefault());
findCollectorClearBtn.addEventListener('click', () => {
  findCollectorInputEl.value = '';
  updateFindCollectorClear();
  document.getElementById('findCollectorResult').textContent = '';
  closeFcSuggestions();
  if (state.spotlightUsername) { state.spotlightUsername = null; fetchPage(true); }
});

findCollectorInputEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && fcSuggestItems.length) {
    e.preventDefault();
    fcSuggestActiveIndex = (fcSuggestActiveIndex + 1) % fcSuggestItems.length;
    renderFcSuggestions();
  } else if (e.key === 'ArrowUp' && fcSuggestItems.length) {
    e.preventDefault();
    fcSuggestActiveIndex = (fcSuggestActiveIndex - 1 + fcSuggestItems.length) % fcSuggestItems.length;
    renderFcSuggestions();
  } else if (e.key === 'Enter') {
    if (fcSuggestActiveIndex >= 0 && fcSuggestItems[fcSuggestActiveIndex]) {
      selectFcSuggestion(fcSuggestItems[fcSuggestActiveIndex]);
    } else {
      closeFcSuggestions();
      spotlightCollector();
    }
  } else if (e.key === 'Escape') {
    closeFcSuggestions();
  }
});

/* ══════════════════ History tab — sitewide per-transaction activity feed ══════════════════
   Same shape as wallet.html's own Activity tab, but with NO wallet scoping
   at all — every collector's rows at once, backed by /api/activity-history
   (+ /api/activity-history/summary). No 'sale' pseudo-type here — that only
   exists on the wallet-scoped version to relabel a 'purchase' row relative
   to whichever wallet is being viewed; a sitewide feed has no single
   viewing wallet, and a 'purchase' row already shows both sides via
   From/To directly.
   IMPORTANT — this endpoint deliberately has NO exact `total` (see
   handleActivityHistory's own comment in dev-server/index.js): a
   COUNT(*) OVER() over this table's real 756K+ rows took 15-29s with no
   scoping to shrink the matching set first, the way every OTHER paginated
   endpoint in this codebase gets to assume. resultsMeta here shows "N
   loaded so far", not "N total". */
const WALLET_ADDRESS_RE = /^0x[0-9a-fA-F]{40}$/;
function prettyWallet(val) {
  if (!val) return val;
  return WALLET_ADDRESS_RE.test(val) ? `${val.slice(0, 6)}…${val.slice(-4)}` : val;
}
// A resolved username links to their nhlbreakaway.com profile (same URL
// shape as the Leaderboard tab's own .holder-link above); a raw, unresolved
// 0x address (see the handoff note's ~1.6%-of-rows gotcha) has no profile
// to link to, so it's plain text.
function fromToLinkHtml(username) {
  if (!username) return '—';
  const display = escHtml(prettyWallet(username));
  if (WALLET_ADDRESS_RE.test(username)) return `<span title="${escHtml(username)}">${display}</span>`;
  return `<a class="holder-link" href="https://nhlbreakaway.com/user/${encodeURIComponent(username)}?sort=newest" target="_blank" rel="noopener" title="${escHtml(username)}">${display}</a>`;
}
function fmtActivityDate(raw) {
  if (!raw) return '—';
  const d = new Date(raw + 'Z');
  if (isNaN(d)) return raw;
  return new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric', hour: 'numeric', minute: '2-digit' }).format(d);
}
function pullListHtml(highlights) {
  return `<div class="pull-list">${(highlights || []).map(h => `
    <a class="pull-item" href="holders?moment_uuid=${encodeURIComponent(h.moment_uuid)}">
      <span class="pull-player">${escHtml(h.player)}</span>
      <span class="pull-edition">#${fmtNum(h.edition_number)}</span>
      <span class="pull-set">${escHtml(h.set_name)}</span>
      ${h.rarity ? `<span class="rarity-pill rarity-pill--${h.rarity.toLowerCase()}"><span class="rarity-pill-text">${h.rarity}</span></span>` : ''}
    </a>
  `).join('')}</div>`;
}
function packPullsBodyHtml(a) {
  if (!a.pack_pulls_resolved) {
    return `<div class="activity-expand-empty">This pack's opening history hasn't been retrieved yet — full history is being backfilled drop by drop.</div>`;
  }
  if (!a.pack_pulls || !a.pack_pulls.length) {
    return `<div class="activity-expand-empty">No highlights found for this pack.</div>`;
  }
  return pullListHtml(a.pack_pulls);
}
// Always-visible, not collapsible — same call already made for wallet.html's
// own Pack Open rows after live testing (see that page's own comment).
function playerCellHtml(a) {
  if (a.player) return escHtml(a.player);
  if (!a.is_pack) return '—';

}

  hasMore: false, busy: false, autoLoadArmed: false, loaded: false,

function historyFilterParams() {
  const params = new URLSearchParams();
  if (historyState.type) params.set('type', historyState.type);
  if (historyState.series_label) params.set('series_label', historyState.series_label);
  if (historyState.set_name) params.set('set_name', historyState.set_name);
  if (historyState.rarity) params.set('rarity', historyState.rarity);
  if (historyState.player) params.set('player', historyState.player);
  if (historyState.min_amount !== '') params.set('min_amount', historyState.min_amount);
  if (historyState.max_amount !== '') params.set('max_amount', historyState.max_amount);
  if (historyState.wallet_search) params.set('wallet_search', historyState.wallet_search);
  if (historyState.min_edition !== '') params.set('min_edition', historyState.min_edition);

  if (historyState.date_from) params.set('date_from', historyState.date_from);
  if (historyState.date_to) params.set('date_to', historyState.date_to);
  return params;
}
function historyQuery() {
  const params = historyFilterParams();
  params.set('sort', historyState.sortField);
  params.set('dir', historyState.sortDir);
  params.set('limit', 50);
  params.set('offset', historyState.activity.length);
  return params;
}
function refreshHistory(reset) {
  return historyState.view === 'summary' ? fetchHistorySummary() : fetchHistoryPage(reset);
}

async function loadHistoryChunk() {
  if (historyState.busy) return 0;
  historyState.busy = true;
  renderHistoryLoadMore();
  setBusyUi(true);
  let got = 0;
  try {
    const version = await getDataVersion();
    const res = await fetch(withVersion(`${API_BASE}/api/activity-history?${historyQuery()}`, version));
    const data = await res.json();
    historyState.activity = [...historyState.activity, ...data.activity];
    historyState.hasMore = data.has_more;
    got = data.activity.length;
    renderHistoryBody();
  } catch (err) {
    document.getElementById('historyResultsMeta').textContent = 'Failed to load activity. Please try again shortly.';
    console.error(err);
  } finally {
    historyState.busy = false;
    renderHistoryLoadMore();
    setBusyUi(false);
  }
  return got;
}
async function fetchHistoryPage(reset) {
  if (reset) { historyState.activity = []; historyState.autoLoadArmed = false; }
  await loadHistoryChunk();
}
async function fetchHistorySummary() {
  setBusyUi(true);
  try {
    const version = await getDataVersion();
    const res = await fetch(withVersion(`${API_BASE}/api/activity-history/summary?${historyFilterParams()}`, version));
    const data = await res.json();
    historyState.summary = data.summary;
    renderHistoryBody();
  } catch (err) {
    document.getElementById('historyResultsMeta').textContent = 'Failed to load activity summary. Please try again shortly.';
    console.error(err);
  } finally {
    setBusyUi(false);
  }
}

    const icon = sorted ? (historyState.sortDir === 'asc' ? '↑' : '↓') : '↕';
    return `<th class="sortable${col.num ? ' col-r' : ''}${sorted ? ' sorted' : ''}" data-field="${col.key}">${col.label} <span class="sort-icon">${icon}</span></th>`;
  }).join('');
  row.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {

/* ══════════════════ "Search collector" — live suggestion dropdown ══════════════════

const historyCollectorInputEl = document.getElementById('historyCollectorSearch');
const historyCollectorClearBtn = document.getElementById('historyCollectorClear');
const historyCollectorSuggestPanel = document.getElementById('historyCollectorSuggestPanel');
let hcSuggestItems = [];
let hcSuggestActiveIndex = -1;
let hcSuggestSeq = 0;

function updateHistoryCollectorClear() { historyCollectorClearBtn.style.display = historyCollectorInputEl.value ? '' : 'none'; }

let _hcSuggestT = null;
let _hcApplyT = null;
historyCollectorInputEl.addEventListener('input', () => {
  updateHistoryCollectorClear();
  const q = historyCollectorInputEl.value.trim();
  clearTimeout(_hcApplyT);
  _hcApplyT = setTimeout(() => applyHistoryCollector(historyCollectorInputEl.value), 300);
  clearTimeout(_hcSuggestT);
  if (q.length < 2) { closeHcSuggestions(); return; }
  _hcSuggestT = setTimeout(async () => {
    const seq = ++hcSuggestSeq;
    try {
      const version = await getDataVersion();
      const res = await fetch(withVersion(`${API_BASE}/api/wallet/suggest?q=${encodeURIComponent(q)}`, version));
      const data = await res.json();
      if (seq !== hcSuggestSeq) return;
      hcSuggestItems = data.suggestions;
      hcSuggestActiveIndex = -1;
      renderHcSuggestions();
    } catch (err) {
      console.error(err);
    }
  }, 250);
});
historyCollectorInputEl.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' && hcSuggestItems.length) {
    e.preventDefault();
    hcSuggestActiveIndex = (hcSuggestActiveIndex + 1) % hcSuggestItems.length;
    renderHcSuggestions();
  } else if (e.key === 'ArrowUp' && hcSuggestItems.length) {
    e.preventDefault();
    hcSuggestActiveIndex = (hcSuggestActiveIndex - 1 + hcSuggestItems.length) % hcSuggestItems.length;
    renderHcSuggestions();
  } else if (e.key === 'Enter') {
    if (hcSuggestActiveIndex >= 0 && hcSuggestItems[hcSuggestActiveIndex]) {
      selectHcSuggestion(hcSuggestItems[hcSuggestActiveIndex]);
    } else {
      closeHcSuggestions();
    }
  } else if (e.key === 'Escape') {
    closeHcSuggestions();
  }
});
historyCollectorClearBtn.addEventListener('mousedown', e => e.preventDefault());
historyCollectorClearBtn.addEventListener('click', () => {
  historyCollectorInputEl.value = '';
  updateHistoryCollectorClear();
  closeHcSuggestions();
  applyHistoryCollector('');
  historyCollectorInputEl.focus();
});
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.collector-search-wrap')) closeHcSuggestions();
});

async function initHistoryTab() {
  renderHistoryHead();
  populateHistoryTypeCombo();
  populateHistoryMobileSort();
  document.getElementById('historyResultsMeta').textContent = 'Loading…';
  try {
    await populateHistoryFilters();
    await fetchHistoryPage(true);
  } catch (err) {
    document.getElementById('historyResultsMeta').textContent = 'Failed to load activity. Please try again shortly.';
    console.error(err);
  }
}

/* ══════════════════ Tabs (Leaderboard / History) ══════════════════ */
const AL_TAB_PANEL_IDS = { leaderboard: 'tabPanelLeaderboard', history: 'tabPanelHistory' };
function setActiveAlTab(tab) {
  if (!AL_TAB_PANEL_IDS[tab]) tab = 'leaderboard';
  document.querySelectorAll('.al-tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === tab));
  Object.entries(AL_TAB_PANEL_IDS).forEach(([name, id]) => {
    document.getElementById(id).classList.toggle('active', name === tab);
  });
  if (tab === 'history' && !historyState.loaded) {
    historyState.loaded = true;
    initHistoryTab();
  }
}
document.getElementById('alTabs').addEventListener('click', e => {
  const btn = e.target.closest('.al-tab-btn');
  if (btn) setActiveAlTab(btn.dataset.tab);
});

(async function init() {
  document.getElementById('resultsMeta').textContent = 'Loading…';
  populateTypeCombo();
  renderHead();
  populateMobileSortCombo();
  try {
    await Promise.all([populateFilters(), fetchPage(true)]);
  } catch (err) {
    document.getElementById('resultsMeta').textContent = 'Failed to load leaderboard. Please try again shortly.';
    console.error(err);
  }
})();
</script>
