<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Highlights — NHL Breakaway — Hoardio</title>
  <meta name="description" content="Browse every NHL Breakaway highlight — player, set, rarity, editions, and team. Filter by player, set, series, rarity, and team." />
  <link rel="canonical" href="https://www.hoardio.com/nhlbreakaway/highlights" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.hoardio.com/nhlbreakaway/highlights" />
  <meta property="og:title" content="Highlights — NHL Breakaway — Hoardio" />
  <meta property="og:description" content="Browse every NHL Breakaway highlight — player, set, rarity, editions, and team. Filter by player, set, series, rarity, and team." />
  <meta property="og:image" content="https://www.hoardio.com/images/og-nhlbreakaway.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Highlights — NHL Breakaway — Hoardio" />
  <meta name="twitter:description" content="Browse every NHL Breakaway highlight — player, set, rarity, editions, and team. Filter by player, set, series, rarity, and team." />
  <meta name="twitter:image" content="https://www.hoardio.com/images/og-nhlbreakaway.png" />
  <link rel="icon" href="../images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="../images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="../shared/global.css" />
  <style>
    .content { display: flex; flex-direction: column; gap: 1.25rem; }
    .page-header { margin-bottom: 0; }

    /* ── Filter bar ── */
    .filter-bar { display: flex; flex-wrap: wrap; gap: 0.5rem; }
    .filter-bar .cb-combo { min-width: 180px; flex: 1; max-width: 260px; }
    .filter-bar .search-input { min-width: 200px; flex: 1.4; max-width: 320px; }

    /* Mobile-only "Sort by" combo + Asc/Desc toggle — replaces the desktop
       table's clickable column headers, which disappear along with the
       table itself at this width (see .mobile-card-list below). Without
       this, mobile would have no way to change sort order at all. */
    .mobile-sort-bar { display: none; }
    .mobile-sort-bar .cb-combo { max-width: 220px; }

    /* ── Results meta ── */
    .results-meta { font-size: 0.8rem; color: var(--text-secondary); min-height: 1.2em; }
    .results-meta strong { color: var(--text-primary); }

    /* ── Busy overlay — shown while a sort/filter change or Load More is
       in flight. Highlights sorts computed columns server-side, which can
       take several seconds (see dev-server/index.js's handleHighlights
       comments) — without this, clicking a sort/filter looked like nothing
       happened, inviting repeated clicks. Overlaying + disabling the
       controls (see .nhl-busy below) makes the wait visible and blocks
       piling up more requests while one is already running.
       Fixed to the viewport (not absolute over .results-wrap) so it's
       always centered on what's actually visible — .results-wrap can be
       many screens tall, so centering within IT could park the message
       far below the fold. Same z-index/backdrop convention as this site's
       other fixed modals (see global.css). */
    .busy-overlay {
      position: fixed; inset: 0; z-index: 400;
      display: none; align-items: center; justify-content: center;
      background: rgba(0,0,0,0.6);
    }
    .busy-overlay.active { display: flex; }
    .busy-box {
      display: flex; align-items: center; gap: 0.6rem;
      background: var(--bg-card); border: 1px solid var(--border);
      padding: 0.9rem 1.4rem; border-radius: 14px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.5);
      font-size: 0.85rem; font-weight: 600; color: var(--text-primary);
    }
    .busy-spinner {
      width: 16px; height: 16px; border-radius: 50%; flex-shrink: 0;
      border: 2px solid rgba(255,255,255,0.25); border-top-color: var(--accent-light);
      animation: busy-spin 0.7s linear infinite;
    }
    @keyframes busy-spin { to { transform: rotate(360deg); } }
    .nhl-busy .filter-bar, .nhl-busy .mobile-sort-bar { pointer-events: none; opacity: 0.7; }
    .nhl-busy .highlights-table thead th.sortable { pointer-events: none; cursor: not-allowed; }

    /* ── Highlights table ── */
    .highlights-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .highlights-table thead th {
      text-align: left; padding: 8px 12px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-secondary); background: var(--bg-card);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .highlights-table thead th.col-r { text-align: right; }
    .highlights-table thead th.sortable { cursor: pointer; user-select: none; }
    .highlights-table thead th.sortable:hover { color: var(--text-primary); }
    .highlights-table thead th .sort-icon { font-size: 0.6rem; opacity: 0.45; margin-left: 3px; }
    .highlights-table thead th.sorted .sort-icon { opacity: 1; color: var(--accent-light); }
    .highlights-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
    .highlights-table tbody tr:last-child { border-bottom: none; }
    .highlights-table tbody tr:hover { background: rgba(255,255,255,0.04); }
    .highlights-table tbody td { padding: 8px 12px; vertical-align: middle; }
    .highlights-table tbody td.col-r { text-align: right; font-variant-numeric: tabular-nums; }

    .cell-player { font-weight: 600; color: var(--text-primary); text-decoration: none; }
    .cell-player:hover { color: var(--accent-light); text-decoration: underline; }
    .cell-team { display: inline-flex; align-items: center; gap: 0.4rem; }
    .cell-team-logo { height: 1.2rem; width: auto; flex-shrink: 0; }
    .cell-set-name { color: var(--text-primary); }
    .cell-series { font-size: 0.68rem; color: var(--text-secondary); margin-top: 2px; }
    .cell-pct { display: block; font-size: 0.72rem; color: var(--text-secondary); margin-top: 2px; }
    /* Top Holder — count on top, holder name (link when a real username
       exists) underneath, same stacked-line idea as .cell-pct above. */
    .cell-holder-name { display: block; font-size: 0.72rem; color: var(--text-secondary); margin-top: 2px; }
    .holder-link { color: var(--accent-light); text-decoration: none; }
    .holder-link:hover { text-decoration: underline; }
    /* Uncapped highlight (moments.total_editions IS NULL) — a live, growing
       count, not a fixed total. Styled distinctly so "3" here reads as
       "3 so far" rather than "exactly 3, ever". */
    .editions-growing { color: var(--accent-light); font-weight: 700; cursor: help; }

    /* ── Rarity pills — same exact gradients as sets.html's ── */
    .rarity-pill {
      --rr-border: linear-gradient(rgba(255,255,255,0.35), rgba(255,255,255,0.35));
      --rr-text: linear-gradient(91.27deg, #fff 6.06%, #e7f1f4 47.93%, #fff 87.27%);
      display: inline-flex; align-items: center; line-height: 1;
      font-size: 0.68rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      padding: 4px 10px; border-radius: 999px;
      border: 1px solid transparent;
      background-origin: border-box;
      background-clip: padding-box, border-box;
      background-image: linear-gradient(var(--bg), var(--bg)), var(--rr-border);
    }
    .rarity-pill-text {
      background-image: var(--rr-text);
      -webkit-background-clip: text; background-clip: text;
      color: transparent; -webkit-text-fill-color: transparent;
    }
    .rarity-pill--fandom    { --rr-border: linear-gradient(91deg, #824424, #8a6441 30%, #7b4c2e 90%); --rr-text: linear-gradient(91deg, #d1713e 6.06%, #f3ac6c 47.93%, #d28e62 87.27%); }
    .rarity-pill--rare      { --rr-border: linear-gradient(92deg, #4e7fff, #2f52d6 30%, #4e7fff 90%); --rr-text: linear-gradient(93.83deg, #68aeff -0.71%, #c4dfff 45.06%, #68aeff 99.14%); }
    .rarity-pill--limited   { --rr-border: linear-gradient(91deg, #646464, #303030 30%, #646464 90%); --rr-text: linear-gradient(91.27deg, #a5b4ae 6.06%, #e6edea 31.44%, #bdc2c0 47.51%, #d9d9d9 63.58%, #c5d2ce 87.27%); }
    .rarity-pill--legendary { --rr-border: linear-gradient(92.71deg, #bd8800 -7.25%, #633b00 16.42%, #bd8800 36.23%, #633b00 54.94%, #bd8800 76.96%, #633b00 98.42%); --rr-text: linear-gradient(91.27deg, #ffb800 6.06%, #ffebb8 47.93%, #ffcf55 87.27%); }
    .rarity-pill--epic      { --rr-border: linear-gradient(92deg, #007770, #350da7 10%, #89068b 30%, #350da7 70%, #007770 95%); --rr-text: linear-gradient(99.88deg, #23ffa3 0.36%, #5177ff 24.51%, #f364ff 46.15%, #748aff 71.31%, #28ffcb 96.55%); }
    .rarity-pill--heroic    { --rr-border: linear-gradient(91.94deg, #58009d 3.4%, #2b00ab 27.27%, #58009d 45.16%, #2b00ab 60.73%, #58009d 80.46%, #2b00ab 98.86%); --rr-text: linear-gradient(91.27deg, #7d8aff 6.06%, #b98eff 47.93%, #4176ff 87.27%); }
    .rarity-pill--mythic    { --rr-border: linear-gradient(91.94deg, #ff2600 30%, #e20004 50%, #870005 80%, #e20004 98%, #ff2600); --rr-text: linear-gradient(91.27deg, #ff2600 6.06%, #e20004 47.93%); }

    /* ── Mobile card list — one card per highlight instead of a table row,
       so phone widths never need horizontal scroll. Same "two parallel DOM
       representations, toggled by breakpoint" pattern as sets.html/
       pack-stats.html's own — re-rendered from the same data every time. ── */
    .mobile-card-list { display: none; flex-direction: column; gap: 0.75rem; }
    .mobile-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 0.85rem 1rem;
    }
    /* Bled out to the card's own edges (negative margin matching
       .mobile-card's padding, restored as padding so content position is
       unchanged) so the tint reads as a full-width header band, not just a
       tinted rectangle floating inside the card's padding. Top corners
       rounded to match the card's own radius. */
    .mobile-card-header {
      display: flex; align-items: flex-start; justify-content: space-between;
      gap: 0.75rem;
      margin: -0.85rem -1rem 0.6rem;
      padding: 0.85rem 1rem 0.6rem;
      border-bottom: 1px solid var(--border);
      border-radius: 14px 14px 0 0;
      background: rgba(255,255,255,0.045);
    }
    .mobile-card-stats {
      display: grid; grid-template-columns: 1fr 1fr;
      gap: 0.6rem 1rem;
    }
    .mobile-stat-label {
      display: block; font-size: 0.65rem; font-weight: 700; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-secondary); margin-bottom: 2px;
    }
    .mobile-stat-value { font-variant-numeric: tabular-nums; }

    @media (max-width: 700px) {
      .filter-bar .cb-combo, .filter-bar .search-input { max-width: none; }
      .highlights-table { font-size: 0.78rem; }
      .table-scroll { display: none; }
      .mobile-card-list { display: flex; }
      .mobile-sort-bar { display: flex; }
    }
  </style>
</head>
<body>

<div class="page">
  <div class="content">

    <div class="page-header">
      <div class="page-title">NHL Breakaway <span class="accent">Highlights</span></div>
      <div class="page-subtitle">Every highlight — player, set, rarity, editions, and team.</div>
    </div>

    <div class="filter-bar">
      <input type="text" class="search-input" id="playerSearch" placeholder="Search player name" autocomplete="off" spellcheck="false">
      <div class="cb-combo" id="setCombo">
        <input type="text" class="cb-combo-input" id="setComboInput" autocomplete="off" spellcheck="false">
        <button type="button" class="cb-combo-clear" id="setComboClear" style="display:none" title="Clear">✕</button>
        <div class="cb-panel" id="setPanel"></div>
      </div>
      <div class="cb-combo" id="rarityCombo">
        <input type="text" class="cb-combo-input" id="rarityComboInput" autocomplete="off" spellcheck="false">
        <button type="button" class="cb-combo-clear" id="rarityComboClear" style="display:none" title="Clear">✕</button>
        <div class="cb-panel" id="rarityPanel"></div>
      </div>
      <div class="cb-combo" id="seriesCombo">
        <input type="text" class="cb-combo-input" id="seriesComboInput" autocomplete="off" spellcheck="false">
        <button type="button" class="cb-combo-clear" id="seriesComboClear" style="display:none" title="Clear">✕</button>
        <div class="cb-panel" id="seriesPanel"></div>
      </div>
      <div class="cb-combo" id="teamCombo">
        <input type="text" class="cb-combo-input" id="teamComboInput" autocomplete="off" spellcheck="false">
        <button type="button" class="cb-combo-clear" id="teamComboClear" style="display:none" title="Clear">✕</button>
        <div class="cb-panel" id="teamPanel"></div>
      </div>
    </div>

    <div class="filter-bar mobile-sort-bar" id="mobileSortBar">
      <div class="cb-combo" id="sortFieldCombo">
        <input type="text" class="cb-combo-input" id="sortFieldComboInput" autocomplete="off" spellcheck="false" readonly>
        <div class="cb-panel" id="sortFieldPanel"></div>
      </div>
      <div class="tpc-toggle-group" id="sortDirToggle">
        <button type="button" class="tpc-toggle-btn" data-dir="asc">↑ Asc</button>
        <button type="button" class="tpc-toggle-btn" data-dir="desc">↓ Desc</button>
      </div>
    </div>

    <div class="results-meta" id="resultsMeta"></div>

    <div class="results-wrap" id="resultsWrap">
      <div class="busy-overlay" id="busyOverlay"><div class="busy-box"><span class="busy-spinner"></span><span>Loading highlights…</span></div></div>
      <div class="table-scroll" style="overflow-x:auto;">
        <table class="highlights-table">
          <thead>
            <tr id="highlightsHeadRow"></tr>
          </thead>
          <tbody id="highlightsBody"></tbody>
        </table>
      </div>
      <div class="mobile-card-list" id="highlightsMobileList"></div>
    </div>

    <div id="loadMoreWrap" style="display:none; text-align:center; padding:1rem 0;">
      <button type="button" id="loadMoreBtn" class="load-more-btn">Load more</button>
    </div>

  </div>
</div>

<script src="api-base.js"></script>
<script src="rarity-order.js"></script>
<script>
'use strict';

// See api-base.js (loaded above) for the localhost-vs-production URL logic.
const API_BASE = window.NHL_API_BASE;
const PAGE_SIZE = 100;

// The backend caches its cacheable endpoints effectively forever, keyed on
// this version string (see nhlbreakaway/dev-server/index.js's
// VERSIONED_CACHE_SECONDS comment for the full reasoning) — appending it to
// every cacheable fetch is what makes that cache actually invalidate the
// moment new data lands, with no fixed TTL to guess at. Resolved once
// (shares nav.js's own sessionStorage cache/key, so whichever of the two
// runs first on a given page load is the only one that actually hits the
// network) and reused for every fetch on this page — filter changes, Load
// More, etc., not just the first one.
const DATA_VERSION_CACHE_KEY = 'nhlbreakaway_data_last_updated';
const DATA_VERSION_CACHE_TTL_MS = 60 * 1000;
let _dataVersionPromise = null;
function getDataVersion() {
  if (_dataVersionPromise) return _dataVersionPromise;
  _dataVersionPromise = (async () => {
    try {
      const cached = sessionStorage.getItem(DATA_VERSION_CACHE_KEY);
      if (cached) {
        const { value, cachedAt } = JSON.parse(cached);
        if (Date.now() - cachedAt < DATA_VERSION_CACHE_TTL_MS) return value;
      }
    } catch {}
    try {
      const res = await fetch(`${API_BASE}/api/site-meta`);
      const { data_last_updated } = await res.json();
      if (data_last_updated) {
        try { sessionStorage.setItem(DATA_VERSION_CACHE_KEY, JSON.stringify({ value: data_last_updated, cachedAt: Date.now() })); } catch {}
      }
      return data_last_updated || '';
    } catch {
      return '';
    }
  })();
  return _dataVersionPromise;
}
// Appends the cache-busting version param, respecting whether `url` already
// has a query string. No-op (returns url unchanged) if the version couldn't
// be resolved — worst case that one request just isn't optimally cached,
// never a broken request.
function withVersion(url, version) {
  return version ? url + (url.includes('?') ? '&' : '?') + 'v=' + encodeURIComponent(version) : url;
}

const COLUMNS = [
  { key: 'player',   label: 'Player',   sortable: true },
  { key: 'set',      label: 'Set',      sortable: true },
  { key: 'rarity',   label: 'Rarity',   sortable: true },
  { key: 'editions', label: 'Editions', sortable: true, num: true },
  { key: 'holders',  label: 'Holders',  sortable: true, num: true },
  { key: 'in_packs', label: 'In Packs', sortable: true, num: true },
  { key: 'top_holder', label: 'Top Holder', sortable: true, num: true },
  { key: 'team',     label: 'Team',     sortable: true },
];

const state = {
  highlights: [],
  player: '',
  // The "Set" dropdown filters by set_name — deduplicated by name, not
  // set_uuid, since a themed set gives each rarity its own set_uuid (see
  // handleHighlightsFilters' dedup comment in dev-server/index.js).
  set_name: '',
  // Deep-link filter from the Sets page's "collection_key" column (query
  // param `set`, kept as its own state field distinct from the Set dropdown
  // above, since they're independent filter mechanisms).
  collection_key: '',
  series_label: '',
  rarity: '',
  team: '',
  sortField: 'player',
  sortDir: 'asc',
  offset: 0,
  hasMore: false,
  // Real count of highlights matching the current filters, from the
  // backend's `total` field — NOT state.highlights.length, which is just
  // however many rows happen to be loaded so far (always PAGE_SIZE on a
  // first load, regardless of how many actually match).
  total: 0,
  busy: false,
  autoLoadArmed: false,
};

function buildQuery(extra) {
  const params = new URLSearchParams();
  if (state.player) params.set('player', state.player);
  if (state.set_name) params.set('set_name', state.set_name);
  if (state.collection_key) params.set('set', state.collection_key);
  if (state.series_label) params.set('series_label', state.series_label);
  if (state.rarity) params.set('rarity', state.rarity);
  if (state.team) params.set('team', state.team);
  params.set('sort', state.sortField);
  params.set('dir', state.sortDir);
  params.set('limit', PAGE_SIZE);
  params.set('offset', state.offset);
  return params;
}

// ── View-state in the URL, so a "Back to Highlights" link from the Holders
// page (which captures document.referrer — see holders.html) round-trips
// back to the exact filters/sort/loaded-count the user had, instead of a
// reset list. Only non-default values are written, to keep bare URLs clean.
function syncUrl() {
  const params = buildQuery();
  // buildQuery()'s limit is a fetch-only concern, not part of the persisted
  // view state — the restored offset is what matters for "how much was loaded".
  params.delete('limit');
  // A single default page load already leaves state.offset === PAGE_SIZE —
  // only persist it once MORE than that has been loaded (a real "Load more"
  // click/scroll happened), or a bare/default visit would immediately pick
  // up a stray ?offset=100 the moment its first chunk finishes loading.
  if (state.offset <= PAGE_SIZE) params.delete('offset');
  if (state.sortField === 'player') params.delete('sort');
  if (state.sortDir === 'asc') params.delete('dir');
  const qs = params.toString();
  history.replaceState(null, '', qs ? `${location.pathname}?${qs}` : location.pathname);
}

function paramsToState(sp) {
  state.player = sp.get('player') || '';
  state.set_name = sp.get('set_name') || '';
  state.collection_key = sp.get('set') || '';
  state.series_label = sp.get('series_label') || '';
  state.rarity = sp.get('rarity') || '';
  state.team = sp.get('team') || '';
  state.sortField = sp.get('sort') || 'player';
  state.sortDir = sp.get('dir') || 'asc';
  return parseInt(sp.get('offset'), 10) || 0;
}

// Toggles the busy overlay + disables the filter bar/mobile sort bar/sortable
// headers (see .nhl-busy in the <style> above) — sorting a computed column
// here is a real multi-second server-side query, not instant client-side
// re-sorting like sets.html/pack-stats.html, so without this a slow sort
// looked like nothing happened and invited a pile of repeat clicks.
function setBusyUi(active) {
  document.body.classList.toggle('nhl-busy', active);
  document.getElementById('busyOverlay').classList.toggle('active', active);
}

// Fetches exactly one PAGE_SIZE chunk starting at the current state.offset
// and appends it. Returns how many rows came back (0 on error/no more).
async function loadChunk() {
  if (state.busy) return 0;
  state.busy = true;
  renderLoadMore();
  setBusyUi(true);
  let got = 0;
  try {
    const version = await getDataVersion();
    const res = await fetch(withVersion(`${API_BASE}/api/highlights?${buildQuery()}`, version));
    const data = await res.json();
    state.highlights = [...state.highlights, ...data.highlights];
    state.hasMore = data.has_more;
    state.total = data.total;
    state.offset += data.highlights.length;
    got = data.highlights.length;
    renderBody();
    syncUrl();
  } catch (err) {
    document.getElementById('resultsMeta').textContent = 'Failed to load highlights. Please try again shortly.';
    console.error(err);
  } finally {
    state.busy = false;
    renderLoadMore();
    setBusyUi(false);
  }
  return got;
}

async function fetchPage(reset) {
  if (reset) { state.offset = 0; state.highlights = []; state.autoLoadArmed = false; }
  await loadChunk();
}

// Used only on init, to reload however many rows were loaded before the user
// left (via a URL that came from syncUrl() above) — loops one PAGE_SIZE chunk
// at a time rather than assuming a bigger single fetch, since the backend
// clamps limit at 200.
async function restoreChunks(targetOffset) {
  state.offset = 0; state.highlights = []; state.autoLoadArmed = false;
  let got;
  do {
    got = await loadChunk();
  } while (got > 0 && state.hasMore && state.offset < targetOffset);
}

// Shared by the desktop header-click handler and the mobile "Sort by" combo
// (see populateSortFieldCombo below) — picking a new field this way always
// jumps straight to its "best first" direction, matching whichever way
// makes the column read naturally (player/set/rarity/team alphabetical;
// every numeric column highest-first).
function defaultDirForField(field) {
  return (field === 'editions' || field === 'holders' || field === 'in_packs' || field === 'top_holder') ? 'desc' : 'asc';
}

function renderHead() {
  const row = document.getElementById('highlightsHeadRow');
  row.innerHTML = COLUMNS.map(col => {
    if (!col.sortable) return `<th${col.num ? ' class="col-r"' : ''}>${col.label}</th>`;
    const sorted = state.sortField === col.key;
    const icon = sorted ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';
    return `<th class="sortable${col.num ? ' col-r' : ''}${sorted ? ' sorted' : ''}" data-field="${col.key}">${col.label} <span class="sort-icon">${icon}</span></th>`;
  }).join('');
  row.querySelectorAll('th.sortable').forEach(th => {
    th.addEventListener('click', () => {
      const field = th.dataset.field;
      if (state.sortField === field) {
        state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
      } else {
        state.sortField = field;
        state.sortDir = defaultDirForField(field);
      }
      renderHead();
      syncMobileSortControls();
      fetchPage(true);
    });
  });
}

function fmtNum(n) {
  return n === null || n === undefined ? '—' : n.toLocaleString();
}
function fmtPct(p) {
  return p === null || p === undefined ? '' : `${p.toFixed(2)}%`;
}

// Shortens a raw wallet address for display in this dense list — a real
// Sweet username passes through unchanged (only a 0x... address matches).
// Same convention as wallet.html's own prettyWallet(); the full address
// still belongs in a title attribute wherever this is used, for
// verification. Doesn't apply anywhere else on the site showing a single
// wallet identity — only dense multi-row lists like this one.
function prettyWallet(val) {
  if (!val) return val;
  return /^0x[0-9a-fA-F]{40}$/.test(val) ? `${val.slice(0, 6)}…${val.slice(-4)}` : val;
}

// Links a Top Holder to their official nhlbreakaway.com profile, pre-filtered
// to this exact highlight — same URL shape as holders.html's own
// nhlBreakawayUserUrl(). Only valid for a real Sweet username (the backend's
// separate top_holder_username field, not top_holder's own owner_name/wallet
// fallback) — those aren't real usernames on nhlbreakaway.com.
function nhlBreakawayUserUrl(username, h) {
  if (!username) return null;
  const params = new URLSearchParams({
    sort: 'newest',
    set: h.set_name || '',
    q: h.player || '',
    series: h.series_label || '',
  });
  return `https://nhlbreakaway.com/user/${encodeURIComponent(username)}?${params}`;
}

// Top Holder cell content, shared by the desktop table and mobile card —
// a real username links out; otherwise the raw wallet address falls back to
// prettyWallet() so a dense list of these doesn't blow out the row/card width.
function topHolderHtml(h) {
  if (!h.top_holder) return '—';
  const url = nhlBreakawayUserUrl(h.top_holder_username, h);
  const name = url
    ? `<a class="holder-link" href="${url}" target="_blank" rel="noopener">${h.top_holder}</a>`
    : `<span title="${h.top_holder}">${prettyWallet(h.top_holder)}</span>`;
  return `${fmtNum(h.top_holder_count)}<span class="cell-holder-name">${name}</span>`;
}

function renderBody() {
  const body = document.getElementById('highlightsBody');
  body.innerHTML = state.highlights.map(h => `
    <tr>
      <td><a class="cell-player" href="holders/${encodeURIComponent(h.moment_uuid)}">${h.player || '—'}</a></td>
      <td>
        <div class="cell-set-name">${h.set_name || '—'}</div>
        <div class="cell-series">${h.series_label || ''}</div>
      </td>
      <td>${h.rarity
        ? `<span class="rarity-pill rarity-pill--${h.rarity.toLowerCase()}"><span class="rarity-pill-text">${h.rarity}</span></span>`
        : '—'}</td>
      <td class="col-r">${h.editions_is_growing
        ? `<span class="editions-growing" title="Uncapped — grows every time a collector crafts a new copy">${fmtNum(h.editions)}+</span>`
        : fmtNum(h.editions)}</td>
      <td class="col-r">${fmtNum(h.holders)}</td>
      <td class="col-r">${fmtNum(h.in_packs)}<span class="cell-pct">${fmtPct(h.in_packs_pct)}</span></td>
      <td class="col-r">${topHolderHtml(h)}</td>
      <td>${h.team
        ? `<span class="cell-team">${h.team_logo_url ? `<img class="cell-team-logo" src="${h.team_logo_url}" alt="" loading="lazy">` : ''}${h.team}</span>`
        : '—'}</td>
    </tr>
  `).join('');

  const mobileList = document.getElementById('highlightsMobileList');
  mobileList.innerHTML = state.highlights.map(h => `
    <div class="mobile-card">
      <div class="mobile-card-header">
        <div>
          <a class="cell-player" href="holders/${encodeURIComponent(h.moment_uuid)}">${h.player || '—'}</a>
          <div class="cell-series">${h.set_name || ''}${h.series_label ? ` · ${h.series_label}` : ''}</div>
        </div>
        ${h.rarity
          ? `<span class="rarity-pill rarity-pill--${h.rarity.toLowerCase()}"><span class="rarity-pill-text">${h.rarity}</span></span>`
          : ''}
      </div>
      <div class="mobile-card-stats">
        <div><span class="mobile-stat-label">Editions</span><span class="mobile-stat-value">${h.editions_is_growing
          ? `<span class="editions-growing" title="Uncapped — grows every time a collector crafts a new copy">${fmtNum(h.editions)}+</span>`
          : fmtNum(h.editions)}</span></div>
        <div><span class="mobile-stat-label">Holders</span><span class="mobile-stat-value">${fmtNum(h.holders)}</span></div>
        <div><span class="mobile-stat-label">In Packs</span><span class="mobile-stat-value">${fmtNum(h.in_packs)}<span class="cell-pct">${fmtPct(h.in_packs_pct)}</span></span></div>
        <div><span class="mobile-stat-label">Top Holder</span><span class="mobile-stat-value">${topHolderHtml(h)}</span></div>
        <div><span class="mobile-stat-label">Team</span><span class="mobile-stat-value">${h.team
          ? `<span class="cell-team">${h.team_logo_url ? `<img class="cell-team-logo" src="${h.team_logo_url}" alt="" loading="lazy">` : ''}${h.team}</span>`
          : '—'}</span></div>
      </div>
    </div>
  `).join('');

  document.getElementById('resultsMeta').innerHTML =
    `<strong>${fmtNum(state.total)}</strong> highlight${state.total === 1 ? '' : 's'}`;
}

function renderLoadMore() {
  const wrap = document.getElementById('loadMoreWrap');
  const btn = document.getElementById('loadMoreBtn');
  wrap.style.display = state.hasMore ? 'block' : 'none';
  btn.disabled = state.busy;
  btn.textContent = state.busy ? 'Loading…' : 'Load more';
}

function onLoadMoreClick() {
  state.autoLoadArmed = true;
  fetchPage(false);
}
document.getElementById('loadMoreBtn').addEventListener('click', onLoadMoreClick);

// "Click once to arm" infinite scroll — same pattern as explore.html/inventory.html:
// the first page beyond what's shown needs a manual click, but once armed,
// scrolling the Load More button back into view auto-loads the next chunk.
// A fresh filter/sort disarms it (see fetchPage's reset branch above).
new IntersectionObserver(entries => {
  if (entries[0].isIntersecting && state.autoLoadArmed && !state.busy && state.hasMore) fetchPage(false);
}, { rootMargin: '600px' }).observe(document.getElementById('loadMoreWrap'));

/* ── Player search (debounced) ── */
let _playerT = null;
document.getElementById('playerSearch').addEventListener('input', e => {
  clearTimeout(_playerT);
  _playerT = setTimeout(() => {
    state.player = e.target.value.trim();
    fetchPage(true);
  }, 400);
});

/* ── Shared cb-combo wiring (Set / Rarity / Series / Team) ── */
function closeAllCombos() {
  document.querySelectorAll('.cb-combo').forEach(combo => {
    combo.classList.remove('open');
    combo.querySelector('.cb-panel')?.classList.remove('open');
    if (combo._items) syncComboDisplay(combo);
  });
}
document.addEventListener('mousedown', e => {
  if (!e.target.closest('.cb-combo')) closeAllCombos();
});

function syncComboDisplay(combo) {
  const input = combo.querySelector('.cb-combo-input');
  const clear = combo.querySelector('.cb-combo-clear');
  const allItem = combo._items[0];
  const active = combo._items.find(i => i.value === combo._getValue()) || allItem;
  const hasSelection = active.value !== allItem.value;
  input.placeholder = allItem.label;
  input.value = hasSelection ? active.label : '';
  if (clear) clear.style.display = hasSelection ? '' : 'none';
  combo.classList.toggle('has-selection', hasSelection);
}

// onPick defaults to a server refetch (every existing Set/Rarity/Series/Team
// filter combo's own behavior on this page, unchanged) — the mobile "Sort
// by" combo (see populateSortFieldCombo below) is the one exception, needing
// extra side effects (re-render the header, re-sync the direction toggle)
// around that same refetch. It also has no clear (✕) button in its markup —
// there's no "no sort" state, unlike every other filter here — so both this
// and syncComboDisplay above null-guard that lookup instead of assuming it
// always exists.
function buildCombo(comboId, items, getValue, setValue, onPick = () => fetchPage(true)) {
  const combo = document.getElementById(comboId);
  const input = combo.querySelector('.cb-combo-input');
  const clear = combo.querySelector('.cb-combo-clear');
  const panel = combo.querySelector('.cb-panel');

  combo._items = items;
  combo._getValue = getValue;
  syncComboDisplay(combo);
  if (combo._wired) return;
  combo._wired = true;

  const pick = val => {
    closeAllCombos();
    setValue(val);
    syncComboDisplay(combo);
    onPick();
  };

  const renderList = filterText => {
    const q = filterText.trim().toLowerCase();
    const options = combo._items.slice(1);
    const filtered = q ? options.filter(i => i.label.toLowerCase().includes(q)) : options;
    panel.innerHTML = filtered.length
      ? filtered.map(i => `<div class="cb-item${i.value === getValue() ? ' active' : ''}" data-val="${i.value}"><span>${i.label}</span></div>`).join('')
      : `<div class="cb-empty">No matches</div>`;
    panel.querySelectorAll('.cb-item').forEach(item => {
      item.addEventListener('click', () => pick(item.dataset.val));
    });
  };

  input.addEventListener('focus', () => {
    closeAllCombos();
    combo.classList.add('open');
    panel.classList.add('open');
    renderList('');
    input.select();
  });
  input.addEventListener('input', () => renderList(input.value));
  input.addEventListener('keydown', e => {
    if (e.key === 'Escape') { e.stopPropagation(); input.blur(); closeAllCombos(); }
    else if (e.key === 'Enter') { e.preventDefault(); panel.querySelector('.cb-item')?.click(); }
  });
  input.addEventListener('blur', () => {
    // Close only THIS combo, not every combo — see matching comment in
    // sets.html / feedback_cbcombo_blur_close_race memory.
    setTimeout(() => {
      if (!combo.contains(document.activeElement)) {
        combo.classList.remove('open');
        panel.classList.remove('open');
        syncComboDisplay(combo);
      }
    }, 150);
  });
  if (clear) {
    clear.addEventListener('mousedown', e => e.preventDefault());
    clear.addEventListener('click', () => { pick(''); input.blur(); });
  }
}

async function populateFilters() {
  const version = await getDataVersion();
  const res = await fetch(withVersion(`${API_BASE}/api/highlights/filters`, version));
  const data = await res.json();

  // Each setValue also clears collection_key — a manual filter pick means
  // the user is now driving the page directly, and the Sets-page deep
  // link's collection_key (a silent, one-shot arrival filter with no
  // visible UI of its own) must not keep combining with it, or picking e.g.
  // a different Set/Rarity while it's still active produces a confusing,
  // over-narrowed intersection of both.
  buildCombo('setCombo',
    [{ value: '', label: 'All sets' }, ...data.sets.map(name => ({ value: name, label: name }))],
    () => state.set_name, v => { state.set_name = v; state.collection_key = ''; });

  buildCombo('rarityCombo',
    [{ value: '', label: 'All rarities' }, ...data.rarities.map(v => ({ value: v, label: v }))],
    () => state.rarity, v => { state.rarity = v; state.collection_key = ''; });

  buildCombo('seriesCombo',
    [{ value: '', label: 'All series' }, ...data.series.map(v => ({ value: v, label: v }))],
    () => state.series_label, v => { state.series_label = v; state.collection_key = ''; });

  buildCombo('teamCombo',
    [{ value: '', label: 'All teams' }, ...data.teams.map(v => ({ value: v, label: v }))],
    () => state.team, v => { state.team = v; state.collection_key = ''; });
}

// Mobile-only "Sort by" combo — buildCombo's own renderList always slice(1)s
// the items array (index 0 is reserved for the "All X" sentinel every other
// combo here uses, never rendered as a clickable row). Sort field has no
// "All" option — it's always exactly one column — so a real (inert,
// empty-value) sentinel still has to go first, or the actual first column
// would silently take over that hidden slot and could never show as the
// active row when the list opens (hit this exact bug once already on
// activity-leaderboard.html's Type combo).
function populateSortFieldCombo() {
  buildCombo('sortFieldCombo',
    [{ value: '', label: '' }, ...COLUMNS.filter(c => c.sortable).map(c => ({ value: c.key, label: c.label }))],
    () => state.sortField,
    v => {
      state.sortField = v;
      state.sortDir = defaultDirForField(v);
    },
    () => { renderHead(); syncMobileSortControls(); fetchPage(true); });
}

function syncMobileSortControls() {
  syncComboDisplay(document.getElementById('sortFieldCombo'));
  document.querySelectorAll('#sortDirToggle .tpc-toggle-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.dir === state.sortDir);
  });
}

document.getElementById('sortDirToggle').addEventListener('click', e => {
  const btn = e.target.closest('.tpc-toggle-btn');
  if (!btn || btn.classList.contains('active')) return;
  state.sortDir = btn.dataset.dir;
  renderHead();
  syncMobileSortControls();
  fetchPage(true);
});

// ── Best-effort scroll restore when actually returning from a Holders page
// (not on a fresh/direct visit — only when document.referrer proves that's
// where the user came from). Paired with holders.html's own back-link,
// which captures this page's full URL (filters/sort/loaded-count) as its
// href, so this and syncUrl() together are what make "browse Highlights,
// drill into several Holders pages, come back each time to the same spot"
// work without any server-side session state.
const SCROLL_KEY = 'nhlbreakaway_highlights_scroll';
window.addEventListener('pagehide', () => {
  try { sessionStorage.setItem(SCROLL_KEY, String(window.scrollY)); } catch {}
});
function restoreScrollIfReturning() {
  try {
    if (!document.referrer) return;
    const ref = new URL(document.referrer);
    if (ref.origin !== location.origin || !/\/holders(\/|$|\.html)/.test(ref.pathname)) return;
    const y = sessionStorage.getItem(SCROLL_KEY);
    if (y !== null) requestAnimationFrame(() => window.scrollTo(0, parseInt(y, 10) || 0));
  } catch {}
}

(async function init() {
  const initialOffset = paramsToState(new URLSearchParams(location.search));
  document.getElementById('playerSearch').value = state.player;
  renderHead();
  populateSortFieldCombo();
  syncMobileSortControls();
  document.getElementById('resultsMeta').textContent = 'Loading…';
  try {
    await Promise.all([populateFilters(), restoreChunks(initialOffset)]);
    restoreScrollIfReturning();
  } catch (err) {
    document.getElementById('resultsMeta').textContent = 'Failed to load highlights. Please try again shortly.';
    console.error(err);
  }
})();
</script>
