<html lang="en">
<head>

  <link rel="canonical" href="https://www.hoardio.com/funko/market-overview.html" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.hoardio.com/funko/market-overview.html" />
  <meta property="og:title" content="Market Overview — Funko Digital — Hoardio" />
  <meta property="og:description" content="Browse current WAX marketplace prices for all Funko Digital Pop! cards and sets." />
  <meta property="og:image" content="https://www.hoardio.com/images/og-banner.png" />

  <meta name="twitter:title" content="Market Overview — Funko Digital — Hoardio" />
  <meta name="twitter:description" content="Browse current WAX marketplace prices for all Funko Digital Pop! cards and sets." />
  <meta name="twitter:image" content="https://www.hoardio.com/images/og-banner.png" />
  <link rel="icon" href="../images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="../images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="../shared/global.css" />
  <style>
    .content { display: flex; flex-direction: column; gap: 1.25rem; }
    .page-header { margin-bottom: 0; }

    /* ── Rarity tab bar ── */
    .rarity-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }
    .rarity-tab {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      padding: 4px 11px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      transition: opacity 0.15s, background 0.15s, border-color 0.15s;
      user-select: none;
    }
    .rarity-tab:not(.active) { opacity: 0.42; }
    .rarity-tab:not(.active):hover { opacity: 0.75; }
    .rarity-tab.active { opacity: 1; }
    .tab-all {
      color: var(--text-secondary);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
    }
    .tab-all.active {
      color: var(--text-primary);
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.12);
    }
    .tab-royalty-set {
      color: #007deb;
      border-color: rgba(0,125,235,0.35);
      background: rgba(0,125,235,0.08);
    }
    .tab-royalty-set.active {
      background: rgba(0,125,235,0.22);
      border-color: rgba(0,125,235,0.7);
    }
    .tab-mastery-set {
      color: #e93494;
      border-color: rgba(233,52,148,0.35);
      background: rgba(233,52,148,0.08);
    }
    .tab-mastery-set.active {
      background: rgba(233,52,148,0.22);
      border-color: rgba(233,52,148,0.7);
    }
    .tab-sep {
      width: 1px; height: 18px;
      background: var(--border);
      margin: 0 3px;
      flex-shrink: 0;
    }

    /* ── Filter bar ── */
    .filter-bar { display: flex; flex-direction: column; gap: 0.6rem; }
    .filter-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .filter-row .filter-select { min-width: 180px; flex: 1; max-width: 320px; }
    .filter-row .name-search   { min-width: 160px; flex: 1; max-width: 260px; }
    .supply-filter { display: flex; align-items: center; gap: 0.3rem; flex-shrink: 0; }
    .supply-label  { font-size: 0.72rem; font-weight: 600; color: var(--text-secondary); white-space: nowrap; }
    .supply-input  { width: 82px; }
    .listing-filter { display: flex; gap: 0.25rem; flex-shrink: 0; }
    .listing-filter-btn {
      font-size: 0.72rem; font-weight: 600; padding: 3px 11px; border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.04);
      color: var(--text-secondary); cursor: pointer; transition: all 0.15s; user-select: none;
    }
    .listing-filter-btn:hover { opacity: 0.8; }
    .listing-filter-btn.active {
      background: rgba(255,255,255,0.12); border-color: rgba(255,255,255,0.35);
      color: var(--text-primary);
    }
    .supply-sep    { color: var(--text-secondary); font-size: 0.85rem; }

    /* ── Results meta ── */
    .results-meta {
      font-size: 0.8rem;
      color: var(--text-secondary);
      min-height: 1.2em;
    }
    .results-meta strong { color: var(--text-primary); }
    .results-meta .updated { color: var(--accent-light); font-weight: 600; }

    /* ── Market table ── */
    .market-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .market-table thead th {
      text-align: left; padding: 8px 12px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-secondary); background: var(--bg-card);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .market-table thead th.col-r { text-align: right; }
    .market-table thead th.col-c { text-align: center; }
    .market-table thead th.sortable { cursor: pointer; user-select: none; }
    .market-table thead th.sortable:hover { color: var(--text-primary); }
    .market-table thead th .sort-icon { font-size: 0.6rem; opacity: 0.45; margin-left: 3px; }
    .market-table thead th.sorted .sort-icon { opacity: 1; color: var(--accent-light); }
    .market-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
    .market-table tbody tr:last-child { border-bottom: none; }
    .market-table tbody tr:hover { background: rgba(255,255,255,0.04); }
    .market-table tbody td { padding: 8px 12px; vertical-align: middle; }
    .market-table tbody td.col-r { text-align: right; font-variant-numeric: tabular-nums; }
    .market-table tbody td.col-c { text-align: center; }

    /* ── Table cell content ── */
    .cell-drop-name { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
    .cell-drop-schema { font-size: 0.62rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
    .cell-card-name { font-size: 0.85rem; color: var(--text-primary); }
    .cell-card-id { font-size: 0.68rem; color: var(--text-secondary); margin-top: 2px; }
    .cell-supply { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; }
    .cell-price { display: block; font-size: 0.88rem; font-weight: 700; color: var(--text-primary); white-space: nowrap; }
    .cell-price.price-null { color: rgba(255,255,255,0.2); font-weight: 400; font-size: 0.82rem; }
    .cell-price-usd { font-size: 0.78rem; color: var(--text-secondary); white-space: nowrap; margin-top: 2px; }
    .cell-priced { font-size: 0.8rem; white-space: nowrap; }
    .cell-priced.priced-all     { color: var(--text-primary); font-weight: 600; }
    .cell-priced.priced-partial { color: var(--accent-light); }
    .cell-priced.priced-none    { color: rgba(255,255,255,0.2); }

    .template-link {
      font-size: 0.65rem; font-weight: 600; letter-spacing: 0.03em;
      color: var(--text-secondary); text-decoration: none;
      border: 1px solid var(--border); border-radius: 999px;
      padding: 2px 8px; white-space: nowrap;
      opacity: 0.55; transition: opacity 0.15s, color 0.15s, border-color 0.15s;
    }
    .template-link:hover { opacity: 1; color: var(--accent-light); border-color: rgba(240,168,64,0.4); }

    .excl-badge {
      display: inline-flex; align-items: center;
      font-size: 0.58rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--accent-light); border: 1px solid rgba(240,168,64,0.3);
      background: rgba(240,168,64,0.08); border-radius: 4px;
      padding: 1px 4px; margin-left: 5px; vertical-align: middle; line-height: 1.4;
    }

    /* ── Marketplace link icons ── */
    .market-links { display: flex; align-items: center; gap: 1rem; justify-content: flex-end; }
    .market-link { display: flex; align-items: center; opacity: 0.4; transition: opacity 0.15s; text-decoration: none; }
    .market-link:hover { opacity: 1; }
    .market-link img { width: 20px; height: 20px; object-fit: contain; }
    .market-link--primary { display: inline-flex; align-items: center; gap: 0.4rem; opacity: 1; transition: filter 0.2s; text-decoration: none; }
    .market-link--primary img { width: 24px; height: 24px; filter: invert(1); }
    .market-link--primary:hover { filter: drop-shadow(0 0 6px rgba(240,168,64,0.9)) drop-shadow(0 0 12px rgba(240,168,64,0.5)); }
    .buy-label { font-size: 0.82rem; font-weight: 700; color: var(--accent-light); letter-spacing: 0.03em; }

    /* ── Set row drill-through ── */
    .set-row-link { font-size: 0.68rem; opacity: 0; margin-left: 5px; transition: opacity 0.15s; color: var(--accent-light); }
    .market-table tbody tr:hover .set-row-link { opacity: 0.8; }

    /* ── Load more ── */
    .load-more-wrap { text-align: center; padding-top: 0.5rem; }

    @media (max-width: 600px) {
      .filter-row .filter-select,
      .filter-row .name-search { max-width: none; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>

<body>

<div class="page">
  <div class="content">

    <div class="page-header">
      <div class="page-title">Market <span class="accent">Overview</span></div>
      <div class="page-subtitle">Browse current WAX marketplace prices for Funko Digital Pop! cards and sets.</div>
    </div>

    <div class="rarity-tabs" id="rarityTabs"></div>

    <div class="filter-bar">
      <div class="filter-row">
        <select class="filter-select" id="collectionSelect">
          <option value="">All Drops</option>
        </select>
        <input class="name-search search-input" id="nameSearch" type="search" placeholder="Search cards…" autocomplete="off" />
        <div class="supply-filter">
          <span class="supply-label">Supply</span>
          <input class="supply-input search-input" id="supplyMin" type="number" placeholder="Min" min="0" />
          <span class="supply-sep">–</span>
          <input class="supply-input search-input" id="supplyMax" type="number" placeholder="Max" min="0" />
        </div>
      </div>
      <div class="filter-row">
        <span class="supply-label">Listings</span>
        <div class="listing-filter" id="listingFilter">
          <button class="listing-filter-btn" data-lf="all">All</button>
          <button class="listing-filter-btn active" data-lf="listed">Listed</button>
          <button class="listing-filter-btn" data-lf="not_listed">Not Listed</button>
        </div>
      </div>
      <div class="filter-row" id="packFilterRow" style="display:none">
        <span class="supply-label">Openable</span>
        <div class="listing-filter" id="packFilter">
          <button class="listing-filter-btn active" data-pf="all">All</button>
          <button class="listing-filter-btn" data-pf="openable">Openable Only</button>
        </div>
      </div>
    </div>

    <div class="results-meta" id="resultsMeta"></div>

    <div class="table-wrap" id="tableContainer">
      <div class="status-wrap"><div class="spinner"></div><div class="status-text">Loading…</div></div>
    </div>

    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="show-more-btn" id="loadMoreBtn">Load More</button>
    </div>

  </div>
</div>

<script src="../shared/supabase-config.js"></script>
<script src="nav.js"></script>
<script>
/* ── Constants ── */
const RARITY_ORDER = [
  'Common','Uncommon','Rare','Epic',
  'Ultra','Legendary','Grail','Mythic','Royalty','Series','1 of 1','Redeemable','Packs'
];
const RARITY_CLASS = {
  'Common':'r-common','Uncommon':'r-uncommon','Rare':'r-rare','Epic':'r-epic',
  'Series':'r-series','Ultra':'r-ultra','Legendary':'r-legendary','Grail':'r-grail',
  'Mythic':'r-mythic','Royalty':'r-royalty','1 of 1':'r-1of1','Redeemable':'r-redeemable',
  'Packs':'r-pack'
};
const LIMIT = 100;

/* Packs that can still be opened on WAX — hardcoded template IDs */
const OPENABLE_PACK_TEMPLATE_IDS = new Set([
  '237610','262834','237606','238045','261936','261937','295134','295135'
]);
const ATOMIC_MARKET = 'https://wax.atomichub.io/market';

/* ── State ── */
const state = {
  rarity:      'All',
  collection:  '',   // 'collection_name|schema_name'
  name:        '',
  source:      'wax',
  sortField:    'price',  // 'price' | 'id'
  sortDir:      'asc',
  setSortField: 'drop',   // 'drop' | 'price'
  setSortDir:   'asc',
  offset:      0,
  supplyMin:      '',
  supplyMax:      '',
  listingFilter:  'listed',
  packFilter:     'all',
};

let allSetPrices  = [];
let allCards      = [];
let tableRows     = [];
let isLoading     = false;
let canLoadMore   = false;
let fetchedAt     = null;
let nameTimer     = null;
let supplyTimer   = null;
let waxUsdRate    = null;

/* ── Helpers ── */
function enc(v)    { return encodeURIComponent(v); }
function fmtN(n)   { return Number(n).toLocaleString(); }
function fmtUsd(v) { return v == null ? null : '$' + Number(v).toFixed(2); }

function fmtWax(wax) {
  if (wax == null) return null;
  if (wax < 1) return wax.toFixed(4) + ' WAX';
  return wax.toFixed(2) + ' WAX';
}

async function fetchWaxRate() {
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=wax&vs_currencies=usd');
    if (!r.ok) return;
    const j = await r.json();
    waxUsdRate = j?.wax?.usd ?? null;
  } catch { /* non-fatal */ }
}

function buildPriceCell(row) {
  const wax = row.wax_price_wax;
  const usd = row.wax_price_usd;
  if (wax == null && usd == null) return '<span class="cell-price price-null">—</span>';
  if (wax != null) {
    const sub = usd != null ? `<div class="cell-price-usd">≈ $${usd.toFixed(2)}</div>` : '';
    return `<span class="cell-price">${fmtWax(wax)}</span>${sub}`;
  }
  return `<span class="cell-price">$${usd.toFixed(2)}</span>`;
}

function fmtAgo(ts) {
  if (!ts) return '';
  const d = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (d < 1)   return 'just now';
  if (d < 60)  return d + 'm ago';
  if (d < 1440) return Math.floor(d / 60) + 'h ago';
  return Math.floor(d / 1440) + 'd ago';
}

function schemaLabel(sn) {
  const b = (sn || '').replace('.drop', '');
  const m = b.match(/^series(\d+)$/);
  return m ? 'Series ' + m[1] : b.charAt(0).toUpperCase() + b.slice(1);
}

function isSetMode() {
  return state.rarity === 'Royalty Set' || state.rarity === 'Mastery Set';
}

function priceCol() {
  if (!isSetMode()) return 'wax_price_usd';
  const p = state.rarity === 'Royalty Set' ? 'royalty' : 'mastery';
  return p + '_wax_usd';
}

function pricedCols(row) {
  const p = state.rarity === 'Royalty Set' ? 'royalty' : 'mastery';
  return {
    priced: row[p + '_wax_priced'] ?? 0,
    count:  row[p + '_card_count'] ?? 0,
  };
}

function effectivePrice(row) {
  const v = row[priceCol()];
  return (v != null && v > 0) ? v : null;
}

function priceLabel() {
  return 'WAX';
}

/* ── Supabase fetch ── */
async function sbFetch(table, qs) {
  const url = SUPABASE_URL + '/rest/v1/' + table + (qs ? '?' + qs : '');
  const r = await fetch(url, {
    headers: {
      'apikey':          SUPABASE_ANON_KEY,
      'Authorization':   'Bearer ' + SUPABASE_ANON_KEY,
      'Accept-Profile':  'funko',
      'Prefer':          'count=exact',
    }
  });
  if (!r.ok) throw new Error('Supabase ' + r.status + ' on ' + table);
  const range = r.headers.get('Content-Range');
  const total = range ? (range.match(/\/(\d+)/) || [])[1] : null;
  return { data: await r.json(), total: total ? parseInt(total) : null };
}

async function sbFetchAll(table, qs) {
  const out = [];
  let offset = 0;
  while (true) {
    const url = SUPABASE_URL + '/rest/v1/' + table + '?' + qs + '&limit=1000&offset=' + offset;
    const r = await fetch(url, {
      headers: {
        'apikey':         SUPABASE_ANON_KEY,
        'Authorization':  'Bearer ' + SUPABASE_ANON_KEY,
        'Accept-Profile': 'funko',
      }
    });
    if (!r.ok) throw new Error('Supabase ' + r.status + ' on ' + table);
    const page = await r.json();
    out.push(...page);
    if (page.length < 1000) break;
    offset += 1000;
  }
  return out;
}

/* ── Rarity tabs ── */
function buildRarityTabs() {
  const el = document.getElementById('rarityTabs');
  const cur = state.rarity;
  let h = `<span class="rarity-tab tab-all${cur==='All'?' active':''}" data-rarity="All">All</span>`;
  for (const r of RARITY_ORDER) {
    h += `<span class="rarity-tab ${RARITY_CLASS[r]||''}${cur===r?' active':''}" data-rarity="${r}">${r}</span>`;
  }
  h += '<span class="tab-sep"></span>';
  h += `<span class="rarity-tab tab-royalty-set${cur==='Royalty Set'?' active':''}" data-rarity="Royalty Set">Royalty Set</span>`;
  h += `<span class="rarity-tab tab-mastery-set${cur==='Mastery Set'?' active':''}" data-rarity="Mastery Set">Mastery Set</span>`;
  el.innerHTML = h;
  el.querySelectorAll('.rarity-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      if (tab.dataset.rarity === state.rarity) return;
      state.rarity = tab.dataset.rarity;
      state.offset = 0;
      tableRows = [];
      const packRow = document.getElementById('packFilterRow');
      if (state.rarity === 'Packs') {
        packRow.style.display = '';
      } else {
        packRow.style.display = 'none';
        state.packFilter = 'all';
        document.querySelectorAll('#packFilter .listing-filter-btn').forEach(b => b.classList.toggle('active', b.dataset.pf === 'all'));
      }
      const ns = document.getElementById('nameSearch');
      ns.disabled      = isSetMode();
      ns.style.opacity = isSetMode() ? '0.4' : '';
      ['supplyMin', 'supplyMax'].forEach(id => {
        const el = document.getElementById(id);
        el.disabled      = isSetMode();
        el.style.opacity = isSetMode() ? '0.4' : '';
      });
      buildRarityTabs();
      loadData();
    });
  });
}

/* ── Collection dropdown ── */
function cleanName(name) {
  return (name || '')
    .replace(/^Funko Presents\s+/i, '')
    .replace(/:\s*Funko Digital Pop!$/i, '')
    .replace(/\s+X\s+Funko$/i, '')
    .replace(/:\s*Funko Digital$/i, '')
    .replace(/\s+x\s+Funko Digital Pop!$/i, '');
}

function populateCollections(rows) {
  const sel = document.getElementById('collectionSelect');
  const sorted = [...rows]
    .map(d => ({ ...d, _name: cleanName(d.drop_displayname || d.collection_name) }))
    .sort((a, b) => a._name.localeCompare(b._name) || a.schema_name.localeCompare(b.schema_name));
  let h = '<option value="">All Drops</option>';
  for (const d of sorted) {
    const v = d.collection_name + '|' + d.schema_name;
    h += `<option value="${v}">${d._name}  —  ${schemaLabel(d.schema_name)}</option>`;
  }
  sel.innerHTML = h;
  if (state.collection) sel.value = state.collection;
}

/* ── Card table (funko_market_prices) ── */
function buildCardTable(rows, append) {
  const wrap = document.getElementById('tableContainer');

  if (!append && rows.length === 0) {
    wrap.innerHTML = '<div class="no-results">No cards found matching your filters.</div>';
    return;
  }
  if (append && rows.length === 0) return;

  const pc    = priceCol();
  const pl    = priceLabel();
  const idSi     = state.sortField === 'id'     ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';
  const supplySi = state.sortField === 'supply' ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';
  const priceSi  = state.sortField === 'price'  ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';

  if (!append) {
    wrap.innerHTML = `<table class="market-table">
      <thead><tr>
        <th class="sortable${state.sortField==='id'?' sorted':''}" style="min-width:200px" id="idHdr">
          ID — Card <span class="sort-icon">${idSi}</span>
        </th>
        <th style="min-width:150px">Drop</th>
        <th class="col-r sortable${state.sortField==='supply'?' sorted':''}" style="width:100px" id="supplyHdr">
          Supply <span class="sort-icon">${supplySi}</span>
        </th>
        <th class="col-r sortable${state.sortField==='price'?' sorted':''}" style="width:120px" id="priceHdr">
          Floor Price <span class="sort-icon">${priceSi}</span>
        </th>
        <th class="col-r" style="width:140px">Market</th>
      </tr></thead>
      <tbody id="cardTbody"></tbody>
    </table>`;
    wrap.querySelector('#idHdr').addEventListener('click',     () => toggleSort('id'));
    wrap.querySelector('#supplyHdr').addEventListener('click', () => toggleSort('supply'));
    wrap.querySelector('#priceHdr').addEventListener('click',  () => toggleSort('price'));
  }

  const tbody = document.getElementById('cardTbody');
  if (!tbody) return;

  let h = '';
  for (const row of rows) {
    const ph = buildPriceCell(row);

    const excl = row.droppp_exclusive
      ? '<span class="excl-badge">Excl</span>'
      : '';

    const tid = row.template_id;
    const col = row.collection_name;
    const sch = row.schema_name;

    const linksHtml = `<a class="market-link market-link--primary" href="../marketplace.html?template_id=${enc(tid)}" target="_blank" rel="noopener noreferrer" title="Buy on Hoardio"><img src="../images/Hoardio_fav.png" alt="Hoardio"><span class="buy-label">Buy</span></a>`;

    const circ = row.in_circulation;
    const issued = row.issued_supply;
    const displayNum = circ ?? issued;
    const showOf = issued != null && (issued === 1 || (circ != null && circ < issued));
    const supplyHtml = displayNum != null
      ? `<div class="cell-supply" style="color:var(--text-primary);font-weight:600;font-size:0.85rem">${fmtN(displayNum)}</div>` +
        (showOf ? `<div class="cell-supply">of ${fmtN(issued)}</div>` : '')
      : '<span style="color:rgba(255,255,255,0.2);font-size:0.82rem">—</span>';

    h += `<tr>
      <td>
        <div class="cell-card-name">${row.cardid != null ? row.cardid + ' — ' : ''}${row.name||'—'}</div>
        <div style="margin-top:3px;display:flex;align-items:center;justify-content:space-between;gap:0.5rem">
          <span class="rarity-pill ${RARITY_CLASS[row.rarity]||''}">${row.rarity||'—'}</span>
          <a class="template-link" href="https://wax.atomichub.io/explorer/template/wax-mainnet/${enc(row.template_id)}" target="_blank" rel="noopener noreferrer">View template #${row.template_id}</a>
        </div>
      </td>
      <td>
        <div class="cell-drop-name">${cleanName(row.drop_displayname||row.collection_name)}${excl}</div>
        <div class="cell-drop-schema">${schemaLabel(row.schema_name)}</div>
      </td>
      <td class="col-r">${supplyHtml}</td>
      <td class="col-r">${ph}</td>
      <td class="col-r"><div class="market-links">${linksHtml}</div></td>
    </tr>`;
  }
  tbody.insertAdjacentHTML('beforeend', h);
}

/* ── Set table (funko_set_prices) ── */
function buildSetTable(rows) {
  const wrap = document.getElementById('tableContainer');
  if (rows.length === 0) {
    wrap.innerHTML = '<div class="no-results">No drops found matching your filters.</div>';
    return;
  }

  const isRoyalty = state.rarity === 'Royalty Set';
  const pc     = priceCol();
  const pl     = priceLabel();
  const setLbl = isRoyalty ? 'Royalty Set' : 'Mastery Set';

  const dropSi  = state.setSortField === 'drop'  ? (state.setSortDir === 'asc' ? '↑' : '↓') : '↕';
  const priceSi = state.setSortField === 'price' ? (state.setSortDir === 'asc' ? '↑' : '↓') : '↕';

  const sorted = [...rows].sort((a, b) => {
    if (state.setSortField === 'price') {
      const pa = a[pc], pb = b[pc];
      if (pa == null && pb == null) return 0;
      if (pa == null) return 1;
      if (pb == null) return -1;
      return state.setSortDir === 'asc' ? pa - pb : pb - pa;
    }
    const cmp = (a.drop_displayname || '').localeCompare(b.drop_displayname || '');
    return state.setSortDir === 'asc' ? cmp : -cmp;
  });

  let h = `<table class="market-table">
    <thead><tr>
      <th class="sortable${state.setSortField==='drop'?' sorted':''}" style="min-width:200px" id="setDropHdr">
        Drop <span class="sort-icon">${dropSi}</span>
      </th>
      <th class="col-c" style="width:120px">Cards Priced</th>
      <th class="col-r sortable${state.setSortField==='price'?' sorted':''}" style="width:140px" id="setPriceHdr">
        Floor Price <span class="sort-icon">${priceSi}</span>
      </th>
    </tr></thead>
    <tbody>`;

  for (const row of sorted) {
    const usdVal = row[pc];
    let ph;
    if (usdVal == null) {
      ph = '<span class="cell-price price-null">—</span>';
    } else if (state.source === 'wax' && waxUsdRate) {
      const wax = usdVal / waxUsdRate;
      ph = `<span class="cell-price">${fmtWax(wax)}</span><div class="cell-price-usd">≈ $${usdVal.toFixed(2)}</div>`;
    } else {
      ph = `<span class="cell-price">$${usdVal.toFixed(2)}</span>`;
    }

    const { priced, count } = pricedCols(row);
    const cls = priced === count ? 'priced-all' : (priced > 0 ? 'priced-partial' : 'priced-none');

    const excl = row.droppp_exclusive ? '<span class="excl-badge">Excl</span>' : '';

    h += `<tr data-col="${row.collection_name}" data-sch="${row.schema_name}" style="cursor:pointer">
      <td>
        <div class="cell-drop-name">${cleanName(row.drop_displayname||row.collection_name)}${excl}<span class="set-row-link">↗</span></div>
        <div class="cell-drop-schema">${schemaLabel(row.schema_name)}</div>
      </td>
      <td class="col-c"><span class="cell-priced ${cls}">${priced} / ${count}</span></td>
      <td class="col-r">${ph}</td>
    </tr>`;
  }

  h += '</tbody></table>';
  wrap.innerHTML = h;
  wrap.querySelector('#setDropHdr').addEventListener('click',  () => toggleSetSort('drop'));
  wrap.querySelector('#setPriceHdr').addEventListener('click', () => toggleSetSort('price'));

  wrap.querySelectorAll('tbody tr[data-col]').forEach(tr => {
    tr.addEventListener('click', () => {
      window.open(`set-detail.html?collection=${enc(tr.dataset.col)}&schema=${enc(tr.dataset.sch)}`, '_blank');
    });
  });
}

/* ── Sort toggles ── */
function toggleSetSort(field) {
  if (state.setSortField === field) {
    state.setSortDir = state.setSortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.setSortField = field;
    state.setSortDir = 'asc';
  }
  loadData();
}

function toggleSort(field) {
  if (state.sortField === field) {
    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortField = field;
    state.sortDir = 'asc';
  }
  state.offset = 0;
  tableRows = [];
  loadData();
}

/* ── Client-side filter + sort ── */
function applyCardFilters(cards) {
  let out = cards;

  if (state.rarity !== 'All') {
    out = out.filter(r => r.rarity === state.rarity);
  }

  if (state.collection) {
    const [col, schema] = state.collection.split('|');
    const dropInfo = allSetPrices.find(d => d.collection_name === col && d.schema_name === schema);
    const dropppId = dropInfo?.droppp_id;
    out = out.filter(r => {
      if (r.collection_name !== col) return false;
      if (state.rarity === 'Packs') {
        return dropppId ? r.droppp_id === dropppId : r.schema_name === 'packs.drop';
      }
      if (state.rarity === 'All' && dropppId) {
        return r.schema_name === schema || (r.schema_name === 'packs.drop' && r.droppp_id === dropppId);
      }
      return r.schema_name === schema;
    });
  }

  if (state.name.trim()) {
    const q = state.name.trim().toLowerCase();
    out = out.filter(r => (r.name || '').toLowerCase().includes(q));
  }

  if (state.supplyMin !== '') {
    const min = Number(state.supplyMin);
    out = out.filter(r => r.in_circulation != null && r.in_circulation >= min);
  }
  if (state.supplyMax !== '') {
    const max = Number(state.supplyMax);
    out = out.filter(r => r.in_circulation != null && r.in_circulation <= max);
  }

  const pc = priceCol();
  if (state.listingFilter === 'listed')          out = out.filter(r => r[pc] != null);
  else if (state.listingFilter === 'not_listed') out = out.filter(r => r[pc] == null);

  if (state.rarity === 'Packs' && state.packFilter === 'openable') {
    out = out.filter(r => OPENABLE_PACK_TEMPLATE_IDS.has(String(r.template_id)));
  }

  return out;
}

function sortCards(cards) {
  const pc = priceCol();
  return [...cards].sort((a, b) => {
    if (state.sortField === 'price') {
      const av = a[pc], bv = b[pc];
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      const d = state.sortDir === 'asc' ? av - bv : bv - av;
      if (d !== 0) return d;
      const dd = (a.drop_displayname || '').localeCompare(b.drop_displayname || '');
      if (dd !== 0) return dd;
      return (a.cardid ?? 0) - (b.cardid ?? 0);
    }
    if (state.sortField === 'supply') {
      const av = a.in_circulation, bv = b.in_circulation;
      if (av == null && bv == null) return 0;
      if (av == null) return 1;
      if (bv == null) return -1;
      const d = state.sortDir === 'asc' ? av - bv : bv - av;
      if (d !== 0) return d;
      const pav = a[pc], pbv = b[pc];
      if (pav == null && pbv != null) return 1;
      if (pav != null && pbv == null) return -1;
      if (pav != null && pbv != null) { const pd = pav - pbv; if (pd !== 0) return pd; }
      return (a.drop_displayname || '').localeCompare(b.drop_displayname || '');
    }
    // 'id' sort
    const av = a.cardid ?? Infinity, bv = b.cardid ?? Infinity;
    const d = state.sortDir === 'asc' ? av - bv : bv - av;
    if (d !== 0) return d;
    return (a.drop_displayname || '').localeCompare(b.drop_displayname || '');
  });
}

/* ── Load data ── */
async function loadData(append) {
  if (isLoading) return;
  isLoading = true;

  const wrap      = document.getElementById('tableContainer');
  const morewrap  = document.getElementById('loadMoreWrap');
  const meta      = document.getElementById('resultsMeta');
  const moreBtn   = document.getElementById('loadMoreBtn');

  if (!append) {
    wrap.innerHTML = '<div class="status-wrap"><div class="spinner"></div><div class="status-text">Loading…</div></div>';
    morewrap.style.display = 'none';
    meta.innerHTML = '';
  }

  try {
    if (isSetMode()) {
      let rows = allSetPrices;

      if (state.collection) {
        const [col, schema] = state.collection.split('|');
        rows = rows.filter(r => r.collection_name === col && r.schema_name === schema);
      }

      rows = [...rows].sort((a, b) =>
        (a.drop_displayname || '').localeCompare(b.drop_displayname || '')
      );

      buildSetTable(rows);

      const ts = rows.length > 0 ? rows[0].fetched_at : (allSetPrices[0] || {}).fetched_at;
      meta.innerHTML = `<strong>${rows.length}</strong> drop${rows.length !== 1 ? 's' : ''}` +
        (ts ? ` <span class="updated">· updated ${fmtAgo(ts)}</span>` : '');
      morewrap.style.display = 'none';

    } else {
      const filtered = applyCardFilters(allCards);
      const sorted   = sortCards(filtered);

      const offset = append ? state.offset : 0;
      const page   = sorted.slice(offset, offset + LIMIT);

      if (!append) tableRows = page;
      else         tableRows = tableRows.concat(page);

      state.offset = offset + page.length;
      canLoadMore  = state.offset < sorted.length;

      buildCardTable(page, !!append);

      const shown = tableRows.length;
      const total = sorted.length;
      let m = `Showing <strong>${fmtN(shown)}</strong> of <strong>${fmtN(total)}</strong> cards`;
      if (fetchedAt) m += ` <span class="updated">· updated ${fmtAgo(fetchedAt)}</span>`;
      m += `<div style="margin-top:0.3rem;font-size:0.75rem;opacity:0.55">Supply figures exclude assets held in Droppp wallets.</div>`;
      meta.innerHTML = m;

      morewrap.style.display = canLoadMore ? 'block' : 'none';
    }
  } catch (err) {
    wrap.innerHTML = `<div class="state state-error">Failed to load: ${err.message}</div>`;
  } finally {
    isLoading = false;
    if (moreBtn) moreBtn.disabled = false;
  }
}

/* ── Init ── */
async function init() {
  fetchWaxRate();

  document.getElementById('tableContainer').innerHTML =
    '<div class="status-wrap"><div class="spinner"></div><div class="status-text">Loading catalog…</div></div>';

  try {
    const [setPricesResult, templateRows, priceRows, packRows] = await Promise.all([
      sbFetch('funko_set_prices',
        'select=collection_name,schema_name,drop_displayname,droppp_id,droppp_exclusive,' +
        'royalty_card_count,royalty_wax_usd,royalty_wax_priced,royalty_best_usd,royalty_best_priced,' +
        'mastery_card_count,mastery_wax_usd,mastery_wax_priced,mastery_best_usd,mastery_best_priced,' +
        'fetched_at&order=drop_displayname.asc'
      ).then(r => r.data),
      sbFetchAll('templates',
        'select=template_id,collection_name,schema_name,name,rarity,cardid,max_supply,issued_supply,in_circulation'
      ),
      sbFetchAll('funko_market_prices',
        'select=template_id,droppp_id,droppp_exclusive,wax_price_wax,wax_price_usd,best_price_usd,fetched_at'
      ),
      sbFetchAll('pack_stats',
        'select=template_id,collection_name,schema_name,name,max_supply,issued_supply,in_circulation'
      ),
    ]);

    allSetPrices = setPricesResult;

    const dropInfoMap = new Map(allSetPrices.map(s => [
      s.collection_name + '|' + s.schema_name,
      { drop_displayname: s.drop_displayname, droppp_id: s.droppp_id, droppp_exclusive: s.droppp_exclusive }
    ]));
    const collDropppId = new Map(
      allSetPrices.filter(s => s.schema_name !== 'packs.drop' && s.droppp_id)
                  .map(s => [s.collection_name, s.droppp_id])
    );

    const priceMap = new Map(priceRows.map(p => [String(p.template_id), p]));
    if (priceRows.length > 0 && priceRows[0].fetched_at) fetchedAt = priceRows[0].fetched_at;

    allCards = templateRows.map(t => {
      const p   = priceMap.get(String(t.template_id)) || {};
      const key = t.collection_name + '|' + t.schema_name;
      const di  = dropInfoMap.get(key) || {};
      const dropppId = p.droppp_id
        ?? (t.schema_name === 'packs.drop' ? (collDropppId.get(t.collection_name) ?? null) : (di.droppp_id ?? null));
      return {
        template_id:      String(t.template_id),
        collection_name:  t.collection_name,
        schema_name:      t.schema_name,
        name:             t.name || '',
        rarity:           t.rarity || 'Unknown',
        cardid:           t.cardid ?? null,
        max_supply:       t.max_supply ?? null,
        issued_supply:    t.issued_supply ?? null,
        in_circulation:   t.in_circulation ?? null,
        droppp_id:        dropppId,
        droppp_exclusive: p.droppp_exclusive ?? di.droppp_exclusive ?? false,
        wax_price_wax:    p.wax_price_wax ?? null,
        wax_price_usd:    p.wax_price_usd ?? null,
        best_price_usd:   p.best_price_usd ?? null,
        fetched_at:       p.fetched_at ?? null,
        drop_displayname: di.drop_displayname ?? t.collection_name,
      };
    });

    const packCards = packRows.map(t => {
      const p   = priceMap.get(String(t.template_id)) || {};
      const key = t.collection_name + '|' + t.schema_name;
      const di  = dropInfoMap.get(key) || {};
      const dropppId = p.droppp_id ?? (collDropppId.get(t.collection_name) ?? null);
      return {
        template_id:      String(t.template_id),
        collection_name:  t.collection_name,
        schema_name:      t.schema_name,
        name:             t.name || '',
        rarity:           'Packs',
        cardid:           null,
        max_supply:       t.max_supply ?? null,
        issued_supply:    t.issued_supply ?? null,
        in_circulation:   t.in_circulation ?? null,
        droppp_id:        dropppId,
        droppp_exclusive: p.droppp_exclusive ?? di.droppp_exclusive ?? false,
        wax_price_wax:    p.wax_price_wax ?? null,
        wax_price_usd:    p.wax_price_usd ?? null,
        best_price_usd:   p.best_price_usd ?? null,
        fetched_at:       p.fetched_at ?? null,
        drop_displayname: di.drop_displayname ?? t.collection_name,
      };
    });
    allCards = allCards.concat(packCards);

    // Recompute _priced fields from allCards using the correct rarity definitions.
    // Pipeline priced counts are wrong since funko_market_prices now only stores listed
    // cards (all with non-null prices), making priced = total.
    const ROYALTY_RARITIES = new Set(['Common','Uncommon','Rare','Epic']);
    const MASTERY_RARITIES = new Set(['Common','Uncommon','Rare','Epic','Ultra','Legendary','Grail','Mythic','Series','Royalty']);
    const setCardMap = new Map();
    for (const c of allCards) {
      const key = c.collection_name + '|' + c.schema_name;
      if (!setCardMap.has(key)) setCardMap.set(key, []);
      setCardMap.get(key).push(c);
    }
    for (const row of allSetPrices) {
      const cards = setCardMap.get(row.collection_name + '|' + row.schema_name) || [];
      const royaltyCards = cards.filter(c => ROYALTY_RARITIES.has(c.rarity));
      const masteryCards = cards.filter(c => MASTERY_RARITIES.has(c.rarity));
      row.royalty_card_count  = royaltyCards.length;
      row.mastery_card_count  = masteryCards.length;
      row.royalty_wax_priced  = royaltyCards.filter(c => c.wax_price_usd  != null).length;
      row.royalty_best_priced = royaltyCards.filter(c => c.best_price_usd != null).length;
      row.mastery_wax_priced  = masteryCards.filter(c => c.wax_price_usd  != null).length;
      row.mastery_best_priced = masteryCards.filter(c => c.best_price_usd != null).length;
    }

    populateCollections(allSetPrices);
  } catch (e) {
    console.error('Catalog load failed:', e);
    document.getElementById('tableContainer').innerHTML =
      '<div class="state state-error">Failed to load catalog.</div>';
    return;
  }

  buildRarityTabs();

  document.getElementById('collectionSelect').addEventListener('change', e => {
    state.collection = e.target.value;
    state.offset = 0; tableRows = [];
    loadData();
  });

  document.getElementById('nameSearch').addEventListener('input', e => {
    clearTimeout(nameTimer);
    nameTimer = setTimeout(() => {
      state.name = e.target.value;
      state.offset = 0; tableRows = [];
      loadData();
    }, 300);
  });

  document.getElementById('supplyMin').addEventListener('input', e => {
    clearTimeout(supplyTimer);
    supplyTimer = setTimeout(() => {
      state.supplyMin = e.target.value;
      state.offset = 0; tableRows = [];
      loadData();
    }, 400);
  });

  document.getElementById('supplyMax').addEventListener('input', e => {
    clearTimeout(supplyTimer);
    supplyTimer = setTimeout(() => {
      state.supplyMax = e.target.value;
      state.offset = 0; tableRows = [];
      loadData();
    }, 400);
  });

  document.getElementById('listingFilter').addEventListener('click', e => {
    const btn = e.target.closest('.listing-filter-btn');
    if (!btn || btn.dataset.lf === state.listingFilter) return;
    state.listingFilter = btn.dataset.lf;
    state.offset = 0; tableRows = [];
    document.querySelectorAll('.listing-filter-btn').forEach(b => b.classList.toggle('active', b === btn));
    loadData();
  });

  document.getElementById('packFilter').addEventListener('click', e => {
    const btn = e.target.closest('.listing-filter-btn');
    if (!btn || btn.dataset.pf === state.packFilter) return;
    state.packFilter = btn.dataset.pf;
    state.offset = 0; tableRows = [];
    document.querySelectorAll('#packFilter .listing-filter-btn').forEach(b => b.classList.toggle('active', b === btn));
    loadData();
  });

  document.getElementById('loadMoreBtn').addEventListener('click', () => {
    if (isLoading) return;
    document.getElementById('loadMoreBtn').disabled = true;
    loadData(true);
  });

  loadData();
}

init();
</script>
