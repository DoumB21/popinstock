<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Market Overview — Funko Digital — PopInStock</title>
  <meta name="description" content="Browse current Droppp and WAX marketplace prices for all Funko Digital Pop! cards and sets. Filter by rarity, collection, and marketplace source." />
  <link rel="canonical" href="https://www.popinstock.com/funko/market-overview.html" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.popinstock.com/funko/market-overview.html" />
  <meta property="og:title" content="Market Overview — Funko Digital — PopInStock" />
  <meta property="og:description" content="Browse current Droppp and WAX marketplace prices for all Funko Digital Pop! cards and sets." />
  <meta property="og:image" content="https://www.popinstock.com/images/og-banner.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Market Overview — Funko Digital — PopInStock" />
  <meta name="twitter:description" content="Browse current Droppp and WAX marketplace prices for all Funko Digital Pop! cards and sets." />
  <meta name="twitter:image" content="https://www.popinstock.com/images/og-banner.png" />
  <link rel="icon" type="image/png" href="../images/FoxLogo.png" />
  <link rel="stylesheet" href="../shared/global.css" />
  <style>
    .content { display: flex; flex-direction: column; gap: 1.25rem; }
    .page-header { margin-bottom: 0; }

    /* ── Rarity tab bar ── */
    .rarity-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      align-items: center;
    }
    .rarity-tab {
      display: inline-flex;
      align-items: center;
      cursor: pointer;
      padding: 4px 11px;
      border-radius: 999px;
      border: 1px solid transparent;
      font-size: 0.72rem;
      font-weight: 600;
      white-space: nowrap;
      transition: opacity 0.15s, background 0.15s, border-color 0.15s;
      user-select: none;
    }
    .rarity-tab:not(.active) { opacity: 0.42; }
    .rarity-tab:not(.active):hover { opacity: 0.75; }
    .rarity-tab.active { opacity: 1; }
    .tab-all {
      color: var(--text-secondary);
      border-color: rgba(255,255,255,0.2);
      background: rgba(255,255,255,0.06);
    }
    .tab-all.active {
      color: var(--text-primary);
      border-color: rgba(255,255,255,0.4);
      background: rgba(255,255,255,0.12);
    }
    .tab-royalty-set {
      color: #007deb;
      border-color: rgba(0,125,235,0.35);
      background: rgba(0,125,235,0.08);
    }
    .tab-royalty-set.active {
      background: rgba(0,125,235,0.22);
      border-color: rgba(0,125,235,0.7);
    }
    .tab-mastery-set {
      color: #e93494;
      border-color: rgba(233,52,148,0.35);
      background: rgba(233,52,148,0.08);
    }
    .tab-mastery-set.active {
      background: rgba(233,52,148,0.22);
      border-color: rgba(233,52,148,0.7);
    }
    .tab-sep {
      width: 1px; height: 18px;
      background: var(--border);
      margin: 0 3px;
      flex-shrink: 0;
    }

    /* ── Filter bar ── */
    .filter-bar { display: flex; flex-direction: column; gap: 0.6rem; }
    .filter-row { display: flex; gap: 0.5rem; align-items: center; flex-wrap: wrap; }
    .filter-row .filter-select { min-width: 180px; flex: 1; max-width: 320px; }
    .filter-row .name-search   { min-width: 160px; flex: 1; max-width: 260px; }

    .excl-label {
      display: flex; align-items: center; gap: 0.4rem;
      font-size: 0.88rem; color: var(--text-secondary);
      cursor: pointer; white-space: nowrap;
    }
    .excl-label input[type="checkbox"] { cursor: pointer; accent-color: var(--accent-light); }

    .source-label {
      font-size: 0.88rem; color: var(--text-secondary); white-space: nowrap;
    }

    .source-control {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      flex-shrink: 0;
    }
    .source-btn {
      background: none; border: none; cursor: pointer;
      font-size: 0.82rem; font-weight: 600;
      color: var(--text-secondary);
      padding: 0.5rem 0.9rem;
      transition: color 0.15s, background 0.15s;
      white-space: nowrap;
      font-family: inherit;
    }
    .source-btn + .source-btn { border-left: 1px solid var(--border); }
    .source-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.04); }
    .source-btn.active { color: var(--accent-light); background: rgba(192,120,40,0.12); }

    /* ── Results meta ── */
    .results-meta {
      font-size: 0.8rem;
      color: var(--text-secondary);
      min-height: 1.2em;
    }
    .results-meta strong { color: var(--text-primary); }
    .results-meta .updated { opacity: 0.65; }

    /* ── Market table ── */
    .market-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .market-table thead th {
      text-align: left; padding: 8px 12px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-secondary); background: var(--bg-card);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .market-table thead th.col-r { text-align: right; }
    .market-table thead th.col-c { text-align: center; }
    .market-table thead th.sortable { cursor: pointer; user-select: none; }
    .market-table thead th.sortable:hover { color: var(--text-primary); }
    .market-table thead th .sort-icon { font-size: 0.6rem; opacity: 0.45; margin-left: 3px; }
    .market-table thead th.sorted .sort-icon { opacity: 1; color: var(--accent-light); }
    .market-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
    .market-table tbody tr:last-child { border-bottom: none; }
    .market-table tbody tr:hover { background: rgba(255,255,255,0.04); }
    .market-table tbody td { padding: 8px 12px; vertical-align: middle; }
    .market-table tbody td.col-r { text-align: right; font-variant-numeric: tabular-nums; }
    .market-table tbody td.col-c { text-align: center; }

    /* ── Table cell content ── */
    .cell-drop-name { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
    .cell-drop-schema { font-size: 0.62rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
    .cell-card-name { font-size: 0.85rem; color: var(--text-primary); }
    .cell-card-id { font-size: 0.68rem; color: var(--text-secondary); margin-top: 2px; }
    .cell-supply { font-size: 0.8rem; color: var(--text-secondary); white-space: nowrap; }
    .cell-price { font-size: 0.88rem; font-weight: 700; color: var(--text-primary); white-space: nowrap; }
    .cell-price.price-null { color: rgba(255,255,255,0.2); font-weight: 400; font-size: 0.82rem; }
    .cell-priced { font-size: 0.8rem; white-space: nowrap; }
    .cell-priced.priced-all     { color: var(--text-primary); font-weight: 600; }
    .cell-priced.priced-partial { color: var(--accent-light); }
    .cell-priced.priced-none    { color: rgba(255,255,255,0.2); }

    .excl-badge {
      display: inline-flex; align-items: center;
      font-size: 0.58rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--accent-light); border: 1px solid rgba(240,168,64,0.3);
      background: rgba(240,168,64,0.08); border-radius: 4px;
      padding: 1px 4px; margin-left: 5px; vertical-align: middle; line-height: 1.4;
    }

    /* ── Marketplace link icons ── */
    .market-links { display: flex; align-items: center; gap: 1rem; justify-content: flex-end; }
    .market-link { display: flex; align-items: center; opacity: 0.4; transition: opacity 0.15s; text-decoration: none; }
    .market-link:hover { opacity: 1; }
    .market-link img { width: 20px; height: 20px; object-fit: contain; }
    .market-link img[src*="droppp"] { filter: brightness(0) invert(1); }

    /* ── Load more ── */
    .load-more-wrap { text-align: center; padding-top: 0.5rem; }

    @media (max-width: 600px) {
      .filter-row .filter-select,
      .filter-row .name-search { max-width: none; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

<div class="page">
  <div class="content">

    <div class="page-header">
      <div class="page-title">Market <span class="accent">Overview</span></div>
      <div class="page-subtitle">Browse current Droppp and WAX marketplace prices for Funko Digital Pop! cards and sets.</div>
    </div>

    <div class="rarity-tabs" id="rarityTabs"></div>

    <div class="filter-bar">
      <div class="filter-row">
        <select class="filter-select" id="collectionSelect">
          <option value="">All Drops</option>
        </select>
        <input class="name-search search-input" id="nameSearch" type="search" placeholder="Search cards…" autocomplete="off" />
      </div>
      <div class="filter-row">
        <label class="excl-label">
          <input type="checkbox" id="exclToggle" />
          Droppp Exclusive Only
        </label>
        <span style="width:1px;height:20px;background:var(--border);flex-shrink:0;margin:0 0.5rem"></span>
        <span class="source-label">Price source</span>
        <div class="source-control">
          <button class="source-btn active" data-source="all">All</button>
          <button class="source-btn" data-source="droppp">Droppp</button>
          <button class="source-btn" data-source="wax">WAX</button>
        </div>
      </div>
    </div>

    <div class="results-meta" id="resultsMeta"></div>

    <div class="table-wrap" id="tableContainer">
      <div class="status-wrap"><div class="spinner"></div><div class="status-text">Loading…</div></div>
    </div>

    <div class="load-more-wrap" id="loadMoreWrap" style="display:none">
      <button class="show-more-btn" id="loadMoreBtn">Load More</button>
    </div>

  </div>
</div>

<script src="../shared/supabase-config.js"></script>
<script src="nav.js"></script>
<script>
/* ── Constants ── */
const RARITY_ORDER = [
  'Common','Uncommon','Rare','Epic',
  'Ultra','Legendary','Grail','Mythic','Royalty','Series','1 of 1','Redeemable','Packs'
];
const RARITY_CLASS = {
  'Common':'r-common','Uncommon':'r-uncommon','Rare':'r-rare','Epic':'r-epic',
  'Series':'r-series','Ultra':'r-ultra','Legendary':'r-legendary','Grail':'r-grail',
  'Mythic':'r-mythic','Royalty':'r-royalty','1 of 1':'r-1of1','Redeemable':'r-redeemable',
  'Packs':'r-pack'
};
const LIMIT = 100;
const ATOMIC_MARKET  = 'https://wax.atomichub.io/market';
const DROPPP_MARKET  = 'https://droppp.io/market/';

/* ── State ── */
const state = {
  rarity:      'All',
  collection:  '',   // 'collection_name|schema_name'
  name:        '',
  exclusive:   false,
  source:      'all',
  sortField:    'price',  // 'price' | 'id'
  sortDir:      'asc',
  setSortField: 'drop',   // 'drop' | 'price'
  setSortDir:   'asc',
  offset:      0,
};

let allSetPrices  = [];
let tableRows     = [];
let isLoading     = false;
let canLoadMore   = false;
let fetchedAt     = null;
let nameTimer     = null;

/* ── Helpers ── */
function enc(v)    { return encodeURIComponent(v); }
function fmtN(n)   { return Number(n).toLocaleString(); }
function fmtUsd(v) { return v == null ? null : '$' + Number(v).toFixed(2); }

function fmtAgo(ts) {
  if (!ts) return '';
  const d = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (d < 1)   return 'just now';
  if (d < 60)  return d + 'm ago';
  if (d < 1440) return Math.floor(d / 60) + 'h ago';
  return Math.floor(d / 1440) + 'd ago';
}

function schemaLabel(sn) {
  const b = (sn || '').replace('.drop', '');
  const m = b.match(/^series(\d+)$/);
  return m ? 'Series ' + m[1] : b.charAt(0).toUpperCase() + b.slice(1);
}

function isSetMode() {
  return state.rarity === 'Royalty Set' || state.rarity === 'Mastery Set';
}

function priceCol() {
  if (!isSetMode()) {
    if (state.source === 'droppp') return 'droppp_price_usd';
    if (state.source === 'wax')    return 'wax_price_usd';
    return 'best_price_usd';
  }
  const p = state.rarity === 'Royalty Set' ? 'royalty' : 'mastery';
  if (state.source === 'droppp') return p + '_droppp_usd';
  if (state.source === 'wax')    return p + '_wax_usd';
  return p + '_best_usd';
}

function pricedCols(row) {
  const p   = state.rarity === 'Royalty Set' ? 'royalty' : 'mastery';
  const src = state.source === 'all' ? 'best' : state.source;
  return {
    priced: row[p + '_' + src + '_priced'] ?? 0,
    count:  row[p + '_card_count']         ?? 0,
  };
}

function effectivePrice(row) {
  const v = row[priceCol()];
  if (v != null && v > 0) return v;
  if (state.source === 'all') {
    const candidates = [row.droppp_price_usd, row.wax_price_usd].filter(x => x != null);
    if (candidates.length) return Math.min(...candidates);
  }
  return null;
}

function priceLabel() {
  if (state.source === 'droppp') return 'Droppp';
  if (state.source === 'wax')    return 'WAX';
  return 'Best Price';
}

/* ── Supabase fetch ── */
async function sbFetch(table, qs) {
  const url = SUPABASE_URL + '/rest/v1/' + table + (qs ? '?' + qs : '');
  const r = await fetch(url, {
    headers: {
      'apikey':          SUPABASE_ANON_KEY,
      'Authorization':   'Bearer ' + SUPABASE_ANON_KEY,
      'Accept-Profile':  'funko',
      'Prefer':          'count=exact',
    }
  });
  if (!r.ok) throw new Error('Supabase ' + r.status + ' on ' + table);
  const range = r.headers.get('Content-Range');
  const total = range ? (range.match(/\/(\d+)/) || [])[1] : null;
  return { data: await r.json(), total: total ? parseInt(total) : null };
}

/* ── Rarity tabs ── */
function buildRarityTabs() {
  const el = document.getElementById('rarityTabs');
  const cur = state.rarity;
  let h = `<span class="rarity-tab tab-all${cur==='All'?' active':''}" data-rarity="All">All</span>`;
  for (const r of RARITY_ORDER) {
    h += `<span class="rarity-tab ${RARITY_CLASS[r]||''}${cur===r?' active':''}" data-rarity="${r}">${r}</span>`;
  }
  h += '<span class="tab-sep"></span>';
  h += `<span class="rarity-tab tab-royalty-set${cur==='Royalty Set'?' active':''}" data-rarity="Royalty Set">Royalty Set</span>`;
  h += `<span class="rarity-tab tab-mastery-set${cur==='Mastery Set'?' active':''}" data-rarity="Mastery Set">Mastery Set</span>`;
  el.innerHTML = h;
  el.querySelectorAll('.rarity-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      if (tab.dataset.rarity === state.rarity) return;
      state.rarity = tab.dataset.rarity;
      state.offset = 0;
      tableRows = [];
      const ns = document.getElementById('nameSearch');
      ns.disabled     = isSetMode();
      ns.style.opacity = isSetMode() ? '0.4' : '';
      buildRarityTabs();
      loadData();
    });
  });
}

/* ── Collection dropdown ── */
function populateCollections(rows) {
  const sel = document.getElementById('collectionSelect');
  const sorted = [...rows].sort((a,b) => (a.drop_displayname||'').localeCompare(b.drop_displayname||''));
  let h = '<option value="">All Drops</option>';
  for (const d of sorted) {
    const v = d.collection_name + '|' + d.schema_name;
    h += `<option value="${v}">${d.drop_displayname || d.collection_name}  —  ${schemaLabel(d.schema_name)}</option>`;
  }
  sel.innerHTML = h;
  if (state.collection) sel.value = state.collection;
}

/* ── Card table (funko_market_prices) ── */
function buildCardTable(rows, append) {
  const wrap = document.getElementById('tableContainer');

  if (!append && rows.length === 0) {
    wrap.innerHTML = '<div class="no-results">No cards found matching your filters.</div>';
    return;
  }
  if (append && rows.length === 0) return;

  const pc    = priceCol();
  const pl    = priceLabel();
  const idSi    = state.sortField === 'id'    ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';
  const priceSi = state.sortField === 'price' ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';

  if (!append) {
    wrap.innerHTML = `<table class="market-table">
      <thead><tr>
        <th class="sortable${state.sortField==='id'?' sorted':''}" style="min-width:200px" id="idHdr">
          ID — Card <span class="sort-icon">${idSi}</span>
        </th>
        <th style="min-width:150px">Drop</th>
        <th class="col-r sortable${state.sortField==='price'?' sorted':''}" style="width:105px" id="priceHdr">
          ${pl} <span class="sort-icon">${priceSi}</span>
        </th>
        <th class="col-r" style="width:140px">Market</th>
      </tr></thead>
      <tbody id="cardTbody"></tbody>
    </table>`;
    wrap.querySelector('#idHdr').addEventListener('click',    () => toggleSort('id'));
    wrap.querySelector('#priceHdr').addEventListener('click', () => toggleSort('price'));
  }

  const tbody = document.getElementById('cardTbody');
  if (!tbody) return;

  let h = '';
  for (const row of rows) {
    const p   = fmtUsd(effectivePrice(row));
    const ph  = p
      ? `<span class="cell-price">${p}</span>`
      : `<span class="cell-price price-null">—</span>`;

    const excl = row.droppp_exclusive
      ? '<span class="excl-badge">Excl</span>'
      : '';

    const tid = row.template_id;
    const col = row.collection_name;
    const sch = row.schema_name;

    const links = [
      { href: `https://droppp.io/products/${tid}/`,
        icon: '../images/droppp.svg', title: 'View on Droppp' },
      { href: `${ATOMIC_MARKET}?blockchain=wax-mainnet&collection_name=${enc(col)}&template_id=${enc(tid)}&order=asc&primary_chain=wax-mainnet&schema_name=${enc(sch)}&sort=price&symbol=WAX`,
        icon: '../images/atomic.svg', title: 'View on AtomicHub' },
      { href: `https://neftyblocks.com/marketplace/listing?collection_name=${enc(col)}&order=asc&page=1&sort=price&template_id=${enc(tid)}`,
        icon: '../images/neftyblocks.svg', title: 'View on NeftyBlocks' },
      { href: `https://nfthive.io/market?term=${enc(tid)}&order_by=price_asc&offer_type=listings`,
        icon: '../images/nfthive.svg', title: 'View on NFTHive' },
    ];

    const linksHtml = links.map(l =>
      `<a class="market-link" href="${l.href}" target="_blank" rel="noopener noreferrer" title="${l.title}"><img src="${l.icon}" alt="${l.title}"></a>`
    ).join('');

    h += `<tr>
      <td>
        <div class="cell-card-name">${row.cardid != null ? row.cardid + ' — ' : ''}${row.name||'—'}</div>
        <div style="margin-top:3px"><span class="rarity-pill ${RARITY_CLASS[row.rarity]||''}">${row.rarity||'—'}</span></div>
      </td>
      <td>
        <div class="cell-drop-name">${row.drop_displayname||row.collection_name}${excl}</div>
        <div class="cell-drop-schema">${schemaLabel(row.schema_name)}</div>
      </td>
      <td class="col-r">${ph}</td>
      <td class="col-r"><div class="market-links">${linksHtml}</div></td>
    </tr>`;
  }
  tbody.insertAdjacentHTML('beforeend', h);
}

/* ── Set table (funko_set_prices) ── */
function buildSetTable(rows) {
  const wrap = document.getElementById('tableContainer');
  if (rows.length === 0) {
    wrap.innerHTML = '<div class="no-results">No drops found matching your filters.</div>';
    return;
  }

  const isRoyalty = state.rarity === 'Royalty Set';
  const pc     = priceCol();
  const pl     = priceLabel();
  const setLbl = isRoyalty ? 'Royalty Set' : 'Mastery Set';

  const dropSi  = state.setSortField === 'drop'  ? (state.setSortDir === 'asc' ? '↑' : '↓') : '↕';
  const priceSi = state.setSortField === 'price' ? (state.setSortDir === 'asc' ? '↑' : '↓') : '↕';

  const sorted = [...rows].sort((a, b) => {
    if (state.setSortField === 'price') {
      const pa = a[pc], pb = b[pc];
      if (pa == null && pb == null) return 0;
      if (pa == null) return 1;
      if (pb == null) return -1;
      return state.setSortDir === 'asc' ? pa - pb : pb - pa;
    }
    const cmp = (a.drop_displayname || '').localeCompare(b.drop_displayname || '');
    return state.setSortDir === 'asc' ? cmp : -cmp;
  });

  let h = `<table class="market-table">
    <thead><tr>
      <th class="sortable${state.setSortField==='drop'?' sorted':''}" style="min-width:200px" id="setDropHdr">
        Drop <span class="sort-icon">${dropSi}</span>
      </th>
      <th class="col-c" style="width:120px">Cards Priced</th>
      <th class="col-r sortable${state.setSortField==='price'?' sorted':''}" style="width:140px" id="setPriceHdr">
        ${pl} <span class="sort-icon">${priceSi}</span>
      </th>
    </tr></thead>
    <tbody>`;

  for (const row of sorted) {
    const p  = fmtUsd(row[pc]);
    const ph = p
      ? `<span class="cell-price">${p}</span>`
      : `<span class="cell-price price-null">—</span>`;

    const { priced, count } = pricedCols(row);
    const cls = priced === count ? 'priced-all' : (priced > 0 ? 'priced-partial' : 'priced-none');

    const excl = row.droppp_exclusive ? '<span class="excl-badge">Excl</span>' : '';

    const dlnk = row.droppp_slug
      ? `<a class="market-link" href="${DROPPP_MARKET}${enc(row.droppp_slug)}/" target="_blank" rel="noopener noreferrer" title="View on Droppp"><img src="../images/droppp.svg" alt="Droppp"></a>`
      : '';

    h += `<tr>
      <td>
        <div class="cell-drop-name">${row.drop_displayname||row.collection_name}${excl}</div>
        <div class="cell-drop-schema">${schemaLabel(row.schema_name)}</div>
      </td>
      <td class="col-c"><span class="cell-priced ${cls}">${priced} / ${count}</span></td>
      <td class="col-r">${ph}</td>
    </tr>`;
  }

  h += '</tbody></table>';
  wrap.innerHTML = h;
  wrap.querySelector('#setDropHdr').addEventListener('click',  () => toggleSetSort('drop'));
  wrap.querySelector('#setPriceHdr').addEventListener('click', () => toggleSetSort('price'));
}

/* ── Sort toggles ── */
function toggleSetSort(field) {
  if (state.setSortField === field) {
    state.setSortDir = state.setSortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.setSortField = field;
    state.setSortDir = 'asc';
  }
  loadData();
}

function toggleSort(field) {
  if (state.sortField === field) {
    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortField = field;
    state.sortDir = 'asc';
  }
  state.offset = 0;
  tableRows = [];
  loadData();
}

/* ── Query builder ── */
function buildCardQuery(offset) {
  const parts = [
    'select=template_id,collection_name,schema_name,drop_displayname,droppp_slug,droppp_exclusive,' +
    'name,rarity,cardid,max_supply,issued_supply,droppp_price_usd,wax_price_usd,best_price_usd,fetched_at'
  ];

  if (state.rarity !== 'All') parts.push('rarity=eq.' + enc(state.rarity));

  if (state.collection) {
    const [col, schema] = state.collection.split('|');
    const dropInfo  = allSetPrices.find(d => d.collection_name === col && d.schema_name === schema);
    const dropppId  = dropInfo?.droppp_id;
    parts.push('collection_name=eq.' + enc(col));

    if (state.rarity === 'Packs') {
      // Packs live in packs.drop — link via droppp_id instead of schema
      if (dropppId) parts.push('droppp_id=eq.' + dropppId);
    } else if (state.rarity === 'All' && dropppId) {
      // Include both the series schema and packs.drop matched by droppp_id
      parts.push('or=(schema_name.eq.' + enc(schema) + ',and(schema_name.eq.packs.drop,droppp_id.eq.' + dropppId + '))');
    } else {
      parts.push('schema_name=eq.' + enc(schema));
    }
  }

  if (state.name.trim()) parts.push('name=ilike.*' + enc(state.name.trim()) + '*');
  if (state.exclusive)   parts.push('droppp_exclusive=eq.true');

  const pc = priceCol();
  if (state.sortField === 'price') {
    parts.push('order=' + pc + '.' + state.sortDir + '.nullslast,drop_displayname.asc,cardid.asc');
  } else {
    parts.push('order=cardid.' + state.sortDir + ',drop_displayname.asc');
  }

  parts.push('limit=' + LIMIT + '&offset=' + offset);
  return parts.join('&');
}

/* ── Load data ── */
async function loadData(append) {
  if (isLoading) return;
  isLoading = true;

  const wrap      = document.getElementById('tableContainer');
  const morewrap  = document.getElementById('loadMoreWrap');
  const meta      = document.getElementById('resultsMeta');
  const moreBtn   = document.getElementById('loadMoreBtn');

  if (!append) {
    wrap.innerHTML = '<div class="status-wrap"><div class="spinner"></div><div class="status-text">Loading…</div></div>';
    morewrap.style.display = 'none';
    meta.innerHTML = '';
  }

  try {
    if (isSetMode()) {
      let rows = allSetPrices;

      if (state.collection) {
        const [col, schema] = state.collection.split('|');
        rows = rows.filter(r => r.collection_name === col && r.schema_name === schema);
      }
      if (state.exclusive) rows = rows.filter(r => r.droppp_exclusive);

      rows = [...rows].sort((a, b) =>
        (a.drop_displayname || '').localeCompare(b.drop_displayname || '')
      );

      buildSetTable(rows);

      const ts = rows.length > 0 ? rows[0].fetched_at : (allSetPrices[0] || {}).fetched_at;
      meta.innerHTML = `<strong>${rows.length}</strong> drop${rows.length !== 1 ? 's' : ''}` +
        (ts ? ` <span class="updated">· updated ${fmtAgo(ts)}</span>` : '');
      morewrap.style.display = 'none';

    } else {
      const offset = append ? state.offset : 0;
      const { data, total } = await sbFetch('funko_market_prices', buildCardQuery(offset));

      if (!append) tableRows = data;
      else         tableRows = tableRows.concat(data);

      state.offset = (append ? offset : 0) + data.length;

      if (data.length > 0 && data[0].fetched_at) fetchedAt = data[0].fetched_at;

      canLoadMore = data.length === LIMIT;

      buildCardTable(data, !!append);

      const shown = tableRows.length;
      let m = total != null
        ? `Showing <strong>${fmtN(shown)}</strong> of <strong>${fmtN(total)}</strong> cards`
        : `Showing <strong>${fmtN(shown)}</strong> cards`;
      if (fetchedAt) m += ` <span class="updated">· updated ${fmtAgo(fetchedAt)}</span>`;
      meta.innerHTML = m;

      morewrap.style.display = canLoadMore ? 'block' : 'none';
    }
  } catch (err) {
    wrap.innerHTML = `<div class="state state-error">Failed to load: ${err.message}</div>`;
  } finally {
    isLoading = false;
    if (moreBtn) moreBtn.disabled = false;
  }
}

/* ── Init ── */
async function init() {
  try {
    const { data } = await sbFetch('funko_set_prices',
      'select=collection_name,schema_name,drop_displayname,droppp_id,droppp_slug,droppp_exclusive,' +
      'royalty_card_count,royalty_droppp_usd,royalty_droppp_priced,' +
      'royalty_wax_usd,royalty_wax_priced,royalty_best_usd,royalty_best_priced,' +
      'mastery_card_count,mastery_droppp_usd,mastery_droppp_priced,' +
      'mastery_wax_usd,mastery_wax_priced,mastery_best_usd,mastery_best_priced,' +
      'fetched_at&order=drop_displayname.asc'
    );
    allSetPrices = data;
    populateCollections(data);
  } catch (e) {
    console.error('Set prices load failed:', e);
  }

  buildRarityTabs();

  document.getElementById('collectionSelect').addEventListener('change', e => {
    state.collection = e.target.value;
    state.offset = 0; tableRows = [];
    loadData();
  });

  document.getElementById('nameSearch').addEventListener('input', e => {
    clearTimeout(nameTimer);
    nameTimer = setTimeout(() => {
      state.name = e.target.value;
      state.offset = 0; tableRows = [];
      loadData();
    }, 300);
  });

  document.getElementById('exclToggle').addEventListener('change', e => {
    state.exclusive = e.target.checked;
    state.offset = 0; tableRows = [];
    loadData();
  });

  document.querySelectorAll('.source-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      if (btn.dataset.source === state.source) return;
      state.source = btn.dataset.source;
      document.querySelectorAll('.source-btn').forEach(b =>
        b.classList.toggle('active', b.dataset.source === state.source)
      );
      state.offset = 0; tableRows = [];
      loadData();
    });
  });

  document.getElementById('loadMoreBtn').addEventListener('click', () => {
    if (isLoading) return;
    document.getElementById('loadMoreBtn').disabled = true;
    loadData(true);
  });

  loadData();
}

init();
</script>
