<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funko Mint Tracker — PopInStock</title>
  <link rel="icon" type="image/png" href="../images/FoxLogo.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --bg-card: #13131d;
      --bg-row-alt: rgba(255,255,255,0.025);
      --border: rgba(255,255,255,0.07);
      --text-primary: #f0f0f5;
      --text-secondary: #8888aa;
      --accent: #c07828;
      --accent-light: #f0a840;
      --nav-height: 64px;
      --rarity-common:     #9ca3af;
      --rarity-uncommon:   #4ade80;
      --rarity-rare:       #60a5fa;
      --rarity-epic:       #c084fc;
      --rarity-ultra:      #e8ff00;
      --rarity-legendary:  #e93494;
      --rarity-grail:      #faa500;
      --rarity-mythic:     #01ffff;
      --rarity-royalty:    #007deb;
      --rarity-redeemable: #f97316;
      --rarity-pack:       #94a3b8;
    }

    html, body { height: 100%; }
    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    body::before {
      content: '';
      position: fixed; inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none; z-index: 0;
    }

    /* ── Nav ── */
    .site-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex; align-items: center; gap: 0.5rem;
      max-width: 1200px; margin: 0 auto;
      padding: 0 1.5rem; height: var(--nav-height);
    }
    .nav-home { display: flex; align-items: center; flex-shrink: 0; margin-right: 1rem; }
    .nav-home img { height: 36px; width: 36px; object-fit: contain; transition: opacity 0.2s; }
    .nav-home:hover img { opacity: 0.75; }
    .nav-links { display: flex; align-items: center; gap: 0.25rem; flex: 1; }
    .nav-link {
      text-decoration: none; color: var(--text-secondary);
      font-size: 0.875rem; font-weight: 500;
      padding: 0.4rem 0.85rem; border-radius: 999px;
      border: 1px solid transparent;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .nav-link:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
    .nav-link--active {
      color: var(--accent-light);
      background: rgba(192,120,40,0.12);
      border-color: rgba(192,120,40,0.25);
    }
    .nav-burger {
      display: none; flex-direction: column; justify-content: center; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 0.4rem; margin-left: auto;
    }
    .nav-burger span {
      display: block; width: 22px; height: 2px;
      background: var(--text-secondary); border-radius: 2px;
      transition: transform 0.25s ease, opacity 0.25s ease, background 0.2s;
    }
    .nav-burger--open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-burger--open span:nth-child(2) { opacity: 0; }
    .nav-burger--open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .nav-burger--open span { background: var(--text-primary); }
    .nav-mobile {
      display: none; flex-direction: column;
      padding: 0.75rem 1.5rem 1rem;
      border-top: 1px solid var(--border); gap: 0.25rem;
    }
    .nav-mobile.open { display: flex; }
    .nav-mobile .nav-link { border-radius: 10px; }
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .nav-burger { display: flex; }
    }

    /* ── Page ── */
    .page-main {
      flex: 1; position: relative; z-index: 1;
      max-width: 1200px; margin: 0 auto; width: 100%;
      padding: 2rem 1.5rem;
    }
    .page-header { margin-bottom: 2rem; }
    .page-title { font-size: 1.75rem; font-weight: 700; }
    .page-title .accent { color: var(--accent-light); }
    .page-desc { color: var(--text-secondary); margin-top: 0.4rem; font-size: 0.95rem; }

    /* ── Controls ── */
    .controls-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 18px; padding: 1.5rem; margin-bottom: 1.5rem;
    }
    .controls-row { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
    .control-group { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-width: 180px; }
    .control-group--wide { flex: 2; min-width: 260px; }
    .control-label {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-secondary);
    }
    .control-hint { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: 0.75; }
    .control-select, .control-input {
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-primary);
      font-size: 0.9rem; padding: 0.55rem 0.85rem;
      outline: none; transition: border-color 0.2s; width: 100%;
    }
    .control-select:focus, .control-input:focus { border-color: var(--accent-light); }
    .control-select option { background: #1a1a2a; }
    .search-btn {
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      color: #fff; border: none; border-radius: 10px; cursor: pointer;
      font-size: 0.9rem; font-weight: 600; padding: 0.55rem 1.75rem;
      transition: opacity 0.2s; white-space: nowrap;
    }
    .search-btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .search-btn:not(:disabled):hover { opacity: 0.85; }
    .input-error { color: #e05252; font-size: 0.82rem; margin-top: 0.6rem; }

    .control-group--filter { max-width: 280px; }

    /* ── Sticky first column ── */
    .results-table th:first-child {
      position: sticky; left: 0; z-index: 3;
      background: #141419;
    }
    .results-table td:first-child {
      position: sticky; left: 0; z-index: 1;
      background: #0a0a0f;
    }
    .results-table tr:hover td:first-child { background: #101015; }

    /* ── Mint filter ── */
    .controls-filter {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid var(--border);
    }
    .mint-range-inputs {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .mint-range-inputs .control-input {
      flex: 1;
      min-width: 0;
    }
    .range-sep {
      color: var(--text-secondary);
      flex-shrink: 0;
      font-size: 0.9rem;
    }

    /* ── Status ── */
    .status-wrap {
      text-align: center; padding: 3rem 1rem;
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
    }
    .spinner {
      width: 32px; height: 32px; border-radius: 50%;
      border: 3px solid var(--border);
      border-top-color: var(--accent-light);
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .status-text { color: var(--text-secondary); font-size: 0.9rem; }

    /* ── Results ── */
    .results-meta {
      color: var(--text-secondary); font-size: 0.8rem;
      margin-bottom: 0.75rem; padding: 0 0.25rem;
    }
    .results-meta strong { color: var(--text-primary); }
    .table-scroll { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); }
    .results-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    .results-table th {
      background: rgba(255,255,255,0.04);
      color: var(--text-secondary); font-size: 0.72rem; font-weight: 600;
      letter-spacing: 0.05em; padding: 0.65rem 0.85rem;
      text-align: left; text-transform: uppercase; white-space: nowrap;
      position: sticky; top: 0; z-index: 2;
      border-bottom: 1px solid var(--border);
    }
    .results-table th.col-wallet {
      text-align: right; color: var(--accent-light);
      max-width: 130px; overflow: hidden; text-overflow: ellipsis;
    }
    .results-table td { border-top: 1px solid var(--border); padding: 0.5rem 0.85rem; vertical-align: top; }
    .results-table tr:hover td { background: var(--bg-row-alt); }
    .results-table td.col-num {
      color: var(--text-secondary); font-size: 0.9rem; text-align: right;
      font-variant-numeric: tabular-nums;
    }
    .results-table td.col-wallet {
      white-space: nowrap; padding-left: 0.6rem; padding-right: 0.6rem;
    }
    .wallet-cell {
      display: flex; justify-content: space-between; align-items: center; gap: 0.5rem;
    }
    .wallet-copies {
      color: var(--text-secondary); font-size: 0.85rem; font-weight: 400;
    }
    .wallet-mint {
      font-variant-numeric: tabular-nums; text-align: right;
    }
    .wallet-next-mints {
      font-size: 0.8rem; color: var(--text-secondary); text-align: right;
      margin-top: 0.15rem; font-variant-numeric: tabular-nums;
    }
    .mint-lowest .wallet-next-mints { opacity: 0.6; }
    .results-table td.col-empty { color: var(--text-secondary); text-align: right; padding-left: 0.6rem; padding-right: 0.6rem; }
    .mint-lowest {
      background: rgba(250,165,0,0.1) !important;
    }
    .mint-lowest .wallet-mint {
      color: var(--accent-light); font-weight: 700;
    }
    .mint-lowest .wallet-copies {
      color: var(--accent-light); opacity: 0.7;
    }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .page-main { padding: 1.25rem 0.75rem; }
      .page-header { margin-bottom: 1.25rem; }
      .page-title { font-size: 1.4rem; }
      .controls-card { padding: 1.25rem 1rem; }
      .search-btn { width: 100%; }
      .control-group--filter { max-width: none; }
      .results-table { font-size: 0.85rem; }
      .results-table th,
      .results-table td { padding: 0.4rem 0.5rem; }
      .results-table td.col-wallet,
      .results-table td.col-empty { padding-left: 0.35rem; padding-right: 0.35rem; }
    }

    /* ── Rarity badges ── */
    .rarity-badge {
      display: inline-block; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase;
      padding: 0.15rem 0.5rem; border-radius: 999px;
      border: 1px solid transparent;
    }
    .rarity-mythic    { color: var(--rarity-mythic); background-image: linear-gradient(var(--bg-card), var(--bg-card)), linear-gradient(90deg, #01ffff, #9926c1); background-origin: border-box; background-clip: padding-box, border-box; }
    .rarity-ultra     { color: var(--rarity-ultra);      border-color: var(--rarity-ultra);      background: rgba(232,255,0,0.08); }
    .rarity-grail     { color: var(--rarity-grail);      border-color: var(--rarity-grail);      background: rgba(250,165,0,0.12); }
    .rarity-legendary { color: var(--rarity-legendary);  border-color: var(--rarity-legendary);  background: rgba(233,52,148,0.12); }
    .rarity-royalty   { color: var(--rarity-royalty);    border-color: var(--rarity-royalty);    background: rgba(0,125,235,0.12); }
    .rarity-epic      { color: var(--rarity-epic);       border-color: var(--rarity-epic);       background: rgba(192,132,252,0.12); }
    .rarity-rare      { color: var(--rarity-rare);       border-color: var(--rarity-rare);       background: rgba(96,165,250,0.12); }
    .rarity-uncommon  { color: var(--rarity-uncommon);   border-color: var(--rarity-uncommon);   background: rgba(74,222,128,0.10); }
    .rarity-common    { color: var(--rarity-common);     border-color: var(--rarity-common);     background: rgba(156,163,175,0.10); }
    .rarity-redeemable{ color: var(--rarity-redeemable); border-color: var(--rarity-redeemable); background: rgba(249,115,22,0.12); }
    .rarity-pack      { color: var(--rarity-pack);       border-color: var(--rarity-pack);       background: rgba(148,163,184,0.10); }
  </style>
</head>
<body>
  <div id="nav"></div>

  <main class="page-main">
    <div class="page-header">
      <h1 class="page-title">Funko Mint <span class="accent">#</span> Tracker</h1>
      <p class="page-desc">Compare mint numbers across up to 5 WAX wallets for any drop</p>
    </div>

    <div class="controls-card">
      <div class="controls-row">
        <div class="control-group">
          <label for="dropSelect" class="control-label">Drop</label>
          <select id="dropSelect" class="control-select">
            <option value="">— Select a drop —</option>
          </select>
        </div>
        <div class="control-group control-group--wide">
          <label for="walletsInput" class="control-label">
            Wallets <span class="control-hint">(up to 5, comma-separated)</span>
          </label>
          <input id="walletsInput" class="control-input" type="text"
            placeholder="wallet1.wam, wallet2.dp, ..." autocomplete="off" spellcheck="false" />
        </div>
        <button id="searchBtn" class="search-btn" disabled>Search</button>
      </div>
      <div id="inputError" class="input-error" style="display:none;"></div>
      <div class="controls-row controls-filter" id="filterRow" style="display:none;">
        <div class="control-group control-group--filter">
          <label class="control-label">Filter by Mint Range</label>
          <div class="mint-range-inputs">
            <input id="mintMin" class="control-input" type="number" min="1" placeholder="Min" oninput="applyFilter()" />
            <span class="range-sep">—</span>
            <input id="mintMax" class="control-input" type="number" min="1" placeholder="Max" oninput="applyFilter()" />
          </div>
        </div>
      </div>
    </div>

    <div id="statusWrap" class="status-wrap" style="display:none;">
      <div class="spinner"></div>
      <div id="statusText" class="status-text"></div>
    </div>

    <div id="resultsWrap" style="display:none;">
      <div class="results-meta" id="resultsMeta"></div>
      <div class="table-scroll">
        <table class="results-table">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <script src="nav.js"></script>
  <script>
    'use strict';

    const MAX_WAL   = 5;

    let API          = '';
    let packsCatalog = [];
    let rarityRank   = {};
    let lastSorted   = [];
    let lastWalletMaps = [];

    // ── Data loading ──────────────────────────────────────────────────────────

    async function loadJSON(path) {
      const r = await fetch(path);
      if (!r.ok) throw new Error(`Failed to load ${path}`);
      return r.json();
    }

    function fmtSchema(schema) {
      const s = schema.replace(/\.drop$/, '').replace(/([a-z])(\d)/g, '$1 $2');
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    async function init() {
      const [drops, packs, sortOrder, endpoint] = await Promise.all([
        loadJSON('data/drops_catalog.json'),
        loadJSON('data/packs_catalog.json'),
        loadJSON('data/sort_order.json'),
        loadJSON('data/wax_endpoint.json'),
      ]);

      API = endpoint.atomicassets;

      packsCatalog = packs;

      sortOrder.rarity.forEach((r, i) => {
        rarityRank[r.toLowerCase()] = i;
      });

      const sel = document.getElementById('dropSelect');
      for (const d of drops) {
        const opt = document.createElement('option');
        opt.value = `${d.collection}|${d.schema}`;
        opt.textContent = `${d.displayname ?? d.collection}  —  ${fmtSchema(d.schema)}`;
        sel.appendChild(opt);
      }

      sel.addEventListener('change', updateBtn);
      document.getElementById('walletsInput').addEventListener('input', updateBtn);
      document.getElementById('searchBtn').addEventListener('click', onSearch);
    }

    function updateBtn() {
      const hasDrop    = document.getElementById('dropSelect').value !== '';
      const hasWallets = document.getElementById('walletsInput').value.trim() !== '';
      document.getElementById('searchBtn').disabled = !(hasDrop && hasWallets);
    }

    // ── API helpers ───────────────────────────────────────────────────────────

    async function apiFetch(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`API ${r.status}: ${url}`);
      const json = await r.json();
      if (!json.success) throw new Error(`API error: ${url}`);
      return json.data;
    }

    async function fetchAllPages(baseUrl) {
      const out = [];
      let page = 1;
      while (true) {
        const data = await apiFetch(`${baseUrl}&page=${page}&limit=1000`);
        out.push(...data);
        if (data.length < 1000) break;
        page++;
      }
      return out;
    }

    // ── Search ────────────────────────────────────────────────────────────────

    async function onSearch() {
      const btn = document.getElementById('searchBtn');
      btn.disabled = true;
      hideError();
      hideResults();

      const wallets = [...new Set(
        document.getElementById('walletsInput').value
          .split(',').map(w => w.trim()).filter(Boolean)
      )];

      if (wallets.length === 0) {
        showError('Enter at least one wallet address.');
        btn.disabled = false; return;
      }
      if (wallets.length > MAX_WAL) {
        showError(`Maximum ${MAX_WAL} wallets allowed.`);
        btn.disabled = false; return;
      }

      const [collection, schema] = document.getElementById('dropSelect').value.split('|');

      const packEntry = packsCatalog.find(e => e.collection === collection && e.schema === schema);
      const packIds   = new Set((packEntry?.packs ?? []).map(String));

      try {
        setStatus('Fetching template data…');
        const rawTemplates = await fetchAllPages(
          `${API}/templates?collection_name=${collection}&schema_name=${schema}`
        );

        const templates = new Map();
        for (const t of rawTemplates) {
          if (parseInt(t.issued_supply, 10) === 0) continue;
          const d = t.immutable_data ?? {};
          templates.set(t.template_id, {
            templateId : t.template_id,
            name       : d.name   ?? t.name ?? `#${t.template_id}`,
            cardId     : d.cardid ?? '—',
            rarity     : packIds.has(t.template_id) ? 'Pack' : (d.rarity ?? 'Unknown'),
          });
        }

        setStatus(`Fetching assets for ${wallets.length} wallet${wallets.length > 1 ? 's' : ''}…`);
        const walletMaps = await Promise.all(wallets.map(w => fetchWalletAssets(collection, schema, w)));

        hideStatus();
        renderTable(templates, wallets, walletMaps);

      } catch (err) {
        hideStatus();
        showError(err.message);
      }

      btn.disabled = false;
    }

    async function fetchWalletAssets(collection, schema, wallet) {
      const map = new Map(); // templateId → { lowestMint, count }
      try {
        const assets = await fetchAllPages(
          `${API}/assets?collection_name=${collection}&schema_name=${schema}&owner=${wallet}&sort=template_mint&order=asc`
        );
        for (const a of assets) {
          const tid  = a.template?.template_id;
          const mint = parseInt(a.template_mint, 10);
          if (!tid || isNaN(mint)) continue;
          if (!map.has(tid)) {
            map.set(tid, { mints: [mint], count: 1 });
          } else {
            const e = map.get(tid);
            e.count++;
            e.mints.push(mint);
          }
        }
        // Sort and trim to 4 lowest per template
        for (const e of map.values()) {
          e.mints.sort((a, b) => a - b);
          e.mints = e.mints.slice(0, 4);
        }
      } catch (e) {
        console.warn(`Could not fetch assets for ${wallet}:`, e.message);
      }
      return map;
    }

    // ── Render ────────────────────────────────────────────────────────────────

    function rarityKey(r) { return r.toLowerCase().replace(/\s+/g, ''); }

    function getRank(rarity) {
      return rarityRank[rarity.toLowerCase()] ?? 999;
    }

    function abbrev(wallet) {
      return wallet.length > 13 ? wallet.slice(0, 6) + '…' + wallet.slice(-4) : wallet;
    }

    function renderTable(templates, wallets, walletMaps) {
      const sorted = [...templates.values()].sort((a, b) => {
        const rd = getRank(a.rarity) - getRank(b.rarity);
        if (rd !== 0) return rd;
        const ca = parseInt(a.cardId, 10), cb = parseInt(b.cardId, 10);
        if (!isNaN(ca) && !isNaN(cb)) return ca - cb;
        return String(a.cardId).localeCompare(String(b.cardId));
      });

      // Head
      const thead = document.getElementById('tableHead');
      thead.innerHTML = '';
      const hr = document.createElement('tr');
      ['Card ID', 'Name', 'Template ID', 'Rarity', ...wallets.map(abbrev)].forEach((col, i) => {
        const th = document.createElement('th');
        th.textContent = col;
        if (i === 0 || i === 2) th.style.textAlign = 'right';
        if (i >= 4) {
          th.className = 'col-wallet';
          th.title = wallets[i - 4];
        }
        hr.appendChild(th);
      });
      thead.appendChild(hr);

      // Body
      const tbody = document.getElementById('tableBody');
      tbody.innerHTML = '';
      const frag = document.createDocumentFragment();

      lastSorted     = sorted;
      lastWalletMaps = walletMaps;

      const curMin = parseInt(document.getElementById('mintMin').value, 10);
      const curMax = parseInt(document.getElementById('mintMax').value, 10);
      const curHasMin = !isNaN(curMin);
      const curHasMax = !isNaN(curMax);

      for (const tmpl of sorted) {
        const row = document.createElement('tr');

        // Card ID
        const tdCard = document.createElement('td');
        tdCard.textContent = tmpl.cardId;
        tdCard.className = 'col-num';
        row.appendChild(tdCard);

        // Name
        const tdName = document.createElement('td');
        tdName.textContent = tmpl.name;
        row.appendChild(tdName);

        // Template ID
        const tdTid = document.createElement('td');
        tdTid.textContent = tmpl.templateId;
        tdTid.className = 'col-num';
        row.appendChild(tdTid);

        // Rarity
        const tdRarity = document.createElement('td');
        const badge = document.createElement('span');
        badge.className = `rarity-badge rarity-${rarityKey(tmpl.rarity)}`;
        badge.textContent = tmpl.rarity;
        tdRarity.appendChild(badge);
        row.appendChild(tdRarity);

        fillWalletCells(row, tmpl, walletMaps, curHasMin, curMin, curHasMax, curMax);

        frag.appendChild(row);
      }

      tbody.appendChild(frag);

      // Meta
      const dropLabel = document.getElementById('dropSelect').selectedOptions[0].text;
      document.getElementById('resultsMeta').innerHTML =
        `<strong>${sorted.length}</strong> templates &nbsp;·&nbsp; <strong>${wallets.length}</strong> wallet${wallets.length > 1 ? 's' : ''} &nbsp;·&nbsp; ${dropLabel}`;

      document.getElementById('filterRow').style.display = '';
      showResults();
    }

    // ── Mint filter ───────────────────────────────────────────────────────────

    function mintInRange(m, hasMin, min, hasMax, max) {
      return (!hasMin || m >= min) && (!hasMax || m <= max);
    }

    function fillWalletCells(row, tmpl, walletMaps, hasMin, min, hasMax, max) {
      // Remove existing wallet TDs (keep first 4: Name, Card ID, Template ID, Rarity)
      while (row.cells.length > 4) row.deleteCell(4);

      // Find lowest in-range mint across all wallets
      let lowest = Infinity;
      for (const wmap of walletMaps) {
        const e = wmap.get(tmpl.templateId);
        if (e) {
          for (const m of e.mints) {
            if (mintInRange(m, hasMin, min, hasMax, max) && m < lowest) lowest = m;
          }
        }
      }

      for (const wmap of walletMaps) {
        const td    = document.createElement('td');
        const entry = wmap.get(tmpl.templateId);
        if (entry) {
          const visible = entry.mints.filter(m => mintInRange(m, hasMin, min, hasMax, max));
          const isLowest = visible.length > 0 && visible[0] === lowest;
          td.className = 'col-wallet' + (isLowest ? ' mint-lowest' : '');

          const cell = document.createElement('div');
          cell.className = 'wallet-cell';
          const spanCopies = document.createElement('span');
          spanCopies.className = 'wallet-copies';
          spanCopies.textContent = `${entry.count}x`;
          const spanMint = document.createElement('span');
          spanMint.className = 'wallet-mint';
          spanMint.textContent = visible.length > 0 ? `#${visible[0]}` : '—';
          cell.appendChild(spanCopies);
          cell.appendChild(spanMint);
          td.appendChild(cell);

          if (visible.length > 1) {
            const next = document.createElement('div');
            next.className = 'wallet-next-mints';
            next.textContent = visible.slice(1).map(m => `#${m}`).join(', ');
            td.appendChild(next);
          }
        } else {
          td.className = 'col-empty';
          td.textContent = '—';
        }
        row.appendChild(td);
      }
    }

    function applyFilter() {
      const minVal = parseInt(document.getElementById('mintMin').value, 10);
      const maxVal = parseInt(document.getElementById('mintMax').value, 10);
      const hasMin = !isNaN(minVal);
      const hasMax = !isNaN(maxVal);

      const rows = document.querySelectorAll('#tableBody tr');
      lastSorted.forEach((tmpl, i) => {
        fillWalletCells(rows[i], tmpl, lastWalletMaps, hasMin, minVal, hasMax, maxVal);
      });
    }

    // ── UI helpers ────────────────────────────────────────────────────────────

    function setStatus(msg) {
      document.getElementById('statusText').textContent = msg;
      document.getElementById('statusWrap').style.display = 'flex';
    }
    function hideStatus()  { document.getElementById('statusWrap').style.display  = 'none'; }
    function showResults() { document.getElementById('resultsWrap').style.display = 'block'; }
    function hideResults() { document.getElementById('resultsWrap').style.display = 'none'; }
    function showError(msg) {
      const el = document.getElementById('inputError');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() { document.getElementById('inputError').style.display = 'none'; }

    // ── Boot ──────────────────────────────────────────────────────────────────
    init().catch(err => showError(`Init failed: ${err.message}`));
  </script>
</body>
</html>
