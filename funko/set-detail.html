<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Detail — Funko Digital — PopInStock</title>
  <link rel="icon" type="image/png" href="../images/FoxLogo.png" />
  <link rel="stylesheet" href="../shared/global.css" />
  <style>
    /* ── Banner ── */
    .drop-banner-wrap { position: relative; width: 100%; height: 200px; overflow: hidden; }
    .drop-banner-img  { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.6; }
    .drop-banner-fade { position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(10,10,15,0.2) 0%, rgba(10,10,15,0.5) 50%, var(--bg) 100%); }

    /* ── Drop header ── */
    .drop-header { display: flex; align-items: flex-start; gap: 1.25rem; padding: 1.5rem 1.5rem 0.5rem; max-width: 1100px; margin: 0 auto; width: 100%; }
    .drop-header.has-banner { padding-top: 0; margin-top: -160px; position: relative; z-index: 1; }
    .drop-logo { width: 72px; height: 72px; border-radius: 10px; object-fit: contain; background: #0d0d18; border: 1px solid var(--border); flex-shrink: 0; }
    .drop-logo-placeholder { width: 72px; height: 72px; border-radius: 10px; background: #0d0d18; border: 1px solid var(--border); flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #333; font-size: 1.5rem; }
    .drop-header-info { display: flex; flex-direction: column; gap: 0.25rem; padding-top: 4px; }
    .drop-schema-label { font-size: 0.68rem; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; color: var(--accent); }
    .drop-name { font-size: clamp(1.2rem, 3vw, 1.8rem); font-weight: 800; letter-spacing: -0.5px; line-height: 1.2; }
    .drop-meta { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; }
    .drop-release-date { font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 0.2rem; }

    /* ── Content ── */
    .content { padding: 1.25rem 1.5rem 4rem; display: flex; flex-direction: column; gap: 2rem; }

    /* ── Stat card colors ── */
    .stat-card.burned  .stat-value { color: #e74c3c; }
    .stat-card.locked  .stat-value { color: #a78bfa; }
    .stat-card.owners  .stat-value { color: #3b82f6; }

    /* ── Rarity pills ── */
    .rarity-pills { display: flex; flex-wrap: wrap; gap: 6px; }
    .rarity-pill  { padding: 5px 13px; gap: 6px; font-size: 0.82rem; }
    .pill-count   { opacity: 0.7; font-weight: 500; }

    /* ── Results meta ── */
    .results-meta { font-size: 0.8rem; color: var(--text-secondary); min-height: 1.2em; }
    .results-meta strong { color: var(--text-primary); }
    .results-meta .updated { opacity: 0.65; }

    /* ── Market table ── */
    .market-table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }
    .market-table thead th {
      text-align: left; padding: 8px 12px;
      font-size: 0.65rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
      color: var(--text-secondary); background: var(--bg-card);
      border-bottom: 1px solid var(--border); white-space: nowrap;
    }
    .market-table thead th.col-r  { text-align: right; }
    .market-table thead th.sortable { cursor: pointer; user-select: none; }
    .market-table thead th.sortable:hover { color: var(--text-primary); }
    .market-table thead th .sort-icon { font-size: 0.6rem; opacity: 0.45; margin-left: 3px; }
    .market-table thead th.sorted .sort-icon { opacity: 1; color: var(--accent-light); }
    .market-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
    .market-table tbody tr:last-child { border-bottom: none; }
    .market-table tbody tr:hover { background: rgba(255,255,255,0.04); }
    .market-table tbody td { padding: 8px 12px; vertical-align: middle; }
    .market-table tbody td.col-r { text-align: right; font-variant-numeric: tabular-nums; }

    /* ── Unlisted rows ── */
    .market-table tbody tr.row-unlisted { background: rgba(220,60,60,0.05); opacity: 0.55; }
    .market-table tbody tr.row-unlisted:hover { background: rgba(220,60,60,0.09); opacity: 0.8; }

    /* ── Table cell content ── */
    .cell-card-name  { font-size: 0.85rem; color: var(--text-primary); }
    .cell-drop-name  { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
    .cell-drop-schema { font-size: 0.62rem; font-weight: 700; color: var(--accent); text-transform: uppercase; letter-spacing: 0.06em; margin-top: 2px; }
    .cell-price      { display: block; font-size: 0.88rem; font-weight: 700; color: var(--text-primary); white-space: nowrap; }
    .cell-price.price-null { color: rgba(255,255,255,0.2); font-weight: 400; font-size: 0.82rem; }
    .cell-price-usd  { font-size: 0.78rem; color: var(--text-secondary); white-space: nowrap; margin-top: 2px; }

    .excl-badge {
      display: inline-flex; align-items: center;
      font-size: 0.58rem; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      color: var(--accent-light); border: 1px solid rgba(240,168,64,0.3);
      background: rgba(240,168,64,0.08); border-radius: 4px;
      padding: 1px 4px; margin-left: 5px; vertical-align: middle; line-height: 1.4;
    }

    /* ── Marketplace link icons ── */
    .market-links { display: flex; align-items: center; gap: 1rem; justify-content: flex-end; }
    .market-link  { display: flex; align-items: center; opacity: 0.4; transition: opacity 0.15s; text-decoration: none; }
    .market-link:hover { opacity: 1; }
    .market-link img { width: 20px; height: 20px; object-fit: contain; }
    .market-link--primary { opacity: 1; transition: filter 0.2s; }
    .market-link--primary img { width: 24px; height: 24px; }
    .market-link--primary:hover { filter: drop-shadow(0 0 6px rgba(240,168,64,0.9)) drop-shadow(0 0 12px rgba(240,168,64,0.5)); }

    @media (max-width: 600px) {
      .drop-header { flex-direction: column; align-items: flex-start; gap: 0.75rem; }
      .drop-header.has-banner { margin-top: -110px; }
      .drop-banner-wrap { height: 140px; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

<div class="page" id="pageRoot">
  <div class="state">Loading…</div>
</div>

<script src="../shared/supabase-config.js"></script>
<script src="nav.js"></script>
<script>
const RARITY_ORDER = ['Common','Uncommon','Rare','Epic','Series','Ultra','Legendary','Grail','Mythic','Royalty','1 of 1','Redeemable','Packs'];
const RARITY_CLASS = {
  'Common':'r-common','Uncommon':'r-uncommon','Rare':'r-rare','Epic':'r-epic',
  'Series':'r-series','Ultra':'r-ultra','Legendary':'r-legendary','Grail':'r-grail',
  'Mythic':'r-mythic','Royalty':'r-royalty','1 of 1':'r-1of1','Redeemable':'r-redeemable',
  'Packs':'r-pack',
};
const ATOMIC_MARKET = 'https://wax.atomichub.io/market';

const params = new URLSearchParams(location.search);
const COL    = params.get('collection') || '';
const SCH    = params.get('schema')     || '';

const state = { sortField: 'id', sortDir: 'asc' };
let allRows = [];

/* ── Helpers ── */
function enc(v)    { return encodeURIComponent(v); }
function fmt(n)    { return Number(n).toLocaleString(); }
function fmtUsd(v) { return v == null ? null : '$' + Number(v).toFixed(2); }
function fmtWax(wax) {
  if (wax == null) return null;
  if (wax < 1) return wax.toFixed(4) + ' WAX';
  return wax.toFixed(2) + ' WAX';
}
function buildPriceCell(row) {
  const wax = row.wax_price_wax, usd = row.wax_price_usd;
  if (wax == null && usd == null) return '<span class="cell-price price-null">—</span>';
  if (wax != null) {
    const sub = usd != null ? `<div class="cell-price-usd">≈ $${usd.toFixed(2)}</div>` : '';
    return `<span class="cell-price">${fmtWax(wax)}</span>${sub}`;
  }
  return `<span class="cell-price">$${usd.toFixed(2)}</span>`;
}
function fmtDate(iso) {
  if (!iso) return '';
  return new Date(iso).toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
}
function fmtAgo(ts) {
  if (!ts) return '';
  const d = Math.floor((Date.now() - new Date(ts)) / 60000);
  if (d < 1)    return 'just now';
  if (d < 60)   return d + 'm ago';
  if (d < 1440) return Math.floor(d / 60) + 'h ago';
  return Math.floor(d / 1440) + 'd ago';
}
function schemaLabel(sn) {
  const b = (sn || '').replace('.drop', '');
  const m = b.match(/^series(\d+)$/);
  return m ? 'Series ' + m[1] : b.charAt(0).toUpperCase() + b.slice(1);
}
function cleanName(name) {
  return (name || '')
    .replace(/^Funko Presents\s+/i, '')
    .replace(/:\s*Funko Digital Pop!$/i, '')
    .replace(/\s+X\s+Funko$/i, '')
    .replace(/:\s*Funko Digital$/i, '')
    .replace(/\s+x\s+Funko Digital Pop!$/i, '');
}
function ipfsUrl(cid) {
  if (!cid) return '';
  if (cid.startsWith('http'))   return cid;
  if (cid.startsWith('ipfs://')) return IPFS_GATEWAY + cid.slice(7);
  return IPFS_GATEWAY + cid;
}

/* ── Supabase fetch ── */
async function sbFetch(table, qs) {
  const url = SUPABASE_URL + '/rest/v1/' + table + (qs ? '?' + qs : '');
  const r = await fetch(url, {
    headers: {
      'apikey':         SUPABASE_ANON_KEY,
      'Authorization':  'Bearer ' + SUPABASE_ANON_KEY,
      'Accept-Profile': 'funko',
    }
  });
  if (!r.ok) throw new Error('Supabase ' + r.status + ' on ' + table);
  return r.json();
}

/* ── Sort ── */
function sortRows(rows) {
  return [...rows].sort((a, b) => {
    if (state.sortField === 'price') {
      const pa = a.wax_price_usd, pb = b.wax_price_usd;
      if (pa == null && pb == null) return (a.cardid || 0) - (b.cardid || 0);
      if (pa == null) return 1;
      if (pb == null) return -1;
      const d = state.sortDir === 'asc' ? pa - pb : pb - pa;
      return d !== 0 ? d : (a.cardid || 0) - (b.cardid || 0);
    }
    const d = state.sortDir === 'asc'
      ? (a.cardid || 0) - (b.cardid || 0)
      : (b.cardid || 0) - (a.cardid || 0);
    return d !== 0 ? d : (a.wax_price_usd ?? Infinity) - (b.wax_price_usd ?? Infinity);
  });
}

function toggleSort(field) {
  if (state.sortField === field) {
    state.sortDir = state.sortDir === 'asc' ? 'desc' : 'asc';
  } else {
    state.sortField = field;
    state.sortDir   = 'asc';
  }
  buildTable();
}

/* ── Table ── */
function buildTable() {
  const wrap = document.getElementById('tableContainer');
  const meta = document.getElementById('resultsMeta');
  if (!wrap) return;

  const rows     = sortRows(allRows);
  const listed   = rows.filter(r => r.wax_price_usd != null).length;
  const fetchedAt = rows.length > 0 ? rows[0].fetched_at : null;

  const idSi    = state.sortField === 'id'    ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';
  const priceSi = state.sortField === 'price' ? (state.sortDir === 'asc' ? '↑' : '↓') : '↕';

  let h = `<table class="market-table">
    <thead><tr>
      <th class="sortable${state.sortField==='id'?' sorted':''}" style="min-width:200px" id="idHdr">
        ID — Card <span class="sort-icon">${idSi}</span>
      </th>
      <th style="min-width:150px">Drop</th>
      <th class="col-r sortable${state.sortField==='price'?' sorted':''}" style="width:120px" id="priceHdr">
        Floor Price <span class="sort-icon">${priceSi}</span>
      </th>
      <th class="col-r" style="width:140px">Market</th>
    </tr></thead>
    <tbody>`;

  for (const row of rows) {
    const unlisted = row.wax_price_wax == null && row.wax_price_usd == null;
    const ph = buildPriceCell(row);

    const excl = row.droppp_exclusive ? '<span class="excl-badge">Excl</span>' : '';
    const tid  = row.template_id;
    const col  = row.collection_name;
    const sch  = row.schema_name;

    const links = [
      { href: `../marketplace.html?template_id=${enc(tid)}`,
        icon: '../images/FoxLogo.png', title: 'Buy on PopInStock', cls: 'market-link market-link--primary' },
      { href: `${ATOMIC_MARKET}?blockchain=wax-mainnet&order=asc&primary_chain=wax-mainnet&sort=price&symbol=WAX&template_id=${enc(tid)}`,
        icon: '../images/atomic.svg', title: 'View on AtomicHub' },
      // { href: `https://neftyblocks.com/marketplace/listing?collection_name=${enc(col)}&order=asc&page=1&sort=price&template_id=${enc(tid)}`,
      //   icon: '../images/neftyblocks.svg', title: 'View on NeftyBlocks' },
      { href: `https://nfthive.io/market?term=${enc(tid)}&order_by=price_asc&offer_type=listings`,
        icon: '../images/nfthive.svg', title: 'View on NFTHive' },
    ];

    const linksHtml = links.map(l =>
      `<a class="${l.cls || 'market-link'}" href="${l.href}" target="_blank" rel="noopener noreferrer" title="${l.title}"><img src="${l.icon}" alt="${l.title}"></a>`
    ).join('');

    h += `<tr${unlisted ? ' class="row-unlisted"' : ''}>
      <td>
        <div class="cell-card-name">${row.cardid != null ? row.cardid + ' — ' : ''}${row.name || '—'}</div>
        <div style="margin-top:3px"><span class="rarity-pill ${RARITY_CLASS[row.rarity] || ''}">${row.rarity || '—'}</span></div>
      </td>
      <td>
        <div class="cell-drop-name">${row.drop_displayname || col}${excl}</div>
        <div class="cell-drop-schema">${schemaLabel(sch)}</div>
      </td>
      <td class="col-r">${ph}</td>
      <td class="col-r"><div class="market-links">${linksHtml}</div></td>
    </tr>`;
  }

  h += '</tbody></table>';
  wrap.innerHTML = h;
  wrap.querySelector('#idHdr').addEventListener('click',    () => toggleSort('id'));
  wrap.querySelector('#priceHdr').addEventListener('click', () => toggleSort('price'));

  if (meta) meta.innerHTML = `<strong>${listed}</strong> of <strong>${rows.length}</strong> cards listed` +
    (fetchedAt ? ` <span class="updated">· updated ${fmtAgo(fetchedAt)}</span>` : '');
}

/* ── Init ── */
async function init() {
  const root = document.getElementById('pageRoot');

  if (!COL || !SCH) {
    root.innerHTML = '<div class="state state-error">Missing collection or schema parameter.</div>';
    return;
  }

  try {
    const [colData, statsData, officialData, templateRows, priceRows] = await Promise.all([
      sbFetch('collections',
        'select=collection_name,display_name,img,logo,banner' +
        '&collection_name=eq.' + enc(COL) + '&limit=1'),
      sbFetch('schema_stats',
        'select=total_assets,total_burned,unique_owners,total_templates,rarity_breakdown,created_at,updated_at' +
        '&collection_name=eq.' + enc(COL) +
        '&schema_name=eq.' + enc(SCH) + '&limit=1'),
      sbFetch('top_holders',
        'select=total_assets' +
        '&collection_name=eq.' + enc(COL) +
        '&schema_name=eq.' + enc(SCH) +
        '&is_official=eq.true'),
      sbFetch('templates',
        'select=template_id,name,rarity,cardid,dp_locked_count' +
        '&collection_name=eq.' + enc(COL) +
        '&schema_name=eq.' + enc(SCH) +
        '&order=cardid.asc&limit=1000'),
      sbFetch('funko_market_prices',
        'select=template_id,droppp_exclusive,wax_price_wax,wax_price_usd,fetched_at' +
        '&collection_name=eq.' + enc(COL) +
        '&schema_name=eq.' + enc(SCH) +
        '&limit=1000'),
    ]);

    const priceMap = new Map(priceRows.map(p => [String(p.template_id), p]));
    const displayName = (colData[0] || {}).display_name || COL;

    allRows = templateRows.map(t => {
      const p = priceMap.get(String(t.template_id)) || {};
      return {
        template_id:      String(t.template_id),
        collection_name:  COL,
        schema_name:      SCH,
        name:             t.name || `#${t.template_id}`,
        rarity:           t.rarity || 'Unknown',
        cardid:           t.cardid ?? null,
        dp_locked_count:  t.dp_locked_count ?? 0,
        drop_displayname: displayName,
        droppp_exclusive: p.droppp_exclusive ?? false,
        wax_price_wax:    p.wax_price_wax ?? null,
        wax_price_usd:    p.wax_price_usd ?? null,
        fetched_at:       p.fetched_at ?? null,
      };
    });

    const col      = colData[0]   || {};
    const stats    = statsData[0] || {};
    const dropName = cleanName(col.display_name || COL);
    const label    = schemaLabel(SCH);

    document.title = `${dropName} ${label} — Market — PopInStock`;

    // Banner
    const bannerCid  = col.banner;
    const bannerHtml = bannerCid
      ? `<div class="drop-banner-wrap">
           <img class="drop-banner-img" src="${ipfsUrl(bannerCid)}" alt="" onerror="this.closest('.drop-banner-wrap').remove()">
           <div class="drop-banner-fade"></div>
         </div>`
      : '';

    // Logo
    const logoCid  = col.logo || col.img;
    const logoHtml = logoCid
      ? `<img class="drop-logo" src="${ipfsUrl(logoCid)}" alt="${dropName}" onerror="this.outerHTML='<div class=\\'drop-logo-placeholder\\'>&#9670;</div>'">`
      : `<div class="drop-logo-placeholder">&#9670;</div>`;

    // Asset stats
    const active     = stats.total_assets || 0;
    const burned     = stats.total_burned  || 0;
    const minted     = active + burned;
    const inOfficial      = officialData.reduce((sum, r) => sum + (r.total_assets || 0), 0);
    const dpLocked        = allRows.reduce((sum, r) => sum + (r.dp_locked_count || 0), 0);
    const dpLockedDisplay = dpLocked - inOfficial;
    const circulation     = active - dpLocked;

    const statsHtml = `
      <div class="stat-card">
        <div class="stat-value">${fmt(minted)}</div>
        <div class="stat-label">Minted</div>
      </div>
      <div class="stat-card burned">
        <div class="stat-value">${fmt(burned)}</div>
        <div class="stat-label">Burned</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${fmt(inOfficial)}</div>
        <div class="stat-label">In Packs</div>
      </div>
      <div class="stat-card locked">
        <div class="stat-value">${fmt(dpLockedDisplay)}</div>
        <div class="stat-label">Locked on Droppp</div>
      </div>
      <div class="stat-card owners">
        <div class="stat-value">${fmt(circulation)}</div>
        <div class="stat-label">In Circulation</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${fmt(stats.unique_owners || 0)}</div>
        <div class="stat-label">Unique Owners</div>
      </div>
      <div class="stat-card">
        <div class="stat-value">${fmt(stats.total_templates || 0)}</div>
        <div class="stat-label">Templates</div>
      </div>`;

    // Rarity breakdown
    const rarityCounts = stats.rarity_breakdown || {};
    const rarityPills  = RARITY_ORDER
      .filter(r => rarityCounts[r])
      .map(r => `<span class="rarity-pill ${RARITY_CLASS[r] || ''}">${r} <span class="pill-count">${rarityCounts[r]}</span></span>`)
      .join('');
    const extraPills = Object.entries(rarityCounts)
      .filter(([r]) => !RARITY_ORDER.includes(r))
      .map(([r, n]) => `<span class="rarity-pill">${r} <span class="pill-count">${n}</span></span>`)
      .join('');

    root.innerHTML = `
      ${bannerHtml}
      <div class="drop-header${bannerCid ? ' has-banner' : ''}">
        ${logoHtml}
        <div class="drop-header-info">
          ${stats.created_at ? `<div class="drop-release-date">Released ${fmtDate(stats.created_at)}</div>` : ''}
          <div class="drop-schema-label">${label}</div>
          <div class="drop-name">${dropName}</div>
          <div class="drop-meta">${COL}</div>
        </div>
      </div>

      <div class="content">
        <div class="section">
          <div class="section-heading">Asset Stats <span style="font-size:0.72rem;font-weight:400;color:var(--text-secondary);text-transform:none;letter-spacing:0;margin-left:0.5rem">Last updated: ${stats.updated_at ? new Date(stats.updated_at).toLocaleDateString('en-US',{year:'numeric',month:'long',day:'numeric'}) : '—'}</span></div>
          <div class="stats-grid">${statsHtml}</div>
        </div>

        ${(rarityPills || extraPills) ? `
        <div class="section">
          <div class="section-heading">Rarity Breakdown</div>
          <div class="rarity-pills">${rarityPills}${extraPills}</div>
        </div>` : ''}

        <div class="section">
          <div class="section-heading">Market Prices</div>
          <div class="results-meta" id="resultsMeta"></div>
          <div class="table-wrap" id="tableContainer"></div>
        </div>
      </div>`;

    buildTable();

  } catch (err) {
    root.innerHTML = `<div class="state state-error">Failed to load: ${err.message}</div>`;
  }
}

init();
</script>

</body>
</html>
