<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Set Tracker — Funko Digital — Hoardio</title>
  <meta name="description" content="Track your Funko Digital Pop! collection progress on WAX. Discover which cards you're missing to complete your Royalty and Mastery sets." />
  <link rel="canonical" href="https://www.hoardio.com/funko/set-tracker" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.hoardio.com/funko/set-tracker" />
  <meta property="og:title" content="Set Tracker — Funko Digital — Hoardio" />
  <meta property="og:description" content="Track your Funko Digital Pop! collection progress on WAX. Discover which cards you're missing to complete your Royalty and Mastery sets." />
  <meta property="og:image" content="https://www.hoardio.com/images/og-funko.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Set Tracker — Funko Digital — Hoardio" />
  <meta name="twitter:description" content="Track your Funko Digital Pop! collection progress on WAX. Discover which cards you're missing to complete your Royalty and Mastery sets." />
  <meta name="twitter:image" content="https://www.hoardio.com/images/og-funko.png" />
  <link rel="icon" href="../images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="../images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="../shared/global.css" />
  <style>
    .content { display: flex; flex-direction: column; gap: 2rem; }

    /* ── Controls ── */
    .controls { display: flex; flex-direction: column; gap: 0.65rem; max-width: 600px; }
    .controls-row { display: flex; gap: 0.5rem; }
    .wallet-group { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; }
    .wallet-label { font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--text-secondary); }
    .wallet-hint  { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: 0.75; }
    .wallet-input { flex: 1; }
    .drop-combo   { flex: 1; }

    /* ── Royalty / Mastery toggle ── */
    .set-toggle {
      display: inline-flex;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
    }
    .set-toggle-btn {
      padding: 0.45rem 1.5rem;
      border: none;
      background: none;
      color: var(--text-secondary);
      font-size: 0.82rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
      white-space: nowrap;
    }
    .set-toggle-btn + .set-toggle-btn { border-left: 1px solid var(--border); }
    .set-toggle-btn.active-royalty { background: rgba(0,125,235,0.15); color: #007deb; }
    .set-toggle-btn.active-mastery { background: rgba(233,52,148,0.15); color: #e93494; }

    /* ── Summary cards accent colours ── */
    .stat-card.royalty .stat-value { color: #007deb; }
    .stat-card.mastery .stat-value { color: #e93494; }
    .stat-card.total   .stat-value { color: var(--accent-light); }

    /* ── Progress block ── */
    .progress-block {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 1.25rem 1.5rem;
    }
    .progress-meta {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
      margin-bottom: 0.65rem;
    }
    .progress-label {
      font-size: 0.95rem;
      font-weight: 700;
      color: var(--text-primary);
    }
    .progress-count {
      font-size: 0.82rem;
      color: var(--text-secondary);
      font-variant-numeric: tabular-nums;
    }
    .progress-bar-track {
      height: 8px;
      background: var(--bg-card-hover);
      border-radius: 999px;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      border-radius: 999px;
      transition: width 0.5s ease;
    }
    .progress-bar-fill.royalty { background: #007deb; }
    .progress-bar-fill.mastery { background: #e93494; }
    .progress-complete {
      margin-top: 0.6rem;
      font-size: 0.78rem;
      color: var(--text-secondary);
    }
    .progress-cost {
      margin-top: 0.65rem;
      font-size: 0.82rem;
      display: flex;
      align-items: baseline;
      gap: 0.35rem;
      flex-wrap: wrap;
    }
    .cost-label   { color: var(--text-secondary); }
    .cost-wax     { font-weight: 700; color: var(--text-primary); }
    .cost-usd     { font-size: 0.75rem; color: var(--text-secondary); }
    .progress-unavailable {
      margin-top: 0.5rem;
      font-size: 0.78rem;
      color: var(--text-secondary);
      font-style: italic;
    }

    /* ── Missing cards table ── */
    .missing-heading {
      font-size: 0.82rem;
      font-weight: 700;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin: 1.5rem 0 0.75rem;
    }
    .missing-heading span { color: var(--text-primary); }

    .cards-table-wrap { overflow-x: auto; border-radius: 12px; border: 1px solid var(--border); }
    .cards-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 0.85rem;
    }
    .cards-table thead th {
      text-align: left;
      padding: 8px 12px;
      font-size: 0.65rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--text-secondary);
      background: var(--bg-card);
      border-bottom: 1px solid var(--border);
      white-space: nowrap;
    }
    .cards-table thead th.col-r { text-align: right; }
    .cards-table tbody tr { border-bottom: 1px solid rgba(255,255,255,0.04); transition: background 0.15s; }
    .cards-table tbody tr:last-child { border-bottom: none; }
    .cards-table tbody tr:hover { background: rgba(255,255,255,0.04); }
    .cards-table tbody td { padding: 8px 12px; vertical-align: middle; }
    .cards-table tbody td.col-r { text-align: right; font-variant-numeric: tabular-nums; }

    .cell-card-name { font-size: 0.85rem; color: var(--text-primary); font-weight: 500; }
    .cell-card-id   { font-size: 0.68rem; color: var(--text-secondary); margin-top: 2px; }
    .cell-price     { display: block; font-size: 0.85rem; font-weight: 700; color: var(--text-primary); white-space: nowrap; }
    .cell-price.price-null { color: rgba(255,255,255,0.2); font-weight: 400; font-size: 0.8rem; }
    .cell-price-usd { font-size: 0.83rem; color: var(--text-secondary); white-space: nowrap; margin-top: 2px; }
    .cell-owned     { font-size: 0.8rem; color: var(--text-secondary); font-variant-numeric: tabular-nums; }

    /* ── Marketplace links ── */
    .market-links { display: flex; align-items: center; gap: 0.5rem; justify-content: flex-end; }
    .market-link { display: flex; align-items: center; opacity: 0.4; transition: opacity 0.15s; text-decoration: none; }
    .market-link:hover { opacity: 1; }
    .market-link img { width: 20px; height: 20px; object-fit: contain; }
    .market-link--primary { display: inline-flex; align-items: center; gap: 0.4rem; opacity: 1; transition: filter 0.2s; text-decoration: none; }
    .market-link--primary img { width: 24px; height: 24px; filter: invert(1); }
    .market-link--primary:hover { filter: drop-shadow(0 0 6px rgba(240,168,64,0.9)) drop-shadow(0 0 12px rgba(240,168,64,0.5)); }
    .buy-label { font-size: 0.82rem; font-weight: 700; color: var(--accent-light); letter-spacing: 0.03em; }

    /* ── Rarity breakdown ── */
    .rarity-breakdown {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin-top: 1rem;
      margin-bottom: 1.25rem;
    }
    .rb-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 0.35rem 0.7rem 0.35rem 0.45rem;
    }
    .rb-count      { font-size: 0.78rem; font-weight: 700; color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .rb-count.done { color: #3fb950; }

    /* ── No-data / empty states ── */
    .no-cards {
      padding: 1.5rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      font-size: 0.88rem;
      color: var(--text-secondary);
      text-align: center;
    }
    .complete-banner {
      padding: 1.25rem 1.5rem;
      background: rgba(63, 185, 80, 0.08);
      border: 1px solid rgba(63, 185, 80, 0.25);
      border-radius: 12px;
      color: #3fb950;
      font-size: 0.95rem;
      font-weight: 600;
      text-align: center;
    }

    /* ── Full scan banner ── */
    .full-scan-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 1.25rem;
      margin-top: 1.25rem;
      padding: 1.1rem 1.4rem;
      background: linear-gradient(135deg, rgba(240,168,64,0.10) 0%, rgba(240,168,64,0.04) 100%);
      border: 1px solid rgba(240,168,64,0.35);
      border-radius: 12px;
      flex-wrap: wrap;
    }
    .full-scan-banner-left {
      display: flex;
      align-items: center;
      gap: 0.9rem;
    }
    .full-scan-icon {
      font-size: 1.6rem;
      line-height: 1;
      flex-shrink: 0;
    }
    .full-scan-label {
      font-size: 0.7rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent-light);
      margin-bottom: 0.2rem;
    }
    .full-scan-desc {
      font-size: 0.88rem;
      color: var(--text-primary);
      font-weight: 500;
      line-height: 1.35;
    }
    .full-scan-btn {
      flex-shrink: 0;
      padding: 0.55rem 1.25rem;
      background: rgba(240,168,64,0.12);
      border: 1px solid rgba(240,168,64,0.45);
      border-radius: 8px;
      color: var(--accent-light);
      font-size: 0.84rem;
      font-weight: 700;
      font-family: inherit;
      cursor: pointer;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s;
    }
    .full-scan-btn:hover { background: rgba(240,168,64,0.2); border-color: rgba(240,168,64,0.7); }

    @media (max-width: 500px) {
      .full-scan-banner { flex-direction: column; align-items: flex-start; }
      .stats-grid { grid-template-columns: repeat(2, 1fr); }
      .progress-block { padding: 1rem; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script src="../shared/wax-auth.js"></script>
</head>
<body>

<div class="page">
  <div class="content">

    <div class="page-header">
      <div class="page-title">Set <span class="accent">Tracker</span></div>
      <div class="page-subtitle">Track your collection progress and discover which cards you're missing.</div>
      <div class="full-scan-banner">
        <div class="full-scan-banner-left">
          <div class="full-scan-icon">💎</div>
          <div>
            <div class="full-scan-label">Premium Feature</div>
            <div class="full-scan-desc">Scan your wallet against the entire Funko Digital catalog and see every card you're missing.</div>
          </div>
        </div>
        <button class="full-scan-btn" onclick="openFullScan()">Run Full Scan →</button>
      </div>
    </div>

    <div class="controls">
      <div class="controls-row">
        <div class="wallet-group">
          <label for="walletInput" class="wallet-label">
            Wallets <span class="wallet-hint">(comma-separated for multiple)</span>
          </label>
          <input class="wallet-input" id="walletInput" type="text" placeholder="wallet1.wam, wallet2.gm, …" spellcheck="false" autocomplete="off" />
        </div>
      </div>
      <div class="controls-row">
        <div class="cb-combo drop-combo" id="dropCombo">
          <input type="text" class="cb-combo-input" id="dropComboInput" autocomplete="off" spellcheck="false" placeholder="Loading drops…">
          <button type="button" class="cb-combo-clear" id="dropComboClear" style="display:none" title="Clear">✕</button>
          <div class="cb-panel" id="dropPanel"></div>
        </div>
        <button class="lookup-btn" id="trackBtn" onclick="lookupWallet()" disabled>Track</button>
      </div>
      <div class="controls-row">
        <div class="set-toggle" id="setToggle">
          <button class="set-toggle-btn active-royalty" data-type="royalty" onclick="setActiveType('royalty')">Royalty</button>
          <button class="set-toggle-btn" data-type="mastery" onclick="setActiveType('mastery')">Mastery</button>
        </div>
      </div>
    </div>

    <div id="trackerContent"></div>

  </div>
</div>

<script src="../shared/supabase-config.js"></script>
<script src="../shared/wax-api.js"></script>
<script src="nav.js"></script>
<script>
  'use strict';

  /* ── Constants ── */
  const ROYALTY_RARITIES = new Set(['Common','Uncommon','Rare','Epic']);
  const MASTERY_RARITIES = new Set(['Common','Uncommon','Rare','Epic','Ultra','Legendary','Grail','Mythic','Series','Royalty']);
  const RARITY_CLASS = {
    'Common':'r-common','Uncommon':'r-uncommon','Rare':'r-rare','Epic':'r-epic',
    'Series':'r-series','Ultra':'r-ultra','Legendary':'r-legendary','Grail':'r-grail',
    'Mythic':'r-mythic','Royalty':'r-royalty','1 of 1':'r-1of1','Redeemable':'r-redeemable',
  };
  /* ── URL params ── */
  const params = new URLSearchParams(location.search);
  const initW  = params.get('w') || '';
  const initC  = params.get('c') || '';
  const initS  = params.get('s') || '';

  /* ── State ── */
  let currentWallet     = '';
  let currentCollection = '';
  let currentSchema     = '';
  let collNameMap       = new Map();
  let allDrops          = [];
  let activeType        = 'royalty';   // 'royalty' | 'mastery'
  let lastRoyaltyStats  = null;
  let lastMasteryStats  = null;
  let waxApi            = '';
  let waxMarketApi      = '';
  let waxUsdRate        = null;

  /* ── Helpers ── */
  function enc(v) { return encodeURIComponent(v); }

  function fmtWax(wax) {
    if (wax == null) return null;
    if (wax < 1) return wax.toFixed(4) + ' WAX';
    return wax.toFixed(2) + ' WAX';
  }

  function supplyCell(inCirc, issued) {
    const primary = inCirc ?? issued;
    if (primary == null) return '<span class="cell-price price-null">—</span>';
    const showSub = inCirc != null && (inCirc < issued || issued === 1);
    const sub = showSub ? `<div class="cell-price-usd">of ${issued.toLocaleString()}</div>` : '';
    return `<span class="cell-price">${primary.toLocaleString()}</span>${sub}`;
  }

  function priceCell(floor) {
    if (!floor) return '<span class="cell-price price-null">—</span>';
    if (floor.sym === 'USD') {
      const usdStr = '$' + floor.usd.toFixed(2);
      const sub = floor.wax != null ? '<div class="cell-price-usd">≈ ' + fmtWax(floor.wax) + '</div>' : '';
      return '<span class="cell-price">' + usdStr + '</span>' + sub;
    }
    const sub = floor.usd != null ? '<div class="cell-price-usd">≈ $' + floor.usd.toFixed(2) + '</div>' : '';
    return '<span class="cell-price">' + fmtWax(floor.wax) + '</span>' + sub;
  }

  async function fetchWaxPrice() {
    try {
      const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=wax&vs_currencies=usd');
      if (!r.ok) return;
      const json = await r.json();
      waxUsdRate = json?.wax?.usd ?? null;
    } catch { /* non-fatal — USD column just won't show */ }
  }

  function cleanName(name) {
    return name
      .replace(/^Funko Presents\s+/i, '')
      .replace(/:\s*Funko Digital Pop!$/i, '')
      .replace(/\s+X\s+Funko$/i, '')
      .replace(/:\s*Funko Digital$/i, '')
      .replace(/\s+x\s+Funko Digital Pop!$/i, '');
  }

  function schemaLabel(sn) {
    const base = sn.replace('.drop', '');
    const m = base.match(/^series(\d+)$/);
    if (m) return 'Series ' + m[1];
    return base.charAt(0).toUpperCase() + base.slice(1);
  }

  /* ── Supabase fetch ── */
  async function sbFetch(table, qs) {
    const url = SUPABASE_URL + '/rest/v1/' + table + (qs ? '?' + qs : '');
    const r = await fetch(url, {
      headers: {
        'apikey':         SUPABASE_ANON_KEY,
        'Authorization':  'Bearer ' + SUPABASE_ANON_KEY,
        'Accept-Profile': 'funko',
      }
    });
    if (!r.ok) throw new Error('Supabase error ' + r.status + ' on ' + table);
    return r.json();
  }

  /* ── AtomicAssets fetch ── */
  function apiFetch(url) { return WaxApi.apiFetch(url); }

  async function fetchAllPages(baseUrl) {
    const out = [];
    let page = 1;
    while (true) {
      const data = await apiFetch(baseUrl + '&page=' + page + '&limit=1000');
      out.push(...data);
      if (data.length < 1000) break;
      page++;
    }
    return out;
  }

  async function fetchMarketPages(baseUrl) {
    const out = [];
    let page = 1;
    while (true) {
      const data = await apiFetch(baseUrl + '&page=' + page + '&limit=100');
      out.push(...data);
      if (data.length < 100) break;
      page++;
    }
    return out;
  }

  /* ── Drop selector ── */
  async function initDropSelector() {
    const [schemas, collections] = await Promise.all([
      sbFetch('schema_stats', 'select=collection_name,schema_name,created_at&order=created_at.asc'),
      sbFetch('collections',  'select=collection_name,display_name'),
    ]);

    collNameMap = new Map(collections.map(c => [c.collection_name, cleanName(c.display_name || c.collection_name)]));

    allDrops = schemas.map(s => ({
      collection_name: s.collection_name,
      schema_name:     s.schema_name,
      display_name:    collNameMap.get(s.collection_name) || s.collection_name,
    })).sort((a, b) => a.display_name.localeCompare(b.display_name));

    _dropItems = [{ value: '', label: '— Select a Drop —' },
      ...allDrops.map(d => ({ value: `${d.collection_name}|${d.schema_name}`, label: `${d.display_name} — ${schemaLabel(d.schema_name)}` }))];
    if (initC && initS) _dropValue = initC + '|' + initS;
    renderDropDd();
    updateTrackBtn();
  }

  let _dropValue = '';
  let _dropItems = [];
  let _dropComboWired = false;

  // Long list (every Funko drop) — searchable combobox, same component as
  // trade-analyzer.html's Funko "Drop" filter. _dropItems[0] is always the
  // "— Select a Drop —" sentinel: reflected as the input's placeholder/
  // clear-button state, never a row in the list.
  function syncDropComboDisplay() {
    const input   = document.getElementById('dropComboInput');
    const clear   = document.getElementById('dropComboClear');
    const allItem = _dropItems[0];
    const active  = _dropItems.find(i => i.value === _dropValue) || allItem;
    const hasSelection = !!allItem && active.value !== allItem.value;
    input.placeholder = allItem ? allItem.label : 'Loading drops…';
    input.value = hasSelection ? active.label : '';
    clear.style.display = hasSelection ? '' : 'none';
    document.getElementById('dropCombo').classList.toggle('has-selection', hasSelection);
  }

  function renderDropDd() {
    syncDropComboDisplay();
    if (_dropComboWired) return;
    _dropComboWired = true;

    const combo = document.getElementById('dropCombo');
    const input = document.getElementById('dropComboInput');
    const clear = document.getElementById('dropComboClear');
    const panel = document.getElementById('dropPanel');

    const pick = val => {
      _dropValue = val;
      closeAllDd();
      syncUrl();
      updateTrackBtn();
    };

    const renderList = filterText => {
      const q = filterText.trim().toLowerCase();
      const options = _dropItems.slice(1); // exclude the "— Select a Drop —" sentinel
      const filtered = q
        ? options.filter(i => i.label.toLowerCase().includes(q) || i.value.toLowerCase().includes(q))
        : options;
      panel.innerHTML = filtered.length
        ? filtered.map(i => `<div class="cb-item${i.value === _dropValue ? ' active' : ''}" data-val="${i.value}"><span>${i.label}</span></div>`).join('')
        : `<div class="cb-empty">No matches</div>`;
      panel.querySelectorAll('.cb-item').forEach(item => {
        item.addEventListener('click', () => pick(item.dataset.val));
      });
    };

    input.addEventListener('focus', () => {
      closeAllDd();
      combo.classList.add('open');
      panel.classList.add('open');
      renderList('');
      input.select();
    });
    input.addEventListener('input', () => renderList(input.value));
    input.addEventListener('keydown', e => {
      if (e.key === 'Escape') {
        e.stopPropagation();
        input.blur();
        closeAllDd();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        panel.querySelector('.cb-item')?.click();
      }
    });
    input.addEventListener('blur', () => {
      // Close only THIS combo, not every dropdown — closeAllDd() here would
      // also clobber a different dropdown the user just clicked into and
      // opened in the meantime (this fires 150ms after blur, well after that
      // other dropdown's own focus handler already ran).
      setTimeout(() => {
        if (!combo.contains(document.activeElement)) {
          combo.classList.remove('open');
          panel.classList.remove('open');
          syncDropComboDisplay();
        }
      }, 150);
    });
    clear.addEventListener('mousedown', e => e.preventDefault());
    clear.addEventListener('click', () => {
      pick(_dropItems[0].value);
      input.blur();
    });
  }
  function closeAllDd() {
    document.querySelectorAll('.cb-panel.open').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.cb-dropdown-btn.open').forEach(t => t.classList.remove('open'));
    const combo = document.getElementById('dropCombo');
    combo.classList.remove('open');
    if (_dropComboWired) syncDropComboDisplay();
  }
  document.addEventListener('mousedown', e => {
    if (!e.target.closest('.cb-dropdown') && !e.target.closest('.cb-combo')) closeAllDd();
  });

  /* ── Toggle ── */
  function setActiveType(type) {
    activeType = type;
    document.querySelectorAll('.set-toggle-btn').forEach(btn => {
      btn.classList.remove('active-royalty', 'active-mastery');
      if (btn.dataset.type === type) btn.classList.add('active-' + type);
    });
    if (lastRoyaltyStats && lastMasteryStats) renderProgress();
  }

  /* ── Clear ── */
  function clearAll() {
    _dropValue = '';
    renderDropDd();
    document.getElementById('walletInput').value = '';
    document.getElementById('trackerContent').innerHTML = '';
    currentWallet = ''; currentCollection = ''; currentSchema = '';
    lastRoyaltyStats = null; lastMasteryStats = null;
    syncUrl();
  }

  function syncUrl() {
    const url = new URL(location.href);
    if (currentWallet) url.searchParams.set('w', currentWallet);
    else url.searchParams.delete('w');
    const val = _dropValue;
    if (val) {
      const [c, s] = val.split('|');
      url.searchParams.set('c', c);
      url.searchParams.set('s', s);
    } else {
      url.searchParams.delete('c');
      url.searchParams.delete('s');
    }
    history.replaceState(null, '', url.toString());
  }

  /* ── Set computation ── */
  function computeSetStats(templates, walletMap) {
    if (!templates.length) return { complete: 0, nextSet: 1, missing: [], alreadyHave: [], total: 0 };
    const withOwned = templates.map(t => ({
      ...t,
      owned: walletMap.get(String(t.template_id))?.count || 0,
      mints: walletMap.get(String(t.template_id))?.mints || [],
    }));
    const complete = Math.min(...withOwned.map(t => t.owned));
    return {
      complete,
      nextSet: complete + 1,
      missing:    withOwned.filter(t => t.owned <= complete),
      alreadyHave: withOwned.filter(t => t.owned > complete),
      total: templates.length,
    };
  }

  /* ── Main tracking logic ── */
  function lookupWallet() {
    const raw = document.getElementById('walletInput').value.trim();
    if (!raw) return;
    const val = _dropValue;
    if (!val) {
      document.getElementById('trackerContent').innerHTML =
        '<div class="state state-error">Please select a drop first.</div>';
      return;
    }
    const wallets = [...new Set(raw.split(',').map(w => w.trim()).filter(Boolean))];
    if (!wallets.length) return;
    const [c, s] = val.split('|');
    currentWallet = wallets.join(', ');
    currentCollection = c;
    currentSchema = s;
    syncUrl();
    runTracker(wallets, c, s);
  }

  function setStatus(msg) {
    document.getElementById('trackerContent').innerHTML =
      `<div class="status-wrap"><div class="spinner"></div><div class="status-text">${msg}</div></div>`;
  }

  async function runTracker(wallets, collection, schema) {
    const btn = document.getElementById('trackBtn');
    btn.disabled = true;
    lastRoyaltyStats = null;
    lastMasteryStats = null;

    try {
      // 1. WAX endpoints + USD rate (parallel)
      setStatus('Initialising…');
      const initTasks = [];
      if (!waxApi) {
        waxApi       = WaxApi.aaBase();
        waxMarketApi = WaxApi.marketBase();
      }
      initTasks.push(fetchWaxPrice());
      await Promise.all(initTasks);

      // 2. Templates from Supabase (funko.templates is the full catalog master)
      setStatus('Fetching card templates…');
      const rawTemplates = await sbFetch('templates',
        'select=template_id,name,rarity,cardid,in_circulation,issued_supply' +
        '&collection_name=eq.' + enc(collection) +
        '&schema_name=eq.' + enc(schema) +
        '&order=cardid.asc&limit=1000'
      );
      const templates = rawTemplates.map(t => ({
        template_id:    String(t.template_id),
        name:           t.name  || `#${t.template_id}`,
        rarity:         t.rarity || 'Unknown',
        cardid:         t.cardid ?? null,
        in_circulation: t.in_circulation ?? null,
        issued_supply:  t.issued_supply  ?? null,
      }));

      // 3. Wallet assets from AtomicAssets (parallel fetch, merged inventory)
      setStatus(wallets.length > 1 ? `Fetching inventory for ${wallets.length} wallets…` : 'Fetching wallet inventory…');
      const allAssets = await Promise.all(wallets.map(w =>
        fetchAllPages(`${waxApi}/assets?collection_name=${enc(collection)}&schema_name=${enc(schema)}&owner=${enc(w)}&sort=template_mint&order=asc`)
      ));
      const walletMap = new Map();
      let totalNFTs = 0;
      for (const assets of allAssets) {
        totalNFTs += assets.length;
        for (const a of assets) {
          const tid  = String(a.template?.template_id || '');
          const mint = parseInt(a.template_mint, 10);
          if (!tid || isNaN(mint)) continue;
          if (!walletMap.has(tid)) walletMap.set(tid, { count: 0, mints: [] });
          const e = walletMap.get(tid);
          e.count++;
          e.mints.push(mint);
        }
      }
      for (const e of walletMap.values()) e.mints.sort((a, b) => a - b);

      // 4. Floor prices:
      //    - WAX: /sales/templates?symbol=WAX  → one row per template, very fast
      //    - USD: /sales?symbol=USD            → all USD listings (rare, still fast)
      //    Both fetched in parallel then merged.
      setStatus('Fetching market prices…');
      const collFilter = `collection_name=${enc(collection)}&schema_name=${enc(schema)}&state=1&sort=price&order=asc`;
      const [rawWax, rawUsd] = await Promise.all([
        fetchMarketPages(`${waxMarketApi}/sales/templates?symbol=WAX&${collFilter}`).catch(() => []),
        fetchMarketPages(`${waxMarketApi}/sales?symbol=USD&${collFilter}`).catch(() => []),
      ]);

      const priceMap = new Map();

      for (const item of rawWax) {
        const tid = String(item.assets?.[0]?.template?.template_id || '');
        const amt = item.listing_price;
        if (!tid || amt == null) continue;
        const wax = parseInt(amt) / 1e8;
        priceMap.set(tid, { wax, usd: waxUsdRate ? wax * waxUsdRate : null, sym: 'WAX' });
      }

      for (const item of rawUsd) {
        const tid = String(item.assets?.[0]?.template?.template_id || '');
        const amt = item.listing_price;
        if (!tid || amt == null) continue;
        const usd = parseInt(amt) / 100;
        const wax = waxUsdRate ? usd / waxUsdRate : null;
        // Only use this USD entry if no WAX listing exists or it's cheaper in WAX terms
        const existing = priceMap.get(tid);
        if (!existing || (wax != null && existing.wax != null && wax < existing.wax)) {
          priceMap.set(tid, { wax, usd, sym: 'USD' });
        }
      }

      // Enrich templates with prices
      const enriched = templates.map(t => ({
        ...t,
        floor: priceMap.get(t.template_id) ?? null,
      }));

      // 5. Classify and compute
      const royaltyTpls = enriched.filter(t => ROYALTY_RARITIES.has(t.rarity));
      const masteryTpls = enriched.filter(t => MASTERY_RARITIES.has(t.rarity));

      lastRoyaltyStats = { ...computeSetStats(royaltyTpls, walletMap), totalNFTs };
      lastMasteryStats = { ...computeSetStats(masteryTpls, walletMap), totalNFTs };

      renderResults(collection, schema);

    } catch (err) {
      document.getElementById('trackerContent').innerHTML =
        `<div class="state state-error">Failed to load data: ${err.message}</div>`;
    } finally {
      btn.disabled = false;
    }
  }

  /* ── Render ── */
  function renderResults(collection, schema) {
    const drop = allDrops.find(d => d.collection_name === collection && d.schema_name === schema);
    const dropLabel = drop ? `${drop.display_name} — ${schemaLabel(drop.schema_name)}` : collection;

    const rs = lastRoyaltyStats;
    const ms = lastMasteryStats;

    document.getElementById('trackerContent').innerHTML = `
      <div class="section">
        <div class="section-heading">${dropLabel}</div>
        <div class="stats-grid">
          <div class="stat-card royalty">
            <div class="stat-value">${rs.complete}</div>
            <div class="stat-label">Royalty Sets</div>
          </div>
          <div class="stat-card mastery">
            <div class="stat-value">${ms.complete}</div>
            <div class="stat-label">Mastery Sets</div>
          </div>
          <div class="stat-card total">
            <div class="stat-value">${(rs.totalNFTs || 0).toLocaleString()}</div>
            <div class="stat-label">NFTs Owned</div>
          </div>
        </div>
      </div>
      <div id="progressSection" style="margin-top:1rem"></div>
    `;
    renderProgress();
  }

  function renderProgress() {
    const stats  = activeType === 'royalty' ? lastRoyaltyStats : lastMasteryStats;
    const color  = activeType === 'royalty' ? '#007deb' : '#e93494';
    const label  = activeType === 'royalty' ? 'Royalty' : 'Mastery';
    const el     = document.getElementById('progressSection');
    if (!el) return;

    const { complete, nextSet, missing, alreadyHave, total } = stats;
    const ownedCount   = alreadyHave.length;
    const progressPct  = total > 0 ? Math.round((ownedCount / total) * 100) : 0;

    if (total === 0) {
      el.innerHTML = `<div class="no-cards">No ${label} cards found in this drop.</div>`;
      return;
    }

    // Rarity breakdown
    const RARITY_DISPLAY_ORDER = ['Common','Uncommon','Rare','Epic','Ultra','Legendary','Grail','Mythic','Series','Royalty'];
    const allForSet = [...alreadyHave, ...missing];
    const rarityMap = {};
    for (const t of allForSet) {
      if (!rarityMap[t.rarity]) rarityMap[t.rarity] = { total: 0, missing: 0 };
      rarityMap[t.rarity].total++;
    }
    for (const t of missing) {
      if (rarityMap[t.rarity]) rarityMap[t.rarity].missing++;
    }
    const rarityBreakdownHtml = RARITY_DISPLAY_ORDER
      .filter(r => rarityMap[r])
      .map(r => {
        const { total, missing: m } = rarityMap[r];
        const owned = total - m;
        const done  = m === 0;
        return `<div class="rb-item">
          <span class="rarity-pill ${RARITY_CLASS[r] || ''}">${r}</span>
          <span class="rb-count${done ? ' done' : ''}">${owned}/${total}</span>
        </div>`;
      }).join('');

    const listedMissing  = missing.filter(t => t.floor != null);
    const unlistedCount  = missing.length - listedMissing.length;
    // Normalise to WAX for summing (USD listings converted via rate if available)
    const totalWax = listedMissing.reduce((sum, t) => sum + (t.floor.wax ?? 0), 0);
    const totalUsd = listedMissing.reduce((sum, t) => sum + (t.floor.usd ?? 0), 0);
    const hasWaxTotal = listedMissing.some(t => t.floor.wax != null);
    const hasUsdTotal = listedMissing.some(t => t.floor.usd != null);

    let costHtml = '';
    if (missing.length > 0 && listedMissing.length > 0) {
      const waxStr = hasWaxTotal ? `<span class="cost-wax">${fmtWax(totalWax)}</span>` : '';
      const usdStr = hasUsdTotal ? `<span class="cost-usd">≈ $${totalUsd.toFixed(2)}</span>` : '';
      costHtml = `<div class="progress-cost"><span class="cost-label">Cost to complete:</span> ${waxStr} ${usdStr}</div>`;
    }

    const unavailableHtml = unlistedCount > 0
      ? `<div class="progress-unavailable">${unlistedCount} card${unlistedCount !== 1 ? 's' : ''} currently not available on the market</div>`
      : '';

    const progressBlock = `
      <div class="progress-block">
        <div class="progress-meta">
          <span class="progress-label">${label} Set #${nextSet} Progress</span>
          <span class="progress-count">${ownedCount} / ${total} cards</span>
        </div>
        <div class="progress-bar-track">
          <div class="progress-bar-fill ${activeType}" style="width:${progressPct}%"></div>
        </div>
        ${complete > 0 ? `<div class="progress-complete">${complete} complete set${complete !== 1 ? 's' : ''} · working toward set #${nextSet}</div>` : ''}
        ${costHtml}
        ${unavailableHtml}
      </div>
      <div class="rarity-breakdown">${rarityBreakdownHtml}</div>`;

    if (missing.length === 0) {
      el.innerHTML = progressBlock + `
        <div class="complete-banner" style="margin-top:1.25rem">
          ✓ You have all ${total} ${label} cards for Set #${nextSet}! Congrats!
        </div>`;
      return;
    }

    const rows = [...missing]
      .sort((a, b) => {
        const ca = parseInt(a.cardid, 10), cb = parseInt(b.cardid, 10);
        if (!isNaN(ca) && !isNaN(cb)) return ca - cb;
        return String(a.cardid ?? '').localeCompare(String(b.cardid ?? ''));
      })
      .map(t => {
        const col = currentCollection;
        const sch = currentSchema;
        const tid = t.template_id;
        const ph = priceCell(t.floor);
        const rPill = t.rarity && RARITY_CLASS[t.rarity]
          ? `<span class="rarity-pill ${RARITY_CLASS[t.rarity]}">${t.rarity}</span>`
          : `<span class="rarity-pill">${t.rarity || '—'}</span>`;
        const links = `<div class="market-links">
          <a class="market-link market-link--primary" href="../explore?template_id=${enc(tid)}" target="_blank" rel="noopener noreferrer" title="Buy on Hoardio"><img src="../images/Hoardio_fav.png" alt="Hoardio"><span class="buy-label">Buy</span></a>
        </div>`;
        return `<tr>
          <td>
            <div class="cell-card-name">${t.cardid != null ? t.cardid + ' — ' : ''}${t.name}</div>
          </td>
          <td style="width:110px">${rPill}</td>
          <td class="col-r" style="width:80px">${supplyCell(t.in_circulation, t.issued_supply)}</td>
          <td class="col-r" style="width:90px">${ph}</td>
          <td style="width:70px">${links}</td>
        </tr>`;
      }).join('');

    el.innerHTML = progressBlock + `
      <div class="missing-heading">
        Missing cards — <span>${missing.length} needed</span>
        <div style="margin-top:0.3rem;font-size:0.75rem;opacity:0.55;font-weight:400;font-style:normal;text-transform:none;letter-spacing:normal">Supply figures exclude assets held in Droppp wallets.</div>
      </div>
      <div class="cards-table-wrap">
        <table class="cards-table">
          <thead><tr>
            <th>ID — Card</th>
            <th style="width:110px">Rarity</th>
            <th class="col-r" style="width:80px">Supply</th>
            <th class="col-r" style="width:90px">Floor Price</th>
            <th style="width:70px">Market</th>
          </tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>`;
  }

  function openFullScan() {
    const w = document.getElementById('walletInput').value.trim();
    location.href = 'set-tracker-full' + (w ? '?w=' + encodeURIComponent(w) : '');
  }

  function updateTrackBtn() {
    const hasWallet = document.getElementById('walletInput').value.trim() !== '';
    const hasDrop   = _dropValue !== '';
    document.getElementById('trackBtn').disabled = !(hasWallet && hasDrop);
  }

  /* ── Init ── */
  document.getElementById('walletInput').addEventListener('input', () => {
    const el = document.getElementById('walletInput');
    const { selectionStart, selectionEnd } = el;
    el.value = el.value.toLowerCase();
    el.setSelectionRange(selectionStart, selectionEnd);
    updateTrackBtn();
  });
  document.getElementById('walletInput').addEventListener('keydown', e => {
    if (e.key === 'Enter') lookupWallet();
  });

  async function init() {
    await initDropSelector();
    if (initW) {
      document.getElementById('walletInput').value = initW;
      currentWallet = initW;
    }
    if (initW && initC && initS) {
      _dropValue = initC + '|' + initS;
      renderDropDd();
      currentCollection = initC;
      currentSchema     = initS;
      const wallets = [...new Set(initW.split(',').map(w => w.trim()).filter(Boolean))];
      runTracker(wallets, initC, initS);
    }

    function prefillWallet() {
      const acc = window.getWaxAccount ? window.getWaxAccount() : null;
      const el  = document.getElementById('walletInput');
      if (!acc || el.value.trim()) return;
      el.value = acc;
      updateTrackBtn();
    }
    prefillWallet();
    window.addEventListener('wax-auth-change', prefillWallet);
  }

  init();
</script>
