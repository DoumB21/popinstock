<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hall of Fame — Funko Digital — Hoardio</title>
  <link rel="icon" href="../images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="../images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="../shared/global.css" />
  <style>
    .content { display: flex; flex-direction: column; gap: 2rem; }
    #hof-content { margin-top: -4rem; }

    /* ── Hero banner ── */
    .hof-hero {
      position: relative; overflow: hidden;
      background: linear-gradient(135deg, rgba(240,192,64,0.07) 0%, rgba(192,120,40,0.04) 50%, var(--bg-card) 100%);
      border: 1px solid rgba(240,192,64,0.25); border-radius: 16px;
      padding: 2rem 2rem 1.75rem; display: flex; align-items: center; gap: 2rem; flex-wrap: wrap;
    }
    .hof-hero::before {
      content: ''; position: absolute; inset: 0;
      background: radial-gradient(ellipse at 10% 50%, rgba(240,192,64,0.06) 0%, transparent 60%);
      pointer-events: none;
    }
    .hof-hero-crown { font-size: 3rem; line-height: 1; flex-shrink: 0; filter: drop-shadow(0 0 12px rgba(240,192,64,0.4)); }
    .hof-hero-text { flex: 1; min-width: 0; }
    .hof-hero-title { font-size: 1.5rem; font-weight: 800; color: var(--text-primary); letter-spacing: -0.5px; }
    .hof-hero-title .accent { color: #f0c040; }
    .hof-hero-sub { font-size: 0.88rem; color: var(--text-secondary); line-height: 1.6; margin-top: 0.4rem; }
    .hof-hero-count {
      flex-shrink: 0; text-align: center;
      background: rgba(240,192,64,0.06); border: 1px solid rgba(240,192,64,0.2);
      border-radius: 12px; padding: 0.85rem 1.5rem;
    }
    .hof-hero-count-num { font-size: 2rem; font-weight: 800; color: #f0c040; line-height: 1; }
    .hof-hero-count-label { font-size: 0.72rem; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--text-secondary); margin-top: 4px; }

    /* ── Grid ── */
    .hof-grid { display: grid; grid-template-columns: repeat(3, 1fr); column-gap: 1.25rem; row-gap: 0; }
    @media (max-width: 900px) { .hof-grid { grid-template-columns: repeat(2, 1fr); } }
    @media (max-width: 560px) { .hof-grid { grid-template-columns: 1fr; } }

    /* ── Legend card ── */
    @keyframes legend-glow {
      0%, 100% { box-shadow: 0 0 18px rgba(240,192,64,0.07), 0 6px 28px rgba(0,0,0,0.4); }
      50%       { box-shadow: 0 0 36px rgba(240,192,64,0.18), 0 6px 28px rgba(0,0,0,0.4); }
    }
    @keyframes card-shimmer {
      from { transform: translateX(-100%) skewX(-12deg); }
      to   { transform: translateX(400%)  skewX(-12deg); }
    }

    .legend-card {
      background: transparent;
      display: flex; flex-direction: column;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }
    .hof-grid .legend-card:nth-child(n+4) { margin-top: -3rem; }
    .legend-card:hover .legend-crown-section::before {
      filter: brightness(0.3) saturate(1.2);
      opacity: 0.75;
    }

    /* ── Top section: crown background + identity ── */
    .legend-crown-section {
      position: relative; overflow: hidden;
      min-height: 19rem;
      padding: 0 1.25rem 1.5rem;
      display: flex; justify-content: center; align-items: flex-end;
    }
    .legend-crown-section::before {
      content: '👑';
      position: absolute; top: 0; left: 50%;
      transform: translateX(-50%);
      font-size: 21rem; line-height: 1;
      filter: brightness(0) drop-shadow(0 0 6px rgba(240,168,64,0.35));
      opacity: 0.45;
      pointer-events: none; z-index: 0;
      user-select: none;
      transition: filter 0.3s ease, opacity 0.3s ease;
    }

    /* ── Identity row inside crown section ── */
    .legend-card-top {
      display: flex; flex-direction: row; align-items: center;
      position: relative; z-index: 1;
    }
    .legend-identity { display: flex; flex-direction: column; align-items: center; text-align: center; min-width: 0; flex: 1; }

    /* ── Avatar ── */
    .legend-avatar {
      width: 58px; height: 58px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, rgba(240,192,64,0.28), rgba(192,120,40,0.12));
      border: 2px solid rgba(240,192,64,0.5);
      box-shadow: 0 0 0 5px rgba(240,192,64,0.07), 0 6px 20px rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.85rem; font-weight: 800; color: #f0c040;
      overflow: hidden; position: relative;
    }
    .legend-avatar img { width: 100%; height: 100%; object-fit: cover; position: absolute; inset: 0; }

    /* ── Identity text ── */
    .legend-name {
      font-size: 1.2rem; font-weight: 800; color: var(--text-primary);
      text-decoration: none; line-height: 1.25;
      transition: color 0.15s; word-break: break-word; display: block;
    }
    .legend-name:hover { color: #f0c040; }
    .legend-wallet-sub {
      font-size: 0.9rem; color: var(--text-secondary);
      margin-top: 3px; word-break: break-all; line-height: 1.3;
    }
    .legend-badge {
      display: inline-flex; align-items: center; gap: 4px; margin-top: 0.55rem;
      font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
      padding: 3px 10px; border-radius: 999px;
      color: #f0c040; background: rgba(240,192,64,0.1); border: 1px solid rgba(240,192,64,0.28);
    }
    .legend-since {
      font-size: 0.75rem; color: var(--text-secondary);
      margin-top: 0.4rem; display: flex; align-items: center; gap: 0.35rem;
    }
    .legend-since-date { color: var(--text-primary); font-weight: 600; }

    /* ── Stats section ── */
    .legend-stats-section {
      padding: 0.5rem 1.25rem 1rem;
      border-top: 1px solid rgba(240,192,64,0.1);
    }
    .legend-stats {
      display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.35rem;
    }
    .legend-stat {
      display: flex; flex-direction: column; align-items: center; gap: 1px;
      padding: 0.45rem 0.15rem;
      background: rgba(240,192,64,0.03); border-radius: 8px;
      border: 1px solid rgba(240,192,64,0.08);
    }
    .legend-stat-value { font-size: 0.93rem; font-weight: 800; color: var(--text-primary); line-height: 1.2; }
    .legend-stat-label { font-size: 0.58rem; font-weight: 600; letter-spacing: 0.04em; text-transform: uppercase; color: var(--text-secondary); margin-top: 1px; }

    /* ── Loading skeletons ── */
    @keyframes shimmer {
      0%   { background-position: -400px 0; }
      100% { background-position: 400px 0; }
    }
    .skeleton {
      background: linear-gradient(90deg, rgba(255,255,255,0.04) 25%, rgba(255,255,255,0.08) 50%, rgba(255,255,255,0.04) 75%);
      background-size: 800px 100%; animation: shimmer 1.5s infinite linear;
      border-radius: 6px;
    }
    .skeleton-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-top: 2px solid rgba(255,255,255,0.06);
      border-radius: 16px;
      padding: 1.6rem 1.25rem 1.35rem;
      display: flex; flex-direction: column; align-items: center; gap: 0;
    }
    .skeleton-avatar { width: 72px; height: 72px; border-radius: 50%; flex-shrink: 0; margin-bottom: 0.9rem; }
    .skeleton-line-lg { height: 14px; width: 65%; }
    .skeleton-line-sm { height: 10px; width: 80%; margin-top: 6px; }
    .skeleton-line-badge { height: 18px; width: 90px; border-radius: 999px; margin-top: 10px; }
    .skeleton-line-date { height: 10px; width: 55%; margin-top: 10px; }
    .skeleton-divider { width: 75%; height: 1px; margin: 1rem 0 0.85rem; }
    .skeleton-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 0.35rem; width: 100%; }
    .skeleton-stat { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 0.45rem 0.15rem; border-radius: 8px; }
    .skeleton-stat-val { height: 15px; width: 70%; }
    .skeleton-stat-lbl { height: 8px; width: 85%; }

    /* ── Empty state ── */
    .hof-empty {
      padding: 4rem 1.5rem; text-align: center;
      display: flex; flex-direction: column; align-items: center; gap: 1rem;
    }
    .hof-empty-icon { font-size: 2.5rem; opacity: 0.3; }
    .hof-empty-title { font-size: 1.05rem; font-weight: 700; color: var(--text-primary); }
    .hof-empty-sub { font-size: 0.85rem; color: var(--text-secondary); max-width: 340px; line-height: 1.6; }

    /* ── Error state ── */
    .hof-error {
      padding: 2rem 1.5rem; text-align: center; border-radius: 12px;
      background: rgba(224,82,82,0.05); border: 1px solid rgba(224,82,82,0.2);
      font-size: 0.85rem; color: var(--text-secondary);
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

<div class="page">
  <div class="content">

    <div class="page-header">
      <div class="page-title">Hall of <span class="accent">Fame</span></div>
      <div class="page-subtitle">Collectors who reached the pinnacle — Legend status.</div>
    </div>

    <!-- Hero -->
    <div class="hof-hero">
      <div class="hof-hero-crown">👑</div>
      <div class="hof-hero-text">
        <div class="hof-hero-title">Legend <span class="accent">Collectors</span></div>
        <div class="hof-hero-sub">These elite collectors have completed all 28 achievements across 4 tiers,<br>earning the highest recognition in the Funko Digital community.</div>
      </div>
      <div class="hof-hero-count">
        <div class="hof-hero-count-num" id="legend-count">—</div>
        <div class="hof-hero-count-label">Legends</div>
      </div>
    </div>

    <!-- Content area -->
    <div id="hof-content"></div>

  </div>
</div>

<script src="../shared/supabase-config.js"></script>
<script src="nav.js"></script>
<script>
  const SB_HEADERS = {
    'apikey':         SUPABASE_ANON_KEY,
    'Authorization':  'Bearer ' + SUPABASE_ANON_KEY,
    'Accept-Profile': 'funko',
  };

  function fmtDate(iso) {
    if (!iso) return null;
    return new Date(iso).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
  }

  function fmtNum(n) {
    if (n == null) return '—';
    return Number(n).toLocaleString();
  }

  async function fetchLegends() {
    const tiersRes = await fetch(
      `${SUPABASE_URL}/rest/v1/funko_collector_tiers?max_tier=eq.4&select=wallet,tier_4_at,username,avatar&order=tier_4_at.asc`,
      { headers: SB_HEADERS }
    );
    if (!tiersRes.ok) throw new Error(`HTTP ${tiersRes.status}`);
    const tiers = await tiersRes.json();
    if (tiers.length === 0) return [];

    const walletList = tiers.map(t => t.wallet).join(',');
    const profilesRes = await fetch(
      `${SUPABASE_URL}/rest/v1/funko_wallet_profiles?wallet=in.(${walletList})&select=wallet,profile`,
      { headers: SB_HEADERS }
    );
    const profiles = profilesRes.ok ? await profilesRes.json() : [];
    const profileMap = Object.fromEntries(profiles.map(p => [p.wallet, p.profile]));

    return tiers.map(t => ({ wallet: t.wallet, tier4At: t.tier_4_at, username: t.username ?? null, avatar: t.avatar ?? null, profile: profileMap[t.wallet] ?? null }));
  }

  function renderSkeletons(count = 6) {
    const items = Array.from({ length: count }, () => `
      <div class="skeleton-card">
        <div class="skeleton skeleton-avatar"></div>
        <div class="skeleton skeleton-line-lg"></div>
        <div class="skeleton skeleton-line-sm"></div>
        <div class="skeleton skeleton-line-badge"></div>
        <div class="skeleton skeleton-line-date"></div>
        <div class="skeleton skeleton-divider"></div>
        <div class="skeleton-stats">
          <div class="skeleton-stat"><div class="skeleton skeleton-stat-val"></div><div class="skeleton skeleton-stat-lbl"></div></div>
          <div class="skeleton-stat"><div class="skeleton skeleton-stat-val"></div><div class="skeleton skeleton-stat-lbl"></div></div>
          <div class="skeleton-stat"><div class="skeleton skeleton-stat-val"></div><div class="skeleton skeleton-stat-lbl"></div></div>
          <div class="skeleton-stat"><div class="skeleton skeleton-stat-val"></div><div class="skeleton skeleton-stat-lbl"></div></div>
        </div>
      </div>
    `).join('');
    return `<div class="hof-grid">${items}</div>`;
  }

  function renderCard(legend, rank) {
    const { wallet, tier4At, username, avatar, profile: p } = legend;
    const date = fmtDate(tier4At);

    const rankClass = rank === 1 ? 'legend-rank--1' : '';

    const avatarHtml = avatar
      ? `<div class="legend-avatar"><img src="${avatar}" alt="" /></div>`
      : `<div class="legend-avatar">${wallet[0].toUpperCase()}</div>`;

    const nameHtml = username
      ? `<a class="legend-name" href="wallet?w=${encodeURIComponent(wallet)}">${username}</a>
         <div class="legend-wallet-sub">${wallet}</div>`
      : `<a class="legend-name" href="wallet?w=${encodeURIComponent(wallet)}">${wallet}</a>`;

    const dateHtml = date
      ? `<div class="legend-since">Legend since <span class="legend-since-date">${date}</span></div>`
      : '';

    const statsHtml = p ? `
      <div class="legend-stats-section">
        <div class="legend-stats">
          <div class="legend-stat">
            <div class="legend-stat-value">${fmtNum(p.total_cards)}</div>
            <div class="legend-stat-label">Cards</div>
          </div>
          <div class="legend-stat">
            <div class="legend-stat-value">${fmtNum(p.card_mint?.double_digit)}</div>
            <div class="legend-stat-label">Mint 1–99</div>
          </div>
          <div class="legend-stat">
            <div class="legend-stat-value">${fmtNum(p.mastery?.total_count)}</div>
            <div class="legend-stat-label">Mastery</div>
          </div>
          <div class="legend-stat">
            <div class="legend-stat-value">${fmtNum(p.royalty?.total_count)}</div>
            <div class="legend-stat-label">Royalty</div>
          </div>
        </div>
      </div>
    ` : '';

    return `
      <div class="legend-card">
        <div class="legend-crown-section">
          <div class="legend-card-top">
            ${avatarHtml}
            <div class="legend-identity">
              ${nameHtml}
              <div class="legend-badge">👑 Legend</div>
              ${dateHtml}
            </div>
          </div>
        </div>
        ${statsHtml}
      </div>
    `;
  }

  async function init() {
    const container = document.getElementById('hof-content');
    container.innerHTML = renderSkeletons();

    try {
      const legends = await fetchLegends();
      document.getElementById('legend-count').textContent = legends.length;

      if (legends.length === 0) {
        container.innerHTML = `
          <div class="hof-empty">
            <div class="hof-empty-icon">👑</div>
            <div class="hof-empty-title">No Legends yet</div>
            <div class="hof-empty-sub">Be the first to complete all 4 tiers and earn your place in the Hall of Fame.</div>
          </div>
        `;
        return;
      }

      const cards = legends.map((l, i) => renderCard(l, i + 1)).join('');
      container.innerHTML = `<div class="hof-grid">${cards}</div>`;
    } catch (e) {
      console.error('Hall of Fame fetch failed:', e);
      document.getElementById('legend-count').textContent = '—';
      container.innerHTML = `<div class="hof-error">Could not load Hall of Fame data. Please try refreshing.</div>`;
    }
  }

  document.addEventListener('DOMContentLoaded', init);
</script>

</body>
</html>
