<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funko Trade Analyzer — PopInStock</title>
  <meta name="description" content="Compare the NFT inventory of up to 5 WAX wallets for any Funko Digital Pop! drop. Instantly spot trade opportunities and find missing cards to complete your set." />
  <link rel="canonical" href="https://www.popinstock.com/funko/trade-analyzer.html" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.popinstock.com/funko/trade-analyzer.html" />
  <meta property="og:title" content="Funko Trade Analyzer — PopInStock" />
  <meta property="og:description" content="Compare the NFT inventory of up to 5 WAX wallets for any Funko Digital Pop! drop. Instantly spot trade opportunities and find missing cards to complete your set." />
  <meta property="og:image" content="https://www.popinstock.com/images/og-banner.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Funko Trade Analyzer — PopInStock" />
  <meta name="twitter:description" content="Compare the NFT inventory of up to 5 WAX wallets for any Funko Digital Pop! drop. Instantly spot trade opportunities and find missing cards to complete your set." />
  <meta name="twitter:image" content="https://www.popinstock.com/images/og-banner.png" />
  <link rel="icon" type="image/png" href="../images/FoxLogo.png" />
  <link rel="stylesheet" href="../shared/global.css" />
  <style>
    /* ── Controls card ── */
    .controls-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 18px; padding: 1.5rem; margin-bottom: 1.5rem;
    }
    .controls-row { display: flex; gap: 1rem; align-items: flex-end; flex-wrap: wrap; }
    .control-group { display: flex; flex-direction: column; gap: 0.4rem; flex: 1; min-width: 180px; }
    .control-group--wide { flex: 2; min-width: 260px; }
    .control-label {
      font-size: 0.75rem; font-weight: 600; letter-spacing: 0.06em;
      text-transform: uppercase; color: var(--text-secondary);
    }
    .control-hint { font-weight: 400; text-transform: none; letter-spacing: 0; opacity: 0.75; }
    .control-group--filter { max-width: 280px; }
    .input-error { color: #e05252; font-size: 0.82rem; margin-top: 0.6rem; }

    /* ── Sticky first column ── */
    .results-table th:first-child {
      position: sticky; left: 0; z-index: 3; background: #141419;
    }
    .results-table .card-main-row td:first-child {
      position: sticky; left: 0; z-index: 1; background: #0a0a0f;
    }
    .card-group:hover .card-main-row td:first-child { background: #101015; }

    /* ── Mint filter ── */
    .controls-filter { margin-top: 1rem; padding-top: 1rem; border-top: 1px solid var(--border); }
    .mint-range-inputs { display: flex; align-items: center; gap: 0.5rem; }
    .mint-range-inputs .control-input { flex: 1; min-width: 0; }
    .range-sep { color: var(--text-secondary); flex-shrink: 0; font-size: 0.9rem; }

    /* ── Results ── */
    .results-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 0.75rem; padding: 0 0.25rem; gap: 1rem;
    }
    .results-meta { color: var(--text-secondary); font-size: 0.8rem; }
    .results-meta strong { color: var(--text-primary); }
    .trade-filter-btn {
      display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; color: var(--text-secondary);
      font-size: 0.78rem; font-weight: 600; padding: 0.35rem 0.75rem;
      cursor: pointer; transition: border-color 0.2s, color 0.2s, background 0.2s;
    }
    .trade-filter-btn:hover { border-color: rgba(255,255,255,0.2); color: var(--text-primary); }
    .trade-filter-btn--active { background: rgba(74,222,128,0.1); border-color: #4ade80; color: #4ade80; }
    .trade-filter-dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex-shrink: 0; }
    .trade-filter-empty { display: none; text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 0.9rem; }
    .table-scroll { overflow-x: auto; border-radius: 14px; border: 1px solid var(--border); }
    .results-table { width: 100%; border-collapse: collapse; font-size: 0.95rem; }
    .results-table th {
      background: rgba(255,255,255,0.04); color: var(--text-secondary);
      font-size: 0.72rem; font-weight: 600; letter-spacing: 0.05em;
      padding: 0.65rem 0.85rem; text-align: left; text-transform: uppercase;
      white-space: nowrap; position: sticky; top: 0; z-index: 2;
      border-bottom: 1px solid var(--border);
    }
    .results-table th.col-wallet { text-align: right; color: var(--accent-light); max-width: 130px; overflow: hidden; text-overflow: ellipsis; }
    .results-table td { border-top: 1px solid var(--border); padding: 0.5rem 0.85rem; vertical-align: top; }
    .card-group:hover td { background: var(--bg-row-alt); }
    .results-table td.col-num { color: var(--text-secondary); font-size: 0.9rem; text-align: right; font-variant-numeric: tabular-nums; }
    .results-table td.col-wallet { white-space: nowrap; padding-left: 0.6rem; padding-right: 0.6rem; }
    .wallet-cell { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; }
    .wallet-copies { color: var(--text-secondary); font-size: 0.85rem; font-weight: 400; }
    .wallet-mint { font-variant-numeric: tabular-nums; text-align: right; }
    .wallet-next-mints { font-size: 0.8rem; color: var(--text-secondary); text-align: right; font-variant-numeric: tabular-nums; }
    .mint-lowest .wallet-next-mints { opacity: 0.6; }
    .results-table td.col-empty { color: var(--text-secondary); text-align: right; padding-left: 0.6rem; padding-right: 0.6rem; }
    .mint-lowest { background: rgba(250,165,0,0.1) !important; }
    .mint-lowest .wallet-mint { color: var(--accent-light); font-weight: 700; }
    .mint-lowest .wallet-copies { color: var(--accent-light); opacity: 0.7; }

    /* ── Responsive ── */
    @media (max-width: 640px) {
      .page-main { padding: 1.25rem 0.75rem; }
      .controls-card { padding: 1.25rem 1rem; }
      .search-btn { width: 100%; }
      .control-group--filter { max-width: none; }
      .results-table { font-size: 0.85rem; }
      .results-table th, .results-table td { padding: 0.4rem 0.5rem; }
      .results-table td.col-wallet, .results-table td.col-empty { padding-left: 0.35rem; padding-right: 0.35rem; }
    }

    /* ── Clickable / selected mints ── */
    .mint-clickable {
      cursor: pointer;
      border-radius: 999px;
      padding: 0.05rem 0.35rem;
      transition: background 0.15s, color 0.15s, box-shadow 0.15s;
      display: inline-block;
    }
    .mint-clickable:hover {
      background: rgba(74,222,128,0.15);
      color: #4ade80;
    }
    .mint-selected {
      background: rgba(74,222,128,0.18) !important;
      color: #4ade80 !important;
      box-shadow: 0 0 0 2px #4ade80;
      font-weight: 700;
    }

    /* ── Trade tab (right edge) ── */
    .trade-tab {
      position: fixed;
      right: 0;
      top: 50%;
      transform: translateY(-50%);
      background: linear-gradient(180deg, var(--accent-light), var(--accent));
      color: #fff;
      border: none;
      border-radius: 10px 0 0 10px;
      padding: 1.1rem 0.55rem;
      cursor: pointer;
      z-index: 200;
      font-weight: 700;
      font-size: 0.78rem;
      writing-mode: vertical-lr;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: -3px 0 12px rgba(0,0,0,0.35);
      transition: opacity 0.2s;
    }
    .trade-tab:hover { opacity: 0.88; }
    .trade-count-badge {
      background: #fff;
      color: var(--accent);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 800;
      min-width: 18px;
      height: 18px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      padding: 0 3px;
    }

    /* ── Trade sidebar ── */
    .trade-sidebar {
      position: fixed;
      right: -380px;
      top: 0;
      bottom: 0;
      width: 360px;
      background: var(--bg-card);
      border-left: 1px solid var(--border);
      z-index: 300;
      transition: right 0.3s ease;
      display: flex;
      flex-direction: column;
      box-shadow: -6px 0 24px rgba(0,0,0,0.4);
    }
    .trade-sidebar.open { right: 0; }

    .trade-sidebar-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1rem 1.25rem;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .trade-sidebar-title {
      font-weight: 700;
      font-size: 1rem;
      color: var(--accent-light);
      letter-spacing: 0.03em;
    }
    .trade-close-btn {
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 1.1rem;
      padding: 0.2rem 0.4rem;
      border-radius: 6px;
      transition: color 0.15s, background 0.15s;
    }
    .trade-close-btn:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }

    .trade-entries {
      flex: 1;
      overflow-y: auto;
      padding: 0.75rem 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
    }
    .trade-empty {
      color: var(--text-secondary);
      font-size: 0.875rem;
      text-align: center;
      margin-top: 2rem;
      line-height: 1.6;
    }

    .trade-wallet-group { display: flex; flex-direction: column; gap: 0.35rem; }
    .trade-wallet-header {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.3rem 0.1rem 0.2rem;
    }
    .trade-wallet-label {
      font-size: 0.85rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      color: var(--accent-light);
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .trade-wallet-divider {
      flex: 1;
      height: 1px;
      background: var(--border);
    }
    .trade-entry {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 0.55rem 0.85rem;
      position: relative;
      padding-right: 2.2rem;
    }
    .trade-entry-main {
      display: flex;
      align-items: baseline;
      gap: 0.5rem;
    }
    .trade-entry-mint {
      color: #4ade80;
      font-weight: 800;
      font-variant-numeric: tabular-nums;
      font-size: 0.92rem;
      flex-shrink: 0;
    }
    .trade-entry-name {
      font-weight: 600;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .trade-entry-sub {
      font-size: 0.82rem;
      color: var(--text-secondary);
      margin-top: 0.1rem;
    }
    /* ── Double-row card layout ── */
    .card-sub-row td { border-top: none !important; padding-top: 0; padding-bottom: 0.45rem; }
    .card-id-prefix { color: var(--text-secondary); font-variant-numeric: tabular-nums; }
    .template-id-suffix { color: var(--text-secondary); font-size: 0.88em; opacity: 0.55; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .card-name-line { display: flex; align-items: baseline; justify-content: space-between; gap: 1.5rem; }
    .card-meta-line { display: flex; align-items: center; justify-content: space-between; gap: 0.75rem; }

    .market-links { display: flex; align-items: center; gap: 1rem; }
    .market-link {
      display: flex;
      align-items: center;
      opacity: 0.4;
      transition: opacity 0.15s;
    }
    .market-link:hover { opacity: 1; }
    .market-link img { width: 20px; height: 20px; object-fit: contain; }
    .market-link img[src*="droppp"] { filter: brightness(0) invert(1); }
    .trade-entry-drop {
      font-size: 0.82rem;
      color: var(--text-secondary);
      opacity: 0.85;
      margin-top: 0.1rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .trade-remove-btn {
      position: absolute;
      top: 50%;
      right: 0.6rem;
      transform: translateY(-50%);
      background: none;
      border: none;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 0.85rem;
      padding: 0.25rem;
      border-radius: 4px;
      line-height: 1;
      transition: color 0.15s, background 0.15s;
    }
    .trade-remove-btn:hover { color: #e05252; background: rgba(224,82,82,0.1); }

    .trade-sidebar-footer {
      padding: 0.85rem 1rem;
      border-top: 1px solid var(--border);
      display: flex;
      gap: 0.5rem;
      flex-shrink: 0;
    }
    .trade-action-btn {
      flex: 1;
      padding: 0.5rem 0.75rem;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-primary);
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .trade-action-btn:hover { background: rgba(255,255,255,0.06); border-color: rgba(255,255,255,0.15); }
    .trade-action-btn--danger:hover { background: rgba(224,82,82,0.1); border-color: #e05252; color: #e05252; }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>
  <div id="nav"></div>

  <main class="page-main">
    <div class="page-header">
      <h1 class="page-title">Trade <span class="accent">Analyzer</span></h1>
      <p class="page-desc">Compare the inventory of up to 5 wallets for any drop</p>
    </div>

    <div class="controls-card">
      <div class="controls-row">
        <div class="control-group">
          <label for="dropSelect" class="control-label">Drop</label>
          <select id="dropSelect" class="control-select">
            <option value="">— Select a drop —</option>
          </select>
        </div>
        <div class="control-group control-group--wide">
          <label for="walletsInput" class="control-label">
            Wallets <span class="control-hint">(up to 5, comma-separated)</span>
          </label>
          <input id="walletsInput" class="control-input" type="text"
            placeholder="wallet1.wam, wallet2.dp, ..." autocomplete="off" spellcheck="false" />
        </div>
        <button id="searchBtn" class="search-btn" disabled>Search</button>
      </div>
      <div id="inputError" class="input-error" style="display:none;"></div>
      <div class="controls-row controls-filter" id="filterRow" style="display:none;">
        <div class="control-group control-group--filter">
          <label class="control-label">Filter by Mint Range</label>
          <div class="mint-range-inputs">
            <input id="mintMin" class="control-input" type="number" min="1" placeholder="Min" value="1" oninput="applyFilter()" />
            <span class="range-sep">—</span>
            <input id="mintMax" class="control-input" type="number" min="1" placeholder="Max" value="99" oninput="applyFilter()" />
          </div>
        </div>
      </div>
    </div>

    <div id="statusWrap" class="status-wrap" style="display:none;">
      <div class="spinner"></div>
      <div id="statusText" class="status-text"></div>
    </div>

    <div id="resultsWrap" style="display:none;">
      <div class="results-header">
        <div class="results-meta" id="resultsMeta"></div>
        <button id="tradeFilterBtn" class="trade-filter-btn" onclick="toggleTradeFilter()">
          <span class="trade-filter-dot"></span>
          <span id="tradeFilterLabel">Show trade only</span>
        </button>
      </div>
      <div id="tradeFilterEmpty" class="trade-filter-empty">No cards from this search are in your trade summary.</div>
      <div class="table-scroll">
        <table class="results-table">
          <thead id="tableHead"></thead>
          <tbody id="tableBody"></tbody>
        </table>
      </div>
    </div>
  </main>

  <!-- Trade Tab -->
  <button id="tradeTab" class="trade-tab" onclick="toggleSidebar()">
    Trade<span id="tradeCountBadge" class="trade-count-badge">0</span>
  </button>

  <!-- Trade Sidebar -->
  <div id="tradeSidebar" class="trade-sidebar">
    <div class="trade-sidebar-header">
      <span class="trade-sidebar-title">Trade Summary</span>
      <button class="trade-close-btn" onclick="toggleSidebar()">✕</button>
    </div>
    <div id="tradeEntries" class="trade-entries">
      <p class="trade-empty">No assets selected yet.<br>Click a mint # in the table to add it.</p>
    </div>
    <div class="trade-sidebar-footer">
      <button id="tradeCopyBtn" class="trade-action-btn" onclick="copyTrade()">Copy to Clipboard</button>
      <button class="trade-action-btn trade-action-btn--danger" onclick="clearTrade()">Clear All</button>
    </div>
  </div>

  <script src="nav.js"></script>
  <script>
    'use strict';

    const MAX_WAL   = 5;

    let API          = '';
    let packsCatalog = [];
    let rarityRank   = {};
    let lastSorted   = [];
    let lastWalletMaps = [];
    let lastWallets      = [];
    let currentDropLabel = '';
    let lastCollection   = '';
    let lastSchema       = '';
    let tradeFilterActive = false;

    // ── Trade Summary state ───────────────────────────────────────────────────
    let tradeSummary   = [];
    let tradeIdCounter = 0;

    const TRADE_STORAGE_KEY = 'popinstock_trade';

    function saveTrade() {
      localStorage.setItem(TRADE_STORAGE_KEY, JSON.stringify({ items: tradeSummary, counter: tradeIdCounter }));
    }
    function loadTrade() {
      try {
        const raw = localStorage.getItem(TRADE_STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          tradeSummary   = parsed.items   ?? [];
          tradeIdCounter = parsed.counter ?? 0;
        }
      } catch { tradeSummary = []; tradeIdCounter = 0; }
      renderSidebar();
      updateTradeTab();
    }

    function tradeKey(templateId, wallet, mint) { return `${templateId}:${wallet}:${mint}`; }
    function isInTrade(templateId, wallet, mint) {
      return tradeSummary.some(e => e.key === tradeKey(templateId, wallet, mint));
    }

    // ── Data loading ──────────────────────────────────────────────────────────

    async function loadJSON(path) {
      const r = await fetch(path);
      if (!r.ok) throw new Error(`Failed to load ${path}`);
      return r.json();
    }

    function fmtSchema(schema) {
      const s = schema.replace(/\.drop$/, '').replace(/([a-z])(\d)/g, '$1 $2');
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    async function init() {
      const [drops, packs, sortOrder, endpoint] = await Promise.all([
        loadJSON('data/drops_catalog.json'),
        loadJSON('data/packs_catalog.json'),
        loadJSON('data/sort_order.json'),
        loadJSON('data/wax_endpoint.json'),
      ]);

      API = endpoint.atomicassets;

      packsCatalog = packs;

      sortOrder.rarity.forEach((r, i) => {
        rarityRank[r.toLowerCase()] = i;
      });

      const sel = document.getElementById('dropSelect');
      for (const d of drops) {
        const opt = document.createElement('option');
        opt.value = `${d.collection}|${d.schema}`;
        opt.textContent = `${d.displayname ?? d.collection}  —  ${fmtSchema(d.schema)}`;
        sel.appendChild(opt);
      }

      sel.addEventListener('change', updateBtn);
      const walletsInput = document.getElementById('walletsInput');
      walletsInput.addEventListener('input', () => {
        const { selectionStart, selectionEnd } = walletsInput;
        walletsInput.value = walletsInput.value.toLowerCase();
        walletsInput.setSelectionRange(selectionStart, selectionEnd);
        updateBtn();
      });
      document.getElementById('searchBtn').addEventListener('click', onSearch);

      loadTrade();
    }

    function updateBtn() {
      const hasDrop    = document.getElementById('dropSelect').value !== '';
      const hasWallets = document.getElementById('walletsInput').value.trim() !== '';
      document.getElementById('searchBtn').disabled = !(hasDrop && hasWallets);
    }

    // ── API helpers ───────────────────────────────────────────────────────────

    async function apiFetch(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(`API ${r.status}: ${url}`);
      const json = await r.json();
      if (!json.success) throw new Error(`API error: ${url}`);
      return json.data;
    }

    async function fetchAllPages(baseUrl) {
      const out = [];
      let page = 1;
      while (true) {
        const data = await apiFetch(`${baseUrl}&page=${page}&limit=1000`);
        out.push(...data);
        if (data.length < 1000) break;
        page++;
      }
      return out;
    }

    // ── Search ────────────────────────────────────────────────────────────────

    async function onSearch() {
      const btn = document.getElementById('searchBtn');
      btn.disabled = true;
      hideError();
      hideResults();

      const wallets = [...new Set(
        document.getElementById('walletsInput').value
          .split(',').map(w => w.trim()).filter(Boolean)
      )];

      if (wallets.length === 0) {
        showError('Enter at least one wallet address.');
        btn.disabled = false; return;
      }
      if (wallets.length > MAX_WAL) {
        showError(`Maximum ${MAX_WAL} wallets allowed.`);
        btn.disabled = false; return;
      }

      const [collection, schema] = document.getElementById('dropSelect').value.split('|');

      const packEntry = packsCatalog.find(e => e.collection === collection && e.schema === schema);
      const packIds   = new Set((packEntry?.packs ?? []).map(String));

      try {
        setStatus('Fetching template data…');
        const rawTemplates = await fetchAllPages(
          `${API}/templates?collection_name=${collection}&schema_name=${schema}`
        );

        const templates = new Map();
        for (const t of rawTemplates) {
          if (parseInt(t.issued_supply, 10) === 0) continue;
          const d = t.immutable_data ?? {};
          templates.set(t.template_id, {
            templateId : t.template_id,
            name       : d.name   ?? t.name ?? `#${t.template_id}`,
            cardId     : d.cardid ?? '—',
            rarity     : packIds.has(t.template_id) ? 'Pack' : (d.rarity ?? 'Unknown'),
          });
        }

        setStatus(`Fetching assets for ${wallets.length} wallet${wallets.length > 1 ? 's' : ''}…`);
        const walletMaps = await Promise.all(wallets.map(w => fetchWalletAssets(collection, schema, w)));

        lastWallets = wallets;
        lastCollection = collection;
        lastSchema = schema;
        currentDropLabel = document.getElementById('dropSelect').selectedOptions[0].text;

        hideStatus();
        renderTable(templates, wallets, walletMaps);
        reapplyHighlights();
        applyTradeFilter();

      } catch (err) {
        hideStatus();
        showError(err.message);
      }

      btn.disabled = false;
    }

    async function fetchWalletAssets(collection, schema, wallet) {
      const map = new Map(); // templateId → { lowestMint, count }
      try {
        const assets = await fetchAllPages(
          `${API}/assets?collection_name=${collection}&schema_name=${schema}&owner=${wallet}&sort=template_mint&order=asc`
        );
        for (const a of assets) {
          const tid  = a.template?.template_id;
          const mint = parseInt(a.template_mint, 10);
          if (!tid || isNaN(mint)) continue;
          if (!map.has(tid)) {
            map.set(tid, { mints: [mint], count: 1 });
          } else {
            const e = map.get(tid);
            e.count++;
            e.mints.push(mint);
          }
        }
        // Sort and trim to 4 lowest per template
        for (const e of map.values()) {
          e.mints.sort((a, b) => a - b);
          e.mints = e.mints.slice(0, 4);
        }
      } catch (e) {
        console.warn(`Could not fetch assets for ${wallet}:`, e.message);
      }
      return map;
    }

    // ── Render ────────────────────────────────────────────────────────────────

    function rarityKey(r) { return r.toLowerCase().replace(/\s+/g, ''); }

    function getRank(rarity) {
      return rarityRank[rarity.toLowerCase()] ?? 999;
    }

    function abbrev(wallet) {
      return wallet.length > 13 ? wallet.slice(0, 6) + '…' + wallet.slice(-4) : wallet;
    }

    function renderTable(templates, wallets, walletMaps) {
      const sorted = [...templates.values()].sort((a, b) => {
        const rd = getRank(a.rarity) - getRank(b.rarity);
        if (rd !== 0) return rd;
        const ca = parseInt(a.cardId, 10), cb = parseInt(b.cardId, 10);
        if (!isNaN(ca) && !isNaN(cb)) return ca - cb;
        return String(a.cardId).localeCompare(String(b.cardId));
      });

      // Head
      const thead = document.getElementById('tableHead');
      thead.innerHTML = '';
      const hr = document.createElement('tr');
      ['ID — Card', ...wallets.map(abbrev)].forEach((col, i) => {
        const th = document.createElement('th');
        if (i === 0) {
          const wrap = document.createElement('div');
          wrap.className = 'card-name-line';
          const left = document.createElement('span');
          left.textContent = 'ID — Card';
          const right = document.createElement('span');
          right.className = 'template-id-suffix';
          right.style.opacity = '0.4';
          right.textContent = 'Template ID';
          wrap.appendChild(left);
          wrap.appendChild(right);
          th.appendChild(wrap);
        } else {
          th.textContent = col;
          th.className = 'col-wallet';
          th.title = wallets[i - 1];
        }
        hr.appendChild(th);
      });
      thead.appendChild(hr);

      // Body — one <tbody class="card-group"> per card (main row + market sub-row)
      const tableEl = document.querySelector('.results-table');
      tableEl.querySelectorAll('tbody').forEach(b => b.remove());
      const frag = document.createDocumentFragment();

      lastSorted     = sorted;
      lastWalletMaps = walletMaps;

      const curMin = parseInt(document.getElementById('mintMin').value, 10);
      const curMax = parseInt(document.getElementById('mintMax').value, 10);
      const curHasMin = !isNaN(curMin);
      const curHasMax = !isNaN(curMax);


      for (const tmpl of sorted) {
        const cardTbody = document.createElement('tbody');
        cardTbody.className = 'card-group';

        // ── Main row ──
        const row = document.createElement('tr');
        row.className = 'card-main-row';

        // Card info cell — row 1: [ID — Name] (space-between) [templateId]
        const tdName = document.createElement('td');
        const nameLine = document.createElement('div');
        nameLine.className = 'card-name-line';
        const nameLeft = document.createElement('span');
        if (tmpl.cardId !== '—') {
          const idSpan = document.createElement('span');
          idSpan.className = 'card-id-prefix';
          idSpan.textContent = `${tmpl.cardId} — `;
          nameLeft.appendChild(idSpan);
        }
        nameLeft.appendChild(document.createTextNode(tmpl.name));
        const tidSpan = document.createElement('span');
        tidSpan.className = 'template-id-suffix';
        tidSpan.textContent = tmpl.templateId;
        nameLine.appendChild(nameLeft);
        nameLine.appendChild(tidSpan);
        tdName.appendChild(nameLine);
        row.appendChild(tdName);

        // ── Meta sub-row: rarity (left) + market links (right) in first col,
        //    wallet sub-cells (other mints) filled by fillWalletCells ──
        const subRow = document.createElement('tr');
        subRow.className = 'card-sub-row';
        const tdMeta = document.createElement('td');
        tdMeta.className = 'card-meta-cell';
        const metaLine = document.createElement('div');
        metaLine.className = 'card-meta-line';
        const rarityBadge = document.createElement('span');
        rarityBadge.className = `rarity-badge rarity-${rarityKey(tmpl.rarity)}`;
        rarityBadge.textContent = tmpl.rarity;
        metaLine.appendChild(rarityBadge);
        const linksWrap = document.createElement('div');
        linksWrap.className = 'market-links';
        [
          { href: `https://droppp.io/products/${tmpl.templateId}/`,                                                                                                                                                                                           icon: '../images/droppp.svg',      title: 'View on Droppp' },
          { href: `https://wax.atomichub.io/market?blockchain=wax-mainnet&collection_name=${lastCollection}&template_id=${tmpl.templateId}&order=asc&primary_chain=wax-mainnet&schema_name=${lastSchema}&sort=template_mint&symbol=WAX&max_assets=1`,         icon: '../images/atomic.svg',      title: 'View on AtomicHub' },
          { href: `https://neftyblocks.com/marketplace/listing?collection_name=${lastCollection}&order=asc&page=1&sort=template_mint&template_id=${tmpl.templateId}`,                                                                                         icon: '../images/neftyblocks.svg', title: 'View on NeftyBlocks' },
          { href: `https://nfthive.io/market?term=${tmpl.templateId}&order_by=mint_asc&offer_type=listings`,                                                                                                                                   icon: '../images/nfthive.svg',     title: 'View on NFTHive' },
        ].forEach(({ href, icon, title }) => {
          const a = document.createElement('a');
          a.href = href;
          a.target = '_blank';
          a.rel = 'noopener noreferrer';
          a.className = 'market-link';
          a.title = title;
          const img = document.createElement('img');
          img.src = icon;
          img.alt = title;
          a.appendChild(img);
          linksWrap.appendChild(a);
        });
        metaLine.appendChild(linksWrap);
        tdMeta.appendChild(metaLine);
        subRow.appendChild(tdMeta);

        fillWalletCells(row, subRow, tmpl, walletMaps, curHasMin, curMin, curHasMax, curMax);
        cardTbody.appendChild(row);
        cardTbody.appendChild(subRow);

        frag.appendChild(cardTbody);
      }

      tableEl.appendChild(frag);

      // Meta
      updateResultsMeta(sorted.length, sorted.length);

      document.getElementById('filterRow').style.display = '';
      showResults();
    }

    // ── Mint filter ───────────────────────────────────────────────────────────

    function mintInRange(m, hasMin, min, hasMax, max) {
      return (!hasMin || m >= min) && (!hasMax || m <= max);
    }

    function makeMintSpan(tmpl, wallet, mint) {
      const span = document.createElement('span');
      span.className = 'mint-clickable';
      const key = tradeKey(tmpl.templateId, wallet, mint);
      span.dataset.tradeKey = key;
      span.textContent = `#${mint}`;
      if (isInTrade(tmpl.templateId, wallet, mint)) span.classList.add('mint-selected');
      span.addEventListener('click', () => toggleMint(tmpl, wallet, mint, span));
      return span;
    }

    function fillWalletCells(mainRow, subRow, tmpl, walletMaps, hasMin, min, hasMax, max) {
      // Remove existing wallet TDs (keep first 1: card info in main, meta cell in sub)
      while (mainRow.cells.length > 1) mainRow.deleteCell(1);
      while (subRow.cells.length > 1) subRow.deleteCell(1);

      // Find lowest in-range mint across all wallets
      let lowest = Infinity;
      for (const wmap of walletMaps) {
        const e = wmap.get(tmpl.templateId);
        if (e) {
          for (const m of e.mints) {
            if (mintInRange(m, hasMin, min, hasMax, max) && m < lowest) lowest = m;
          }
        }
      }

      walletMaps.forEach((wmap, walletIdx) => {
        const wallet  = lastWallets[walletIdx] ?? `wallet${walletIdx}`;
        const tdMain  = document.createElement('td');
        const tdSub   = document.createElement('td');
        const entry   = wmap.get(tmpl.templateId);

        if (entry) {
          const visible  = entry.mints.filter(m => mintInRange(m, hasMin, min, hasMax, max));
          const isLowest = visible.length > 0 && visible[0] === lowest;
          const cls      = 'col-wallet' + (isLowest ? ' mint-lowest' : '');
          tdMain.className = cls;
          tdSub.className  = cls;

          const cell = document.createElement('div');
          cell.className = 'wallet-cell';
          const spanCopies = document.createElement('span');
          spanCopies.className = 'wallet-copies';
          spanCopies.textContent = `${entry.count}x`;
          const spanMint = document.createElement('span');
          spanMint.className = 'wallet-mint';
          if (visible.length > 0) {
            spanMint.appendChild(makeMintSpan(tmpl, wallet, visible[0]));
          } else {
            spanMint.textContent = '—';
          }
          cell.appendChild(spanCopies);
          cell.appendChild(spanMint);
          tdMain.appendChild(cell);

          if (visible.length > 1) {
            const next = document.createElement('div');
            next.className = 'wallet-next-mints';
            visible.slice(1).forEach((m, i) => {
              if (i > 0) next.appendChild(document.createTextNode(', '));
              next.appendChild(makeMintSpan(tmpl, wallet, m));
            });
            tdSub.appendChild(next);
          }
        } else {
          tdMain.className = 'col-empty';
          tdMain.textContent = '—';
        }

        mainRow.appendChild(tdMain);
        subRow.appendChild(tdSub);
      });
    }

    function applyFilter() {
      const minVal = parseInt(document.getElementById('mintMin').value, 10);
      const maxVal = parseInt(document.getElementById('mintMax').value, 10);
      const hasMin = !isNaN(minVal);
      const hasMax = !isNaN(maxVal);

      const mainRows = document.querySelectorAll('.card-main-row');
      const subRows  = document.querySelectorAll('.card-sub-row');
      lastSorted.forEach((tmpl, i) => {
        fillWalletCells(mainRows[i], subRows[i], tmpl, lastWalletMaps, hasMin, minVal, hasMax, maxVal);
      });
      applyTradeFilter();
    }

    // ── Trade Summary logic ───────────────────────────────────────────────────

    function toggleMint(tmpl, wallet, mint, spanEl) {
      if (isInTrade(tmpl.templateId, wallet, mint)) {
        const entry = tradeSummary.find(e => e.key === tradeKey(tmpl.templateId, wallet, mint));
        if (entry) removeFromTrade(entry.id);
      } else {
        addToTrade(tmpl, wallet, mint);
        spanEl.classList.add('mint-selected');
      }
      applyTradeFilter();
    }

    function addToTrade(tmpl, wallet, mint) {
      const key = tradeKey(tmpl.templateId, wallet, mint);
      if (isInTrade(tmpl.templateId, wallet, mint)) return;
      tradeSummary.push({
        id        : ++tradeIdCounter,
        key,
        templateId: tmpl.templateId,
        mint,
        cardId    : tmpl.cardId,
        cardName  : tmpl.name,
        rarity    : tmpl.rarity,
        wallet,
        dropLabel : currentDropLabel,
      });
      saveTrade();
      renderSidebar();
      updateTradeTab();
    }

    function removeFromTrade(id) {
      const entry = tradeSummary.find(e => e.id === id);
      if (!entry) return;
      tradeSummary = tradeSummary.filter(e => e.id !== id);
      saveTrade();
      const span = document.querySelector(`[data-trade-key="${entry.key}"]`);
      if (span) span.classList.remove('mint-selected');
      renderSidebar();
      updateTradeTab();
    }

    function clearTrade() {
      tradeSummary = [];
      saveTrade();
      document.querySelectorAll('.mint-selected').forEach(el => el.classList.remove('mint-selected'));
      renderSidebar();
      updateTradeTab();
    }

    function reapplyHighlights() {
      tradeSummary.forEach(entry => {
        const span = document.querySelector(`[data-trade-key="${entry.key}"]`);
        if (span) span.classList.add('mint-selected');
      });
    }

    function renderSidebar() {
      const container = document.getElementById('tradeEntries');
      container.innerHTML = '';
      if (tradeSummary.length === 0) {
        container.innerHTML = '<p class="trade-empty">No assets selected yet.<br>Click a mint # in the table to add it.</p>';
        return;
      }

      // Group entries by wallet, preserving insertion order
      const byWallet = new Map();
      tradeSummary.forEach(entry => {
        if (!byWallet.has(entry.wallet)) byWallet.set(entry.wallet, []);
        byWallet.get(entry.wallet).push(entry);
      });

      byWallet.forEach((entries, wallet) => {
        entries.sort((a, b) => {
          const dd = a.dropLabel.localeCompare(b.dropLabel);
          if (dd !== 0) return dd;
          const ca = parseInt(a.cardId, 10), cb = parseInt(b.cardId, 10);
          if (!isNaN(ca) && !isNaN(cb)) return ca - cb;
          return String(a.cardId).localeCompare(String(b.cardId));
        });

        const group = document.createElement('div');
        group.className = 'trade-wallet-group';

        // Wallet header
        const header = document.createElement('div');
        header.className = 'trade-wallet-header';
        const label = document.createElement('span');
        label.className = 'trade-wallet-label';
        label.textContent = wallet;
        label.title = wallet;
        const divider = document.createElement('div');
        divider.className = 'trade-wallet-divider';
        header.appendChild(label);
        header.appendChild(divider);
        group.appendChild(header);

        // Entries for this wallet
        entries.forEach(entry => {
          const el = document.createElement('div');
          el.className = 'trade-entry';

          const main = document.createElement('div');
          main.className = 'trade-entry-main';
          const mintSpan = document.createElement('span');
          mintSpan.className = 'trade-entry-mint';
          mintSpan.textContent = `#${entry.mint}`;
          const nameSpan = document.createElement('span');
          nameSpan.className = 'trade-entry-name';
          nameSpan.textContent = entry.cardName;
          nameSpan.title = entry.cardName;
          main.appendChild(mintSpan);
          main.appendChild(nameSpan);

          const sub = document.createElement('div');
          sub.className = 'trade-entry-sub';
          sub.textContent = `ID: ${entry.cardId}  ·  ${entry.rarity}`;

          const drop = document.createElement('div');
          drop.className = 'trade-entry-drop';
          drop.textContent = entry.dropLabel;
          drop.title = entry.dropLabel;

          const removeBtn = document.createElement('button');
          removeBtn.className = 'trade-remove-btn';
          removeBtn.textContent = '✕';
          removeBtn.title = 'Remove from trade';
          removeBtn.onclick = () => removeFromTrade(entry.id);

          el.appendChild(main);
          el.appendChild(sub);
          el.appendChild(drop);
          el.appendChild(removeBtn);
          group.appendChild(el);
        });

        container.appendChild(group);
      });
    }

    function updateTradeTab() {
      document.getElementById('tradeCountBadge').textContent = tradeSummary.length;
    }

    function toggleSidebar() {
      document.getElementById('tradeSidebar').classList.toggle('open');
    }

    function copyTrade() {
      if (tradeSummary.length === 0) return;
      const byWallet = new Map();
      tradeSummary.forEach(e => {
        if (!byWallet.has(e.wallet)) byWallet.set(e.wallet, []);
        byWallet.get(e.wallet).push(e);
      });
      const lines = [];
      byWallet.forEach((entries, wallet) => {
        entries.sort((a, b) => {
          const dd = a.dropLabel.localeCompare(b.dropLabel);
          if (dd !== 0) return dd;
          const ca = parseInt(a.cardId, 10), cb = parseInt(b.cardId, 10);
          if (!isNaN(ca) && !isNaN(cb)) return ca - cb;
          return String(a.cardId).localeCompare(String(b.cardId));
        });
        lines.push(`[ ${wallet} ]`);
        entries.forEach(e => lines.push(`  #${e.mint}  ${e.cardName} (ID: ${e.cardId})  —  ${e.dropLabel}`));
        lines.push('');
      });
      lines.pop(); // remove trailing blank line
      navigator.clipboard.writeText(lines.join('\n')).then(() => {
        const btn = document.getElementById('tradeCopyBtn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy to Clipboard', 1800);
      }).catch(() => {
        alert(lines.join('\n'));
      });
    }

    // ── Trade filter ─────────────────────────────────────────────────────────

    function updateResultsMeta(visible, total) {
      const wc = lastWallets.length;
      const meta = document.getElementById('resultsMeta');
      if (tradeFilterActive && visible < total) {
        meta.innerHTML = `<strong>${visible}</strong> of <strong>${total}</strong> cards &nbsp;·&nbsp; <strong>${wc}</strong> wallet${wc > 1 ? 's' : ''} &nbsp;·&nbsp; ${currentDropLabel}`;
      } else {
        meta.innerHTML = `<strong>${total}</strong> templates &nbsp;·&nbsp; <strong>${wc}</strong> wallet${wc > 1 ? 's' : ''} &nbsp;·&nbsp; ${currentDropLabel}`;
      }
    }

    function toggleTradeFilter() {
      tradeFilterActive = !tradeFilterActive;
      const btn = document.getElementById('tradeFilterBtn');
      btn.classList.toggle('trade-filter-btn--active', tradeFilterActive);
      document.getElementById('tradeFilterLabel').textContent = tradeFilterActive ? 'Show all cards' : 'Show trade only';
      applyTradeFilter();
    }

    function applyTradeFilter() {
      const groups = document.querySelectorAll('.card-group');
      const tableScroll = document.querySelector('.table-scroll');
      const emptyEl = document.getElementById('tradeFilterEmpty');
      let visible = 0;

      groups.forEach(group => {
        if (!tradeFilterActive) {
          group.style.display = '';
          visible++;
        } else {
          const hasSelected = group.querySelector('.mint-selected') !== null;
          group.style.display = hasSelected ? '' : 'none';
          if (hasSelected) visible++;
        }
      });

      const isEmpty = tradeFilterActive && visible === 0;
      tableScroll.style.display = isEmpty ? 'none' : '';
      emptyEl.style.display     = isEmpty ? 'block' : 'none';

      updateResultsMeta(visible, lastSorted.length);
    }

    // ── UI helpers ────────────────────────────────────────────────────────────

    function setStatus(msg) {
      document.getElementById('statusText').textContent = msg;
      document.getElementById('statusWrap').style.display = 'flex';
    }
    function hideStatus()  { document.getElementById('statusWrap').style.display  = 'none'; }
    function showResults() { document.getElementById('resultsWrap').style.display = 'block'; }
    function hideResults() { document.getElementById('resultsWrap').style.display = 'none'; }
    function showError(msg) {
      const el = document.getElementById('inputError');
      el.textContent = msg;
      el.style.display = 'block';
    }
    function hideError() { document.getElementById('inputError').style.display = 'none'; }

    // ── Boot ──────────────────────────────────────────────────────────────────
    init().catch(err => showError(`Init failed: ${err.message}`));
  </script>

</body>
</html>
