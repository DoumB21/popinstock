<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Funko NFT Redemption Numbers — Hoardio</title>
  <meta name="description" content="View final redemption numbers for all Funko Digital Pop! sets on the WAX blockchain. Track how many of each NFT were minted across every drop." />
  <link rel="canonical" href="https://www.hoardio.com/funko/redemptions" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.hoardio.com/funko/redemptions" />
  <meta property="og:title" content="Funko NFT Redemption Numbers — Hoardio" />
  <meta property="og:description" content="View final redemption numbers for all Funko Digital Pop! sets on the WAX blockchain. Track how many of each NFT were minted across every drop." />
  <meta property="og:image" content="https://www.hoardio.com/images/og-funko.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Funko NFT Redemption Numbers — Hoardio" />
  <meta name="twitter:description" content="View final redemption numbers for all Funko Digital Pop! sets on the WAX blockchain. Track how many of each NFT were minted across every drop." />
  <meta name="twitter:image" content="https://www.hoardio.com/images/og-funko.png" />
  <link rel="icon" href="../images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="../images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="../shared/global.css" />
  <style>
    /* ── Page layout (this page uses .page as centered container) ── */
    .page {
      max-width: 1100px;
      width: 100%;
      margin: 0 auto;
      padding: 2.5rem 1.5rem 4rem;
    }

    /* ── Controls ── */
    .controls {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      align-items: center; margin-bottom: 1.5rem;
    }
    .search-wrap {
      position: relative; flex: 1; min-width: 200px;
    }
    .search-wrap svg {
      position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; fill: var(--text-secondary); pointer-events: none;
    }
    .search-input { padding-left: 2.4rem; }

    .stats {
      font-size: 0.8rem; color: var(--text-secondary);
      margin-left: auto; white-space: nowrap;
    }

    /* ── Accordion sets ── */
    .sets-list { display: flex; flex-direction: column; gap: 0.6rem; }

    .set-item {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
      transition: border-color 0.2s;
    }
    .set-item:hover { border-color: var(--border-hover); }
    .set-item.hidden { display: none; }

    .set-header {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.95rem 1.25rem; cursor: pointer;
      user-select: none;
    }

    .set-chevron {
      width: 18px; height: 18px; flex-shrink: 0;
      color: var(--text-secondary);
      transition: transform 0.2s;
    }
    .set-item.open .set-chevron { transform: rotate(90deg); }

    .set-name { font-size: 0.95rem; font-weight: 600; flex: 1; }

    .set-meta {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.75rem; color: var(--text-secondary); flex-shrink: 0;
    }
    .set-count {
      background: rgba(255,255,255,0.06); border-radius: 999px;
      padding: 0.15rem 0.55rem;
    }

    .set-body { display: none; border-top: 1px solid var(--border); }
    .set-item.open .set-body { display: block; }

    /* Table */
    .figures-table { width: 100%; border-collapse: collapse; }
    .figures-table th {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--text-secondary);
      padding: 0.6rem 1.25rem; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .figures-table th:not(:first-child) { text-align: right; }
    .figures-table th:last-child { text-align: center; }

    .figures-table td {
      padding: 0.65rem 1.25rem; font-size: 0.875rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .figures-table tr:last-child td { border-bottom: none; }
    .figures-table tr:nth-child(even) td { background: var(--bg-row-alt); }
    .figures-table td:not(:first-child) { text-align: right; }
    .figures-table td:last-child { text-align: center; }

    .btn-price-history {
      display: inline-flex; align-items: center; gap: 0.3rem;
      font-size: 0.72rem; font-weight: 600;
      padding: 0.28rem 0.65rem; border-radius: 7px;
      background: rgba(99,102,241,0.1);
      border: 1px solid rgba(99,102,241,0.3);
      color: #a5b4fc;
      text-decoration: none;
      white-space: nowrap;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .btn-price-history:hover {
      background: rgba(99,102,241,0.2);
      border-color: rgba(99,102,241,0.55);
      color: #c7d2fe;
    }

    .pct-bar-wrap { display: flex; align-items: center; gap: 0.5rem; justify-content: flex-end; }
    .pct-label { font-size: 0.8rem; width: 42px; text-align: right; color: var(--text-secondary); }
    .pct-bar {
      width: 60px; height: 5px; background: rgba(255,255,255,0.08);
      border-radius: 999px; overflow: hidden; flex-shrink: 0;
    }
    .pct-fill { height: 100%; border-radius: 999px; background: var(--accent); }
    .pct-fill.high { background: #4dd9c0; }
    .pct-fill.low  { background: #e05252; }

    @media (max-width: 600px) {
      .page { padding: 1.5rem 0.75rem 3rem; }

      /* ── Stacked card layout: each row becomes a block ── */
      .figures-table { display: block; }
      .figures-table thead { display: none; }
      .figures-table tbody { display: flex; flex-direction: column; gap: 0.5rem; padding: 0.75rem; }
      .figures-table tbody tr {
        display: block;
        background: var(--bg);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 0.75rem 1rem;
      }
      .figures-table tr:nth-child(even) td { background: transparent; }
      .figures-table tbody td {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 0.3rem 0;
        border-bottom: none;
        text-align: right;
        font-size: 0.875rem;
      }
      .figures-table tbody td::before {
        content: attr(data-label);
        font-size: 0.68rem;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        color: var(--text-secondary);
        flex-shrink: 0;
        text-align: left;
        margin-right: 0.75rem;
      }
      /* Figure name is the card header — no label prefix */
      .figures-table tbody td:first-child {
        font-weight: 600;
        font-size: 0.9rem;
        padding-bottom: 0.6rem;
        margin-bottom: 0.25rem;
        border-bottom: 1px solid var(--border);
        justify-content: flex-start;
      }
      .figures-table tbody td:first-child::before { display: none; }
      /* Price History button sits full-width at the bottom of the card */
      .figures-table tbody td:last-child {
        justify-content: flex-end;
        padding-top: 0.5rem;
      }
      .figures-table tbody td:last-child::before { display: none; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

  <div class="page">
    <div class="page-header">
      <h1 class="page-title">Funko NFT <span class="accent">Redemptions</span></h1>
      <p class="page-desc">Final redemption numbers for all Funko Digital Pop sets on WAX.</p>
    </div>

    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search sets or figures…" />
      </div>
      <div class="cb-dropdown" id="rarityDd">
        <button class="cb-dropdown-btn" id="rarityTrigger" type="button">
          <span class="cb-label">All rarities</span>
          <span class="cb-arrow">▾</span>
        </button>
        <div class="cb-panel" id="rarityPanel"></div>
      </div>
      <button class="ctrl-btn" id="expandAll">Expand All</button>
      <button class="ctrl-btn" id="collapseAll">Collapse All</button>
      <span class="stats" id="stats"></span>
    </div>

    <div class="sets-list" id="setsList"></div>
    <div class="no-results" id="noResults" style="display:none">No sets or figures match your search.</div>
  </div>


  <script src="nav.js"></script>
  <script>
  let SETS = [];

  function fmt(n) { return n.toLocaleString(); }
  function pct(r, m) { return Math.round((r / m) * 100); }
  function rarityClass(r) { return 'rarity-' + r.toLowerCase(); }
  function pctClass(p) { return p >= 90 ? 'high' : p < 50 ? 'low' : ''; }

  function buildSets(sets) {
    const list = document.getElementById('setsList');
    list.innerHTML = '';
    const totalSets = SETS.length;
    const totalFigs = SETS.reduce((a, s) => a + s.figures.length, 0);

    sets.forEach((set, idx) => {
      const hasFigs = set.figures.length > 0;
      const item = document.createElement('div');
      item.className = 'set-item';
      item.dataset.idx = idx;

      const header = document.createElement('div');
      header.className = 'set-header';
      header.innerHTML = `
        <svg class="set-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        <span class="set-name">${set.name}</span>
        <div class="set-meta">
          <span class="set-count">${set.figures.length} figure${set.figures.length !== 1 ? 's' : ''}</span>
        </div>
      `;

      const body = document.createElement('div');
      body.className = 'set-body';

      if (!hasFigs) {
        body.innerHTML = '<div class="no-data">No data available for this set.</div>';
      } else {
        const table = document.createElement('table');
        table.className = 'figures-table';
        table.innerHTML = `
          <thead><tr>
            <th>Figure</th>
            <th>Rarity</th>
            <th>Redeemed</th>
            <th>Supply</th>
            <th>% redeemed</th>
            <th>Price History</th>
          </tr></thead>
        `;
        const tbody = document.createElement('tbody');
        set.figures.forEach(fig => {
          const p = pct(fig.redeemed, fig.minted);
          const tr = document.createElement('tr');
          tr.dataset.rarity = fig.rarity;
          const priceBtn = fig.ebay_id
            ? `<a href="price-history?id=${fig.ebay_id}" class="btn-price-history">&#9196; Prices</a>`
            : `<span style="color:var(--text-secondary);font-size:0.75rem">\u2014</span>`;
          tr.innerHTML = `
            <td>${fig.name}</td>
            <td data-label="Rarity"><span class="rarity-badge ${rarityClass(fig.rarity)}">${fig.rarity}</span></td>
            <td data-label="Redeemed">${fmt(fig.redeemed)}</td>
            <td data-label="Supply">${fmt(fig.minted)}</td>
            <td data-label="% Redeemed">
              <div class="pct-bar-wrap">
                <span class="pct-label">${p}%</span>
                <div class="pct-bar"><div class="pct-fill ${pctClass(p)}" style="width:${p}%"></div></div>
              </div>
            </td>
            <td data-label="Price History">${priceBtn}</td>
          `;
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        body.appendChild(table);
      }

      header.addEventListener('click', () => item.classList.toggle('open'));
      item.appendChild(header);
      item.appendChild(body);
      list.appendChild(item);
    });

    updateStats();
  }

  function updateStats() {
    const visible = document.querySelectorAll('.set-item:not(.hidden)').length;
    const total = SETS.length;
    document.getElementById('stats').textContent =
      visible === total ? `${total} sets` : `${visible} of ${total} sets`;
  }

  let _rarityFilter = '';

  function applyFilters() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const rarity = _rarityFilter;
    let visibleCount = 0;

    document.querySelectorAll('.set-item').forEach(item => {
      const idx = parseInt(item.dataset.idx);
      const set = SETS[idx];
      const setNameMatch = set.name.toLowerCase().includes(query);
      const matchingFigs = set.figures.filter(fig => {
        const nameMatch = !query || setNameMatch || fig.name.toLowerCase().includes(query);
        const rarityMatch = !rarity || fig.rarity === rarity;
        return nameMatch && rarityMatch;
      });

      const show = !query && !rarity
        ? true
        : setNameMatch && !rarity
        ? true
        : matchingFigs.length > 0;

      item.classList.toggle('hidden', !show);
      if (show) {
        visibleCount++;
        // If searching, open matching sets and filter rows
        if (query || rarity) {
          item.classList.add('open');
          item.querySelectorAll('tbody tr').forEach(tr => {
            const figName = tr.cells[0]?.textContent.toLowerCase() || '';
            const figRarity = tr.dataset.rarity || '';
            const nameOk = !query || setNameMatch || figName.includes(query);
            const rarityOk = !rarity || figRarity === rarity;
            tr.style.display = nameOk && rarityOk ? '' : 'none';
          });
        } else {
          item.querySelectorAll('tbody tr').forEach(tr => tr.style.display = '');
        }
      }
    });

    document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
    document.getElementById('stats').textContent =
      visibleCount === SETS.length ? `${SETS.length} sets` : `${visibleCount} of ${SETS.length} sets`;
  }

  document.getElementById('searchInput').addEventListener('input', applyFilters);

  const RARITY_OPTIONS = [
    { value: '',          label: 'All rarities' },
    { value: 'Mythic',    label: 'Mythic' },
    { value: 'Ultra',     label: 'Ultra' },
    { value: 'Grail',     label: 'Grail' },
    { value: 'Legendary', label: 'Legendary' },
    { value: 'Royalty',   label: 'Royalty' },
  ];
  function renderRarityDd() {
    const panel = document.getElementById('rarityPanel');
    panel.innerHTML = RARITY_OPTIONS.map(o =>
      `<div class="cb-item${o.value === _rarityFilter ? ' active' : ''}" data-val="${o.value}"><span>${o.label}</span></div>`
    ).join('');
    document.querySelector('#rarityDd .cb-label').textContent =
      (RARITY_OPTIONS.find(o => o.value === _rarityFilter) || RARITY_OPTIONS[0]).label;
    panel.querySelectorAll('.cb-item').forEach(item => {
      item.addEventListener('click', () => {
        _rarityFilter = item.dataset.val;
        closeAllDd();
        renderRarityDd();
        applyFilters();
      });
    });
  }
  renderRarityDd();

  function toggleDd(id) {
    const wrap    = document.getElementById(id);
    const panel   = wrap.querySelector('.cb-panel');
    const trigger = wrap.querySelector('.cb-dropdown-btn');
    const isOpen  = panel.classList.contains('open');
    closeAllDd();
    if (!isOpen) { panel.classList.add('open'); trigger.classList.add('open'); }
  }
  function closeAllDd() {
    document.querySelectorAll('.cb-panel.open').forEach(p => p.classList.remove('open'));
    document.querySelectorAll('.cb-dropdown-btn.open').forEach(t => t.classList.remove('open'));
  }
  document.addEventListener('mousedown', e => {
    if (!e.target.closest('.cb-dropdown')) closeAllDd();
  });
  document.getElementById('rarityTrigger').addEventListener('click', () => toggleDd('rarityDd'));

  document.getElementById('expandAll').addEventListener('click', () => {
    document.querySelectorAll('.set-item:not(.hidden)').forEach(i => i.classList.add('open'));
  });
  document.getElementById('collapseAll').addEventListener('click', () => {
    document.querySelectorAll('.set-item').forEach(i => i.classList.remove('open'));
  });

  fetch('data/redemptions_sets_catalog.json')
    .then(r => r.json())
    .then(data => { SETS = data; buildSets(SETS); });
  </script>

</body>
</html>
