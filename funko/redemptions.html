<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Redemptions — PopInStock</title>
  <link rel="icon" type="image/png" href="../images/FoxLogo.png" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0f;
      --bg-card: #13131d;
      --bg-card-hover: #1a1a2a;
      --bg-row-alt: rgba(255,255,255,0.025);
      --border: rgba(255,255,255,0.07);
      --border-hover: rgba(255,255,255,0.15);
      --text-primary: #f0f0f5;
      --text-secondary: #8888aa;
      --accent: #c07828;
      --accent-light: #f0a840;
      --nav-height: 64px;
      --rarity-mythic:    #01ffff;
      --rarity-ultra:     #e8ff00;
      --rarity-grail:     #faa500;
      --rarity-legendary: #e93494;
      --rarity-royalty:   #007deb;
    }

    html, body { height: 100%; }

    body {
      background-color: var(--bg);
      color: var(--text-primary);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.025) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
      z-index: 0;
    }

    /* ── Nav ── */
    .site-nav {
      position: sticky; top: 0; z-index: 100;
      background: rgba(10,10,15,0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }
    .nav-inner {
      display: flex; align-items: center; gap: 0.5rem;
      max-width: 1100px; margin: 0 auto;
      padding: 0 1.5rem; height: var(--nav-height);
    }
    .nav-home { display: flex; align-items: center; flex-shrink: 0; margin-right: 1rem; }
    .nav-home img { height: 36px; width: 36px; object-fit: contain; transition: opacity 0.2s; }
    .nav-home:hover img { opacity: 0.75; }
    .nav-links { display: flex; align-items: center; gap: 0.25rem; flex: 1; }
    .nav-link {
      text-decoration: none; color: var(--text-secondary);
      font-size: 0.875rem; font-weight: 500;
      padding: 0.4rem 0.85rem; border-radius: 999px;
      border: 1px solid transparent;
      transition: color 0.2s, background 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .nav-link:hover { color: var(--text-primary); background: rgba(255,255,255,0.06); }
    .nav-link--active {
      color: var(--accent-light);
      background: rgba(192,120,40,0.12);
      border-color: rgba(192,120,40,0.25);
    }
    .nav-burger {
      display: none; flex-direction: column; justify-content: center; gap: 5px;
      background: none; border: none; cursor: pointer; padding: 0.4rem; margin-left: auto;
    }
    .nav-burger span {
      display: block; width: 22px; height: 2px;
      background: var(--text-secondary); border-radius: 2px;
      transition: transform 0.25s ease, opacity 0.25s ease, background 0.2s;
    }
    .nav-burger--open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .nav-burger--open span:nth-child(2) { opacity: 0; }
    .nav-burger--open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .nav-burger--open span { background: var(--text-primary); }
    .nav-mobile {
      display: none; flex-direction: column;
      padding: 0.75rem 1.5rem 1rem;
      border-top: 1px solid var(--border); gap: 0.25rem;
    }
    .nav-mobile .nav-link { font-size: 0.95rem; padding: 0.6rem 1rem; border-radius: 10px; }
    .nav-mobile--open { display: flex; }
    @media (max-width: 640px) {
      .nav-links { display: none; }
      .nav-burger { display: flex; }
      .nav-mobile { display: none; }
      .nav-mobile--open { display: flex; }
    }

    /* ── Page ── */
    .page {
      position: relative; z-index: 1;
      flex: 1; display: flex; flex-direction: column;
      max-width: 1100px; width: 100%;
      margin: 0 auto; padding: 2.5rem 1.5rem 4rem;
    }

    .page-header { margin-bottom: 2rem; }
    .page-title { font-size: 1.75rem; font-weight: 700; }
    .page-title .accent { color: var(--accent-light); }
    .page-desc { color: var(--text-secondary); margin-top: 0.4rem; font-size: 0.95rem; }

    /* ── Controls ── */
    .controls {
      display: flex; flex-wrap: wrap; gap: 0.75rem;
      align-items: center; margin-bottom: 1.5rem;
    }
    .search-wrap {
      position: relative; flex: 1; min-width: 200px;
    }
    .search-wrap svg {
      position: absolute; left: 0.85rem; top: 50%; transform: translateY(-50%);
      width: 16px; height: 16px; fill: var(--text-secondary); pointer-events: none;
    }
    .search-input {
      width: 100%; background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-primary);
      font-size: 0.9rem; padding: 0.6rem 0.9rem 0.6rem 2.4rem;
      outline: none; transition: border-color 0.2s;
    }
    .search-input:focus { border-color: rgba(192,120,40,0.5); }
    .search-input::placeholder { color: var(--text-secondary); }

    .filter-select {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-primary);
      font-size: 0.875rem; padding: 0.6rem 0.9rem;
      outline: none; cursor: pointer; transition: border-color 0.2s;
    }
    .filter-select:focus { border-color: rgba(192,120,40,0.5); }

    .ctrl-btn {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text-secondary);
      font-size: 0.8rem; padding: 0.6rem 0.9rem;
      cursor: pointer; transition: color 0.2s, border-color 0.2s;
      white-space: nowrap;
    }
    .ctrl-btn:hover { color: var(--text-primary); border-color: var(--border-hover); }

    .stats {
      font-size: 0.8rem; color: var(--text-secondary);
      margin-left: auto; white-space: nowrap;
    }

    /* ── Accordion sets ── */
    .sets-list { display: flex; flex-direction: column; gap: 0.6rem; }

    .set-item {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden;
      transition: border-color 0.2s;
    }
    .set-item:hover { border-color: var(--border-hover); }
    .set-item.hidden { display: none; }

    .set-header {
      display: flex; align-items: center; gap: 0.75rem;
      padding: 0.95rem 1.25rem; cursor: pointer;
      user-select: none;
    }

    .set-chevron {
      width: 18px; height: 18px; flex-shrink: 0;
      color: var(--text-secondary);
      transition: transform 0.2s;
    }
    .set-item.open .set-chevron { transform: rotate(90deg); }

    .set-name { font-size: 0.95rem; font-weight: 600; flex: 1; }

    .set-meta {
      display: flex; align-items: center; gap: 0.5rem;
      font-size: 0.75rem; color: var(--text-secondary); flex-shrink: 0;
    }
    .set-count {
      background: rgba(255,255,255,0.06); border-radius: 999px;
      padding: 0.15rem 0.55rem;
    }

    .set-body { display: none; border-top: 1px solid var(--border); }
    .set-item.open .set-body { display: block; }

    /* Table */
    .figures-table { width: 100%; border-collapse: collapse; }
    .figures-table th {
      font-size: 0.7rem; font-weight: 600; text-transform: uppercase;
      letter-spacing: 0.07em; color: var(--text-secondary);
      padding: 0.6rem 1.25rem; text-align: left;
      border-bottom: 1px solid var(--border);
    }
    .figures-table th:not(:first-child) { text-align: right; }

    .figures-table td {
      padding: 0.65rem 1.25rem; font-size: 0.875rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .figures-table tr:last-child td { border-bottom: none; }
    .figures-table tr:nth-child(even) td { background: var(--bg-row-alt); }
    .figures-table td:not(:first-child) { text-align: right; }

    .rarity-badge {
      display: inline-block; font-size: 0.7rem; font-weight: 700;
      letter-spacing: 0.05em; text-transform: uppercase;
      padding: 0.15rem 0.5rem; border-radius: 999px;
      border: 1px solid transparent;
    }
    .rarity-mythic    { color: var(--rarity-mythic); background-image: linear-gradient(var(--bg-card), var(--bg-card)), linear-gradient(90deg, #01ffff, #9926c1); background-origin: border-box; background-clip: padding-box, border-box; }
    .rarity-ultra     { color: var(--rarity-ultra);     border-color: var(--rarity-ultra);     background: rgba(232,255,0,0.08); }
    .rarity-grail     { color: var(--rarity-grail);     border-color: var(--rarity-grail);     background: rgba(250,165,0,0.12); }
    .rarity-legendary { color: var(--rarity-legendary); border-color: var(--rarity-legendary); background: rgba(233,52,148,0.12); }
    .rarity-royalty   { color: var(--rarity-royalty);   border-color: var(--rarity-royalty);   background: rgba(0,125,235,0.12); }

    .pct-bar-wrap { display: flex; align-items: center; gap: 0.5rem; justify-content: flex-end; }
    .pct-label { font-size: 0.8rem; width: 42px; text-align: right; color: var(--text-secondary); }
    .pct-bar {
      width: 60px; height: 5px; background: rgba(255,255,255,0.08);
      border-radius: 999px; overflow: hidden; flex-shrink: 0;
    }
    .pct-fill { height: 100%; border-radius: 999px; background: var(--accent); }
    .pct-fill.high { background: #4dd9c0; }
    .pct-fill.low  { background: #e05252; }

    .no-data {
      padding: 1.25rem; font-size: 0.85rem;
      color: var(--text-secondary); font-style: italic;
      text-align: center;
    }

    .no-results {
      text-align: center; padding: 3rem 1rem;
      color: var(--text-secondary); font-size: 0.95rem;
    }

    /* ── Footer ── */
    footer {
      position: relative; z-index: 1;
      text-align: center; padding: 1.5rem;
      font-size: 0.8rem; color: var(--text-secondary);
      border-top: 1px solid var(--border);
    }

    @media (max-width: 600px) {
      .pct-bar { display: none; }
      .figures-table th:nth-child(3),
      .figures-table td:nth-child(3) { display: none; }
    }
  </style>
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-4798734033365350" crossorigin="anonymous"></script>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

  <div class="page">
    <div class="page-header">
      <h1 class="page-title">Funko NFT <span class="accent">Redemptions</span></h1>
      <p class="page-desc">Final redemption numbers for all Funko Digital Pop sets on WAX.</p>
    </div>

    <div class="controls">
      <div class="search-wrap">
        <svg viewBox="0 0 24 24"><path d="M21 21l-4.35-4.35M17 11A6 6 0 1 1 5 11a6 6 0 0 1 12 0z" stroke="currentColor" stroke-width="2" fill="none" stroke-linecap="round"/></svg>
        <input type="text" class="search-input" id="searchInput" placeholder="Search sets or figures…" />
      </div>
      <select class="filter-select" id="rarityFilter">
        <option value="">All Rarities</option>
        <option value="Mythic">Mythic</option>
        <option value="Ultra">Ultra</option>
        <option value="Grail">Grail</option>
        <option value="Legendary">Legendary</option>
        <option value="Royalty">Royalty</option>
      </select>
      <button class="ctrl-btn" id="expandAll">Expand All</button>
      <button class="ctrl-btn" id="collapseAll">Collapse All</button>
      <span class="stats" id="stats"></span>
    </div>

    <div class="sets-list" id="setsList"></div>
    <div class="no-results" id="noResults" style="display:none">No sets or figures match your search.</div>
  </div>


  <script src="nav.js"></script>
  <script>
  let SETS = [];

  function fmt(n) { return n.toLocaleString(); }
  function pct(r, m) { return Math.round((r / m) * 100); }
  function rarityClass(r) { return 'rarity-' + r.toLowerCase(); }
  function pctClass(p) { return p >= 90 ? 'high' : p < 50 ? 'low' : ''; }

  function buildSets(sets) {
    const list = document.getElementById('setsList');
    list.innerHTML = '';
    const totalSets = SETS.length;
    const totalFigs = SETS.reduce((a, s) => a + s.figures.length, 0);

    sets.forEach((set, idx) => {
      const hasFigs = set.figures.length > 0;
      const item = document.createElement('div');
      item.className = 'set-item';
      item.dataset.idx = idx;

      const header = document.createElement('div');
      header.className = 'set-header';
      header.innerHTML = `
        <svg class="set-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="9 18 15 12 9 6"/>
        </svg>
        <span class="set-name">${set.name}</span>
        <div class="set-meta">
          <span class="set-count">${set.figures.length} figure${set.figures.length !== 1 ? 's' : ''}</span>
        </div>
      `;

      const body = document.createElement('div');
      body.className = 'set-body';

      if (!hasFigs) {
        body.innerHTML = '<div class="no-data">No data available for this set.</div>';
      } else {
        const table = document.createElement('table');
        table.className = 'figures-table';
        table.innerHTML = `
          <thead><tr>
            <th>Figure</th>
            <th>Rarity</th>
            <th>Redeemed</th>
            <th>Supply</th>
            <th>% redeemed</th>
          </tr></thead>
        `;
        const tbody = document.createElement('tbody');
        set.figures.forEach(fig => {
          const p = pct(fig.redeemed, fig.minted);
          const tr = document.createElement('tr');
          tr.dataset.rarity = fig.rarity;
          tr.innerHTML = `
            <td>${fig.name}</td>
            <td><span class="rarity-badge ${rarityClass(fig.rarity)}">${fig.rarity}</span></td>
            <td>${fmt(fig.redeemed)}</td>
            <td>${fmt(fig.minted)}</td>
            <td>
              <div class="pct-bar-wrap">
                <span class="pct-label">${p}%</span>
                <div class="pct-bar"><div class="pct-fill ${pctClass(p)}" style="width:${p}%"></div></div>
              </div>
            </td>
          `;
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        body.appendChild(table);
      }

      header.addEventListener('click', () => item.classList.toggle('open'));
      item.appendChild(header);
      item.appendChild(body);
      list.appendChild(item);
    });

    updateStats();
  }

  function updateStats() {
    const visible = document.querySelectorAll('.set-item:not(.hidden)').length;
    const total = SETS.length;
    document.getElementById('stats').textContent =
      visible === total ? `${total} sets` : `${visible} of ${total} sets`;
  }

  function applyFilters() {
    const query = document.getElementById('searchInput').value.toLowerCase().trim();
    const rarity = document.getElementById('rarityFilter').value;
    let visibleCount = 0;

    document.querySelectorAll('.set-item').forEach(item => {
      const idx = parseInt(item.dataset.idx);
      const set = SETS[idx];
      const setNameMatch = set.name.toLowerCase().includes(query);
      const matchingFigs = set.figures.filter(fig => {
        const nameMatch = !query || setNameMatch || fig.name.toLowerCase().includes(query);
        const rarityMatch = !rarity || fig.rarity === rarity;
        return nameMatch && rarityMatch;
      });

      const show = !query && !rarity
        ? true
        : setNameMatch && !rarity
        ? true
        : matchingFigs.length > 0;

      item.classList.toggle('hidden', !show);
      if (show) {
        visibleCount++;
        // If searching, open matching sets and filter rows
        if (query || rarity) {
          item.classList.add('open');
          item.querySelectorAll('tbody tr').forEach(tr => {
            const figName = tr.cells[0]?.textContent.toLowerCase() || '';
            const figRarity = tr.dataset.rarity || '';
            const nameOk = !query || setNameMatch || figName.includes(query);
            const rarityOk = !rarity || figRarity === rarity;
            tr.style.display = nameOk && rarityOk ? '' : 'none';
          });
        } else {
          item.querySelectorAll('tbody tr').forEach(tr => tr.style.display = '');
        }
      }
    });

    document.getElementById('noResults').style.display = visibleCount === 0 ? 'block' : 'none';
    document.getElementById('stats').textContent =
      visibleCount === SETS.length ? `${SETS.length} sets` : `${visibleCount} of ${SETS.length} sets`;
  }

  document.getElementById('searchInput').addEventListener('input', applyFilters);
  document.getElementById('rarityFilter').addEventListener('change', applyFilters);
  document.getElementById('expandAll').addEventListener('click', () => {
    document.querySelectorAll('.set-item:not(.hidden)').forEach(i => i.classList.add('open'));
  });
  document.getElementById('collapseAll').addEventListener('click', () => {
    document.querySelectorAll('.set-item').forEach(i => i.classList.remove('open'));
  });

  fetch('data/redemptions_sets_catalog.json')
    .then(r => r.json())
    .then(data => { SETS = data; buildSets(SETS); });
  </script>
</body>
</html>
