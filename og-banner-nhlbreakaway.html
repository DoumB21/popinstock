<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OG Banner — NHL Breakaway — 1200×630</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 1200px;
      height: 630px;
      overflow: hidden;
    }

    body {
      background-color: #0a0a0f;
      color: #f0f0f5;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    /* Grid background */
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 48px 48px;
      pointer-events: none;
    }

    /* Subtle radial glow behind the content — NHL Breakaway cyan (--nhl in
       index.html) instead of the site's orange */
    body::after {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 70% 60% at 50% 50%, rgba(34, 211, 238, 0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .banner {
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 28px;
      text-align: center;
      padding: 0 80px;
    }

    /* Small Hoardio wordmark row, same treatment as the site-wide banner —
       this still identifies as a Hoardio page, just NHL Breakaway-branded
       below. */
    .wordmark {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .wordmark img {
      height: 32px;
      width: auto;
      object-fit: contain;
      filter: invert(1);
      opacity: 0.7;
    }

    /* nhlbreakaway.svg is a full-color wordmark+crest (white/light-gray
       shield, dark interior detail lines) already designed to sit directly
       on a dark background — same as it's shown on the homepage's "Other
       Networks" card — so no invert trick needed here, unlike funko.svg's
       black-only fill. Sized by width (not height) since the source is a
       long, short wordmark (~7:1 aspect ratio), not a compact mark. */
    .nhl-logo {
      width: 480px;
      height: auto;
      object-fit: contain;
      margin: 10px 0 6px;
    }

    /* Main headline */
    h1 {
      font-size: 3.6rem;
      font-weight: 800;
      letter-spacing: -1.5px;
      line-height: 1.1;
      color: #f0f0f5;
    }

    h1 span {
      background: linear-gradient(135deg, #67e8f9, #22d3ee);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    /* Tagline */
    .tagline {
      font-size: 1.25rem;
      color: #8888aa;
      letter-spacing: 0.02em;
      line-height: 1.5;
    }

    /* NHL Breakaway runs on Sweet/Polygon, not WAX — this pill intentionally
       reads differently from the Funko/Topps banners' "Powered by the WAX
       Blockchain" for that reason, not just a copy-paste. */
    .wax-pill {
      font-size: 0.8rem;
      font-weight: 600;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      padding: 7px 20px;
      border-radius: 999px;
      border: 1px solid rgba(34, 211, 238, 0.4);
      background: rgba(34, 211, 238, 0.08);
      color: #67e8f9;
    }

    /* Bottom border accent */
    .accent-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 3px;
      background: linear-gradient(90deg, transparent, #22d3ee 30%, #67e8f9 50%, #22d3ee 70%, transparent);
    }
  </style>
</head>
<body>

  <div class="banner">
    <div class="wordmark">
      <img src="images/Hoardio_logo.png" alt="Hoardio" />
    </div>

    <img class="nhl-logo" src="images/nhlbreakaway.svg" alt="NHL Breakaway" />

    <h1>NHL Breakaway <span>Collector Tools</span></h1>

    <p class="tagline">Set stats, wallet lookups, edition rankings, and collector leaderboards.</p>

    <span class="wax-pill">Powered by Sweet &amp; Polygon</span>
  </div>

  <div class="accent-bar"></div>

</body>
</html>
