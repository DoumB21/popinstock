<script>
'use strict';

const IPFS_GATEWAY_LIST = ['https://ipfs.io/ipfs/', 'https://cloudflare-ipfs.com/ipfs/', 'https://dweb.link/ipfs/'];

function escHtml(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
}
function walletLinkHtml(account) {
  if (!account) return '';
  return `<a href="${_p}inventory/${encodeURIComponent(account)}" class="wallet-link">${escHtml(account)}</a>`;
}
function toMediaUrl(v) { return /^https?:\/\//i.test(v) ? v : IPFS_GATEWAY_LIST[0] + v; }

// Pack collections don't agree on how they name this custom attribute, OR
// whether the value includes a URL scheme — confirmed live: mlb.topps/packs
// uses key "unpack_url" with value "toppsmlb.com/unpack" (no scheme, which
// window.open() would otherwise resolve relative to the CURRENT page
// instead of navigating away), while tmnt.funko/packs.drop uses key
// "unpack url" (a literal space) with a full https:// URL already. Matches
// the key by normalized shape rather than one fixed name, and always forces
// a scheme onto the value.
function resolveUnpackUrl(data) {
  if (!data) return null;
  for (const k in data) {
    if (!/^unpack[\s_-]*url$/i.test(k)) continue;
    const v = String(data[k] || '').trim();
    if (!v) continue;
    return /^https?:\/\//i.test(v) ? v : 'https://' + v;
  }
  return null;
}

// Same markdown-link / bare-URL scan as template.html's own copy — Template
// Attributes values often carry a URL (markdown-style [label](url) or a
// bare URL as the whole field). See template.html for the fuller rationale.
function linkifyValue(raw) {
  const str = String(raw ?? '');
  const re = /\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)|(https?:\/\/[^\s<]+)/g;
  let out = '';
  let last = 0;
  let m;
  while ((m = re.exec(str))) {
    out += escHtml(str.slice(last, m.index));
    if (m[1] !== undefined) {
      out += `<a href="${escHtml(m[2])}" target="_blank" rel="noopener" style="color:var(--accent-light);text-decoration:none">${escHtml(m[1])} ↗</a>`;
    } else {
      let url = m[3];
      let trail = '';
      const t = url.match(/[.,;:!?]+$/);
      if (t) { trail = t[0]; url = url.slice(0, -trail.length); }
      out += `<a href="${escHtml(url)}" target="_blank" rel="noopener" style="color:var(--accent-light);text-decoration:none">${escHtml(url)} ↗</a>${escHtml(trail)}`;
    }
    last = re.lastIndex;
  }
  out += escHtml(str.slice(last));
  return out;
}
function onImgError(el) {
  const idx = parseInt(el.dataset.gwIdx || '0', 10) + 1;
  const hash = el.dataset.ipfsHash;
  if (hash && idx < IPFS_GATEWAY_LIST.length) {
    el.dataset.gwIdx = String(idx);
    setTimeout(() => { el.src = IPFS_GATEWAY_LIST[idx] + hash; }, 1000);
    return;
  }
  el.outerHTML = '<div class="ast-placeholder" style="padding:0;background:none;border:none;">?</div>';
}
function fmtWax(raw, precision) {
  const n = Number(raw) / (10 ** (precision ?? 8));
  if (!isFinite(n)) return '—';
  return n.toLocaleString(undefined, { maximumFractionDigits: 2 }) + ' WAX';
}
function fmtDate(msStr) {
  const n = Number(msStr);
  if (!isFinite(n) || !n) return '';
  return new Date(n).toLocaleDateString(undefined, { year: 'numeric', month: 'short', day: 'numeric' });
}
function fmtDateTime(msStr) {
  const n = Number(msStr);
  if (!isFinite(n) || !n) return '';
  return new Date(n).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' });
}

// Live spot rate — same CoinGecko call template.html/inventory.html use —
// powers every "≈ $" tag on this page that isn't the historical-rate-keyed
// price chart (Lowest Listing, Top Active Offers).
async function fetchWaxPrice() {
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=wax&vs_currencies=usd');
    const json = await r.json();
    window._waxUsdRate = json?.wax?.usd ?? null;
  } catch { /* leave unset — "≈ $" tags simply don't render */ }
}

// Same param-with-path-fallback pattern as template.html's getTemplateIdFromUrl().
function getAssetIdFromUrl() {
  const qp = new URLSearchParams(location.search).get('asset_id');
  if (qp) return qp;
  const m = location.pathname.match(/\/asset\/([^/]+)\/?$/);
  return m ? decodeURIComponent(m[1]) : null;
}
const assetId = getAssetIdFromUrl();
let _collectionName = null;
let _schemaName = null;
let _templateId = null;

// assetId is always passed to open() here — MakeOfferModal defaults to
// Asset mode with the Asset/Template toggle available (this page always has
// a specific asset in context, unlike template.html).
const MAKER = 'hoardiostore'; // same account used site-wide for listing/offer attribution
const _offerModal = MakeOfferModal.mount({
  apiFetch: WaxApi.apiFetch,
  marketBase: WaxApi.marketBase,
  makerMarketplace: MAKER,
  connectWallet: () => _wallet.connect(),
  refreshBalance: () => _wallet.refreshBalance(),
  ramPrefix: _p,
});

/* ── Header + attributes ── */
async function loadHeader() {
  const aa  = WaxApi.aaBase();
  const mkt = WaxApi.marketBase();

  let asset;
  try {
    asset = await WaxApi.apiFetch(`${aa}/assets/${encodeURIComponent(assetId)}`);
    if (!asset) throw new Error('not found');
  } catch {
    document.getElementById('loadingMsg').style.display = 'none';
    const el = document.getElementById('notFoundMsg');
    el.style.display = '';
    el.innerHTML = `Could not find an asset with ID <strong>${escHtml(assetId)}</strong>.`;
    return;
  }
  _collectionName = asset.collection?.collection_name || '';
  _schemaName     = asset.schema?.schema_name || '';
  _templateId     = asset.template?.template_id || null;
  const isBurned  = !!asset.burned_at_time;

  let templateStats = null;
  if (_templateId) {
    try { templateStats = await WaxApi.apiFetch(`${aa}/templates/${encodeURIComponent(_collectionName)}/${_templateId}/stats`); } catch { templateStats = null; }
  }
  let lowestListing = null;
  if (_templateId) {
    try {
      const rows = await WaxApi.apiFetch(`${mkt}/sales?template_id=${_templateId}&symbol=WAX&state=1&min_assets=1&max_assets=1&sort=price&order=asc&limit=1`);
      lowestListing = rows?.[0] || null;
    } catch { lowestListing = null; }
  }
  await fetchWaxPrice();

  const data = asset.data || {};
  document.title = `${data.name || asset.name || 'Asset #' + assetId} — Hoardio`;

  // Video-first hero, same convention as template.html's own — the merged
  // `data` view already carries mutable-data overrides (if any), unlike
  // reading immutable_data directly.
  const img     = data.img;
  const video   = data.video;
  const backimg = data.backimg;
  const mainWrap = document.getElementById('astMainImgWrap');
  ImageLightbox.wire(mainWrap);
  const setMainMedia = (hash, kind) => {
    if (kind === 'video') {
      const autoplay = window.getReduceMotion?.() ? '' : 'autoplay';
      mainWrap.innerHTML = `<video ${autoplay} loop muted playsinline><source src="${escHtml(toMediaUrl(hash))}" type="video/mp4"></video>`;
    } else {
      mainWrap.innerHTML = `<img alt="" src="${escHtml(toMediaUrl(hash))}" data-ipfs-hash="${escHtml(hash)}" data-gw-idx="0" onerror="onImgError(this)">`;
    }
  };
  const mediaItems = [
    video   ? { hash: video,   kind: 'video' } : null,
    img     ? { hash: img,     kind: 'image' } : null,
    backimg ? { hash: backimg, kind: 'image' } : null,
  ].filter(Boolean);
  if (mediaItems.length) setMainMedia(mediaItems[0].hash, mediaItems[0].kind);
  if (mediaItems.length > 1) {
    document.getElementById('astThumbs').innerHTML = mediaItems.map((m, i) =>
      `<div class="tpl-thumb${i === 0 ? ' active' : ''}" data-hash="${escHtml(m.hash)}" data-kind="${m.kind}">${
        m.kind === 'video'
          ? `<video muted loop playsinline preload="metadata"><source src="${escHtml(toMediaUrl(m.hash))}" type="video/mp4"></video>`
          : `<img src="${escHtml(toMediaUrl(m.hash))}" alt="" loading="lazy">`
      }</div>`
    ).join('');
    document.querySelectorAll('.tpl-thumb').forEach(el => {
      el.addEventListener('click', () => {
        document.querySelectorAll('.tpl-thumb').forEach(t => t.classList.remove('active'));
        el.classList.add('active');
        setMainMedia(el.dataset.hash, el.dataset.kind);
      });
    });
  }

  document.getElementById('astName').textContent = data.name || asset.name || `Asset #${assetId}`;
  document.getElementById('astId').textContent = `#${assetId}`;
  document.getElementById('astOwner').innerHTML = isBurned
    ? `<span class="ast-burned-tag" title="${asset.burned_by_account ? 'Burned by ' + escHtml(asset.burned_by_account) : 'Burned'}">🔥 Burned${asset.burned_by_account ? ' by ' + walletLinkHtml(asset.burned_by_account) : ''}</span>`
    : walletLinkHtml(asset.owner);
  const issuedSupply = asset.template ? Number(asset.template.issued_supply) : null;
  const burnedCount  = templateStats ? Number(templateStats.burned) : 0;
  document.getElementById('astMint').innerHTML = issuedSupply != null
    ? `${asset.template_mint} of ${issuedSupply.toLocaleString()}${burnedCount > 0 ? ` (<span class="tpl-supply-tag" title="Burned assets">${burnedCount.toLocaleString()}🔥</span>)` : ''}`
    : `#${asset.template_mint}`;
  document.getElementById('astFlags').innerHTML =
    `<span class="tpl-badge ${asset.is_burnable ? 'tpl-badge--yes' : 'tpl-badge--no'}">${asset.is_burnable ? 'Burnable' : 'Not burnable'}</span> ` +
    `<span class="tpl-badge ${asset.is_transferable ? 'tpl-badge--yes' : 'tpl-badge--no'}">${asset.is_transferable ? 'Transferable' : 'Not transferable'}</span>`;
  document.getElementById('astCollection').innerHTML = _collectionName
    ? `<a href="${_p}collection/${encodeURIComponent(_collectionName)}">${escHtml(asset.collection?.name || _collectionName)}</a>` : '—';
  document.getElementById('astSchema').innerHTML = (_collectionName && _schemaName)
    ? `<a href="${_p}schema/${encodeURIComponent(_collectionName)}/${encodeURIComponent(_schemaName)}">${escHtml(_schemaName)}</a>` : '—';
  document.getElementById('astTemplate').innerHTML = _templateId
    ? `<a href="${_p}template/${encodeURIComponent(_templateId)}">#${escHtml(_templateId)}</a>` : '—';
  document.getElementById('astBacked').textContent = AssetPopup.fmtBackedTokens(asset.backed_tokens);

  if (lowestListing) {
    const usd = window._waxUsdRate ? ` <span class="tpl-listing-usd">≈ $${(Number(lowestListing.price.amount) / 1e8 * window._waxUsdRate).toFixed(2)}</span>` : '';
    document.getElementById('astLowestListing').innerHTML = fmtWax(lowestListing.price.amount) + usd;
  }
  document.getElementById('astMarketLink').href = _templateId ? `${_p}explore?template_id=${encodeURIComponent(_templateId)}` : `${_p}explore`;

  // Make Offer needs a template_id (createbuyo/createtbuyo both key off
  // it) and makes no sense on a burned asset (no owner left to target) or
  // on an asset the connected wallet already owns — re-synced on every
  // wax-auth-change since both checks depend on the connected wallet.
  function syncOfferBtn() {
    const btn = document.getElementById('astOfferBtn');
    if (!_templateId || isBurned) { btn.style.display = 'none'; return; }
    const acc = window.getWaxAccount ? window.getWaxAccount() : null;
    btn.style.display = (acc && acc === asset.owner) ? 'none' : '';
  }
  syncOfferBtn();
  window.addEventListener('wax-auth-change', syncOfferBtn);

  // Unpack — some pack collections carry an unpack-url-shaped attribute
  // (in the same merged `data` view as everything else below) pointing to
  // whatever off-chain unpacking flow that collection uses; there's no
  // universal on-chain unpack action. Owner-gated the same way as
  // syncOfferBtn, just the opposite condition — only the actual owner can
  // do anything useful by unpacking it.
  const unpackUrl = resolveUnpackUrl(data);
  function syncUnpackBtn() {
    const btn = document.getElementById('astUnpackBtn');
    if (!unpackUrl || isBurned) { btn.style.display = 'none'; return; }
    const acc = window.getWaxAccount ? window.getWaxAccount() : null;
    btn.style.display = (acc && acc === asset.owner) ? '' : 'none';
  }
  syncUnpackBtn();
  window.addEventListener('wax-auth-change', syncUnpackBtn);
  document.getElementById('astUnpackBtn').onclick = () => window.open(unpackUrl, '_blank', 'noopener');

  document.getElementById('astOfferBtn').onclick = () => _offerModal.open({
    templateId: _templateId,
    collectionName: _collectionName,
    name: data.name || asset.name || `Asset #${assetId}`,
    imageUrl: mediaItems[0] ? toMediaUrl(mediaItems[0].hash) : null,
    isVideo: mediaItems[0]?.kind === 'video',
    assetId,
    owner: asset.owner,
    mint: asset.template_mint,
    issuedSupply,
    onSuccess: () => loadOffers(),
  });

  // NFT Attributes — every key in the merged `data` view (template immutable
  // + asset immutable + asset mutable, whichever takes precedence at each
  // key), raw — same "show it all" idea as template.html's own Template
  // Attributes, deliberately not filtering out image/ipfs fields.
  const attrsBody = document.getElementById('astAttrsBody');
  attrsBody.innerHTML = Object.entries(data).map(([k, v]) =>
    `<tr><td class="wallet-cell" style="width:35%;">${escHtml(k)}</td><td>${linkifyValue(v)}</td></tr>`
  ).join('') || '<tr><td>No attributes</td></tr>';

  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('astWrap').style.display = '';

  if (_templateId) TemplatePriceChart.mount({ containerId: 'astPriceHistory', templateId: _templateId, collectionName: _collectionName });
  else document.getElementById('astPriceHistory').innerHTML = '<div class="tpc-placeholder">No template associated with this asset.</div>';

  loadOffers();
  loadHistory();
}

/* ── Top Active Offers — template-pooled (any matching copy, not just this
   exact asset_id) — same /template_buyoffers endpoint and rendering as
   template.html's own "Top Active Offers", so the two pages agree. ── */
async function loadOffers() {
  const wrap = document.getElementById('astOffersWrap');
  const mkt  = WaxApi.marketBase();
  if (!_templateId) { wrap.innerHTML = '<div class="ast-placeholder">No template associated with this asset.</div>'; return; }
  let offers;
  try {
    offers = await WaxApi.apiFetch(`${mkt}/template_buyoffers?template_id=${_templateId}&state=0&symbol=WAX&sort=price&order=desc&limit=10`);
  } catch { offers = null; }
  if (!offers || !offers.length) {
    wrap.innerHTML = '<div class="ast-placeholder">No active offers.</div>';
    return;
  }
  wrap.innerHTML = `<table>
    <thead><tr><th>Buyer</th><th>Price Offered</th><th>Offer Placed On</th></tr></thead>
    <tbody>${offers.map(o => {
      const usd = window._waxUsdRate ? ` <span class="tpl-listing-usd">≈ $${(Number(o.price.amount) / (10 ** o.price.token_precision) * window._waxUsdRate).toFixed(2)}</span>` : '';
      return `<tr>
        <td class="wallet-cell">${walletLinkHtml(o.buyer)}</td>
        <td>${fmtWax(o.price.amount, o.price.token_precision)}${usd}</td>
        <td>${fmtDate(o.created_at_time)}</td>
      </tr>`;
    }).join('')}</tbody>
  </table>`;
}

/* ── History — one merged, sorted feed built from three sources (fetched
   once), each tab just a client-side filter over it. A single NFT's full
   life (mint → transfers → sales → burn) is small at this asset's scale, so
   there's no pagination/"load more" step needed here — confirmed live
   against a real asset with several transfers + a completed sale. ── */
let _histAll = [];
let _histLoaded = false;

const LOG_TYPE_LABEL = {
  logmint: 'Mint',
  logburn: 'Burn',
};
function logTypeClass(name) {
  if (name === 'logmint') return 'mint';
  if (name === 'logburn') return 'burn';
  return 'update';
}
function logTypeLabel(name) {
  return LOG_TYPE_LABEL[name] || name.replace(/^log/, '').replace(/([A-Z])/g, ' $1').trim().replace(/^./, c => c.toUpperCase());
}
function logDetailHtml(entry) {
  // Each key in entry.data is a genuinely separate field (confirmed live —
  // e.g. logmint's new_asset_owner and authorized_minter), so one <div> per
  // field reads as a real list rather than a single run-on line.
  const parts = Object.entries(entry.data || {}).map(([k, v]) => `<div>${escHtml(k)}: ${escHtml(typeof v === 'object' ? JSON.stringify(v) : v)}</div>`);
  return parts.join('') || '—';
}

async function loadHistory() {
  const wrap = document.getElementById('astHistWrap');
  const aa  = WaxApi.aaBase();
  const mkt = WaxApi.marketBase();

  const [transfers, sales, logs] = await Promise.all([
    WaxApi.apiFetch(`${aa}/transfers?asset_id=${encodeURIComponent(assetId)}&limit=100&order=desc`).catch(() => []),
    WaxApi.apiFetch(`${mkt}/sales?asset_id=${encodeURIComponent(assetId)}&limit=100&order=desc&sort=created`).catch(() => []),
    WaxApi.apiFetch(`${aa}/assets/${encodeURIComponent(assetId)}/logs?limit=100&order=desc`).catch(() => []),
  ]);

  const events = [];
  for (const t of (transfers || [])) {
    events.push({
      type: 'transfer', time: Number(t.created_at_time), txid: t.txid,
      html: `${walletLinkHtml(t.sender_name)} → ${walletLinkHtml(t.recipient_name)}`,
      memo: t.memo || '',
    });
  }
  for (const s of (sales || [])) {
    const stateLabel = s.state === 3 ? 'Sale' : s.state === 1 ? 'Listed' : s.state === 2 ? 'Cancelled' : 'Offer';
    events.push({
      type: 'sale', time: Number(s.updated_at_time), txid: null, saleId: s.sale_id,
      html: `${stateLabel}: ${walletLinkHtml(s.seller)} → ${walletLinkHtml(s.buyer)} for ${fmtWax(s.price.amount, s.price.token_precision)}`,
      memo: '',
    });
  }
  for (const l of (logs || [])) {
    // type is always 'log' (so the Logs tab shows every raw log entry,
    // mint/burn included, matching AtomicHub's own Logs tab) — logKind is
    // the finer sub-type, used for badge styling and to let the Updates tab
    // show only non-mint/burn log entries.
    const kind = logTypeClass(l.name);
    events.push({
      type: 'log', logKind: kind, time: Number(l.created_at_time), txid: l.txid,
      html: `<span class="ast-hist-type ast-hist-type--${kind}">${escHtml(logTypeLabel(l.name))}</span> ${logDetailHtml(l)}`,
      memo: '',
    });
  }
  events.sort((a, b) => b.time - a.time);
  _histAll = events;
  _histLoaded = true;
  renderHistory('transfer');
}

function renderHistory(tab) {
  const wrap = document.getElementById('astHistWrap');
  if (!_histLoaded) { wrap.innerHTML = '<div class="ast-placeholder">Loading…</div>'; return; }
  const items = tab === 'update' ? _histAll.filter(e => e.type === 'log' && e.logKind === 'update')
    : _histAll.filter(e => e.type === tab);
  if (!items.length) { wrap.innerHTML = '<div class="ast-placeholder">No events found.</div>'; return; }
  wrap.innerHTML = `<table><thead><tr><th>Event</th><th>Date</th><th></th></tr></thead><tbody>
    ${items.map(e => `<tr>
      <td class="ast-hist-detail">${e.html}${e.memo ? `<div class="ast-hist-memo">${escHtml(e.memo)}</div>` : ''}</td>
      <td>${fmtDateTime(e.time)}</td>
      <td class="ast-hist-tx">${e.saleId ? `<a href="${_p}sale/${escHtml(e.saleId)}">View listing</a>` : e.txid ? `<a href="https://waxblock.io/transaction/${escHtml(e.txid)}" target="_blank" rel="noopener">View transaction ↗</a>` : ''}</td>
    </tr>`).join('')}
  </tbody></table>`;
}

document.querySelectorAll('#astHistTabs .ast-tab-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('#astHistTabs .ast-tab-btn').forEach(b => b.classList.toggle('active', b === btn));
    renderHistory(btn.dataset.tab);
  });
});

/* ── Init ── */
if (!assetId) {
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('noParamMsg').style.display = '';
} else {
  loadHeader();
}
</script>

</body>
