<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monthly Stream Stats — PopInStock Twitch</title>
  <meta name="description" content="Monthly stream statistics for Pop In Stock on Twitch. Track prizes distributed, winning numbers, leaderboards, and community engagement data." />
  <link rel="canonical" href="https://www.popinstock.com/twitch/monthly-stats.html" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.popinstock.com/twitch/monthly-stats.html" />
  <meta property="og:title" content="Monthly Stream Stats — PopInStock Twitch" />
  <meta property="og:description" content="Monthly stream statistics for Pop In Stock on Twitch. Track prizes distributed, winning numbers, leaderboards, and community engagement data." />
  <meta property="og:image" content="https://www.popinstock.com/images/og-banner.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Monthly Stream Stats — PopInStock Twitch" />
  <meta name="twitter:description" content="Monthly stream statistics for Pop In Stock on Twitch. Track prizes distributed, winning numbers, leaderboards, and community engagement data." />
  <meta name="twitter:image" content="https://www.popinstock.com/images/og-banner.png" />
  <link rel="icon" type="image/png" href="../images/FoxLogo.png" />
  <link rel="stylesheet" href="../shared/global.css" />
  <style>
    /* ── Token remapping (data-viz colors kept as-is) ── */
    :root {
      --panel:    var(--bg-card);
      --panel2:   var(--bg-card-hover);
      --gold:     var(--accent-light);
      --green:    #3fb950;
      --blue:     #58a6ff;
      --red:      #f85149;
      --purple:   #bc8cff;
      --text:     var(--text-primary);
      --text-dim: var(--text-secondary);
    }

    /* Section headings (h2 used inside JS-rendered content) */
    h2 {
      color: var(--text-primary);
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 1rem;
      letter-spacing: 0.02em;
    }

    .section { margin-bottom: 2.5rem; }

    /* ── Month filter bar ── */
    .filter-bar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 2rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 0.875rem 1.25rem;
      flex-wrap: wrap;
    }
    .filter-bar label {
      font-size: 0.8rem;
      color: var(--text-secondary);
      white-space: nowrap;
    }
    .filter-bar input[type="month"] {
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 10px;
      color: var(--text-primary);
      font-size: 0.875rem;
      font-family: inherit;
      padding: 0.55rem 0.85rem;
      outline: none;
      cursor: pointer;
      color-scheme: dark;
      transition: border-color 0.2s;
    }
    .filter-bar input[type="month"]:focus { border-color: var(--accent-light); }

    .btn-submit {
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      color: #fff;
      border: none;
      border-radius: 10px;
      padding: 0.6rem 1.5rem;
      font-size: 0.875rem;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: opacity 0.2s;
      white-space: nowrap;
    }
    .btn-submit:hover  { opacity: 0.85; }
    .btn-submit:active { opacity: 0.7; }

    /* ── Summary cards ── */
    .summary-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 1rem;
      margin-bottom: 2.5rem;
    }
    .stat-card {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 1.25rem 1.4rem;
      transition: border-color 0.2s;
    }
    .stat-card .label {
      font-size: 0.68rem;
      color: var(--text-secondary);
      text-transform: uppercase;
      letter-spacing: 0.1em;
      margin-bottom: 0.6rem;
    }
    .stat-card .value { font-size: 2.25rem; font-weight: 700; line-height: 1; }
    .stat-card .sub   { font-size: 0.72rem; color: var(--text-secondary); margin-top: 0.4rem; }

    /* ── Numbers grid ── */
    .numbers-grid {
      display: grid;
      grid-template-columns: repeat(11, 1fr);
      gap: 6px;
    }
    .num-cell {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 8px 4px;
      text-align: center;
      transition: background 0.2s;
    }
    .num-cell .n    { font-size: 15px; font-weight: 700; color: var(--text-primary); }
    .num-cell .hits { font-size: 11px; color: var(--text-secondary); margin-top: 3px; }
    .num-cell .pct  { font-size: 10px; color: var(--text-secondary); }

    /* Heat levels */
    .heat-0        { background: var(--bg-card); }
    .heat-rare     { background: rgba(88,166,255,0.22);  border-color: rgba(88,166,255,0.55); }
    .heat-common   { background: rgba(63,185,80,0.10);   border-color: rgba(63,185,80,0.25);  }
    .heat-frequent { background: rgba(232,184,75,0.25);  border-color: rgba(232,184,75,0.55); }
    .heat-hot      { background: rgba(248,81,73,0.30);   border-color: rgba(248,81,73,0.70);  }
    .heat-rare     .n { color: var(--blue); }
    .heat-common   .n { color: var(--green); }
    .heat-frequent .n { color: var(--gold); }
    .heat-hot      .n { color: var(--red); }

    /* ── Ranking tables ── */
    .tables-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      background: var(--bg-card);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid var(--border);
      font-size: 0.8rem;
    }
    th {
      background: var(--bg-card-hover);
      color: var(--text-secondary);
      font-size: 0.68rem;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      padding: 0.6rem 0.85rem;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }
    td {
      padding: 0.6rem 0.85rem;
      border-bottom: 1px solid rgba(255,255,255,0.04);
      vertical-align: middle;
    }
    tr:last-child td { border-bottom: none; }
    tr:hover td      { background: rgba(255,255,255,0.025); }

    .rank        { color: var(--text-secondary); font-size: 0.75rem; width: 28px; }
    .rank.gold   { color: #FFD700; font-weight: 700; }
    .rank.silver { color: #C0C0C0; font-weight: 700; }
    .rank.bronze { color: #CD7F32; font-weight: 700; }

    .prize-row td       { background: rgba(240,168,64,0.06); }
    .prize-row:hover td { background: rgba(240,168,64,0.12); }
    .prize-badge {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      color: var(--bg);
      background: var(--accent-light);
      border-radius: 4px;
      padding: 1px 5px;
      margin-left: 6px;
      vertical-align: middle;
      letter-spacing: 0.05em;
    }

    .username { font-weight: 600; color: var(--text-primary); }
    .val      { font-weight: 700; text-align: right; }
    .val.green  { color: var(--green); }
    .val.gold   { color: var(--gold); }
    .val.red    { color: var(--red); }
    .val.blue   { color: var(--blue); }
    .sub-val    { font-size: 0.72rem; color: var(--text-secondary); text-align: right; }

    .loading { color: var(--text-secondary); font-size: 1rem; padding: 2.5rem 0; }
    .error {
      color: #f87171;
      padding: 1.25rem;
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      line-height: 1.8;
      font-size: 0.875rem;
    }

    .legend {
      display: flex;
      gap: 1rem;
      margin-bottom: 0.875rem;
      flex-wrap: wrap;
    }
    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      color: var(--text-secondary);
    }
    .legend-dot {
      width: 12px;
      height: 12px;
      border-radius: 3px;
      border: 1px solid transparent;
    }

    /* ── Prizes section ── */
    .prizes-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1.25rem;
      margin-bottom: 0;
    }
    .prizes-panel {
      background: var(--bg-card);
      border: 1px solid var(--border);
      border-radius: 12px;
      overflow: hidden;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
    }
    .prizes-panel-header {
      background: var(--bg-card-hover);
      padding: 0.75rem 1rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      border-bottom: 1px solid var(--border);
    }
    .prizes-panel-header .title {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-primary);
    }
    .prizes-panel-header .total-wax {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent-light);
    }
    .prizes-panel-header .total-wax span {
      font-size: 0.68rem;
      color: var(--text-secondary);
      font-weight: 400;
      margin-right: 4px;
    }
    .prizes-panel table { border-radius: 0; border: none; }
    .prizes-panel th    { background: transparent; }

    .failed-transfers {
      border-top: 1px solid rgba(248, 81, 73, 0.25);
      padding: 0.6rem 1rem;
      font-size: 0.78rem;
      color: var(--red);
    }

    .wax-val     { color: var(--accent-light); font-weight: 700; }
    .unknown-wax { color: var(--text-secondary); font-style: italic; text-align: right; }
    th.num       { text-align: right; }

    /* ── Second Chance pills ── */
    .pill {
      display: inline-block;
      font-size: 0.62rem;
      font-weight: 700;
      border-radius: 20px;
      padding: 2px 8px;
      letter-spacing: 0.04em;
      white-space: nowrap;
    }
    .pill-claimed   { background: rgba(63,185,80,0.15);  color: var(--green); border: 1px solid rgba(63,185,80,0.4);  }
    .pill-unclaimed { background: rgba(248,81,73,0.12);  color: var(--red);   border: 1px solid rgba(248,81,73,0.35); }

    /* ── Responsive ── */
    @media (max-width: 1000px) {
      .tables-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 780px) {
      .prizes-row { grid-template-columns: 1fr; }
    }
    @media (max-width: 768px) {
      .numbers-grid { grid-template-columns: repeat(9, 1fr); gap: 5px; }
      .num-cell { padding: 6px 3px; }
      .num-cell .n    { font-size: 13px; }
      .num-cell .hits { font-size: 10px; }
      .num-cell .pct  { font-size: 9px; }
    }
    @media (max-width: 540px) {
      .summary-grid { grid-template-columns: repeat(2, 1fr); gap: 0.625rem; margin-bottom: 1.5rem; }
      .stat-card { padding: 0.875rem; }
      .stat-card .value { font-size: 1.625rem; }
      .stat-card .label { font-size: 0.62rem; }
      .filter-bar { flex-wrap: wrap; gap: 0.5rem; }
      .filter-bar input[type="month"] { width: 100%; }
      .btn-submit { width: 100%; text-align: center; }
      .numbers-grid { grid-template-columns: repeat(7, 1fr); gap: 4px; }
      .num-cell { padding: 5px 2px; }
      .num-cell .n    { font-size: 11px; }
      .num-cell .hits { font-size: 9px; }
      .num-cell .pct  { display: none; }
      .legend { gap: 0.625rem; }
      .legend-item { font-size: 0.68rem; }
      .section { margin-bottom: 1.75rem; }
      .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
      table { font-size: 0.75rem; min-width: 320px; }
      th, td { padding: 8px 10px; }
      .prizes-panel-header .title     { font-size: 0.8rem; }
      .prizes-panel-header .total-wax { font-size: 0.75rem; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
</head>
<body>

<div class="page">
  <div class="content">
    <div class="page-header">
      <div class="page-title">Monthly <span class="accent">Stats</span></div>
      <div class="page-subtitle" id="subtitle">Loading...</div>
    </div>

    <div class="filter-bar">
      <label for="month-picker">Select month:</label>
      <input type="month" id="month-picker">
      <button class="btn-submit" id="btn-submit">Show Stats</button>
    </div>

    <div id="summary" class="summary-grid"></div>
    <div id="content"><div class="loading">Loading data...</div></div>
  </div>
</div>

<script src="nav.js"></script>
<script>
    // ── Config ────────────────────────────────────────────────────────────
    // Dynamically set to previous month
    const _now = new Date();
    const DEFAULT_MONTH = new Date(_now.getFullYear(), _now.getMonth() - 1, 1)
      .toISOString().slice(0, 7);
    const TOP_N         = 25;         // size of each ranking list
    const MIN_GAMES     = 5;          // minimum games to appear in win-rate lists

    const RESULTS_URL      = 'data/archiveGameResults.json';
    const GUESSES_URL      = 'data/archiveGuesses.json';
    const TRANSFERS_URL    = 'data/transfer-results.json';
    const SECONDCHANCE_URL = 'data/archiveSecondChance.json';

    // ── WAX values per prize name (Game prizes only) ──────────────────────
    // Edit this object to assign WAX values to your prizes.
    // Keys are exact prize names as they appear in transfer-results.json.
    const WAX_VALUES = {
      'Lucky Willy': 15,
      'Fireside Harmony': 25,
      'Oakwood Manor': 50,
      'A Gift From Noelle': 50,
      'The Lost Treasure': 100,
      'Bianca the Love Messenger': 25
      // 'Prize Name':     WAX_amount,
    };

    // ── Cached data — loaded once ─────────────────────────────────────────
    let _results      = null;
    let _guesses      = null;
    let _transfers    = null;
    let _secondChance = null;

    // ── Init ──────────────────────────────────────────────────────────────
    const picker = document.getElementById('month-picker');
    picker.value = DEFAULT_MONTH;

    document.getElementById('btn-submit').addEventListener('click', () => {
      const month = picker.value;
      if (!month) return;
      if (_results && _guesses) {
        render(_results, _guesses, _transfers, _secondChance, month);
      }
    });

    (async () => {
      try {
        const [resResults, resGuesses, resTransfers, resSecondChance] = await Promise.all([
          fetch(RESULTS_URL      + '?t=' + Date.now()),
          fetch(GUESSES_URL      + '?t=' + Date.now()),
          fetch(TRANSFERS_URL    + '?t=' + Date.now()).catch(() => null),
          fetch(SECONDCHANCE_URL + '?t=' + Date.now()).catch(() => null),
        ]);
        [_results, _guesses] = await Promise.all([resResults.json(), resGuesses.json()]);
        _transfers    = resTransfers    ? await resTransfers.json().catch(() => null)    : null;
        _secondChance = resSecondChance ? await resSecondChance.json().catch(() => null) : null;
        render(_results, _guesses, _transfers, _secondChance, DEFAULT_MONTH);
      } catch (e) {
        document.getElementById('subtitle').textContent = 'Error loading data.';
        document.getElementById('content').innerHTML =
          `<div class="error">Could not load stats files.<br><br>
           Error: ${e.message}<br><br>
           Make sure IIS is running and both archive files exist.</div>`;
      }
    })();

    function render(results, guesses, transfers, secondChance, month) {
      // ── Filter to selected month ────────────────────────────────────────
      const monthResults = results.filter(r => r.Timestamp && r.Timestamp.startsWith(month));

      const monthGuessGames = Object.entries(guesses).filter(([, g]) =>
        g.Timestamp && g.Timestamp.startsWith(month)
      );

      // ── Summary numbers ─────────────────────────────────────────────────
      const gamesPlayed = monthResults.length;
      let totalPrizes = 0, totalWins = 0;
      for (const r of monthResults)
        for (const w of (r.Winners || []))
          if (w.Username) {
            totalPrizes++;
            if (w.Guess === r.Mint) totalWins++;
          }

      const uniquePlayers = new Set();
      let totalGuesses = 0;
      for (const [, g] of monthGuessGames) {
        for (const name of Object.keys(g.Guesses || {})) {
          uniquePlayers.add(name.toLowerCase());
          totalGuesses++;
        }
      }

      const uniqueWinners = new Set();
      for (const r of monthResults)
        for (const w of (r.Winners || []))
          if (w.Username) uniqueWinners.add(w.Username.toLowerCase());

      function shortDate(ts) {
        if (!ts) return '';
        return new Date(ts).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
      }

      const maxWinnersGame = monthResults.reduce((best, r) => {
        const c = (r.Winners || []).filter(w => w.Username).length;
        if (c > best.count) return { count: c, ts: r.Timestamp, ties: 1 };
        if (c === best.count && c > 0) return { ...best, ties: best.ties + 1 };
        return best;
      }, { count: 0, ts: null, ties: 0 });

      const maxPlayersGame = monthGuessGames.reduce((best, [, g]) => {
        const c = Object.keys(g.Guesses || {}).length;
        if (c > best.count) return { count: c, ts: g.Timestamp, ties: 1 };
        if (c === best.count && c > 0) return { ...best, ties: best.ties + 1 };
        return best;
      }, { count: 0, ts: null, ties: 0 });

      const monthLabel = new Date(month + '-15').toLocaleDateString('en-US',
        { month: 'long', year: 'numeric' });

      document.getElementById('subtitle').textContent = monthLabel;
      picker.value = month;

      document.getElementById('summary').innerHTML = `
        <div class="stat-card">
          <div class="label">Games Played</div>
          <div class="value" style="color:var(--blue)">${gamesPlayed.toLocaleString()}</div>
          <div class="sub">${monthLabel}</div>
        </div>
        <div class="stat-card">
          <div class="label">Total Game Prizes</div>
          <div class="value" style="color:var(--purple)">${totalPrizes.toLocaleString()}</div>
          <div class="sub">exact guesses or bonuses</div>
        </div>
        <div class="stat-card">
          <div class="label">Total Game Wins</div>
          <div class="value" style="color:var(--gold)">${totalWins.toLocaleString()}</div>
          <div class="sub">exact guesses only</div>
        </div>
        <div class="stat-card">
          <div class="label">Total Guesses</div>
          <div class="value" style="color:var(--purple)">${totalGuesses.toLocaleString()}</div>
          <div class="sub">avg ${gamesPlayed ? (totalGuesses / gamesPlayed).toFixed(1) : '—'} per game</div>
        </div>
        <div class="stat-card">
          <div class="label">No-Winner Games</div>
          <div class="value" style="color:var(--red)">${(gamesPlayed - totalWins > 0 ? gamesPlayed - monthResults.filter(r => r.WinnerCount > 0).length : 0).toLocaleString()}</div>
          <div class="sub">${gamesPlayed ? (((gamesPlayed - monthResults.filter(r => r.WinnerCount > 0).length) / gamesPlayed) * 100).toFixed(1) : 0}% of games</div>
        </div>
        <div class="stat-card">
          <div class="label">Unique Players</div>
          <div class="value" style="color:var(--green)">${uniquePlayers.size.toLocaleString()}</div>
          <div class="sub">joined at least one game</div>
        </div>
        <div class="stat-card">
          <div class="label">Unique Winners</div>
          <div class="value" style="color:var(--green)">${uniqueWinners.size.toLocaleString()}</div>
          <div class="sub">${uniquePlayers.size ? ((uniqueWinners.size / uniquePlayers.size) * 100).toFixed(1) : '0'}% of players won at least once</div>
        </div>
        <div class="stat-card">
          <div class="label">Most Winners in a Game</div>
          <div class="value" style="color:var(--gold)">${maxWinnersGame.count}</div>
          <div class="sub">${shortDate(maxWinnersGame.ts)}${maxWinnersGame.ties > 1 ? ` (+${maxWinnersGame.ties - 1} more times)` : ''}</div>
        </div>
        <div class="stat-card">
          <div class="label">Most Players in a Game</div>
          <div class="value" style="color:var(--blue)">${maxPlayersGame.count}</div>
          <div class="sub">${shortDate(maxPlayersGame.ts)}${maxPlayersGame.ties > 1 ? ` (+${maxPlayersGame.ties - 1} more times)` : ''}</div>
        </div>
      `;

      // ── Winning numbers (1–99) ──────────────────────────────────────────
      const mintCounts = {};
      for (let i = 1; i <= 99; i++) mintCounts[i] = 0;
      for (const r of monthResults)
        if (r.Mint >= 1 && r.Mint <= 99) mintCounts[r.Mint]++;

      // Percentile thresholds across all 99 numbers
      const sortedCounts = Array.from({ length: 99 }, (_, i) => mintCounts[i + 1] || 0)
        .sort((a, b) => a - b);
      const hotMin  = sortedCounts[Math.floor(99 * 0.95)]; // top 5%
      const freqMin = sortedCounts[Math.floor(99 * 0.85)]; // top 15%
      const rareMax = sortedCounts[Math.ceil(99 * 0.05) - 1]; // bottom 5%

      function heatClass(hits) {
        if (hits === 0)          return 'heat-0';
        if (hits >= hotMin)      return 'heat-hot';
        if (hits >= freqMin)     return 'heat-frequent';
        if (hits <= rareMax)     return 'heat-rare';
        return                          'heat-common';
      }

      const totalMints = monthResults.length;
      const numCells = Array.from({ length: 99 }, (_, i) => {
        const n    = i + 1;
        const hits = mintCounts[n];
        const pct  = totalMints ? ((hits / totalMints) * 100).toFixed(1) : '0.0';
        return `<div class="num-cell ${heatClass(hits)}">
          <div class="n">${n}</div>
          <div class="hits">${hits}x</div>
          <div class="pct">${pct}%</div>
        </div>`;
      }).join('');

      // ── Player stats from guesses ────────────────────────────────────────
      const playerGames = {};   // username → games entered
      for (const [, g] of monthGuessGames)
        for (const name of Object.keys(g.Guesses || {})) {
          const key = name.toLowerCase();
          playerGames[key] = (playerGames[key] || 0) + 1;
        }

      // Player prizes, wins & bonuses — all from Winners array
      // Prize = any entry; Win = Guess === Mint; Bonus = Guess !== Mint
      const playerPrizes  = {};
      const playerWins    = {};
      const playerBonuses = {};
      for (const r of monthResults)
        for (const w of (r.Winners || []))
          if (w.Username) {
            const key = w.Username.toLowerCase();
            playerPrizes[key] = (playerPrizes[key] || 0) + 1;
            if (w.Guess === r.Mint) playerWins[key]    = (playerWins[key]    || 0) + 1;
            else                    playerBonuses[key] = (playerBonuses[key] || 0) + 1;
          }

      // ── Top N most games entered ─────────────────────────────────────────
      const topGames = Object.entries(playerGames)
        .sort(([, a], [, b]) => b - a)
        .slice(0, TOP_N);

      // ── Best win rate (min MIN_GAMES games) ──────────────────────────────
      const topBest = Object.entries(playerGames)
        .filter(([, g]) => g >= MIN_GAMES)
        .map(([name, g]) => ({ name, games: g, wins: playerWins[name] || 0 }))
        .sort((a, b) => (b.wins / b.games) - (a.wins / a.games) || b.wins - a.wins)
        .slice(0, TOP_N);

      // ── Worst: most games with 0 wins ────────────────────────────────────
      const topWorst = Object.entries(playerGames)
        .filter(([name, g]) => g >= MIN_GAMES && !(playerWins[name]))
        .map(([name, g]) => ({ name, games: g, wins: 0 }))
        .sort((a, b) => b.games - a.games)
        .slice(0, TOP_N);

      function rankLabel(i) {
        if (i === 0) return `<td class="rank gold">🥇</td>`;
        if (i === 1) return `<td class="rank silver">🥈</td>`;
        if (i === 2) return `<td class="rank bronze">🥉</td>`;
        return `<td class="rank">${i + 1}</td>`;
      }

      const tableGames = topGames.map(([name, g], i) => `<tr>
        ${rankLabel(i)}
        <td class="username">${name}</td>
        <td class="val blue">${g}</td>
        <td class="sub-val">${playerPrizes[name] || 0}P / ${playerWins[name] || 0}W</td>
      </tr>`).join('');

      const tableBest = topBest.map((p, i) => {
        const rate = ((p.wins / p.games) * 100).toFixed(1);
        return `<tr>
          ${rankLabel(i)}
          <td class="username">${p.name}</td>
          <td class="val green">${rate}%</td>
          <td class="sub-val">${p.wins}W / ${p.games}G</td>
        </tr>`;
      }).join('') || `<tr><td colspan="4" style="color:var(--text-dim);padding:16px">No players with ${MIN_GAMES}+ games yet.</td></tr>`;

      const tableWorst = topWorst.map((p, i) => `<tr>
        ${rankLabel(i)}
        <td class="username">${p.name}</td>
        <td class="val red">${p.games}</td>
        <td class="sub-val">${playerPrizes[p.name] || 0}P / 0W</td>
      </tr>`).join('') || `<tr><td colspan="4" style="color:var(--text-dim);padding:16px">Everyone won at least once!</td></tr>`;

      // ── Most Bonus Wins ──────────────────────────────────────────────────
      const topBonus = Object.entries(playerBonuses)
        .sort(([, a], [, b]) => b - a)
        .slice(0, TOP_N);

      const tableBonus = topBonus.map(([name, b], i) => `<tr>
        ${rankLabel(i)}
        <td class="username">${name}</td>
        <td class="val purple">${b}</td>
        <td class="sub-val">${playerPrizes[name] || 0}P / ${playerWins[name] || 0}W</td>
      </tr>`).join('') || `<tr><td colspan="4" style="color:var(--text-dim);padding:16px">No bonus wins this month.</td></tr>`;

      // ── Prizes distributed ───────────────────────────────────────────────
      // Normalise: accept both array and object (keyed by GameId)
      let transfersArray = null;
      if (Array.isArray(transfers)) {
        transfersArray = transfers;
      } else if (transfers && typeof transfers === 'object') {
        transfersArray = Object.values(transfers);
      }

      let prizesHtml = '';
      if (!transfersArray) {
        prizesHtml = `
          <div class="section">
            <h2>🎁 Prizes Distributed — ${monthLabel}</h2>
            <div class="error" style="font-size:13px">Transfer data not available — make sure IIS is running and <code>transfer-results.json</code> exists at <code>${TRANSFERS_URL}</code>.</div>
            ${buildSecondChanceHtml(secondChance, month)}
          </div>`;
      } else {
        transfers = transfersArray;
        // Extract prize name from PrizeSent string
        function extractName(prizeSent) {
          if (!prizeSent) return null;
          const m = prizeSent.match(/Name:\s*([^,]+)/);
          return m ? m[1].trim() : null;
        }

        // Extract yyyy-MM from GameId
        function gameIdToMonth(gameId) {
          if (!gameId) return null;
          // game_20250730_002100 → 2025-07
          const mg = gameId.match(/^game_(\d{4})(\d{2})\d{2}/);
          if (mg) return `${mg[1]}-${mg[2]}`;
          // loyalty_20250323 → 2025-03
          const ml = gameId.match(/^loyalty_(\d{4})(\d{2})\d{2}/);
          if (ml) return `${ml[1]}-${ml[2]}`;
          return null;
        }

        const monthTransfers = transfers.filter(t => gameIdToMonth(t.GameId) === month);

        const gameCounts    = {};
        const loyaltyCounts = {};
        const gameFailures    = [];
        const loyaltyFailures = [];

        for (const t of monthTransfers) {
          const name = extractName(t.PrizeSent);
          if (t.GameId && t.GameId.startsWith('game_')) {
            if (name) gameCounts[name] = (gameCounts[name] || 0) + 1;
            else gameFailures.push(t);
          } else if (t.GameId && t.GameId.startsWith('loyalty_')) {
            if (name) loyaltyCounts[name] = (loyaltyCounts[name] || 0) + 1;
            else loyaltyFailures.push(t);
          }
        }

        function buildFailedHtml(failures) {
          if (!failures.length) return '';
          return `<div class="failed-transfers">
            ⚠ ${failures.length} failed transfer${failures.length !== 1 ? 's' : ''} — sent manually
          </div>`;
        }

        function buildPrizeRows(counts, showWax) {
          const entries = Object.entries(counts).sort(([, a], [, b]) => b - a);
          if (entries.length === 0)
            return `<tr><td colspan="${showWax ? 3 : 2}" style="color:var(--text-dim);padding:16px">No prizes this month.</td></tr>`;
          return entries.map(([name, count]) => {
            const wax = showWax ? WAX_VALUES[name] : null;
            const waxCell = showWax
              ? (wax != null
                  ? `<td class="val wax-val">${(wax * count).toLocaleString()} <span style="font-size:11px;font-weight:400">WAX</span></td>`
                  : `<td class="unknown-wax">—</td>`)
              : '';
            return `<tr>
              <td class="username">${name}</td>
              <td class="val blue">${count}×</td>
              ${waxCell}
            </tr>`;
          }).join('');
        }

        function totalWax(counts) {
          return Object.entries(counts).reduce((sum, [name, count]) => {
            const wax = WAX_VALUES[name];
            return sum + (wax != null ? wax * count : 0);
          }, 0);
        }

        const gameTotal          = totalWax(gameCounts);
        const totalGamePrizes    = Object.values(gameCounts).reduce((s, v) => s + v, 0);
        const totalLoyaltyPrizes = Object.values(loyaltyCounts).reduce((s, v) => s + v, 0);

        prizesHtml = `
          <div class="section">
            <h2>🎁 Prizes Distributed — ${monthLabel}</h2>
            <div class="prizes-row">
              <div class="prizes-panel">
                <div class="prizes-panel-header">
                  <span class="title">Game Prizes &nbsp;<span style="font-size:12px;font-weight:400;color:var(--text-dim)">${totalGamePrizes} sent</span></span>
                  ${gameTotal > 0 ? `<span class="total-wax"><span>total</span>${gameTotal.toLocaleString()} WAX</span>` : ''}
                </div>
                <table>
                  <thead><tr><th>Prize</th><th class="num">Count</th><th class="num">WAX value</th></tr></thead>
                  <tbody>${buildPrizeRows(gameCounts, true)}</tbody>
                </table>
                ${buildFailedHtml(gameFailures)}
              </div>
              <div class="prizes-panel">
                <div class="prizes-panel-header">
                  <span class="title">Loyalty Quest Prizes &nbsp;<span style="font-size:12px;font-weight:400;color:var(--text-dim)">${totalLoyaltyPrizes} sent</span></span>
                </div>
                <table>
                  <thead><tr><th>Prize</th><th class="num">Count</th></tr></thead>
                  <tbody>${buildPrizeRows(loyaltyCounts, false)}</tbody>
                </table>
                ${buildFailedHtml(loyaltyFailures)}
              </div>
            </div>
            ${buildSecondChanceHtml(secondChance, month)}
          </div>`;
      }

      // ── Second Chance wheel spins ────────────────────────────────────────
      function buildSecondChanceHtml(secondChance, month) {
        if (!Array.isArray(secondChance)) return '';
        const spins = secondChance.filter(e =>
          e.WheelTriggered === true &&
          e.Timestamp && e.Timestamp.startsWith(month)
        );
        if (spins.length === 0)
          return `<div class="prizes-panel" style="margin-top:1.25rem">
            <div class="prizes-panel-header">
              <span class="title">Second Chance Wheel &nbsp;<span style="font-size:12px;font-weight:400;color:var(--text-dim)">0 spins</span></span>
            </div>
            <table>
              <tbody><tr><td colspan="3" style="color:var(--text-dim);padding:16px">No wheel spins this month.</td></tr></tbody>
            </table>
          </div>`;

        const claimedCount = spins.filter(e => e.PrizeClaimed === true).length;
        const userTally = {}; // username → { total, claimed }
        const rows = spins.map(e => {
          const dt = new Date(e.Timestamp);
          const date = dt.toLocaleDateString('en-US', { month: 'short', day: 'numeric' })
            + ' ' + dt.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit', hour12: false });
          const pill = e.PrizeClaimed === true
            ? `<span class="pill pill-claimed">Claimed</span>`
            : `<span class="pill pill-unclaimed">Not Claimed</span>`;
          const key = (e.WheelWinner || '').toLowerCase();
          if (!userTally[key]) userTally[key] = { total: 0, claimed: 0 };
          userTally[key].total++;
          if (e.PrizeClaimed === true) userTally[key].claimed++;
          const { total, claimed } = userTally[key];
          const tallyColor = claimed > 0 ? 'var(--green)' : 'var(--text-secondary)';
          return `<tr>
            <td style="color:var(--text-secondary);font-size:0.78rem;white-space:nowrap">${date}</td>
            <td class="username">${e.WheelWinner || '—'}</td>
            <td>${pill}</td>
            <td style="color:${tallyColor};font-weight:700;font-size:0.8rem;text-align:right;white-space:nowrap">${claimed}/${total}</td>
          </tr>`;
        }).join('');

        return `<div class="prizes-panel" style="margin-top:1.25rem">
          <div class="prizes-panel-header">
            <span class="title">Second Chance Wheel &nbsp;<span style="font-size:12px;font-weight:400;color:var(--text-dim)">${spins.length} spin${spins.length !== 1 ? 's' : ''}</span></span>
            <span style="font-size:0.8rem;color:var(--green);font-weight:700">${claimedCount} / ${spins.length} <span style="font-size:0.68rem;color:var(--text-secondary);font-weight:400">claimed</span></span>
          </div>
          <table>
            <thead><tr><th>Date</th><th>Winner</th><th>Status</th><th class="num">Claimed / Opportunities</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>`;
      }

      // ── Most Wins — full list ─────────────────────────────────────────────
      const allPlayers = Object.keys(playerGames).map(name => ({
        name,
        games:  playerGames[name],
        prizes: playerPrizes[name] || 0,
        wins:   playerWins[name] || 0,
      })).filter(p => p.games > 0)
        .sort((a, b) => b.wins - a.wins || b.prizes - a.prizes || (b.wins / b.games) - (a.wins / a.games) || b.games - a.games);

      const tableMostWins = allPlayers.map((p, i) => {
        const rate     = p.games ? ((p.wins / p.games) * 100).toFixed(1) : '0.0';
        const isTop5   = i < 5;
        const badge    = isTop5 ? `<span class="prize-badge">PRIZE</span>` : '';
        const rowClass = isTop5 ? ' class="prize-row"' : '';
        let rankCell;
        if      (i === 0) rankCell = `<td class="rank gold">🥇</td>`;
        else if (i === 1) rankCell = `<td class="rank silver">🥈</td>`;
        else if (i === 2) rankCell = `<td class="rank bronze">🥉</td>`;
        else if (i < 5)   rankCell = `<td class="rank gold">${i + 1}</td>`;
        else              rankCell = `<td class="rank">${i + 1}</td>`;
        return `<tr${rowClass}>
          ${rankCell}
          <td class="username">${p.name}${badge}</td>
          <td class="val blue">${p.games}</td>
          <td class="val purple">${p.prizes}</td>
          <td class="val gold">${p.wins}</td>
          <td class="val green">${rate}%</td>
        </tr>`;
      }).join('') || `<tr><td colspan="6" style="color:var(--text-dim);padding:16px">No data for this month.</td></tr>`;

      document.getElementById('content').innerHTML = `
        ${prizesHtml}
        <div class="section">
          <h2>🎯 Winning Numbers — ${monthLabel}</h2>
          <div class="legend">
            <div class="legend-item"><div class="legend-dot" style="background:var(--panel);border-color:var(--border)"></div> Never drawn</div>
            <div class="legend-item"><div class="legend-dot" style="background:rgba(88,166,255,0.10);border-color:rgba(88,166,255,0.30)"></div> Rare (bottom 5%)</div>
            <div class="legend-item"><div class="legend-dot" style="background:rgba(63,185,80,0.10);border-color:rgba(63,185,80,0.25)"></div> Common (middle 80%)</div>
            <div class="legend-item"><div class="legend-dot" style="background:rgba(232,184,75,0.25);border-color:rgba(232,184,75,0.55)"></div> Frequent (next 10%)</div>
            <div class="legend-item"><div class="legend-dot" style="background:rgba(248,81,73,0.30);border-color:rgba(248,81,73,0.70)"></div> Hot 🔥 (top 5%)</div>
          </div>
          <div class="numbers-grid">${numCells}</div>
        </div>

        <div class="section">
          <h2>🏆 Player Rankings — Top ${TOP_N} &nbsp;<span style="font-size:12px;color:var(--text-dim);font-weight:400">(min ${MIN_GAMES} games for win-rate lists)</span></h2>
          <div class="tables-row">
            <div>
              <h2 style="color:var(--blue);margin-bottom:12px">Most Games Entered</h2>
              <div class="table-scroll"><table>
                <thead><tr><th>#</th><th>Player</th><th class="num">Games</th><th class="num">Wins</th></tr></thead>
                <tbody>${tableGames}</tbody>
              </table></div>
            </div>
            <div>
              <h2 style="color:var(--green);margin-bottom:12px">Best Win Rate</h2>
              <div class="table-scroll"><table>
                <thead><tr><th>#</th><th>Player</th><th class="num">Win %</th><th class="num">W / G</th></tr></thead>
                <tbody>${tableBest}</tbody>
              </table></div>
            </div>
            <div>
              <h2 style="color:var(--red);margin-bottom:12px">Most Games, Zero Wins</h2>
              <div class="table-scroll"><table>
                <thead><tr><th>#</th><th>Player</th><th class="num">Games</th><th class="num">Wins</th></tr></thead>
                <tbody>${tableWorst}</tbody>
              </table></div>
            </div>
            <div>
              <h2 style="color:var(--purple);margin-bottom:12px">Most Bonus Wins</h2>
              <div class="table-scroll"><table>
                <thead><tr><th>#</th><th>Player</th><th class="num">Bonuses</th><th class="num">P / W</th></tr></thead>
                <tbody>${tableBonus}</tbody>
              </table></div>
            </div>
          </div>
        </div>

        <div class="section">
          <h2>🏅 Most Wins — Full Leaderboard &nbsp;<span style="font-size:12px;color:var(--text-dim);font-weight:400">${allPlayers.length} players · top 5 win a prize</span></h2>
          <div class="table-scroll"><table>
            <thead><tr><th>#</th><th>Player</th><th class="num">Games</th><th class="num">Prizes</th><th class="num">Wins</th><th class="num">Win %</th></tr></thead>
            <tbody>${tableMostWins}</tbody>
          </table></div>
        </div>
      `;
    }
  </script>
</body>
</html>
