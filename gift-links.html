<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gift Links — Hoardio</title>
  <meta name="description" content="Manage the NFT gift claim-links you've created — active, claimed, and cancelled." />
  <link rel="canonical" href="https://www.hoardio.com/gift-links" />
  <link rel="icon" href="images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="shared/global.css" />
  <style>
    .page-main { max-width: 1000px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    .auth-gate {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 2.5rem 2rem; text-align: center; color: var(--text-secondary);
    }
    .auth-gate-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem; }
    .auth-gate-hint  { font-size: 0.88rem; }

    .offer-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .offer-tab-btn {
      flex: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      background: rgba(240,168,64,0.12); border: 1px solid rgba(240,168,64,0.45);
      border-radius: 8px; padding: 0.55rem 1.1rem;
      font-size: 0.85rem; font-weight: 700; color: var(--accent-light);
      font-family: inherit; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .offer-tab-btn:hover { background: rgba(240,168,64,0.2); border-color: rgba(240,168,64,0.7); }
    .offer-tab-btn.active {
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      border-color: transparent; color: #fff;
    }

    .status-wrap { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
    .spinner {
      width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 0.9rem; }
    .empty-state strong { display: block; color: var(--text-primary); font-size: 1rem; margin-bottom: 0.4rem; }
    .empty-state a { color: var(--accent-light); text-decoration: underline; }

    .links-list { display: flex; flex-direction: column; gap: 0.7rem; }

    /* ── Accordion item — same shell as trade-offers.html/trade-history.html ── */
    .offer-item { background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px; overflow: hidden; transition: border-color 0.2s; }
    .offer-item:hover { border-color: var(--border-hover); }
    .offer-header { display: flex; align-items: center; padding: 1rem 1.25rem; cursor: pointer; user-select: none; gap: 1rem; }
    .offer-chevron { width: 18px; height: 18px; flex-shrink: 0; color: var(--text-secondary); transition: transform 0.2s; }
    .offer-item.open .offer-chevron { transform: rotate(90deg); }
    .offer-from { flex: 1; min-width: 0; font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .status-pill {
      display: inline-block; margin-left: 0.5rem; font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em;
      border-radius: 999px; padding: 0.12rem 0.5rem; vertical-align: middle;
    }
    .status-active    { color: #4ade80; background: rgba(74,222,128,0.12); border: 1px solid rgba(74,222,128,0.35); }
    .status-claimed   { color: #4ade80; background: rgba(74,222,128,0.12); border: 1px solid rgba(74,222,128,0.35); }
    .status-cancelled { color: var(--text-secondary); background: rgba(255,255,255,0.06); border: 1px solid var(--border); }
    .offer-age { flex-shrink: 0; font-size: 0.75rem; color: var(--text-secondary); white-space: nowrap; text-align: right; }
    .offer-body { display: none; border-top: 1px solid var(--border); }
    .offer-item.open .offer-body { display: block; }

    .link-meta-row { display: flex; flex-wrap: wrap; gap: 0.6rem 1.5rem; padding: 1rem 1.25rem 0.5rem; }
    .modal-info-row {
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
      background: rgba(255,255,255,0.04); border-radius: 8px;
      padding: 0.55rem 0.9rem; flex: 1; min-width: 200px;
    }
    .modal-info-label { font-size: 0.78rem; color: var(--text-secondary); }
    .modal-info-val { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }

    /* ── Item strip — same treatment as inventory.html's bulk-action modal,
       including the custom scrollbar from that same session. ── */
    .bulk-strip { display: flex; gap: 0.6rem; overflow-x: auto; padding: 1rem 1.25rem; }
    .bulk-strip { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.28) transparent; }
    .bulk-strip::-webkit-scrollbar { height: 9px; }
    .bulk-strip::-webkit-scrollbar-track { background: transparent; }
    .bulk-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.28); border-radius: 5px; }
    .bulk-strip::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.45); }
    .bulk-strip-item {
      position: relative; flex-shrink: 0; width: 130px; box-sizing: border-box;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.6rem;
    }
    .bulk-strip-thumb {
      width: 108px; height: 108px; border-radius: 6px; overflow: hidden;
      background: var(--bg-card); border: 1px solid var(--border);
    }
    .bulk-strip-thumb img, .bulk-strip-thumb video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .bulk-strip-name { font-size: 0.74rem; color: var(--text-secondary); margin-top: 0.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .offer-actions { display: flex; align-items: center; justify-content: flex-end; gap: 0.65rem; padding: 1rem 1.25rem; border-top: 1px solid var(--border); }
    .offer-memo { flex: 1; align-self: center; font-size: 0.78rem; color: var(--text-secondary); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 0.5rem; }
    .offer-memo span { color: var(--text-primary); }
    .offer-btn {
      font-size: 0.82rem; font-weight: 700; padding: 0.5rem 1.25rem;
      border-radius: 8px; border: 1px solid transparent; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s; white-space: nowrap;
    }
    .offer-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .offer-btn--accept  { background: rgba(74,222,128,0.1); border-color: rgba(74,222,128,0.4); color: #4ade80; }
    .offer-btn--accept:not(:disabled):hover { background: rgba(74,222,128,0.2); border-color: #4ade80; }
    .offer-btn--decline { background: rgba(224,82,82,0.08); border-color: rgba(224,82,82,0.3); color: #e05252; }
    .offer-btn--decline:not(:disabled):hover { background: rgba(224,82,82,0.18); border-color: #e05252; }
    .offer-btn--done { background: rgba(100,100,100,0.1); border-color: rgba(255,255,255,0.12); color: var(--text-secondary); cursor: default !important; }
    .bl-progress { font-size: 0.75rem; color: var(--text-secondary); text-align: right; padding: 0 1.25rem 0.75rem; }
    .bl-progress.is-error { color: #e05050; }
    .bl-progress.is-success { color: #50c878; }

    .load-more-wrap { text-align: center; margin-top: 1rem; }
    .load-more-btn {
      background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px;
      padding: 0.6rem 1.4rem; color: var(--text-primary); font-size: 0.85rem; font-weight: 600;
      cursor: pointer; transition: border-color 0.15s;
    }
    .load-more-btn:hover { border-color: rgba(192,120,40,0.5); }
    .load-more-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    @media (max-width: 700px) {
      .page-main { padding: 1.25rem 0.75rem 3rem; }
      .offer-header { flex-wrap: wrap; gap: 0.35rem 1rem; }
      .offer-from { flex-basis: calc(100% - 18px - 1rem); white-space: normal; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script src="shared/supabase-config.js"></script>
  <script src="shared/wax-api.js"></script>
  <script src="shared/wallet-widget.js"></script>
  <script src="shared/gift-crypto.js"></script>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index" class="nav-home" title="Back to homepage">
      <img src="images/Hoardio_fav.png" alt="Hoardio" />
    </a>
    <span class="nav-divider"></span>
    <div class="nav-links"></div>
  </div>
</nav>
<script src="shared/generic-nav.js"></script>

<main class="page-main">
  <div class="page-header">
    <h1 class="page-title">Gift <span class="accent">Links</span></h1>
    <p class="page-desc">NFT claim-links you've created — active, claimed, and cancelled.</p>
  </div>

  <div class="offer-tabs" id="linkTabs">
    <button type="button" class="offer-tab-btn active" data-tab="active">🎁 Active</button>
    <button type="button" class="offer-tab-btn" data-tab="history">🕘 History</button>
  </div>

  <div id="authGate" class="auth-gate" style="display:none;">
    <p class="auth-gate-title">Wallet not connected</p>
    <p class="auth-gate-hint">Connect your WAX wallet using the button in the navigation bar to manage your gift links.</p>
  </div>

  <div id="loadWrap" class="status-wrap" style="display:none;">
    <div class="spinner"></div>
    <div id="loadWrapText">Loading gift links…</div>
  </div>

  <div id="emptyWrap" class="empty-state" style="display:none;"></div>

  <div id="linksList" class="links-list" style="display:none;"></div>
  <div id="loadMoreWrap" class="load-more-wrap" style="display:none;">
    <button type="button" class="load-more-btn" id="loadMoreBtn">Load more</button>
  </div>
</main>

<script>
'use strict';

WalletWidget.mount(document.querySelector('.nav-inner'), {
  authScript: 'shared/wax-auth.js',
  menuItems: [
    { href: 'inventory', label: 'Inventory', icon: '📦' },
    { href: 'inventory-activity', label: 'Activity', icon: '🕒' },
    { href: 'trade-offers', label: 'Trade Offers', icon: '🔄' },
    { href: 'gift-links', label: 'Gift Links', icon: '🎁' },
  ],
});
window.addEventListener('wax-auth-change', onWalletChange);

// Dedicated indexed API for this exact contract — same AtomicAssets API
// infrastructure as shared/wax-api.js's pool, but a different path prefix
// (/atomictools/v1, not /atomicassets/v1), so not routed through aaBase()'s
// failover — only the one "official node" host is confirmed to serve it.
// State (per this API's own docs, not the raw chain table — which has no
// state field at all): 0 WAITING (announced, transfer not yet landed —
// essentially never observed in practice since both actions are one
// transaction here), 1 CREATED (active), 2 CANCELED, 3 CLAIMED.
// `sort` only supports "created" (confirmed against the live swagger doc) —
// History is therefore ordered by creation date, not resolution date, unlike
// trade-history.html's `updated`-sorted convention; that's an API
// limitation, not a design choice made here.
const TOOLS_API = 'https://wax.api.atomicassets.io/atomictools/v1';
const LINKS_PAGE_SIZE = 20;

let _tab  = 'active';
let _page = 1;
let _rows = [];
let _hasMore = false;

async function fetchLinksPage(wallet, tab, page) {
  const state = tab === 'active' ? '1' : '2,3';
  const url = `${TOOLS_API}/links?creator=${encodeURIComponent(wallet)}&state=${state}&limit=${LINKS_PAGE_SIZE}&page=${page}&order=desc&sort=created`;
  const res = await fetch(url);
  const body = await res.json();
  if (!body.success) throw new Error(body.message || 'Unknown API error');
  return body.data;
}

function setActiveTab(tab) {
  _tab = tab === 'history' ? 'history' : 'active';
  document.querySelectorAll('.offer-tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === _tab));
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (wallet) loadLinks(true);
}
document.querySelectorAll('.offer-tab-btn').forEach(btn => btn.addEventListener('click', () => setActiveTab(btn.dataset.tab)));

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function relativeTime(ms) {
  const s = Math.floor((Date.now() - ms) / 1000);
  if (s < 60) return 'just now';
  if (s < 3600) return `${Math.floor(s/60)}m ago`;
  if (s < 86400) return `${Math.floor(s/3600)}h ago`;
  return `${Math.floor(s/86400)}d ago`;
}

// Same image/video strategy as inventory.html/explore.html/etc — not the
// data.img-only check this used before, which showed "?" for any asset
// whose media is a video (data.video), a very common case on WAX.
function imgUrl(hash) {
  if (!hash) return '';
  if (hash.startsWith('http')) return hash;
  const gw = (typeof IPFS_GATEWAY !== 'undefined') ? IPFS_GATEWAY : 'https://ipfs.io/ipfs/';
  return gw + hash;
}
const IPFS_GATEWAY_LIST = [
  (typeof IPFS_GATEWAY !== 'undefined') ? IPFS_GATEWAY : 'https://ipfs.io/ipfs/',
  'https://cloudflare-ipfs.com/ipfs/',
  'https://dweb.link/ipfs/',
];
function onAssetImgError(el) {
  const hash = el.dataset.ipfsHash;
  if (hash) {
    const idx = parseInt(el.dataset.gwIdx || '0', 10) + 1;
    if (idx < IPFS_GATEWAY_LIST.length) {
      el.dataset.gwIdx = String(idx);
      setTimeout(() => { el.src = IPFS_GATEWAY_LIST[idx] + hash; }, 1200);
      return;
    }
  } else if (!el.dataset.retried) {
    el.dataset.retried = '1';
    setTimeout(() => { el.src = el.src + (el.src.includes('?') ? '&' : '?') + '_retry=1'; }, 1500);
    return;
  }
  el.style.display = 'none';
}
function assetMediaHtml(a) {
  const d     = a.data || {};
  const t     = a.template?.immutable_data || {};
  const video = d.video || t.video || '';
  const img   = d.img || d.image || t.img || t.image || '';
  if (video) return `<video data-src="${imgUrl(video)}" muted playsinline loop preload="none" style="width:100%;height:100%;object-fit:contain;display:block"></video>`;
  if (img)   return `<img src="${imgUrl(img)}" alt="${escHtml(a.name || '')}" data-ipfs-hash="${img.startsWith('http') ? '' : img}" data-gw-idx="0" onerror="onAssetImgError(this)" style="width:100%;height:100%;object-fit:contain;display:block">`;
  return '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);">?</div>';
}
let _videoObserver = null;
function initLazyVideos() {
  if (_videoObserver) _videoObserver.disconnect();
  _videoObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      const video = entry.target;
      if (entry.isIntersecting) {
        if (video.dataset.src && !video.src) { video.src = video.dataset.src; video.load(); }
        video.play().catch(() => {});
      } else {
        video.pause();
        if (video.src) { video.removeAttribute('src'); video.load(); }
      }
    }
  }, { rootMargin: '300px' });
  document.querySelectorAll('.bulk-strip-thumb video[data-src]').forEach(v => _videoObserver.observe(v));
}

// Full asset objects (name/image/mint) already come embedded in each link
// row from the atomictools API — no separate AtomicAssets lookup needed.
function assetStripHtml(assets) {
  return (assets || []).map(a => {
    const name = a?.data?.name || a?.name || 'Unknown';
    const mint = a?.template_mint ? `#${a.template_mint}` : '';
    return `<div class="bulk-strip-item">
      <div class="bulk-strip-thumb">${assetMediaHtml(a)}</div>
      <div class="bulk-strip-name" title="${escHtml(name)}">${escHtml(name)}</div>
      ${mint ? `<div class="bulk-strip-name">${mint}</div>` : ''}
    </div>`;
  }).join('');
}

function buildActiveItem(row) {
  const memo = row.memo ? `Memo: <span>${escHtml(row.memo)}</span>` : 'No memo';
  const assetIds = (row.assets || []).map(a => a.asset_id);
  return `
    <div class="offer-item" data-link-id="${row.link_id}">
      <div class="offer-header">
        <svg class="offer-chevron" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="offer-from">Link #${row.link_id}<span class="status-pill status-active">Active</span></span>
        <span class="offer-age">${assetIds.length} item${assetIds.length !== 1 ? 's' : ''}</span>
      </div>
      <div class="offer-body">
        <div class="link-meta-row">
          <div class="modal-info-row"><span class="modal-info-label">Link ID</span><span class="modal-info-val">#${row.link_id}</span></div>
          <div class="modal-info-row"><span class="modal-info-label">Created</span><span class="modal-info-val">${relativeTime(Number(row.created_at_time))}</span></div>
        </div>
        <div class="bulk-strip">${assetStripHtml(row.assets)}</div>
        <div class="offer-actions">
          <div class="offer-memo">${memo}</div>
          <button type="button" class="offer-btn offer-btn--decline" data-action="cancel" data-link-id="${row.link_id}">Cancel</button>
          <button type="button" class="offer-btn offer-btn--accept" data-action="regenerate" data-link-id="${row.link_id}" data-asset-ids='${JSON.stringify(assetIds)}' data-memo="${escHtml(row.memo || '')}">Regenerate</button>
        </div>
        <div class="bl-progress" id="linkProgress-${row.link_id}"></div>
      </div>
    </div>`;
}

function buildHistoryItem(row) {
  const claimed = row.state === 3;
  const cls = claimed ? 'status-claimed' : 'status-cancelled';
  const label = claimed ? 'Claimed' : 'Cancelled';
  const claimerTag = claimed && row.claimer ? ` <span style="color:var(--text-secondary);font-weight:400;font-size:0.8rem;">to ${escHtml(row.claimer)}</span>` : '';
  const memo = row.memo ? `Memo: <span>${escHtml(row.memo)}</span>` : 'No memo';
  return `
    <div class="offer-item" data-link-id="${row.link_id}">
      <div class="offer-header">
        <svg class="offer-chevron" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <span class="offer-from">Link #${row.link_id}<span class="status-pill ${cls}">${label}</span>${claimerTag}</span>
        <span class="offer-age">${relativeTime(Number(row.created_at_time))}</span>
      </div>
      <div class="offer-body">
        <div class="bulk-strip">${assetStripHtml(row.assets)}</div>
        <div class="offer-actions"><div class="offer-memo">${memo}</div></div>
      </div>
    </div>`;
}

document.getElementById('linksList').addEventListener('click', e => {
  const actionBtn = e.target.closest('[data-action]');
  if (actionBtn) { e.stopPropagation(); return handleLinkAction(actionBtn); }
  const header = e.target.closest('.offer-header');
  if (!header) return;
  const item = header.closest('.offer-item');
  const wasOpen = item.classList.contains('open');
  document.querySelectorAll('.offer-item.open').forEach(el => el.classList.remove('open'));
  if (!wasOpen) item.classList.add('open');
});

async function handleLinkAction(btn) {
  const action = btn.dataset.action;
  const linkId = btn.dataset.linkId;
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (!wallet) return;
  const progressEl = document.getElementById(`linkProgress-${linkId}`);
  const setMsg = (msg, type) => { if (progressEl) { progressEl.textContent = msg; progressEl.className = 'bl-progress' + (type ? ` is-${type}` : ''); } };

  const item = btn.closest('.offer-item');
  item.querySelectorAll('.offer-btn').forEach(b => b.disabled = true);

  try {
    if (action === 'cancel') {
      setMsg('Waiting for wallet…');
      await WaxAuth.transact([
        { account: 'atomictoolsx', name: 'cancellink', authorization: [{ actor: wallet, permission: 'active' }], data: { link_id: Number(linkId) } },
      ]);
      setMsg('Cancelled.', 'success');
      setTimeout(() => item.remove(), 900);
    } else if (action === 'regenerate') {
      const assetIds = JSON.parse(btn.dataset.assetIds);
      const memo = btn.dataset.memo || GIFT_MEMO_FALLBACK;
      const { privateKey, publicKey } = window.GiftCrypto.generateKeyPair();
      setMsg('Waiting for wallet…');
      await WaxAuth.transact([
        { account: 'atomictoolsx', name: 'cancellink', authorization: [{ actor: wallet, permission: 'active' }], data: { link_id: Number(linkId) } },
        { account: 'atomictoolsx', name: 'announcelink', authorization: [{ actor: wallet, permission: 'active' }], data: { creator: wallet, key: publicKey, asset_ids: assetIds, memo } },
        { account: 'atomicassets', name: 'transfer', authorization: [{ actor: wallet, permission: 'active' }], data: { from: wallet, to: 'atomictoolsx', asset_ids: assetIds, memo: 'link' } },
      ]);
      setMsg('Regenerated — refreshing…', 'success');
      setTimeout(() => loadLinks(), 900);
    }
  } catch (err) {
    item.querySelectorAll('.offer-btn').forEach(b => b.disabled = false);
    const msg = (err?.message || '').toLowerCase();
    setMsg(msg.includes('cancel') || msg.includes('abort') ? 'Transaction cancelled.' : `Error: ${err?.message || 'Unknown error'}`, 'error');
  }
}
const GIFT_MEMO_FALLBACK = 'A fellow collector sent you a gift.';

async function loadLinks(reset = true) {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (!wallet) return;
  if (reset) { _page = 1; _rows = []; }

  document.getElementById('emptyWrap').style.display = 'none';
  document.getElementById('loadMoreWrap').style.display = 'none';
  if (reset) {
    document.getElementById('linksList').style.display = 'none';
    document.getElementById('loadWrap').style.display = '';
    document.getElementById('loadWrapText').textContent = _tab === 'active' ? 'Loading active gift links…' : 'Loading gift link history…';
  } else {
    document.getElementById('loadMoreBtn').disabled = true;
    document.getElementById('loadMoreBtn').textContent = 'Loading…';
  }

  try {
    const data = await fetchLinksPage(wallet, _tab, _page);
    _rows = reset ? data : _rows.concat(data);
    _hasMore = data.length === LINKS_PAGE_SIZE;

    document.getElementById('loadWrap').style.display = 'none';
    if (!_rows.length) {
      const empty = document.getElementById('emptyWrap');
      empty.innerHTML = _tab === 'active'
        ? '<strong>No active gift links</strong>Create one from a card\'s Bulk action menu on <a href="inventory">Inventory</a>.'
        : '<strong>No resolved gift links yet</strong>Claimed or cancelled links will show up here.';
      empty.style.display = '';
      return;
    }

    const list = document.getElementById('linksList');
    list.innerHTML = _rows.map(_tab === 'active' ? buildActiveItem : buildHistoryItem).join('');
    list.style.display = '';
    initLazyVideos();
    document.getElementById('loadMoreBtn').disabled = false;
    document.getElementById('loadMoreBtn').textContent = 'Load more';
    document.getElementById('loadMoreWrap').style.display = _hasMore ? '' : 'none';
  } catch (err) {
    document.getElementById('loadWrap').style.display = 'none';
    if (reset) {
      const empty = document.getElementById('emptyWrap');
      empty.innerHTML = `<strong>Couldn't load gift links</strong>${escHtml(err?.message || 'Unknown error')}`;
      empty.style.display = '';
    } else {
      document.getElementById('loadMoreBtn').disabled = false;
      document.getElementById('loadMoreBtn').textContent = 'Load more';
    }
  }
}
document.getElementById('loadMoreBtn').addEventListener('click', () => { _page++; loadLinks(false); });

function onWalletChange() {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  document.querySelectorAll('.offer-item.open').forEach(el => el.classList.remove('open'));
  if (!wallet) {
    document.getElementById('authGate').style.display = '';
    document.getElementById('linkTabs').style.display = 'none';
    document.getElementById('linksList').style.display = 'none';
    document.getElementById('emptyWrap').style.display = 'none';
    document.getElementById('loadMoreWrap').style.display = 'none';
    return;
  }
  document.getElementById('authGate').style.display = 'none';
  document.getElementById('linkTabs').style.display = '';
  loadLinks();
}
onWalletChange();
</script>
<script src="shared/moved.js"></script>
</body>
