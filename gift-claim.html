<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Claim Your Gift — Hoardio</title>
  <meta name="description" content="Claim NFTs someone gifted you on Hoardio." />
  <link rel="canonical" href="https://www.hoardio.com/gift-claim.html" />
  <link rel="icon" href="images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="shared/global.css" />
  <style>
    .page-main { max-width: 560px; margin: 0 auto; padding: 3rem 1.5rem 4rem; }
    .claim-card {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 18px; padding: 2rem; text-align: center;
    }
    .claim-title { font-size: 1.3rem; font-weight: 800; color: var(--text-primary); margin-bottom: 1.5rem; }
    .claim-title .accent { color: var(--accent-light); }

    .bulk-strip { display: flex; gap: 0.6rem; overflow-x: auto; padding-bottom: 0.5rem; margin-bottom: 1.25rem; }
    .bulk-strip { scrollbar-width: thin; scrollbar-color: rgba(255,255,255,0.28) transparent; }
    .bulk-strip::-webkit-scrollbar { height: 9px; }
    .bulk-strip::-webkit-scrollbar-track { background: transparent; }
    .bulk-strip::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.28); border-radius: 5px; }
    .bulk-strip::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.45); }
    .bulk-strip-item {
      position: relative; flex-shrink: 0; width: 130px; box-sizing: border-box;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: 10px; padding: 0.6rem; text-align: left;
    }
    .bulk-strip-thumb {
      width: 108px; height: 108px; border-radius: 6px; overflow: hidden;
      background: var(--bg-card); border: 1px solid var(--border);
    }
    .bulk-strip-thumb img, .bulk-strip-thumb video { width: 100%; height: 100%; object-fit: contain; display: block; }
    .bulk-strip-name { font-size: 0.74rem; color: var(--text-secondary); margin-top: 0.3rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

    .modal-info-row {
      display: flex; align-items: center; justify-content: space-between;
      background: rgba(255,255,255,0.04); border-radius: 8px;
      padding: 0.65rem 0.9rem; margin-bottom: 0.6rem; text-align: left;
    }
    .modal-info-label { font-size: 0.78rem; color: var(--text-secondary); }
    .modal-info-val { font-size: 0.9rem; font-weight: 700; color: var(--text-primary); }

    .claim-btn {
      width: 100%; margin-top: 1rem; padding: 0.9rem 1.5rem;
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      border: none; border-radius: 10px; color: #fff;
      font-size: 1rem; font-weight: 700; font-family: inherit; cursor: pointer;
      transition: opacity 0.15s;
    }
    .claim-btn:hover:not(:disabled) { opacity: 0.9; }
    .claim-btn:disabled { opacity: 0.5; cursor: not-allowed; }

    .claim-msg { font-size: 0.85rem; margin-top: 0.9rem; min-height: 1.2rem; }
    .claim-msg.is-error   { color: #e05050; }
    .claim-msg.is-success { color: #50c878; }

    .status-wrap { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
    .spinner {
      width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 0.9rem; }
    .empty-state strong { display: block; color: var(--text-primary); font-size: 1rem; margin-bottom: 0.4rem; }
    .empty-state a { color: var(--accent-light); text-decoration: underline; }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script src="shared/supabase-config.js"></script>
  <script src="shared/wax-api.js"></script>
  <script src="shared/wallet-widget.js"></script>
  <script src="shared/gift-crypto.js"></script>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-home" title="Back to homepage">
      <img src="images/Hoardio_fav.png" alt="Hoardio" />
    </a>
    <span class="nav-divider"></span>
    <div class="nav-links"></div>
  </div>
</nav>
<script src="shared/generic-nav.js"></script>

<main class="page-main">
  <div id="loadWrap" class="status-wrap">
    <div class="spinner"></div>
    <div>Loading gift…</div>
  </div>
  <div id="emptyWrap" class="empty-state" style="display:none;"></div>
  <div id="claimCard" class="claim-card" style="display:none;"></div>
</main>

<script>
'use strict';

// No menuItems dropdown here on purpose — a first-time visitor with no
// wallet yet has nothing meaningful to browse in it. The Connect Wallet
// button (via WalletWidget) is the one thing this page needs from the nav.
WalletWidget.mount(document.querySelector('.nav-inner'), { authScript: 'shared/wax-auth.js' });

const CHAIN_RPC = localStorage.getItem('hoardio_rpc_endpoint') || 'https://wax.greymass.com';

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Same image/video strategy as inventory.html/explore.html/etc — not the
// data.img-only check this used before, which showed "?" for any asset
// whose media is a video (data.video), a very common case on WAX.
function imgUrl(hash) {
  if (!hash) return '';
  if (hash.startsWith('http')) return hash;
  const gw = (typeof IPFS_GATEWAY !== 'undefined') ? IPFS_GATEWAY : 'https://ipfs.io/ipfs/';
  return gw + hash;
}
const IPFS_GATEWAY_LIST = [
  (typeof IPFS_GATEWAY !== 'undefined') ? IPFS_GATEWAY : 'https://ipfs.io/ipfs/',
  'https://cloudflare-ipfs.com/ipfs/',
  'https://dweb.link/ipfs/',
];
function onAssetImgError(el) {
  const hash = el.dataset.ipfsHash;
  if (hash) {
    const idx = parseInt(el.dataset.gwIdx || '0', 10) + 1;
    if (idx < IPFS_GATEWAY_LIST.length) {
      el.dataset.gwIdx = String(idx);
      setTimeout(() => { el.src = IPFS_GATEWAY_LIST[idx] + hash; }, 1200);
      return;
    }
  } else if (!el.dataset.retried) {
    el.dataset.retried = '1';
    setTimeout(() => { el.src = el.src + (el.src.includes('?') ? '&' : '?') + '_retry=1'; }, 1500);
    return;
  }
  el.style.display = 'none';
}
function assetMediaHtml(a) {
  const d     = a.data || {};
  const t     = a.template?.immutable_data || {};
  const video = d.video || t.video || '';
  const img   = d.img || d.image || t.img || t.image || '';
  if (video) return `<video data-src="${imgUrl(video)}" muted playsinline loop preload="none" style="width:100%;height:100%;object-fit:contain;display:block"></video>`;
  if (img)   return `<img src="${imgUrl(img)}" alt="${escHtml(a.name || '')}" data-ipfs-hash="${img.startsWith('http') ? '' : img}" data-gw-idx="0" onerror="onAssetImgError(this)" style="width:100%;height:100%;object-fit:contain;display:block">`;
  return '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);">?</div>';
}
let _videoObserver = null;
function initLazyVideos() {
  if (_videoObserver) _videoObserver.disconnect();
  _videoObserver = new IntersectionObserver((entries) => {
    for (const entry of entries) {
      const video = entry.target;
      if (entry.isIntersecting) {
        if (video.dataset.src && !video.src) { video.src = video.dataset.src; video.load(); }
        video.play().catch(() => {});
      } else {
        video.pause();
        if (video.src) { video.removeAttribute('src'); video.load(); }
      }
    }
  }, { rootMargin: '300px' });
  document.querySelectorAll('.bulk-strip-thumb video[data-src]').forEach(v => _videoObserver.observe(v));
}

const params  = new URLSearchParams(location.search);
const linkId  = params.get('id');
// The one-off private key lives in the URL FRAGMENT, not a query param — it
// never gets sent in any HTTP request/server log this way. Read once; never
// echoed back into any fetch call except the local claimer_signature math.
const privKey = location.hash.replace(/^#/, '');

let _link = null; // { creator, memo, asset_ids }

function showEmpty(title, hint) {
  document.getElementById('loadWrap').style.display = 'none';
  document.getElementById('claimCard').style.display = 'none';
  const el = document.getElementById('emptyWrap');
  el.innerHTML = `<strong>${escHtml(title)}</strong>${hint}`;
  el.style.display = '';
}

async function loadLink() {
  if (!linkId || !privKey) {
    showEmpty('Invalid gift link', 'This link is missing its ID or key — ask the sender for the full link again.');
    return;
  }
  try {
    const res = await fetch(`${CHAIN_RPC}/v1/chain/get_table_rows`, {
      method: 'POST',
      body: JSON.stringify({ code: 'atomictoolsx', table: 'links', scope: 'atomictoolsx', lower_bound: linkId, upper_bound: linkId, limit: 1, json: true }),
    });
    const { rows } = await res.json();
    if (!rows || !rows.length) {
      showEmpty('This gift link is no longer available', 'It may have already been claimed or was cancelled by the sender.');
      return;
    }
    _link = rows[0];

    const assets = await WaxApi.apiFetch(`${WaxApi.aaBase()}/assets?ids=${_link.asset_ids.join(',')}&limit=${_link.asset_ids.length}`);
    const assetsById = new Map(assets.map(a => [String(a.asset_id), a]));

    const stripHtml = _link.asset_ids.map(id => {
      const a = assetsById.get(String(id));
      const name = a?.name || 'Unknown';
      const mint = a?.template_mint ? `#${a.template_mint}` : '';
      const thumb = a ? assetMediaHtml(a) : '<div style="display:flex;align-items:center;justify-content:center;height:100%;color:var(--text-secondary);">?</div>';
      return `<div class="bulk-strip-item">
        <div class="bulk-strip-thumb">${thumb}</div>
        <div class="bulk-strip-name" title="${escHtml(name)}">${escHtml(name)}</div>
        ${mint ? `<div class="bulk-strip-name">${mint}</div>` : ''}
      </div>`;
    }).join('');

    document.getElementById('loadWrap').style.display = 'none';
    document.getElementById('emptyWrap').style.display = 'none';
    const card = document.getElementById('claimCard');
    card.innerHTML = `
      <div class="claim-title">Claim Link <span class="accent">#${escHtml(linkId)}</span></div>
      <div class="bulk-strip">${stripHtml}</div>
      <div class="modal-info-row"><span class="modal-info-label">Creator</span><span class="modal-info-val">${escHtml(_link.creator)}</span></div>
      ${_link.memo ? `<div class="modal-info-row"><span class="modal-info-label">Memo</span><span class="modal-info-val">${escHtml(_link.memo)}</span></div>` : ''}
      <button type="button" class="claim-btn" id="claimBtn">Claim</button>
      <div class="claim-msg" id="claimMsg"></div>`;
    card.style.display = '';
    initLazyVideos();
    document.getElementById('claimBtn').addEventListener('click', handleClaim);
  } catch (err) {
    showEmpty("Couldn't load this gift link", escHtml(err?.message || 'Unknown error'));
  }
}

function setMsg(msg, type) {
  const el = document.getElementById('claimMsg');
  if (!el) return;
  el.textContent = msg || '';
  el.className = 'claim-msg' + (type ? ` is-${type}` : '');
}

// NOT YET CONFIRMED against the live contract — atomictoolsx isn't
// open-source, so the exact message claimer_signature must be a signature
// OVER is a best-guess (the claimer's plain account name), verified only by
// actually attempting a real claim. If this rejects on-chain, that's the
// first thing to change — see the plan's verification note.
async function computeClaimerSignature(claimer) {
  return window.GiftCrypto.signMessage(privKey, claimer);
}

async function handleClaim() {
  const btn = document.getElementById('claimBtn');
  btn.disabled = true;

  let wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (!wallet) {
    setMsg('Connecting wallet…');
    try {
      wallet = await WaxAuth.login();
    } catch (err) {
      btn.disabled = false;
      setMsg('Wallet connection cancelled.', 'error');
      return;
    }
  }

  setMsg('Waiting for wallet…');
  try {
    const claimerSignature = await computeClaimerSignature(wallet);
    await WaxAuth.transact([
      { account: 'atomictoolsx', name: 'claimlink', authorization: [{ actor: wallet, permission: 'active' }],
        data: { link_id: Number(linkId), claimer: wallet, claimer_signature: claimerSignature } },
    ]);
    setMsg('', '');
    document.getElementById('claimCard').innerHTML = `
      <div class="claim-title">🎉 Claimed!</div>
      <p style="color:var(--text-secondary); margin-bottom:1.25rem;">These NFTs are now in your wallet.</p>
      <a class="claim-btn" style="display:block; text-decoration:none; box-sizing:border-box;" href="inventory.html">View My Inventory</a>`;
  } catch (err) {
    btn.disabled = false;
    const msg = (err?.message || '').toLowerCase();
    setMsg(msg.includes('cancel') || msg.includes('abort') ? 'Transaction cancelled.' : `Error: ${err?.message || 'Unknown error'}`, 'error');
  }
}

loadLink();
</script>
<script src="shared/moved.js"></script>
</body>
</html>
