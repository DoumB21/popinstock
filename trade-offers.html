<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Trade Offers — Hoardio</title>
  <meta name="description" content="Review, accept, and cancel WAX trade offers for your NFT cards — both received and sent." />
  <link rel="canonical" href="https://www.hoardio.com/trade-offers" />
  <meta property="og:type" content="website" />
  <meta property="og:url" content="https://www.hoardio.com/trade-offers" />
  <meta property="og:title" content="Trade Offers — Hoardio" />
  <meta property="og:description" content="Review, accept, and cancel WAX trade offers for your NFT cards — both received and sent." />
  <meta property="og:image" content="https://www.hoardio.com/images/og-banner.png" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Trade Offers — Hoardio" />
  <meta name="twitter:description" content="Review, accept, and cancel WAX trade offers for your NFT cards — both received and sent." />
  <meta name="twitter:image" content="https://www.hoardio.com/images/og-banner.png" />
  <link rel="icon" href="images/Hoardio_fav.ico" sizes="any" />
  <link rel="icon" href="images/Hoardio_fav.png" type="image/png" />
  <link rel="stylesheet" href="shared/global.css" />
  <style>
    /* ── Page ── */
    .page-main { max-width: 1200px; margin: 0 auto; padding: 2.5rem 1.5rem 4rem; }

    .auth-gate {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; padding: 2.5rem 2rem;
      text-align: center; color: var(--text-secondary);
    }
    .auth-gate-title { font-size: 1rem; font-weight: 600; color: var(--text-primary); margin-bottom: 0.5rem; }
    .auth-gate-hint  { font-size: 0.88rem; }

    /* ── Tab switcher — same visual language as inventory-activity.html's
       .act-tabs (Purchases/Sales/Transfers). ── */
    .offer-tabs { display: flex; gap: 0.5rem; margin-bottom: 1.25rem; }
    .offer-tab-btn {
      flex: 1;
      display: inline-flex; align-items: center; justify-content: center; gap: 0.4rem;
      background: rgba(240,168,64,0.12); border: 1px solid rgba(240,168,64,0.45);
      border-radius: 8px; padding: 0.55rem 1.1rem;
      font-size: 0.85rem; font-weight: 700; color: var(--accent-light);
      font-family: inherit; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .offer-tab-btn:hover { background: rgba(240,168,64,0.2); border-color: rgba(240,168,64,0.7); }
    .offer-tab-btn.active {
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      border-color: transparent; color: #fff;
    }
    .tab-count { font-variant-numeric: tabular-nums; opacity: 0.85; }
    @media (max-width: 480px) {
      .offer-tab-btn { padding: 0.55rem 0.5rem; gap: 0.3rem; }
    }

    #offersPageHeader { display: flex; align-items: flex-end; justify-content: space-between; gap: 1rem; flex-wrap: wrap; }
    .history-link {
      display: inline-flex; align-items: center; gap: 0.4rem; flex-shrink: 0;
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 8px; padding: 0.55rem 0.9rem;
      color: var(--text-primary); font-size: 0.82rem; font-weight: 600;
      text-decoration: none; transition: border-color 0.15s;
    }
    .history-link:hover { border-color: rgba(192,120,40,0.5); }

    .status-wrap { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); }
    .spinner {
      width: 28px; height: 28px; border: 3px solid rgba(255,255,255,0.1);
      border-top-color: var(--accent); border-radius: 50%;
      animation: spin 0.7s linear infinite; margin: 0 auto 0.75rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .empty-state { text-align: center; padding: 3rem 1rem; color: var(--text-secondary); font-size: 0.9rem; }
    .empty-state strong { display: block; color: var(--text-primary); font-size: 1rem; margin-bottom: 0.4rem; }
    .empty-state a { color: var(--accent-light); text-decoration: underline; }
    .empty-state a:hover { opacity: 0.8; }

    /* ── Asset sort toggle (per-offer, sits under the Trade Scorecard) ── */
    .sort-controls {
      display: flex; align-items: center; gap: 0.65rem;
      padding: 0.7rem 1.25rem; border-bottom: 1px solid var(--border);
    }
    .sort-label { font-size: 0.78rem; font-weight: 600; color: var(--text-secondary); }
    .sort-btns  { display: flex; gap: 0.4rem; }
    .sort-btn {
      font-size: 0.78rem; font-weight: 700; font-family: inherit;
      padding: 0.35rem 0.9rem; border-radius: 999px;
      border: 1px solid var(--border); background: transparent; color: var(--text-secondary);
      cursor: pointer; transition: background 0.15s, border-color 0.15s, color 0.15s;
    }
    .sort-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }
    .sort-btn.active {
      background: linear-gradient(135deg, var(--accent-light), var(--accent));
      border-color: transparent; color: #fff;
    }

    .offers-list { display: flex; flex-direction: column; gap: 0.7rem; }

    /* ── Accordion item ── */
    .offer-item {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 14px; overflow: hidden; transition: border-color 0.2s;
    }
    .offer-item:hover { border-color: var(--border-hover); }
    .offer-header {
      display: flex; align-items: center;
      padding: 1rem 1.25rem; cursor: pointer; user-select: none; gap: 1rem;
    }
    .offer-chevron { width: 18px; height: 18px; flex-shrink: 0; color: var(--text-secondary); transition: transform 0.2s; }
    .offer-item.open .offer-chevron { transform: rotate(90deg); }
    .offer-from { flex: 1; min-width: 0; font-size: 0.95rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .offer-from-wallet { color: var(--accent-light); }
    .offer-invalid-tag {
      display: inline-block; margin-left: 0.5rem; font-size: 0.68rem; font-weight: 700;
      text-transform: uppercase; letter-spacing: 0.04em; color: #ef4444;
      background: rgba(239,68,68,0.12); border: 1px solid rgba(239,68,68,0.35);
      border-radius: 999px; padding: 0.12rem 0.5rem; vertical-align: middle;
    }
    .offer-invalid-banner {
      font-size: 0.82rem; color: #ef4444; background: rgba(239,68,68,0.08);
      border-bottom: 1px solid var(--border); padding: 0.65rem 1.25rem;
    }
    .offer-meta { display: flex; align-items: center; gap: 1rem; flex-shrink: 0; }
    .offer-ratio {
      flex-shrink: 0; display: grid;
      grid-template-columns: max-content 1.25rem max-content;
      align-items: center; font-size: 1rem; font-weight: 600; white-space: nowrap;
    }
    .ratio-receive { color: #4ade80; }
    .ratio-sep     { color: var(--text-secondary); font-weight: 400; text-align: center; }
    .ratio-give    { color: #fb923c; }
    .ratio-num     { display: inline-block; min-width: 2ch; font-variant-numeric: tabular-nums; text-align: right; }
    .offer-age     { flex-shrink: 0; width: 5rem; font-size: 0.75rem; color: var(--text-secondary); white-space: nowrap; text-align: right; }
    .offer-body    { display: none; border-top: 1px solid var(--border); }
    .offer-item.open .offer-body { display: block; }

    /* ── Asset score summary ──────────────────────────────────────────────
       Same format as trade-analyzer.html's Trade Scorecard: Items, then
       3 blocks (Mint Distribution / Supply / Floor Value). Mint# is never
       summed/averaged — it's highly nonlinear (a #1 or single-digit mint is
       worth far more than the number implies), so a sum/avg would let a
       pile of "okay" mints falsely outweigh (or hide) one truly special
       piece. Supply/Floor value get both a fair aggregate (avg/sum) AND a
       Lowest/Highest row, since an outlier item can otherwise hide inside
       an aggregate pulled toward the rest of the pile. ── */
    .score-summary {
      padding: 0.85rem 1.25rem; border-bottom: 1px solid var(--border);
      background: rgba(255,255,255,0.02);
    }
    .score-summary-header {
      display: flex; align-items: center; justify-content: space-between;
      cursor: pointer; user-select: none;
    }
    .score-summary-title {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.06em; color: var(--text-secondary);
    }
    .score-chevron {
      width: 14px; height: 14px; color: var(--text-secondary);
      transition: transform 0.15s; flex-shrink: 0;
    }
    .score-chevron--open { transform: rotate(90deg); }
    /* One shared grid for the whole block (column header + every row +
       block titles) — if each row were its own separate grid, column 1's
       content-driven width would be recalculated per row (a short label vs
       a long one), shifting where columns 2/3 start and breaking vertical
       alignment between rows/blocks. One grid = one set of column tracks,
       so "You receive"/"You give" line up top-to-bottom everywhere.
       inline-grid + max-content keeps the whole thing flush left instead of
       stretching to the card's full width. */
    .score-grid {
      display: inline-grid; grid-template-columns: repeat(3, max-content);
      column-gap: 2rem; row-gap: 0.35rem; align-items: start;
      margin-top: 0.55rem;
    }
    .score-col-header { font-size: 0.72rem; font-weight: 700; color: var(--text-secondary); text-align: right; }
    .score-row-label  { font-size: 0.82rem; color: var(--text-secondary); text-align: left; align-self: center; }
    .score-val {
      font-size: 0.88rem; font-weight: 700; color: var(--text-primary);
      text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap;
    }
    .score-val.score-win { color: #4ade80; }
    /* Explicit class (not :first-of-type/nth-child) — in a shared grid with
       full-width block titles/captions interspersed between rows, structural
       selectors can't reliably tell "You receive"'s column from "You give"'s. */
    .score-col-receive { background: rgba(74,222,128,0.08); border-radius: 5px; padding: 0.08rem 0.4rem; }
    .score-null    { color: var(--text-secondary); font-weight: 400; }
    .score-partial { font-size: 0.7rem; font-weight: 400; color: var(--text-secondary); margin-left: 0.3rem; }
    .score-usd     { font-size: 0.72rem; font-weight: 400; color: var(--text-secondary); margin-top: 1px; }
    .score-caption {
      grid-column: 1 / -1;
      font-size: 0.72rem; color: var(--text-secondary); text-align: right;
      margin-top: -0.1rem;
    }
    .score-adv-you  { color: #4ade80; font-weight: 700; }
    .score-adv-them { color: #fb923c; font-weight: 700; }
    .score-block-title {
      grid-column: 1 / -1;
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.05em; color: var(--text-secondary);
      margin-top: 0.35rem; padding-top: 0.55rem; border-top: 1px solid var(--border);
    }

    /* ── Two-column sides ── */
    .offer-sides { display: grid; grid-template-columns: 1fr 1fr; column-gap: 1.5rem; border-bottom: 1px solid var(--border); }
    .offer-side-label {
      font-size: 0.68rem; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.08em; color: #4ade80;
      padding: 0.55rem 1rem 0.4rem; border-bottom: 1px solid rgba(255,255,255,0.04);
    }
    .offer-side-label.label-give { color: #fb923c; }

    /* ── Asset cards ── */
    .asset-cards { display: flex; flex-direction: column; background: var(--bg); }
    .asset-card {
      display: grid; grid-template-columns: 3fr 1.5fr 5.5rem 4rem;
      grid-template-rows: auto auto; column-gap: 1.25rem; row-gap: 0.2rem;
      padding: 0.6rem 1rem; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .asset-card:last-child { border-bottom: none; }
    .asset-card:nth-child(even) { background: rgba(255,255,255,0.04); }
    .ac-name       { grid-column: 1; grid-row: 1; font-size: 0.88rem; font-weight: 600; }
    .ac-rarity-id  { grid-column: 1; grid-row: 2; display: flex; align-items: center; gap: 0.4rem; white-space: nowrap; }
    .ac-collection { grid-column: 2; grid-row: 1; font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
    .ac-series     { grid-column: 2; grid-row: 2; font-size: 0.67rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--accent); }
    .ac-supply     { grid-column: 3; grid-row: 1 / 3; align-self: center; text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
    .ac-supply-main { font-size: 0.85rem; font-weight: 600; color: var(--text-primary); }
    .ac-supply-of   { font-size: 0.8rem; color: var(--text-secondary); }
    .ac-supply-null { color: var(--text-secondary); }
    .ac-mint       { grid-column: 4; grid-row: 1 / 3; align-self: center; text-align: right; white-space: nowrap; font-variant-numeric: tabular-nums; }
    .ac-mint-trade { font-size: 0.85rem; font-weight: 700; color: var(--text-primary); }
    .ac-mint-trade.ac-mint-warn { color: #ef4444; }
    .ac-mint-low   { font-size: 0.8rem; color: var(--text-secondary); margin-top: 1px; }
    .asset-header {
      display: grid; grid-template-columns: 3fr 1.5fr 5.5rem 4rem;
      column-gap: 1.25rem; padding: 0.4rem 1rem;
      border-bottom: 1px solid var(--border); background: rgba(255,255,255,0.025);
    }
    .asset-header span { font-size: 0.67rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-secondary); }
    .asset-header span:nth-child(3),
    .asset-header span:nth-child(4) { text-align: right; }
    .asset-header span:nth-child(4) { font-weight: 700; color: var(--text-primary); }
    .asset-empty { padding: 0.75rem 1rem; font-size: 0.82rem; color: var(--text-secondary); }

    /* ── Offer actions ── */
    .offer-actions {
      display: flex; align-items: center; justify-content: flex-end;
      gap: 0.65rem; padding: 1.25rem 1.25rem 0.85rem;
      border-top: 1px solid var(--border); margin-top: 0.25rem;
    }
    .offer-memo {
      flex: 1; align-self: center; display: flex; align-items: center;
      font-size: 0.78rem; color: var(--text-secondary);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      padding-right: 0.5rem; line-height: 1.2;
    }
    .offer-memo span { color: var(--text-primary); }
    .offer-btn {
      font-size: 0.82rem; font-weight: 700; padding: 0.5rem 1.25rem;
      border-radius: 8px; border: 1px solid transparent; cursor: pointer;
      transition: background 0.15s, border-color 0.15s, opacity 0.15s; white-space: nowrap;
    }
    .offer-btn:disabled { opacity: 0.4; cursor: not-allowed; }
    .offer-btn--accept  { background: rgba(74,222,128,0.1); border-color: rgba(74,222,128,0.4); color: #4ade80; }
    .offer-btn--accept:not(:disabled):hover { background: rgba(74,222,128,0.2); border-color: #4ade80; }
    .offer-btn--decline { background: rgba(224,82,82,0.08); border-color: rgba(224,82,82,0.3); color: #e05252; }
    .offer-btn--decline:not(:disabled):hover { background: rgba(224,82,82,0.18); border-color: #e05252; }
    .offer-btn--done { background: rgba(100,100,100,0.1); border-color: rgba(255,255,255,0.12); color: var(--text-secondary); cursor: default !important; }

    /* ── Responsive ── */
    @media (max-width: 700px) {
      .page-main { padding: 1.25rem 0.75rem 3rem; }
      .offer-sides { grid-template-columns: 1fr; }
      .offer-side + .offer-side { border-top: 1px solid var(--border); }
      /* Sender name gets its own full-width row — sharing one line with the
         fixed-width ratio/age stats left it squeezed down to a couple of
         characters (e.g. "Offer f..."). Wrapping .offer-meta as a whole
         onto row 2 keeps Receiving/Giving and the age together, spread
         apart with space-between. */
      .offer-header { flex-wrap: wrap; gap: 0.35rem 1rem; }
      .offer-from  { flex-basis: calc(100% - 18px - 1rem); white-space: normal; }
      .offer-meta  { flex-basis: 100%; justify-content: space-between; padding-left: calc(18px + 1rem); box-sizing: border-box; }
      .offer-ratio { width: auto; }
      .offer-age   { width: auto; }
    }
  </style>
  <script defer src="/_vercel/insights/script.js"></script>
  <script defer src="/_vercel/speed-insights/script.js"></script>
  <script src="shared/supabase-config.js"></script>
  <script src="shared/wax-api.js"></script>
  <script src="shared/wallet-widget.js"></script>
  <script src="shared/wallet-menu.js"></script>
</head>
<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index" class="nav-home" title="Back to homepage">
      <img src="images/Hoardio_fav.png" alt="Hoardio" />
    </a>
    <span class="nav-divider"></span>
    <div class="nav-links"></div>
  </div>
</nav>
<script src="shared/generic-nav.js"></script>

<main class="page-main">
  <div class="page-header" id="offersPageHeader">
    <div>
      <h1 class="page-title">Trade <span class="accent">Offers</span></h1>
      <p class="page-desc" id="pageDesc">Review and respond to pending offers sent to your WAX wallet.</p>
    </div>
    <a href="trade-history" class="history-link">🕘 Trade History</a>
  </div>

  <div class="offer-tabs" id="offerTabs">
    <button type="button" class="offer-tab-btn active" data-tab="received">📥 Received<span class="tab-count" id="tabCountReceived"></span></button>
    <button type="button" class="offer-tab-btn" data-tab="sent">📤 Sent<span class="tab-count" id="tabCountSent"></span></button>
  </div>

  <div id="authGate" class="auth-gate" style="display:none;">
    <p class="auth-gate-title">Wallet not connected</p>
    <p class="auth-gate-hint">Connect your WAX wallet using the button in the navigation bar to see your pending trade offers.</p>
  </div>

  <div id="loadWrap" class="status-wrap" style="display:none;">
    <div class="spinner"></div>
    <div>Loading trade offers…</div>
  </div>

  <div id="emptyWrap" class="empty-state" style="display:none;">
    <strong>No pending offers</strong>
  </div>

  <div id="offersList" class="offers-list" style="display:none;"></div>
</main>

<script>
'use strict';

/* ── Nav auth ──────────────────────────────────────────────────────────────── */
const _wallet = WalletWidget.mount(document.querySelector('.nav-inner'), {
  authScript: 'shared/wax-auth.js',
  menuItems: walletMenuItems(),
});
window.addEventListener('wax-auth-change', onWalletChange);

/* ── Tabs ──────────────────────────────────────────────────────────────────── */
let _tab = 'received';
const TAB_DESC = {
  received: 'Review and respond to pending offers sent to your WAX wallet.',
  sent:     "Review and cancel trade offers you've sent to other wallets, still awaiting a response.",
};
function setActiveTab(tab) {
  _tab = tab === 'sent' ? 'sent' : 'received';
  document.querySelectorAll('.offer-tab-btn').forEach(btn => btn.classList.toggle('active', btn.dataset.tab === _tab));
  document.getElementById('pageDesc').textContent = TAB_DESC[_tab];
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (wallet && API_BASE) loadOffers();
}
document.querySelectorAll('.offer-tab-btn').forEach(btn => {
  btn.addEventListener('click', () => setActiveTab(btn.dataset.tab));
});

// Tab button counts — omitted entirely at 0 (the empty state already says so
// on-screen, a "(0)" next to it would be redundant). Shows "100+" instead of
// "100" when a count hits OFFERS_LIMIT, since that's a page cap, not a real total.
const TAB_COUNT_EL = { received: document.getElementById('tabCountReceived'), sent: document.getElementById('tabCountSent') };
let _counts = { received: null, sent: null };
function setTabCount(tab, n) {
  _counts[tab] = n;
  const el = TAB_COUNT_EL[tab];
  if (!el) return;
  el.textContent = n ? ` (${n === OFFERS_LIMIT ? n + '+' : n})` : '';
}

/* ── Data ──────────────────────────────────────────────────────────────────── */
let FUNKO_RARITY_ORDER = [];
let FUNKO_DROP_ORDER   = new Map();
let FUNKO_DROP_DISPLAY = new Map();
let FUNKO_COLLECTIONS  = new Set();

let TOPPS_RARITY_ORDER = {};
let TOPPS_DROP_ORDER   = new Map();
let TOPPS_DROP_DISPLAY = new Map();
let TOPPS_COLLECTIONS  = new Set();

let API_BASE = '';

async function loadAllData() {
  const [funkoDCRes, toppsDCRes, funkoSORes, toppsSORes] = await Promise.allSettled([
    fetch('funko/data/drops_catalog.json').then(r => r.ok ? r.json() : []),
    fetch('topps/data/drops_catalog.json').then(r => r.ok ? r.json() : []),
    fetch('funko/data/sort_order.json').then(r => r.ok ? r.json() : {}),
    fetch('topps/data/sort_order.json').then(r => r.ok ? r.json() : {}),
  ]);

  if (funkoDCRes.status === 'fulfilled') {
    (funkoDCRes.value || []).forEach((d, i) => {
      const key = `${d.collection}|${d.schema}`;
      FUNKO_DROP_ORDER.set(key, i);
      FUNKO_DROP_DISPLAY.set(key, d.displayname || d.collection);
      FUNKO_COLLECTIONS.add(d.collection);
    });
  }
  if (toppsDCRes.status === 'fulfilled') {
    (toppsDCRes.value || []).forEach((d, i) => {
      const key = `${d.collection}|${d.schema}`;
      TOPPS_DROP_ORDER.set(key, i);
      TOPPS_DROP_DISPLAY.set(key, d.displayname || d.collection);
      TOPPS_COLLECTIONS.add(d.collection);
    });
  }
  if (funkoSORes.status === 'fulfilled') {
    FUNKO_RARITY_ORDER = ((funkoSORes.value || {}).rarity || []).map(r => r.toLowerCase());
  }
  if (toppsSORes.status === 'fulfilled') {
    for (const [schema, data] of Object.entries(toppsSORes.value || {})) {
      TOPPS_RARITY_ORDER[schema] = (data.rarity || []).map(r => r.toLowerCase());
    }
  }
  API_BASE = WaxApi.aaBase();
}

/* ── Classification ────────────────────────────────────────────────────────── */
function assetProject(asset) {
  const col = asset.collection?.collection_name || '';
  if (FUNKO_COLLECTIONS.has(col)) return 'funko';
  if (TOPPS_COLLECTIONS.has(col)) return 'topps';
  return 'unknown';
}

function classifyOffer(offer) {
  const allAssets = [...(offer.sender_assets || []), ...(offer.recipient_assets || [])];
  const projects = new Set(allAssets.map(assetProject));
  if (projects.has('unknown')) return 'unknown';
  if (projects.has('funko') && projects.has('topps')) return 'mixed';
  if (projects.has('funko')) return 'funko';
  if (projects.has('topps')) return 'topps';
  return 'unknown';
}

/* ── Supabase ──────────────────────────────────────────────────────────────── */
function sbHeaders(profile) {
  return { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Accept-Profile': profile };
}

async function fetchTemplateRows(profile, tids) {
  if (!tids.length) return [];
  try {
    const url = SUPABASE_URL + '/rest/v1/templates?select=template_id,cardid,in_circulation,issued_supply&template_id=in.(' + tids.join(',') + ')';
    const res = await fetch(url, { headers: sbHeaders(profile) });
    return res.ok ? res.json() : [];
  } catch { return []; }
}

async function fetchFunkoDropNames(allAssets) {
  const drops = new Map();
  for (const a of allAssets) {
    if (assetProject(a) !== 'funko') continue;
    const col = a.collection?.collection_name || '', sch = a.schema?.schema_name || '';
    if (col && sch) drops.set(`${col}|${sch}`, { col, sch });
  }
  if (!drops.size) return new Map();
  const pages = await Promise.all([...drops.values()].map(async ({ col, sch }) => {
    try {
      const url = SUPABASE_URL + '/rest/v1/funko_set_prices?select=collection_name,schema_name,drop_displayname'
        + '&collection_name=eq.' + encodeURIComponent(col)
        + '&schema_name=eq.' + encodeURIComponent(sch) + '&limit=1';
      const res = await fetch(url, { headers: sbHeaders('funko') });
      return res.ok ? res.json() : [];
    } catch { return []; }
  }));
  const setMap = new Map();
  for (const rows of pages) for (const r of rows) setMap.set(r.collection_name + '|' + r.schema_name, r.drop_displayname);
  const map = new Map();
  for (const a of allAssets) {
    if (assetProject(a) !== 'funko') continue;
    const col = a.collection?.collection_name || '', sch = a.schema?.schema_name || '';
    const tid = String(a.template?.template_id || '');
    if (tid) map.set(tid, setMap.get(`${col}|${sch}`) || null);
  }
  return map;
}

async function fetchTemplateData(offers) {
  const allAssets = offers.flatMap(o => [...(o.sender_assets || []), ...(o.recipient_assets || [])]);

  const funkoTids = [...new Set(
    allAssets.filter(a => assetProject(a) === 'funko')
      .map(a => String(a.template?.template_id || '')).filter(Boolean)
  )];
  const toppsTids = [...new Set(
    allAssets.filter(a => assetProject(a) === 'topps')
      .map(a => String(a.template?.template_id || '')).filter(Boolean)
  )];

  const [funkoRows, toppsRows, funkoDropNames, floorMap] = await Promise.all([
    fetchTemplateRows('funko', funkoTids),
    fetchTemplateRows('topps', toppsTids),
    fetchFunkoDropNames(allAssets),
    fetchFloorPrices(allAssets),
  ]);

  const tplMap = new Map();
  for (const r of funkoRows) {
    const tid = String(r.template_id);
    tplMap.set(tid, { circ: r.in_circulation ?? null, issued: r.issued_supply ?? null, cardId: r.cardid ?? null, dropDisplay: funkoDropNames.get(tid) ?? null, floor: floorMap.get(tid) ?? null });
  }
  for (const r of toppsRows) {
    const tid = String(r.template_id);
    tplMap.set(tid, { circ: r.in_circulation ?? null, issued: r.issued_supply ?? null, cardId: r.cardid ?? null, dropDisplay: null, floor: floorMap.get(tid) ?? null });
  }
  // Unknown-project assets never get a curated templates-catalog row, but
  // they can still have a live floor price — give them a floor-only entry.
  for (const [tid, price] of floorMap) {
    if (!tplMap.has(tid)) tplMap.set(tid, { circ: null, issued: null, cardId: null, dropDisplay: null, floor: price });
  }
  return tplMap;
}

/* ── Floor prices (live, AtomicMarket) ────────────────────────────────────────
   Deliberately not sourced from funko_market_prices — that table can lag —
   so every project (Funko included) gets its floor from the lowest active
   AtomicMarket listing, fetched at load time. Calls are batched (not all in
   parallel) because atomicmarket is only reliably hosted on one node and
   doesn't rotate — same conservative pattern as inventory-bulk.html's
   fetchFloorPrice/loadFloorPricesForCards. */
async function fetchChainFloorPrice(templateId, collection) {
  try {
    const url = `${WaxApi.marketBase()}/sales?state=1&template_id=${encodeURIComponent(templateId)}&collection_name=${encodeURIComponent(collection)}&symbol=WAX&min_assets=1&max_assets=1&sort=price&order=asc&limit=1`;
    const data = await WaxApi.apiFetch(url);
    if (!data || !data.length) return null;
    const sale      = data[0];
    const precision = sale.price?.token_precision ?? sale.token?.token_precision ?? 8;
    const rawPrice  = sale.price?.amount ?? sale.listing_price;
    return rawPrice != null ? Number(rawPrice) / Math.pow(10, precision) : null;
  } catch { return null; }
}

async function fetchFloorPrices(allAssets) {
  const todo = new Map(); // template_id -> collection_name
  for (const a of allAssets) {
    const tid = String(a.template?.template_id || '');
    const col = a.collection?.collection_name || '';
    if (tid && !todo.has(tid)) todo.set(tid, col);
  }
  const entries = [...todo.entries()];
  const out = new Map();
  const BATCH = 3;
  for (let i = 0; i < entries.length; i += BATCH) {
    const chunk  = entries.slice(i, i + BATCH);
    const prices = await Promise.all(chunk.map(([tid, col]) => fetchChainFloorPrice(tid, col)));
    chunk.forEach(([tid], j) => out.set(tid, prices[j]));
  }
  return out;
}

/* ── Sorting ───────────────────────────────────────────────────────────────── */
function rarityRank(r, project, schemaKey) {
  if (project === 'funko') {
    const idx = FUNKO_RARITY_ORDER.indexOf((r || '').toLowerCase());
    return idx === -1 ? 999 : idx;
  }
  if (project === 'topps') {
    const order = TOPPS_RARITY_ORDER[schemaKey] || Object.values(TOPPS_RARITY_ORDER)[0] || [];
    const idx = order.indexOf((r || '').toLowerCase());
    return idx === -1 ? 999 : idx;
  }
  return 999; // generic collection — no curated rarity order to rank by
}

// Project is resolved per-asset (not once for the whole array) — an offer
// can freely mix Funko/Topps/generic assets on one side now that unknown
// collections render instead of being blocked, so a single blanket project
// no longer holds for the whole side.
// 'rarity' (default) — curated rarity order, then curated drop/set order as a
// tiebreaker. 'mint' — ascending trade mint #, so the most desirable (lowest)
// mints float to the top of each side for a quick side-by-side comparison.
// Each offer has its own independent mode (see _sortModeByOffer) — the
// per-offer sort-btn controls under that offer's Trade Scorecard only affect
// that one card.
function sortAssets(assets, mode) {
  if (mode === 'mint') {
    return [...assets].sort((a, b) => {
      const ma = a.template_mint != null ? Number(a.template_mint) : Infinity;
      const mb = b.template_mint != null ? Number(b.template_mint) : Infinity;
      return ma - mb;
    });
  }
  return [...assets].sort((a, b) => {
    const pa = assetProject(a), pb = assetProject(b);
    const schA = (a.schema?.schema_name || '').replace('.drop', '');
    const schB = (b.schema?.schema_name || '').replace('.drop', '');
    const ra = rarityRank(a.template?.immutable_data?.rarity, pa, schA);
    const rb = rarityRank(b.template?.immutable_data?.rarity, pb, schB);
    if (ra !== rb) return ra - rb;
    const dropOrderMapA = pa === 'funko' ? FUNKO_DROP_ORDER : pa === 'topps' ? TOPPS_DROP_ORDER : null;
    const dropOrderMapB = pb === 'funko' ? FUNKO_DROP_ORDER : pb === 'topps' ? TOPPS_DROP_ORDER : null;
    const ka = `${a.collection?.collection_name || ''}|${a.schema?.schema_name || ''}`;
    const kb = `${b.collection?.collection_name || ''}|${b.schema?.schema_name || ''}`;
    return (dropOrderMapA?.get(ka) ?? 9999) - (dropOrderMapB?.get(kb) ?? 9999);
  });
}

/* ── Helpers ───────────────────────────────────────────────────────────────── */
function rarityClass(r) { return 'rarity-' + (r || 'common').toLowerCase().replace(/[^a-z0-9]/g, ''); }

function schemaLabel(sn) {
  const b = (sn || '').replace('.drop', '');
  const m = b.match(/^series(\d+)$/);
  return m ? 'Series ' + m[1] : b.charAt(0).toUpperCase() + b.slice(1);
}

function cleanFunkoName(s) {
  return (s || '')
    .replace(/^Funko Presents\s+/i, '')
    .replace(/:\s*Funko Digital Pop!$/i, '')
    .replace(/\s+[Xx]\s+Funko$/i, '')
    .replace(/:\s*Funko Digital$/i, '')
    .replace(/\s+x\s+Funko Digital Pop!$/i, '');
}

function relativeTime(ms) {
  const diff = Date.now() - Number(ms), s = Math.floor(diff / 1000);
  if (s < 60)  return 'just now';
  const m = Math.floor(s / 60); if (m < 60) return `${m}m ago`;
  const h = Math.floor(m / 60); if (h < 24) return `${h}h ago`;
  return `${Math.floor(h / 24)}d ago`;
}

function escHtml(s) { return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ── Lowest mints ──────────────────────────────────────────────────────────── */
async function fetchLowestMints(wallet, templateIds) {
  if (!templateIds.length || !wallet) return new Map();
  const entries = await Promise.all([...new Set(templateIds)].map(async tid => {
    try {
      const url = `${WaxApi.aaBase()}/assets?owner=${encodeURIComponent(wallet)}&template_id=${encodeURIComponent(tid)}&sort=template_mint&order=asc&limit=1`;
      const res = await WaxApi.rawFetch(url);
      if (!res.ok) return null;
      const json = await res.json();
      const mint = json.data?.[0]?.template_mint;
      return mint != null ? [tid, Number(mint)] : null;
    } catch { return null; }
  }));
  return new Map(entries.filter(Boolean));
}

/* ── Asset score summary ──────────────────────────────────────────────────
   Same format as trade-analyzer.html's Trade Scorecard (see project memory
   project_trade_scorecard.md for the full rationale). Key points:
   - Mint# is never summed/averaged — collector value on mint# is highly
     nonlinear (a #1 or single-digit mint is worth far more than the number
     implies), so instead: Lowest Mint # (best single piece) + a bucket
     distribution (1–9/10–25/26–99/100+, plain counts, no forced winner).
   - Supply gets an average (fair, roughly linear, pile-size-normalized)
     PLUS a Lowest Supply row, since one rare item can hide inside an
     average pulled toward more-common filler items.
   - Floor value gets a sum (genuinely additive $ value) PLUS a Highest
     Value row, so one expensive item can't hide among cheap ones.
   - Each side is the pile that side is GIVING away (what you receive is the
     counterparty's given pile, and vice versa) — so the winner of a row is
     whoever is giving up the less desirable pile: for Mint#/Supply a HIGHER
     value means more common/less prized (giving more of that is the win),
     for Floor value a LOWER value means less $ given away (that's the win)
     — opposite directions, not a mistake. ────────────────────────────── */
function computeAssetScore(assets, tplMap) {
  let mintMin = null, mintN = 0;
  const buckets = { b1_9: 0, b10_25: 0, b26_99: 0, b100p: 0 };
  let supplySum = 0, supplyMin = null, supplyN = 0;
  let floorSum = 0, floorMax = null, floorN = 0;

  for (const a of assets || []) {
    const tid  = String(a.template?.template_id || '');
    const tpl  = tplMap?.get(tid) ?? {};
    const mint = a.template_mint != null ? Number(a.template_mint) : null;
    if (mint != null) {
      mintN++;
      if (mintMin == null || mint < mintMin) mintMin = mint;
      if (mint <= 9)        buckets.b1_9++;
      else if (mint <= 25)  buckets.b10_25++;
      else if (mint <= 99)  buckets.b26_99++;
      else                  buckets.b100p++;
    }

    const circ    = tpl.circ ?? null;
    const issued  = tpl.issued ?? (a.template?.issued_supply != null ? Number(a.template.issued_supply) : null);
    const supply  = circ ?? issued;
    if (supply != null) {
      supplySum += Number(supply); supplyN++;
      if (supplyMin == null || supply < supplyMin) supplyMin = Number(supply);
    }

    const floor = tpl.floor ?? null;
    if (floor != null) {
      floorSum += Number(floor); floorN++;
      if (floorMax == null || floor > floorMax) floorMax = Number(floor);
    }
  }

  return {
    itemCount: (assets || []).length,
    mintMin, mintN,
    buckets,
    supplyAvg: supplyN ? supplySum / supplyN : null, supplyMin, supplyN,
    floorSum, floorMax, floorN,
  };
}

function fmtScoreInt(v)     { return Math.round(v).toLocaleString(); }
function fmtScoreMint(v)    { return '#' + Math.round(v).toLocaleString(); }
function fmtScoreWax(v)     { return (v < 1 ? v.toFixed(4) : v.toFixed(2)) + ' WAX'; }
function fmtScoreDiffInt(v) { return Math.round(v).toLocaleString(); }
function fmtScoreDiffWax(v) { return (Math.abs(v) < 1 ? v.toFixed(4) : v.toFixed(2)) + ' WAX'; }

function fmtUsd(v) { return '$' + v.toFixed(2); }
function fmtUsdSigned(v) {
  const sign = v > 0 ? '+' : (v < 0 ? '-' : '');
  return sign + '$' + Math.abs(v).toFixed(2);
}

// Best-effort live spot rate, fetched once at page load (fire-and-forget, see
// init()) — same CoinGecko source funko/market-overview.html uses. If it
// hasn't resolved (or failed) by the time a card renders, the USD subtext is
// just omitted rather than blocking the WAX values on it.
let _waxUsdRate = null;
async function fetchWaxUsdRate() {
  try {
    const r = await fetch('https://api.coingecko.com/api/v3/simple/price?ids=wax&vs_currencies=usd');
    if (!r.ok) return;
    const j = await r.json();
    _waxUsdRate = j?.wax?.usd ?? null;
  } catch { /* non-fatal */ }
}

function scoreCell(val, n, total, fmt, usd) {
  if (n === 0) return '<span class="score-null">—</span>';
  const partial = n < total ? `<span class="score-partial">(${n}/${total})</span>` : '';
  const usdHtml = usd != null ? `<div class="score-usd">≈ ${fmtUsd(usd)}</div>` : '';
  return `<div class="score-val-main">${fmt(val)}${partial}</div>${usdHtml}`;
}

// A single 3-column stat row: label | You receive | You give. These 3
// elements are placed directly into the shared .score-grid (not wrapped in
// their own row container) so every row shares the same column tracks —
// see the .score-grid comment in the CSS for why that matters.
//
// `winner` drives the CAPTION's "Advantage:" text (who benefits strategically —
// see scoreCompareRow), but the green highlight here intentionally marks
// the OPPOSITE cell. Reason: winner='rec' means the counterparty's given
// pile scored favorably *for them to give away* — under the give-less-value-
// wins model that means it's numerically the LESS impressive raw stat (e.g.
// a higher/more common mint#). Highlighting that cell green, under a "You
// receive" label, reads as backwards. Green here instead marks whichever
// raw number is the objectively better collectible stat (lower mint#,
// lower supply, higher $) — which is always the cell winner='rec'/'give'
// did NOT flag, since "better to give away" and "better stat" are opposites
// by construction.
function scoreRow(label, recHtml, giveHtml, winner) {
  return `
      <div class="score-row-label">${label}</div>
      <div class="score-val score-col-receive${winner === 'give' ? ' score-win' : ''}">${recHtml}</div>
      <div class="score-val${winner === 'rec' ? ' score-win' : ''}">${giveHtml}</div>`;
}

function scoreBlockTitle(title) {
  return `<div class="score-block-title">${title}</div>`;
}

function scoreCompareRow(label, recVal, recN, recTotal, giveVal, giveN, giveTotal, fmt, diffFmt, higherIsBetter, counterparty, usdEligible) {
  let winner = null;
  if (recN && giveN && recVal !== giveVal) {
    winner = (higherIsBetter ? recVal > giveVal : recVal < giveVal) ? 'rec' : 'give';
  }

  const isWax  = usdEligible && _waxUsdRate != null;
  const recUsd  = isWax && recN  ? recVal  * _waxUsdRate : null;
  const giveUsd = isWax && giveN ? giveVal * _waxUsdRate : null;

  const rowHtml = scoreRow(label, scoreCell(recVal, recN, recTotal, fmt, recUsd), scoreCell(giveVal, giveN, giveTotal, fmt, giveUsd), winner);

  // Caption only renders once both sides actually have a comparable value —
  // no need to clutter a still-loading row with a dash where the numbers
  // themselves already show "—".
  if (!recN || !giveN) return rowHtml;
  const diff    = recVal - giveVal;
  const sign    = diff > 0 ? '+' : '';
  const diffUsd = isWax ? ` (≈ ${fmtUsdSigned(diff * _waxUsdRate)})` : '';
  // "rec" (You receive) is what the COUNTERPARTY is giving away, and "give"
  // (You give) is what YOU'RE giving away — so a "rec"-side win (their given
  // pile scores as the favorable-to-its-giver value) means THEY benefit, and
  // a "give"-side win means YOU do. This is the opposite of a direct
  // rec→You/give→them mapping, which would attribute your own advantage to
  // your counterparty. counterparty arrives already HTML-escaped (see
  // buildOfferItem) — don't escape it again here.
  const captionHtml = winner
    ? `${sign}${diffFmt(diff)}${diffUsd} · Advantage: <span class="${winner === 'give' ? 'score-adv-you' : 'score-adv-them'}">${winner === 'give' ? 'You' : counterparty}</span>`
    : 'Tied';
  return rowHtml + `<div class="score-caption">${captionHtml}</div>`;
}

// Per-offer collapse state, keyed by offer_id — mirrors _sortModeByOffer,
// so collapsing one card's scorecard doesn't affect any other open offer.
// Click wiring lives in buildOfferItem (addEventListener over the offerId
// closure, not an inline onclick="...(${offerId})" string) — offer_id can
// be a number, and string-interpolating it into an attribute then reading
// it back would look it up under a different Map key type than it was set
// with, same reasoning as _sortModeByOffer's wiring.
const _scoreCollapsedByOffer = new Map();

function scoreSummaryHeaderHtml(collapsed) {
  return `<div class="score-summary-header">
    <span class="score-summary-title">Trade Scorecard</span>
    <svg class="score-chevron${collapsed ? '' : ' score-chevron--open'}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
  </div>`;
}

function buildScoreSummaryHtml(receiveAssets, giveAssets, tplMap, counterparty, offerId) {
  const collapsed = !!_scoreCollapsedByOffer.get(offerId);
  if (collapsed) {
    return `<div class="score-summary">${scoreSummaryHeaderHtml(true)}</div>`;
  }

  const rec  = computeAssetScore(receiveAssets, tplMap);
  const give = computeAssetScore(giveAssets, tplMap);
  return `<div class="score-summary">
    ${scoreSummaryHeaderHtml(false)}
    <div class="score-grid">
      <div></div>
      <div class="score-col-header">You receive</div>
      <div class="score-col-header">You give</div>

      ${scoreRow('Items', rec.itemCount, give.itemCount, null)}

      ${scoreBlockTitle('Mint Distribution')}
      ${scoreCompareRow('Lowest Mint #', rec.mintMin, rec.mintN, rec.itemCount, give.mintMin, give.mintN, give.itemCount, fmtScoreMint, fmtScoreDiffInt, true, counterparty, false)}
      ${scoreRow('1–9',   rec.buckets.b1_9,   give.buckets.b1_9,   null)}
      ${scoreRow('10–25', rec.buckets.b10_25, give.buckets.b10_25, null)}
      ${scoreRow('26–99', rec.buckets.b26_99, give.buckets.b26_99, null)}
      ${scoreRow('100+',  rec.buckets.b100p,  give.buckets.b100p,  null)}

      ${scoreBlockTitle('Supply')}
      ${scoreCompareRow('Avg Supply',    rec.supplyAvg, rec.supplyN, rec.itemCount, give.supplyAvg, give.supplyN, give.itemCount, fmtScoreInt, fmtScoreDiffInt, true, counterparty, false)}
      ${scoreCompareRow('Lowest Supply', rec.supplyMin, rec.supplyN, rec.itemCount, give.supplyMin, give.supplyN, give.itemCount, fmtScoreInt, fmtScoreDiffInt, true, counterparty, false)}

      ${scoreBlockTitle('Floor Value')}
      ${scoreCompareRow('Σ Floor value', rec.floorSum, rec.floorN, rec.itemCount, give.floorSum, give.floorN, give.itemCount, fmtScoreWax, fmtScoreDiffWax, false, counterparty, true)}
      ${scoreCompareRow('Highest Value', rec.floorMax, rec.floorN, rec.itemCount, give.floorMax, give.floorN, give.itemCount, fmtScoreWax, fmtScoreDiffWax, false, counterparty, true)}
    </div>
  </div>`;
}

/* ── Asset card rendering ──────────────────────────────────────────────────── */
// `side` is my perspective on this batch of assets ('receiving' or 'giving'),
// not the raw sender_assets/recipient_assets field it came from — those two
// only line up with my perspective on the Received tab; on Sent they're
// swapped (see buildOfferItem), so the warn logic below has to key off
// perspective, not the JSON field name.
function buildAssetCards(assets, tplMap, lowestMints, side, sortMode) {
  if (!assets || assets.length === 0) return '<div class="asset-empty">No assets</div>';
  return sortAssets(assets, sortMode).map(asset => {
    const project = assetProject(asset);
    const data    = asset.template?.immutable_data ?? {};
    const rarity  = data.rarity || '';
    const name    = escHtml(asset.name || data.name || '—');
    const tid     = String(asset.template?.template_id || '');
    const tpl     = tplMap?.get(tid) ?? {};
    const col     = asset.collection?.collection_name || '';
    const sch     = asset.schema?.schema_name || '';

    const tradeMint  = asset.template_mint ? Number(asset.template_mint) : null;
    const lowestMint = lowestMints?.get(tid) ?? null;
    const warn = tradeMint != null && lowestMint != null && (
      side === 'receiving' ? tradeMint >= lowestMint :
      side === 'giving'    ? tradeMint === lowestMint : false
    );
    const mintHtml = tradeMint != null
      ? `<div class="ac-mint-trade${warn?' ac-mint-warn':''}">#${tradeMint.toLocaleString()}</div>`
        + `<div class="ac-mint-low">${lowestMint != null ? '#'+lowestMint.toLocaleString() : '—'}</div>`
      : '—';

    const cardId  = tpl.cardId != null ? tpl.cardId : null;
    const nameStr = cardId != null ? `${cardId} — ${name}` : name;

    let dropDisplay;
    if (project === 'funko') {
      dropDisplay = escHtml(cleanFunkoName(tpl.dropDisplay || asset.collection?.name || ''));
    } else if (project === 'topps') {
      dropDisplay = escHtml(tpl.dropDisplay || TOPPS_DROP_DISPLAY.get(`${col}|${sch}`) || asset.collection?.name || '');
    } else {
      // Generic collection — no curated drop-name catalog, so just show
      // whatever AtomicAssets itself calls the collection.
      dropDisplay = escHtml(asset.collection?.name || col || '');
    }
    const schema = escHtml(schemaLabel(sch));

    const circNum    = tpl.circ   ?? null;
    const issuedNum  = tpl.issued ?? (asset.template?.issued_supply != null ? Number(asset.template.issued_supply) : null);
    const displayNum = circNum ?? issuedNum;
    const showOf     = circNum != null && issuedNum != null && circNum < issuedNum;
    const supplyHtml = displayNum != null
      ? `<div class="ac-supply-main">${Number(displayNum).toLocaleString()}</div>`
        + (showOf ? `<div class="ac-supply-of">of ${Number(issuedNum).toLocaleString()}</div>` : '')
      : '<span class="ac-supply-null">—</span>';

    return `<div class="asset-card">
      <div class="ac-name">${nameStr}</div>
      <div class="ac-rarity-id"><span class="rarity-pill ${rarityClass(rarity)}">${escHtml(rarity)||'—'}</span></div>
      <div class="ac-collection">${dropDisplay||'—'}</div>
      <div class="ac-series">${schema||'—'}</div>
      <div class="ac-supply">${supplyHtml}</div>
      <div class="ac-mint">${mintHtml}</div>
    </div>`;
  }).join('');
}

/* ── Offer item ────────────────────────────────────────────────────────────── */
// `direction` is 'received' or 'sent' (the active tab). sender_assets/
// recipient_assets only map to "what I receive"/"what I give" when I'm the
// offer's recipient (Received tab) — on Sent I'm the offer's sender, so
// those two are swapped for display purposes.
function buildOfferItem(offer, tplMap, lowestMints, type, direction) {
  const offerId      = offer.offer_id;
  const isSent       = direction === 'sent';
  const counterparty = escHtml(isSent ? offer.recipient_name : offer.sender_name);
  const memo         = offer.memo || '';
  const age          = relativeTime(offer.created_at_time);

  const receiveAssets = isSent ? offer.recipient_assets : offer.sender_assets;
  const giveAssets    = isSent ? offer.sender_assets    : offer.recipient_assets;
  const receiveN      = receiveAssets?.length ?? 0;
  const giveN         = giveAssets?.length ?? 0;

  // state 1 = INVALID — an asset in the offer was transferred/burned elsewhere
  // since it was made, so it can no longer be accepted on-chain. Still fully
  // cancellable/declinable (that's the point of showing it), just not acceptable.
  const isInvalid = offer.state === 1;

  // Every offer gets full asset details now — Funko/Topps assets get their
  // curated drop names/rarity order/circulating supply from Supabase (see
  // fetchTemplateData), anything else falls back to whatever AtomicAssets
  // itself reports (name, collection, schema, mint, supply), which is always
  // present regardless of collection. See buildAssetCards/sortAssets.
  const assetHeaderHtml = `<div class="asset-header"><span>Name</span><span>Drop</span><span>Supply</span><span>Mint #<br><span style="font-size:0.7rem;font-weight:400;color:var(--text-secondary);letter-spacing:0.04em;">Own #</span></span></div>`;
  const actionsHtml = isSent
    ? `<button class="offer-btn offer-btn--decline" data-action="cancel" data-offer="${offerId}">Cancel Offer</button>`
    : `<button class="offer-btn offer-btn--decline" data-action="decline" data-offer="${offerId}">Decline</button>
       <button class="offer-btn offer-btn--accept"  data-action="accept"  data-offer="${offerId}"${isInvalid ? ' disabled title="No longer valid — an offered asset has since moved or been burned"' : ''}>Accept Trade</button>`;
  const invalidBannerHtml = isInvalid
    ? `<div class="offer-invalid-banner">⚠ No longer valid — one of the offered assets has since moved or been burned. ${isSent ? 'You can still cancel it.' : 'You can still decline it.'}</div>`
    : '';
  const scoreSummaryHtml = buildScoreSummaryHtml(receiveAssets, giveAssets, tplMap, counterparty, offerId);

  // Sort mode is per-offer (see _sortModeByOffer) — the toggle below only
  // ever affects this one card's asset lists, not every open offer.
  const sortMode = _sortModeByOffer.get(offerId) || 'rarity';
  const sortControlsHtml = `<div class="sort-controls">
    <span class="sort-label">Sort assets by</span>
    <div class="sort-btns">
      <button type="button" class="sort-btn${sortMode === 'rarity' ? ' active' : ''}" data-sort="rarity">Rarity / Set</button>
      <button type="button" class="sort-btn${sortMode === 'mint'   ? ' active' : ''}" data-sort="mint">Mint #</button>
    </div>
  </div>`;

  const bodyHtml = `
      ${invalidBannerHtml}
      ${scoreSummaryHtml}
      ${sortControlsHtml}
      <div class="offer-sides">
        <div class="offer-side">
          <div class="offer-side-label">You receive (${receiveN})</div>
          ${assetHeaderHtml}
          <div class="asset-cards">${buildAssetCards(receiveAssets, tplMap, lowestMints, 'receiving', sortMode)}</div>
        </div>
        <div class="offer-side">
          <div class="offer-side-label label-give">You give (${giveN})</div>
          ${assetHeaderHtml}
          <div class="asset-cards">${buildAssetCards(giveAssets, tplMap, lowestMints, 'giving', sortMode)}</div>
        </div>
      </div>
      <div class="offer-actions">
        ${memo ? `<div class="offer-memo">Memo: <span>${escHtml(memo)}</span></div>` : '<div class="offer-memo"></div>'}
        ${actionsHtml}
      </div>`;

  const item = document.createElement('div');
  item.className = 'offer-item';
  item.dataset.offerId = offerId;
  item.innerHTML = `
    <div class="offer-header">
      <svg class="offer-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
      <span class="offer-from">Offer ${isSent ? 'to' : 'from'} <span class="offer-from-wallet">${counterparty}</span>${type === 'funko' ? ' — Funko' : type === 'topps' ? ' — Topps' : ''}${isInvalid ? ' <span class="offer-invalid-tag">⚠ Invalid</span>' : ''}</span>
      <div class="offer-meta">
        <div class="offer-ratio">
          <span class="ratio-receive">Receiving <span class="ratio-num">${receiveN}</span></span>
          <span class="ratio-sep">&middot;</span>
          <span class="ratio-give">Giving <span class="ratio-num">${giveN}</span></span>
        </div>
        <span class="offer-age">${age}</span>
      </div>
    </div>
    <div class="offer-body">${bodyHtml}</div>
  `;

  item.querySelector('.offer-header').addEventListener('click', () => {
    const isOpen = item.classList.contains('open');
    document.querySelectorAll('.offer-item.open').forEach(el => el.classList.remove('open'));
    if (!isOpen) item.classList.add('open');
  });

  if (isSent) {
    item.querySelector('[data-action="cancel"]').addEventListener('click', e => { e.stopPropagation(); handleOfferAction(offerId, 'cancel', item); });
  } else {
    item.querySelector('[data-action="accept"]').addEventListener('click', e => { e.stopPropagation(); handleOfferAction(offerId, 'accept', item); });
    item.querySelector('[data-action="decline"]').addEventListener('click', e => { e.stopPropagation(); handleOfferAction(offerId, 'decline', item); });
  }

  item.querySelectorAll('.sort-btn').forEach(btn => {
    btn.addEventListener('click', e => {
      e.stopPropagation(); // don't toggle the accordion open/closed
      const mode = btn.dataset.sort;
      if (_sortModeByOffer.get(offerId) === mode) return;
      _sortModeByOffer.set(offerId, mode);
      rebuildOfferItem(offerId);
    });
  });

  item.querySelector('.score-summary-header').addEventListener('click', e => {
    e.stopPropagation(); // don't toggle the accordion open/closed
    _scoreCollapsedByOffer.set(offerId, !_scoreCollapsedByOffer.get(offerId));
    rebuildOfferItem(offerId);
  });

  return item;
}

// Per-offer sort mode, keyed by offer_id — each card's toggle only affects
// that one card (see buildOfferItem/rebuildOfferItem).
const _sortModeByOffer = new Map();

// Rebuilds a single offer card in place from the cached last-fetched data
// (see _lastOffers), preserving whether it was expanded. Used by the
// per-offer sort toggle so switching sort mode doesn't require a refetch.
function rebuildOfferItem(offerId) {
  if (!_lastOffers) return;
  const offer = _lastOffers.find(o => String(o.offer_id) === String(offerId));
  const oldEl = document.querySelector(`.offer-item[data-offer-id="${offerId}"]`);
  if (!offer || !oldEl) return;
  const wasOpen = oldEl.classList.contains('open');
  const type = classifyOffer(offer);
  const newEl = buildOfferItem(offer, _lastTplMap, _lastLowestMints, type, _lastDirection);
  if (wasOpen) newEl.classList.add('open');
  oldEl.replaceWith(newEl);
}

/* ── Actions ───────────────────────────────────────────────────────────────── */
// 'accept'/'decline' are only ever wired on Received cards, 'cancel' only on
// Sent cards (see buildOfferItem) — a card only ever has the buttons for its
// own direction, so exactly one of these three querySelectors will find
// anything on a given itemEl.
const OFFER_CONTRACT_ACTION = { accept: 'acceptoffer', decline: 'declineoffer', cancel: 'canceloffer' };
const OFFER_LABEL           = { accept: 'Accept Trade', decline: 'Decline',    cancel: 'Cancel Offer' };
const OFFER_PROGRESS_LABEL  = { accept: 'Accepting…',   decline: 'Declining…', cancel: 'Cancelling…' };
const OFFER_DONE_LABEL      = { accept: 'Accepted!',    decline: 'Declined',   cancel: 'Cancelled' };

async function handleOfferAction(offerId, action, itemEl) {
  const myAccount = window.getWaxAccount ? window.getWaxAccount() : null;
  if (!myAccount) return;
  const acceptBtn  = itemEl.querySelector('[data-action="accept"]');
  const declineBtn = itemEl.querySelector('[data-action="decline"]');
  const cancelBtn  = itemEl.querySelector('[data-action="cancel"]');
  const activeBtn  = itemEl.querySelector(`[data-action="${action}"]`);
  [acceptBtn, declineBtn, cancelBtn].forEach(b => { if (b) b.disabled = true; });
  activeBtn.textContent = OFFER_PROGRESS_LABEL[action];
  try {
    await WaxAuth.transact([{
      account: 'atomicassets',
      name: OFFER_CONTRACT_ACTION[action],
      authorization: [{ actor: myAccount, permission: 'active' }],
      data: { offer_id: offerId },
    }]);
    activeBtn.textContent = OFFER_DONE_LABEL[action];
    activeBtn.classList.add('offer-btn--done');
    setTimeout(() => {
      itemEl.style.transition = 'opacity 0.3s'; itemEl.style.opacity = '0';
      setTimeout(() => {
        itemEl.remove();
        checkEmpty();
        if (_lastOffers) _lastOffers = _lastOffers.filter(o => o.offer_id !== offerId);
        // 'cancel' only ever fires on a Sent-tab card, 'accept'/'decline' only on Received.
        const direction = action === 'cancel' ? 'sent' : 'received';
        if (_counts[direction] != null) {
          const n = Math.max(0, _counts[direction] - 1);
          setTabCount(direction, n);
          // Only Received affects the nav's pending-offers badge — a Sent
          // cancel doesn't change how many incoming offers need my attention.
          if (direction === 'received') _wallet.setOffersBadge(n);
        }
      }, 350);
    }, 1200);
  } catch (err) {
    console.error(`${action} offer failed:`, err);
    [acceptBtn, declineBtn, cancelBtn].forEach(b => { if (b) b.disabled = false; });
    activeBtn.textContent = 'Failed — try again';
    setTimeout(() => { activeBtn.textContent = OFFER_LABEL[action]; }, 2500);
  }
}

function checkEmpty() {
  const list = document.getElementById('offersList');
  if (list && list.children.length === 0) {
    list.style.display = 'none';
    document.getElementById('emptyWrap').style.display = 'block';
  }
}

function showState(state) {
  document.getElementById('authGate').style.display   = state === 'auth'    ? '' : 'none';
  document.getElementById('loadWrap').style.display   = state === 'loading' ? '' : 'none';
  document.getElementById('emptyWrap').style.display  = state === 'empty'   ? '' : 'none';
  document.getElementById('offersList').style.display = state === 'list'    ? '' : 'none';
}

/* ── Load offers ───────────────────────────────────────────────────────────── */
const OFFERS_LIMIT = 100;
const EMPTY_MSG = {
  received: '<strong>No pending offers</strong>',
  sent:     '<strong>No pending sent offers</strong>You have no outgoing trade offers awaiting a response. Head back to the <a href="trade-analyzer">Trade Analyzer</a>.',
};

function offersUrl(direction, wallet) {
  const filterKey = direction === 'sent' ? 'sender' : 'recipient';
  // state 0=PENDING, 1=INVALID (an asset in the offer moved/burned since it
  // was made, so it can no longer be accepted) — both are still "open" and
  // actionable (decline/cancel), unlike the terminal states on trade-history.html.
  return `${WaxApi.aaBase()}/offers?${filterKey}=${encodeURIComponent(wallet)}&state=0,1&hide_contracts=true&limit=${OFFERS_LIMIT}&page=1`;
}

// Lightweight count-only fetch for the tab NOT currently being viewed — the
// active tab's count comes from loadOffers() itself, this just keeps the
// inactive tab's button label populated without building any DOM for it.
async function refreshTabCountOnly(direction) {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (!wallet || !API_BASE) return;
  try {
    const res = await WaxApi.rawFetch(offersUrl(direction, wallet));
    if (!res.ok) return;
    const json = await res.json();
    setTabCount(direction, (json.data || []).length);
  } catch { /* leave whatever count (or lack of one) was already showing */ }
}

// Cache of the most recently fetched offer list — lets the sort-mode toggle
// (and anything else purely cosmetic) re-render instantly from already-fetched
// data instead of re-running the offer/template/floor-price fetches.
let _lastOffers = null, _lastTplMap = null, _lastLowestMints = null, _lastDirection = null;

function renderOfferList() {
  if (!_lastOffers) return;
  const list = document.getElementById('offersList');
  const openIds = new Set([...list.querySelectorAll('.offer-item.open')].map(el => el.dataset.offerId));
  list.innerHTML = '';
  _lastOffers.forEach(offer => {
    const type = classifyOffer(offer);
    const item = buildOfferItem(offer, _lastTplMap, _lastLowestMints, type, _lastDirection);
    if (openIds.has(String(offer.offer_id))) item.classList.add('open');
    list.appendChild(item);
  });
}

let _loadGen = 0;
async function loadOffers() {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (!wallet || !API_BASE) { showState('auth'); return; }

  const myGen = ++_loadGen;
  const direction = _tab; // snapshot — _tab can change again before this resolves
  showState('loading');
  try {
    const res = await WaxApi.rawFetch(offersUrl(direction, wallet));
    if (!res.ok) throw new Error(`API ${res.status}`);
    const json = await res.json();
    const offers = json.data || [];
    if (myGen !== _loadGen) return; // stale — a newer tab switch superseded this
    setTabCount(direction, offers.length);

    if (offers.length === 0) {
      _lastOffers = null;
      document.getElementById('offersList').innerHTML = '';
      document.getElementById('emptyWrap').innerHTML = EMPTY_MSG[direction];
      showState('empty');
      return;
    }

    const allTemplateIds = offers.flatMap(o => [
      ...(o.sender_assets    || []),
      ...(o.recipient_assets || []),
    ]).map(a => String(a.template?.template_id || '')).filter(Boolean);

    const [tplMap, lowestMints] = await Promise.all([
      fetchTemplateData(offers),
      fetchLowestMints(wallet, allTemplateIds),
    ]);
    if (myGen !== _loadGen) return; // stale — a newer tab switch superseded this

    _lastOffers = offers; _lastTplMap = tplMap; _lastLowestMints = lowestMints; _lastDirection = direction;
    renderOfferList();
    showState('list');
  } catch (err) {
    if (myGen !== _loadGen) return; // stale — a newer tab switch superseded this
    console.error('Failed to load offers:', err);
    showState('empty');
    document.getElementById('emptyWrap').innerHTML = '<strong>Failed to load offers</strong>Could not reach the WAX API. Please try again later.';
  }
}

function otherTab(tab) { return tab === 'sent' ? 'received' : 'sent'; }

function onWalletChange() {
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (wallet && API_BASE) { loadOffers(); refreshTabCountOnly(otherTab(_tab)); }
  else { showState('auth'); setTabCount('received', null); setTabCount('sent', null); }
}

/* ── Init ──────────────────────────────────────────────────────────────────── */
async function init() {
  fetchWaxUsdRate(); // fire-and-forget — nice-to-have, shouldn't delay first paint
  await loadAllData();
  const wallet = window.getWaxAccount ? window.getWaxAccount() : null;
  if (wallet) { loadOffers(); refreshTabCountOnly(otherTab(_tab)); }
  else showState('auth');
}

init().catch(err => console.error('Init failed:', err));
</script>
<script src="shared/moved.js"></script>
</body>
</html>
