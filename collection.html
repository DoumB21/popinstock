    .collection-placeholder {
      background: var(--bg-card); border: 1px solid var(--border);
      border-radius: 16px; padding: 2.5rem 1.5rem;
      text-align: center; color: var(--text-secondary);
    }

<body>

<nav class="site-nav">
  <div class="nav-inner">
    <a href="index" class="nav-home" title="Back to homepage">
      <img src="images/Hoardio_fav.png" alt="Hoardio" />
    </a>
    <span class="nav-divider"></span>
    <div class="nav-links"></div>
  </div>
</nav>
<script src="shared/generic-nav.js"></script>

<main class="page-main">
  <div class="page-header">
    <h1 class="page-title" id="pageTitle">Collection</h1>
    <p class="page-desc" id="pageDesc">General information for a WAX collection</p>
  </div>

  <div id="collectionContent" class="collection-placeholder">Loading…</div>
</main>

<footer>

  <div>All images, logos, and trademarks displayed on this site are the property of their respective owners. No affiliation or endorsement is implied. Used for informational purposes only.</div>
</footer>

<script>
  'use strict';

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' }[c]));
  }

  const collectionName = new URLSearchParams(location.search).get('collection_name');
  const contentEl = document.getElementById('collectionContent');
  const titleEl = document.getElementById('pageTitle');
  const descEl = document.getElementById('pageDesc');

  if (!collectionName) {
    contentEl.innerHTML = 'No collection specified. Add <strong>?collection_name=&lt;name&gt;</strong> to the URL.';
  } else {
    titleEl.textContent = collectionName;
    descEl.textContent = 'Collection overview';
    contentEl.innerHTML = `Data for <strong>${escapeHtml(collectionName)}</strong> coming soon.`;
  }
</script>

</body>
</html>
